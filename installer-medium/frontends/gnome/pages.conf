# gnome-setup's pages for the tunaOS installer medium. install.sh puts this
# over gnome-setup's own /usr/lib/gnome-setup/pages.conf. gnome-setup runs the
# live-initial-setup mode on a live boot. The first boot of the installed
# system creates the user, so the flow ends at the done page: no privacy,
# network, timezone or user pages. The eula page shows only when
# /usr/share/gnome-setup/eula.xml exists. disk-passphrase shows only on a
# machine without a TPM 2.0. Same flow as Utah's medium.
[modes]
live-initial-setup=language;keyboard;prerelease-warning;eula;try-or-install;installer;disk-passphrase;recovery-key;installer-done

[page:installer]
# Started with the target disk as the instance once the copy lands
# (installer-medium/hooks/medium-install-post@.service).
post-install-unit=medium-install-post@.service
