# Live boot of the installed disk image (tunaos.live): the initrd overlay unit,
# the systemd-volatile-root binary it runs, and the drop-ins that pull it in
# before the ostree and the composefs root setup. See medium-live-root.service.
install_items+=" /usr/lib/systemd/systemd-volatile-root /usr/lib/systemd/system/medium-live-root.service /usr/lib/systemd/system/medium-live-cfs.service "
install_optional_items+=" /usr/lib/systemd/system/ostree-prepare-root.service.d/10-medium-live.conf /usr/lib/systemd/system/bootc-root-setup.service.d/10-medium-live.conf /usr/lib/dracut/modules.d/90medium-sr0/module-setup.sh "
add_drivers+=" overlay "
add_dracutmodules+=" medium-sr0 "
