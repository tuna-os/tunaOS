# TEST ONLY (tmp/kde-greeter-wait): the Plasma session's compositor starts
# only after the login screen's compositor has exited.
#
# albacore:kde (EL10, plasma-login 6.7.5) runs 46087879404 and 46093027278:
# the user's kwin_wayland started at 74.7 s while the login screen's
# kwin_wayland (user plasmalogin) ran until 79.4 s and logged "Applying
# output configuration failed!". plasmashell then saw no screen ("requesting
# unexisting screen geometry -1") and the desktop stayed black. Wait up to
# 30 s; start anyway after that. "$$" is a "$" for the shell: systemd
# expands "$i" itself.
[Service]
ExecStartPre=/bin/sh -c 'i=0; while [ "$$i" -lt 60 ] && pgrep -u plasmalogin -x kwin_wayland >/dev/null; do sleep 0.5; i=$$((i + 1)); done; echo "kwin_wayland wait: login screen compositor gone after $$i half-seconds"'
