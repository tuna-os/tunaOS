# TEST ONLY (tmp/kde-greeter-wait). albacore:kde runs 46114459769 and
# 46123262463: plasmashell logs "requesting unexisting screen geometry -1" and
# makes no view, also when it starts 8 s late. kscreen-doctor shows the one
# output enabled with "priority 0"; plasmashell orders screens by priority
# (kde_output_order_v1), so no output has a place. Trial: give the first
# output priority 1 before plasmashell starts, and log the outputs.
[Service]
ExecStartPre=-/bin/sh -c 'echo "kscreen before:"; kscreen-doctor -o 2>&1 | grep -E "Output|priority"; kscreen-doctor output.1.priority.1 2>&1; echo "kscreen after:"; kscreen-doctor -o 2>&1 | grep -E "Output|priority"'
