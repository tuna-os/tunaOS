# Live media (tunaos.live) must not download Flatpaks: the live session writes
# to a RAM overlay, so a medium without baked Flatpaks would pull the whole
# preinstall set into memory, only to lose it at shutdown (measured on Utah's
# and Dakota's spikes). The installed system runs it on first boot instead.
[Unit]
ConditionKernelCommandLine=!tunaos.live
