# Live media (tunaos.live) read the medium through read-only partitions, and
# fsck.fat cannot open one ("open: Read-only file system", exit status 6). A
# BuildStream sibling image mounts the ESP as /boot through boot.automount, so
# the failed check failed boot.mount, and NetworkManager, firewalld and
# ModemManager (each with a /boot mount namespace) failed with it: no network,
# no SSH banner (brussels:xfce run 45915937930). A skipped unit counts as done.
[Unit]
ConditionKernelCommandLine=!tunaos.live
