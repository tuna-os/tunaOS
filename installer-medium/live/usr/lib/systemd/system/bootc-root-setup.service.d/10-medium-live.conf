# Pull in the tunaos.live root overlay and run after it
# (medium-live-root.service): on a composefs-backend medium, bootc's
# initramfs-setup then assembles the composefs root from the overlaid
# /sysroot. Without tunaos.live on the kernel command line that unit is
# skipped and this ordering is inert.
[Unit]
Wants=medium-live-root.service
After=medium-live-root.service
