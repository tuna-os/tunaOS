# Public certificates for the Secure Boot key bundle (tunaOS#4955).
#
# Only public certificates live here. A private key never enters this tree.
# tests/test_installer_medium_secure_boot.py pins every sha256 below, so a
# changed or swapped file fails the suite.
#
# sha256 is the hash of the DER form. Microsoft files come from the fwlink
# URLs that `man loader.conf` (systemd 263~devel, man/loader.conf.xml:354-359)
# lists; the sha1 values there match these files (measured 2026-11-25).
# The Option ROM CA is not in that man page: Microsoft split option ROM
# signatures off the third-party CA in 2023, so the bundle needs it too.

schema_version = 1

# EFI_SIGNATURE_DATA.SignatureOwner for each vendor.
[owners]
microsoft = "77fa9abd-0359-4d32-bd60-28f4e78f784b"
tunaos = "7c0a1e55-7f4b-4b0c-9d5e-74756e616f73"

[tunaos]
pem = "tunaos-sb.crt"
der = "tunaos-sb.cer"
subject_cn = "TunaOS Secure Boot Signing 2026"
sha256 = "d26e134487fc8f99430e416b3fbd8faeef4bcdfca109b1397e29a7b31b3c482c"
not_after = "2036-11-22"
# The suite fails when fewer than this many days remain.
min_days_left = 365

[[microsoft]]
file = "microsoft/ms-kek-2011.pem"
variable = "KEK"
subject_cn = "Microsoft Corporation KEK CA 2011"
sha256 = "a1117f516a32cefcba3f2d1ace10a87972fd6bbe8fe0d0b996e09e65d802a503"
url = "https://go.microsoft.com/fwlink/p/?linkid=321185"

