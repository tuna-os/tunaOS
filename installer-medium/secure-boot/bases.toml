# Secure Boot facts per base (tunaOS#4955), measured 2026-11-25.
#
# This is dated evidence, not live status. Each row names the package that
# was downloaded and the command that decided it. `sbverify --cert` ran
# against the certificate inside the base's own shim (`.vendor_cert`), so
# "accepted" means the signature chain verifies. Nothing was booted.
# Measure again before a cell changes its mode.
#
# bootloader / secure_boot are the recommendation for the resolver:
#   systemd-boot + distro-chain  the distro signs systemd-boot and its shim
#                                accepts it
#   grub + distro-chain          no accepted signed systemd-boot; the distro
#                                signs GRUB and the kernel
#   systemd-boot + tunaos-key    nobody signs for this base; tunaOS CI does
# shim_vendor_sha256 pins the distro certificate for
# `secureboot.py check --pin-sha256`.
#
# tests/test_installer_medium_secure_boot.py keeps docs/SECURE-BOOT.md in
# step with this file.

schema_version = 1
measured = "2026-11-25"

[[base]]
name = "AlmaLinux 10"
bootloader = "grub"
secure_boot = "distro-chain"
signed_systemd_boot = "no"
shim_accepts = "no"
package = "systemd-boot-unsigned-257-33.el10.alma.2 (AppStream)"
signer = "none"
shim = "shim-x64-16.1-4.el10.alma.1, vendor AlmaLinux Secure Boot CA"
shim_vendor_sha256 = ["3d5c198dc5849ce40d55d6a88fcac398327d84d6aa25e0b91e89757b727e6dea"]
kernel = "kernel-core-6.12.0-264.20.1.el10_3: accepted by shim"
evidence = "sbverify --list systemd-bootx64.efi: No signature table present"

