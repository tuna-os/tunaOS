# registry-map.yaml — Registry and image reference configuration.
#
# Maps logical image names to registry prefixes and paths. Every registry
# hostname can be overridden via environment variable:
#   TUNA_REGISTRY_<key>=mirror.example.com
#
# Every image tag can be overridden:
#   TUNA_IMAGE_TAG_<name>=v2.0
#
# Default paths can be overridden:
#   TUNA_IMAGE_PATH_<name>=my-org/my-fork
#
# This file is the single source of truth for all container image references
# used during builds. Scripts should source scripts/_registry.sh and use
# the registry_ref() function instead of hardcoding registry hostnames.
#
# See RFC-009 for design rationale.

registries:
  ghcr: "ghcr.io"
  quay: "quay.io"
  docker: "docker.io"

images:
  # --- Build inputs (external dependencies) ---
  common:
    registry: ghcr
    path: projectbluefin/common
    tag: latest

  brew:
    registry: ghcr
    path: ublue-os/brew
    tag: latest

  # Bluefin's GNOME 51 for Hummingbird as a dnf repository in an OCI image.
  # Digest pinned in image-versions.yaml (see the note there).
  utah-packages:
    registry: ghcr
    path: projectbluefin/utah-packages
    tag: latest

  # tunaOS' GNOME 50 for EL10 as a dnf repository in an OCI image.
  # Digest pinned in image-versions.yaml (see the note there).
  gnome50-el10-packages:
    registry: ghcr
    path: tuna-os/tunaos-packages
    tag: gnome50-el10-x86_64

  akmods:
    registry: ghcr
    path: ublue-os

  akmods-nvidia-open:
    registry: ghcr
    path: ublue-os/akmods-nvidia-open

  # --- Bootc base images ---
  almalinux-bootc:
    registry: quay
    path: almalinuxorg/almalinux-bootc
    tag: "10"

  almalinux-bootc-kitten:
    registry: quay
    path: almalinuxorg/almalinux-bootc
    tag: "10-kitten"

  centos-bootc:
    registry: quay
    path: centos-bootc/centos-bootc
    tag: stream10

  fedora-bootc:
    registry: quay
    path: fedora/fedora-bootc
    tag: "44"

  # --- Tool images ---
  coreos-chunkah:
    registry: quay
    path: coreos/chunkah
    # SECURITY: Pinned to digest to prevent supply-chain attacks via tag mutation.
    # tag: latest is retained as fallback for setups without the pinned image.
    #
    # Refreshed 2026-08-14 (tunaOS#1568). The previous pin
    # (sha256:33ab77f2…) had been garbage-collected upstream — quay returns
    # 404 for it — so anything resolving this entry would have fallen through
    # to building chunkah from source on every build. Nothing noticed because
    # registry_ref could not read this entry at all (see scripts/_registry.sh)
    # and the only consumer hardcoded :latest. A pin that nothing bumps and
    # nothing reads rots; renovate.json now has a manager for this file.
    # Verified a manifest list covering amd64 + arm64, the two arches built here.
    digest: sha256:ff8b8b466a942ec6000445d4001fc661e2fc5a952ad9ee29b4de9ab09d1d1708
    tag: latest

  # --- Tool images (build infra) ---
  tacklebox:
    registry: ghcr
    path: tuna-os/tacklebox
    tag: latest

  rechunker:
    registry: ghcr
    path: hhd-dev/rechunk
    # SECURITY: Pinned to digest. Update by:
    #   podman pull ghcr.io/hhd-dev/rechunk:latest
    #   podman inspect ghcr.io/hhd-dev/rechunk:latest --format '{{.Digest}}'
    digest: sha256:8a84bd5a029681aa8db523f927b7c53b5aded9b078b81605ac0a2fedc969f528
    tag: latest

  # novnc and qemu: images not publicly available on GHCR/Docker Hub.
  # Use env vars NOVNC_IMAGE / QEMU_IMAGE in lima-novnc.sh / run-vm.sh.

  # --- ISO bootc target ---
  bluefin-iso:
    registry: ghcr
    path: tuna-os/bluefin
    # SECURITY: Pinned to digest. The :lts tag is a floating tag — pinning
    # protects ISO builds from unexpected image changes.
    digest: sha256:fa7d24b646cc345542190b7f68fc70fbd9a4d3143e8cc077db4dca68336c3ae8
    tag: lts
