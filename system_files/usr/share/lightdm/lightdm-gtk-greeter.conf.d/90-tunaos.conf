# The LightDM login screen (XFCE on Debian, Arch and Ubuntu) shows the
# variant's wallpaper, not the distro's (Debian's desktop-base ships
# 01_debian.conf here; 90- sorts after it). See docs/BRANDING.md.
[greeter]
background=/usr/share/backgrounds/tunaos/tunaos-default.jpg
# The default panel without ~language: its label is the raw `locale -a` code
# ("en_US.utf8", installer run 45826184478), never a language name. The
# installer sets the system language; the session keeps it.
indicators=~host;~spacer;~clock;~spacer;~session;~a11y;~power
