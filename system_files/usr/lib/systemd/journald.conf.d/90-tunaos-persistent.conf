[Journal]
# Persist the journal under /var/log/journal so a failed first boot can
# be diagnosed from the disk afterward: the default `auto` keeps the log
# only in /run when the directory is absent, and an installed system that
# never reaches a session then leaves no trace. grouper:gnome run
# 42697802969 needed the guest journal to explain a time-zone page that
# ignored every advance; only screenshots survived. 50M bounds the
# cheapest E2E disks.
Storage=persistent
SystemMaxUse=50M
