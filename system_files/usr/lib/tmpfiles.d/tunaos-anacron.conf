# anacron's spool directory. Its package postinst creates it at build time, but
# the image's /var is emptied (99-cleanup.sh, and bootc does not ship /var), so
# anacron.service exited 1 on every boot of installed grouper systems: "Can't
# chdir to /var/spool/anacron" (reproduced in the published image; iso-builder
# runs 42318386139, 42374980522). Shipped statically because on Ubuntu the
# desktop, and with it anacron, is installed AFTER 99-cleanup.sh runs.
# Harmless where anacron is not installed: an empty directory.
d /var/spool/anacron 0755 root root - -
