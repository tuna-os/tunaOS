# RPM policy upgrades happen while container builds have SELinux disabled, so
# their replacement files can retain labels assigned by the base policy.  The
# next boot loads the new policy before systemd-tmpfiles-setup.service runs;
# recursively relabel its runtime-context tree then, before basic.target starts
# D-Bus.
#
# Without this, yellowfin:gnome's 42 -> 43 policy upgrade left dbus_contexts
# unreadable to dbus-broker-launch under enforcing mode (tunaOS#2326).  Keep
# mode/owner/age unchanged: this rule repairs labels only.
Z /etc/selinux/targeted/contexts - - - -
