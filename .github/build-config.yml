        build_image: true
      - id: gnome
        stage: 2
        platforms: ["linux/amd64", "linux/arm64"]
        build_image: true
        build_iso: true
      # Apple Silicon (M1/M2, Asahi Linux) — overlay/asahi.sh, Asahi-ALARM
      # repos. aarch64 only; no ISO (asahi-installer path).
      - id: gnome-asahi
        stage: 3
        platforms: ["linux/arm64"]
        build_image: true
        build_iso: false
        build_qcow2: false
      - id: kde
        stage: 2
        build_image: true
        build_iso: true
      - id: cosmic
        stage: 2
        build_image: true
      - id: niri
        stage: 2
