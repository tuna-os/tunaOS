  # ── Ubuntu ───────────────────────────────────────────────────────────────
  # RFC 010: Ubuntu 26.04 variant. x86_64-only.
  # Desktops: gnome/kde/niri/xfce via the apt branches in build_scripts/*.sh
  # (cosmic has no apt branch yet). No HWE/NVIDIA layers — Ubuntu ships its
  # own kernel stack and the akmods images are RPM-only.
  # ── elementary / Pantheon ──────────────────────────────────────────
  # A SEPARATE variant rather than a grouper flavour, and the base image is
  # why. Pantheon is absent from the Ubuntu archive entirely (verified on
  # ubuntu:resolute with main+universe+restricted+multiverse enabled: gala,
  # wingpanel, pantheon-session and switchboard all ABSENT, only `plank`
  # present). It comes solely from ppa:elementary-os/stable, which publishes
  # for **noble and jammy only** — nothing for resolute. grouper is Ubuntu
  # 26.04, so Pantheon cannot be installed there at any version today.
  #
  # Revisit collapsing this into grouper when elementary publishes for 26.04.
  - id: gurnard
    emoji: "🐟"
    description: "Based on Ubuntu 24.04 Noble Numbat with the Pantheon desktop"
    base_image: "docker.io/library/ubuntu:noble@sha256:561618e2c15bf2397621dd04f96926663a3b5616c189cf7e38db7e82f5c538ea"
    # Friendly alias: same digest also published as ghcr.io/tuna-os/<alias>:<flavor>
    aliases: [elementary]
    platforms:
      - linux/amd64
      - linux/arm64
    flavors:
      - id: base
        stage: 1
        build_image: true
      - id: pantheon
        stage: 2
        build_image: true
        build_iso: true

  - id: grouper
    emoji: "🐟"
    description: "Based on Ubuntu 26.04 Resolute Raccoon"
    base_image: "docker.io/library/ubuntu:resolute@sha256:678c6550cc43645e08669028bc177f50be4e7c5b8cca677067b1914d4afc7a03"
    # Friendly alias: same digest also published as ghcr.io/tuna-os/<alias>:<flavor>
    aliases: [ubuntu]
    # Built directly from stock Ubuntu and bootcified in Containerfile.ubuntu
    # (bootc from the tuna-os bootc-toolchain-sid oras artifact). See RFC 010.
    # arm64: toolchain publishes latest-{amd64,arm64}; Containerfile.ubuntu is
    # TARGETARCH-aware. Apple Silicon (Asahi) support gated behind
    # ENABLE_ASAHI=1 (build_scripts/ubuntu-kernel.sh) — flavor wiring TBD.
    platforms: ["linux/amd64", "linux/arm64"]
    flavors:
      - id: base
        stage: 1
        build_image: true
      - id: gnome
        stage: 2
        build_image: true
        build_iso: true
      # Apple Silicon (M1/M2, Asahi Linux) — full build with ENABLE_ASAHI=1
      # (the kernel decision lives in Containerfile.ubuntu's base stage, so
      # this is not an overlay). aarch64 only; no ISO (asahi-installer path).
      #
      # stage 3, NOT stage 1, and the distinction matters: `stage` is build
      # ORDER, not parentage. This flavor has no PARENT_FLAVOR, so it still
      # builds straight from base wherever it is placed — but at stage 1 it
      # shared a matrix with base, and a stage does not advance until every
      # cell in it passes. One arm64-only Apple Silicon flavor therefore gated
      # gnome, kde, gnome-zfs, cosmic and xfce, which all live in stage 2:
      # run 30688732984 promoted base and then never started them.
      #
      # Every other variant already places gnome-asahi at stage 3; grouper was
      # the lone exception, because there asahi is a full build rather than an
      # overlay and the stage number was read as "has no parent" rather than
      # "runs first".
      - id: gnome-asahi
        stage: 3
        platforms: ["linux/arm64"]
        build_image: true
        build_iso: false
      # GNOME with ZFS-root support (prebuilt zfs.ko + zfs-dracut). ISO gated
      # off until the install-to-filesystem ZFS-root path has a boot e2e (#625).
      - id: gnome-zfs
        stage: 2
        build_image: true
        build_iso: false
      - id: kde
        stage: 2
        build_image: true
        build_iso: true
      # No niri — same reason as flounder and flounder-sid (#918): niri is not
      # packaged for apt in Debian trixie, Debian sid or Ubuntu 26.04, and
      # manifests/desktops/niri.yaml has no apt section. grouper is Ubuntu, so
      # it was covered by that evidence but missed by the change.
      #
      # Nothing would have caught it either. With no packages.apt section the
      # installer skips the install without error, and the apt path `exit 0`s
      # before the shared tail — so the desktop experience contract never runs
      # on an apt variant at all. That is the mechanism that published
      # flounder:niri with no compositor (tunaOS#915); grouper:niri is not in
      # the published set, so it evidently never completed, but the
      # declaration was wrong either way.
      # Packaging it ourselves is tunaos-packages#136. Do not re-add without it.
      #
      # COSMIC, by contrast, IS buildable here and is now declared. Ubuntu has
      # no COSMIC in its own repos, but cosmic.yaml carries
      # ppa:hepp3n/cosmic-epoch with condition: ubuntu, and install-desktop.sh
      # adds a PPA when IS_UBUNTU — measured WITH the PPA enabled,
      # cosmic-session, cosmic-comp, cosmic-settings and cosmic-greeter all
      # resolve. (Measuring in a bare ubuntu container says nothing here: the
      # installer adds repositories before it installs, so a probe that skips
      # that step is answering a question about the wrong system.)
      # amd64 only: ppa:hepp3n/cosmic-epoch publishes amd64 and amd64v3 and
      # nothing else — no arm64 build of cosmic-session/cosmic-comp/etc exists
      # for any series (Launchpad getPublishedBinaries). grouper otherwise
      # builds both arches, so the arm64 job was the ONLY failure in run
      # 31088031074 while amd64 built clean. Same shape as the aarch64 cosmic
      # pin on the EL10 variants for fprintd-pam (tunaOS#732).
      #
      # This PPA dependency is tracked for removal in tunaOS#964 — see the
      # status note at the top of manifests/desktops/cosmic.yaml's apt:
      # block for exactly what has and hasn't landed on the Tideforge side.
      - id: cosmic
        stage: 2
        platforms: ["linux/amd64"]
        build_image: true
      - id: xfce
        stage: 2
        build_image: true
        build_iso: true

  # ── Arch Linux ─────────────────────────────────────────────────────────────
  # Marlin: rolling-release Arch Linux on bootc. Uses Containerfile.arch
  # which builds bootc from source (Arch doesn't package it yet) and sets
  # up the ostree/composefs filesystem layout.
  - id: marlin
    emoji: "🚀"
    description: "Based on Arch Linux (rolling)"
    base_image: "docker.io/archlinux/archlinux:latest@sha256:71810bb6f8bece3e2172e458dd8c0793fec139a6b6a7e5da2c832f96d1b9a0a6"
    # Friendly alias: same digest also published as ghcr.io/tuna-os/<alias>:<flavor>
    aliases: [arch, archlinux]
    # arm64 legs use ghcr.io/tuna-os/archlinuxarm instead (docker.io/archlinux
    # is x86_64-only) — see get-base-image.sh + build-archlinuxarm-base.yml
    # (#778). Only the gnome-asahi parent chain builds arm64.
    platforms: ["linux/amd64"]
    flavors:
      - id: base
        stage: 1
        platforms: ["linux/amd64", "linux/arm64"]
        build_image: true
      - id: gnome
        stage: 2
        platforms: ["linux/amd64", "linux/arm64"]
        build_image: true
        build_iso: true
      # gnome-asahi: NOT declared, and not an oversight.
      #
      # The Asahi-ALARM repo's linux-asahi package is real (verified by
      # downloading it directly: asahi-alarm/asahi-alarm release "aarch64",
      # linux-asahi-7.1.5.asahi2-1-aarch64.pkg.tar.xz), but it ships only 5
      # T8103 (M1) device trees — nowhere near the ~50 the asahi-verify
      # harness requires for real hardware coverage — and is missing several
      # Apple SoC kernel modules the harness checks for, most importantly
      # asahi.ko itself (the GPU driver; appledrm.ko, the older
      # display-only driver, IS present). The published
      # ghcr.io/tuna-os/marlin:gnome-asahi tag scored 23/36 on the harness
      # (run 31243787771, 2026-08-08) — an ordinary arm64 image with a
      # differently-named kernel, not a bootable Apple Silicon image.
      #
      # tunaOS#911: "until fixed, [this] should stop being promoted rather
      # than shipping as unbootable" — a user selecting it in the installer
      # catalog gets a Mac that does not boot. Re-add once asahi-alarm's
      # linux-asahi actually ships the missing modules and device trees, or
      # once TunaOS has its own source of a complete Apple Silicon kernel
      # for Arch. Same pattern as guppy's absent niri/cosmic flavors above.
      - id: kde
        stage: 2
        build_image: true
        build_iso: true
      - id: cosmic
        stage: 2
        build_image: true
      - id: niri
        stage: 2
        build_image: true
      - id: xfce
        stage: 2
        build_image: true
      # CachyOS kernel overlay on the Arch base — like -hwe/-nvidia elsewhere
      # (Containerfile.overlay + build_scripts/cachyos.sh, stage 3 on the parent DE).
      - id: gnome-cachyos
        stage: 3
        build_image: true
      - id: kde-cachyos
        stage: 3
        build_image: true
      - id: cosmic-cachyos
        stage: 3
        build_image: true
      - id: niri-cachyos
        stage: 3
        build_image: true
      - id: xfce-cachyos
        stage: 3
        build_image: true
      # NVIDIA overlay on the Arch base (tunaOS#624): nvidia-open-dkms via
      # pacman + dkms, not akmods — Arch has no RPM/akmods concept at all.
      # See build_scripts/overlay/overrides/nvidia-arch/20-nvidia.sh. No
      # *-nvidia-hwe: marlin has no HWE kernel layer to begin with (Arch
      # ships the latest kernel natively), so there is nothing to stack an
      # nvidia overlay on top of beyond plain *-nvidia.
      #
      # platforms is pinned to linux/amd64 explicitly (not inherited from
      # the variant default) on every *-nvidia flavor in this file — a
      # test (tests/bats/test_nvidia_overlay.bats) asserts that directly,
      # and nvidia-open-dkms/nvidia-utils only publish x86_64 builds.
      - id: gnome-nvidia
        platforms: ["linux/amd64"]
        stage: 3
        build_image: true
        build_iso: true
        build_qcow2: false
      - id: kde-nvidia
        platforms: ["linux/amd64"]
        stage: 3
        build_image: true
        build_iso: true
        build_qcow2: false
      - id: cosmic-nvidia
        platforms: ["linux/amd64"]
        stage: 3
        build_image: true
        build_iso: false
        build_qcow2: false
      - id: niri-nvidia
        platforms: ["linux/amd64"]
        stage: 3
        build_image: true
        build_iso: false
        build_qcow2: false
      - id: xfce-nvidia
        platforms: ["linux/amd64"]
        stage: 3
        build_image: true
        build_iso: false
        build_qcow2: false

  # ── Debian ─────────────────────────────────────────────────────────────────
  # Flounder: Debian Trixie (13) stable. Uses Containerfile.debian.
  - id: flounder
    emoji: "🐡"
    description: "Based on Debian 13 Trixie (stable)"
    base_image: "docker.io/library/debian:trixie@sha256:34cd9e9fd437c0a095ec39cb2e73422c9f30821b0d0848ed74fd0d43bae4d958"
    # Friendly alias: same digest also published as ghcr.io/tuna-os/<alias>:<flavor>
    aliases: [debian]
    platforms: ["linux/amd64"]
    flavors:
      # base + gnome carry an arm64 leg solely as the parent chain for
      # gnome-asahi (debian:trixie is multiarch; the bootc toolchain
      # publishes latest-arm64). Other DEs stay amd64 for now.
      - id: base
        stage: 1
        platforms: ["linux/amd64", "linux/arm64"]
        build_image: true
      - id: gnome
        stage: 2
        platforms: ["linux/amd64", "linux/arm64"]
        build_image: true
        build_iso: true
      # gnome-asahi: NOT declared, and not an oversight.
      #
      # build_scripts/overlay/asahi.sh's debian branch resolves a real
      # linux-image-*-asahi package from the Bananas team's archive, but the
      # published ghcr.io/tuna-os/flounder:gnome-asahi tag currently ships
      # stock 6.12.100+deb13-arm64 — the purge-then-install of the asahi
      # kernel never runs, because it is not even reached: this flavor's
      # arm64 build fails outright at Containerfile.overlay's `pacman`
      # detection step. That step uses bash-only `command -v pacman
      # &>/dev/null` in a RUN instruction with no `bash -c` wrapper, so it
      # runs under the image's default shell — dash on this (Debian) base,
      # which does not understand `&>` and mis-parses it as `command -v
      # pacman &` (backgrounded) `>/dev/null` (redirecting nothing), always
      # entering the `then` branch and invoking a `pacman` that does not
      # exist on Debian (build 93057902527, 2026-08-08: "pacman: not
      # found", exit 127). Fixed in this same change (Containerfile.overlay
      # now uses portable redirection), but with that fixed the harness
      # still needs to confirm the Bananas kernel actually boots and covers
      # real Apple Silicon hardware before this is safe to publish again —
      # unverified as of this writing.
      #
      # tunaOS#911: "until fixed, [this] should stop being promoted rather
      # than shipping as unbootable" — a user selecting it in the installer
      # catalog gets a Mac that does not boot. Re-add once a build with the
      # portability fix has actually produced and verified an asahi kernel
      # here. Same pattern as guppy's absent niri/cosmic flavors elsewhere
      # in this file.
      - id: kde
        stage: 2
        build_image: true
        build_iso: true
      # No cosmic: COSMIC is not packaged in Debian AT ALL. Checked every
      # suite via ftp-master's madison API (oldoldstable through unstable and
      # experimental) for cosmic-session, cosmic-comp, cosmic-panel,
      # cosmic-files, cosmic-term, cosmic-settings, cosmic-greeter and
      # xdg-desktop-portal-cosmic — every one returns empty, while a control
      # (kde-plasma-desktop) returns suites. The apt section of
      # manifests/desktops/cosmic.yaml is served by ppa:hepp3n/cosmic-epoch,
      # which is `condition: ubuntu` and publishes for resolute only, so on a
      # Debian base the package list has no source at all:
      #   E: Unable to locate package cosmic-comp   (and 18 more)
      # flounder:cosmic, LUKS run 31087927879. Same reason niri is absent
      # below; it fails louder only because apt exits 100 on an unknown name
      # while niri.yaml had no apt section at all, so that one installed
      # nothing and exited 0. Do not re-add without a Debian source for COSMIC.
      #
      # That Debian source is what tunaOS#964 is building — our own
      # Tideforge-built debs, not another PPA (which wouldn't cover Debian
      # anyway). See manifests/desktops/cosmic.yaml's apt: block for the
      # current widen/publish status before re-adding this flavor.
      # No niri: it is not packaged for apt in Debian trixie, Debian sid or
      # Ubuntu 26.04 (all three checked), and manifests/desktops/niri.yaml
      # has no apt section as a result. Building it produced a PUBLISHED,
      # installable image with no compositor at all — `command -v niri` was
      # empty in ghcr.io/tuna-os/flounder:niri. See tunaOS#915; packaging it
      # ourselves is tracked in tunaos-packages#136 and needs a whole deb
      # toolchain this org does not have yet. Do not re-add without one.
      - id: xfce
        stage: 2
        build_image: true
      # NVIDIA overlay on the Debian base (tunaOS#624): nvidia-driver via
      # apt (official Debian non-free component, not a third-party repo) +
      # dkms. See build_scripts/overlay/overrides/nvidia-debian/20-nvidia.sh.
      # No *-nvidia-hwe: flounder has no HWE kernel layer (Debian ships one
      # kernel per suite), so there is nothing to stack an nvidia overlay on
      # top of beyond plain *-nvidia.
      #
      # platforms is pinned to linux/amd64 explicitly on every *-nvidia
      # flavor in this file — asserted by
      # tests/bats/test_nvidia_overlay.bats — matching nvidia-driver's own
      # Debian archive coverage focus and this variant's amd64-only DE set.
      - id: gnome-nvidia
        platforms: ["linux/amd64"]
        stage: 3
        build_image: true
        build_iso: true
        build_qcow2: false
      - id: kde-nvidia
        platforms: ["linux/amd64"]
        stage: 3
        build_image: true
        build_iso: true
        build_qcow2: false
      - id: xfce-nvidia
        platforms: ["linux/amd64"]
        stage: 3
        build_image: true
        build_iso: false
        build_qcow2: false

  # Flounder-sid: Debian Sid (unstable/rolling).
  - id: flounder-sid
    publish_name: flounder
    tag_suffix: sid
    emoji: "☢️"
    description: "Based on Debian Sid (unstable, rolling)"
    base_image: "docker.io/library/debian:sid@sha256:24c766c06ebdbda66a026e92361ede7d9212819701b2fca82e347ef0c240cb2c"
    # Friendly alias: same digest also published as ghcr.io/tuna-os/<alias>:<flavor>
    aliases: [debian]
    platforms: ["linux/amd64"]
    flavors:
      - id: base
        stage: 1
        build_image: true
      - id: gnome
        stage: 2
        build_image: true
      - id: kde
        stage: 2
        build_image: true
      # No cosmic — same reason as flounder above. The header on this variant
      # used to read "Has latest COSMIC natively"; it does not. sid returns
      # empty from madison for every cosmic binary, exactly like trixie.
      # No niri — same reason as flounder above (absent from Debian sid too).
      - id: xfce
        stage: 2
        build_image: true
      # NVIDIA overlay on the Debian sid base (tunaOS#624) — same mechanism
      # as flounder above (apt non-free + dkms). No *-nvidia-hwe: sid has
      # no HWE kernel layer, same reasoning as flounder. No ISOs: this
      # variant does not build any today (rolling/unstable), so none of its
      # base DE flavors set build_iso either — nvidia flavors match that.
      #
      # platforms is pinned to linux/amd64 explicitly on every *-nvidia
      # flavor in this file — asserted by
      # tests/bats/test_nvidia_overlay.bats.
      - id: gnome-nvidia
        platforms: ["linux/amd64"]
        stage: 3
        build_image: true
        build_iso: false
        build_qcow2: false
      - id: kde-nvidia
        platforms: ["linux/amd64"]
        stage: 3
        build_image: true
        build_iso: false
        build_qcow2: false
      - id: xfce-nvidia
        platforms: ["linux/amd64"]
        stage: 3
        build_image: true
        build_iso: false
        build_qcow2: false
