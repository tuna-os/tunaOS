      # ── Stage 1 ────────────────────────────────────────────────────────────
      - id: base
        stage: 1
        build_image: true
        build_iso: false
        build_qcow2: false

      # ── Stage 2 ────────────────────────────────────────────────────────────
      - id: base-hwe
        stage: 2
        build_image: true
        build_iso: false
        build_qcow2: false
      - id: base-nvidia
        # x86_64 only: the akmods-nvidia-open kmods are x86_64 builds, so on
        # any other platform the exact-EVR kmod install can never match and
        # the overlay hard-fails (overrides/nvidia/10-kernel-swap.sh) rather
        # than shipping a driverless "nvidia" image. Also excludes amd64/v2:
        # Kitten v2 kernels are ARCH=x86_64_v2, which no published kmod
        # matches. Same shape as bluefin's x86_64-only GDX.
        platforms: ["linux/amd64"]
        stage: 2
        build_image: true
        build_iso: false
        build_qcow2: false
      - id: gnome
        stage: 2
        build_image: true
        build_iso: true
        build_qcow2: true
      - id: cosmic
        stage: 2
        build_image: true
        build_iso: true
        build_qcow2: false
      - id: kde
        stage: 2
        build_image: true
        build_iso: true
        build_qcow2: false
      - id: niri
        stage: 2
        build_image: true
        build_iso: true
        build_qcow2: false
      - id: xfce
        stage: 2
        build_image: true
        build_iso: true
        build_qcow2: false

      # ── Stage 3 ────────────────────────────────────────────────────────────
      # HWE: no ISO — install the standard ISO then `bootc switch` to *-hwe
      - id: gnome-hwe
        stage: 3
        build_image: true
        build_iso: false
        build_qcow2: false
      # Apple Silicon (M1/M2, Asahi Linux) — overlay/asahi.sh; aarch64 only.
      # No ISO: Apple Silicon cannot external-boot; installs go through the
      # asahi-installer path from macOS.
      - id: gnome-asahi
        stage: 3
        platforms: ["linux/arm64"]
        build_image: true
        build_iso: false
        build_qcow2: false
      # Intel Macs with Apple's T2 security chip. Fedora's t2linux stack is
      # x86_64-only; no generic ISO may stand in for this profile because it
      # lacks the T2 kernel. Bootsahi Legacy supplies its dedicated USB flow.
      - id: gnome-t2
        stage: 3
        platforms: ["linux/amd64"]
        build_image: true
        build_iso: false
        build_qcow2: false
      - id: gnome-nvidia
        # x86_64 only: the akmods-nvidia-open kmods are x86_64 builds, so on
