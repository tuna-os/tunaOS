name: Verify Asahi image

# Static verification of an asahi-flavor image against the golden manifest
# derived from the known-working Fedora Asahi Silverblue image: 16K asahi
# kernel, the 12 hardware-critical modules, Apple DTBs, m1n1/U-Boot payloads,
# the dracut ESP-firmware flow, and the audio stack (speakers stay disabled if
# any piece is missing). No Mac needed; catches regressions before hardware.
#
# Two modes:
#   - Sweep (schedule, or dispatch with no image): every promoted asahi flavor,
#     one matrix leg each. This is the mode that matters. A tag existing in
#     ghcr only means some build promoted it once; when all eight promoted tags
#     were swept on 2026-07-30, six were unbootable (#776). Green decays
#     silently unless something re-checks it on a timer.
#   - Triage (dispatch with an explicit image): one arbitrary ref, for
#     iterating on a single variant or on a -candidate tag before promotion.
#
# fail-fast is off so one red flavor cannot hide the other seven, and the legs
# are deliberately NOT continue-on-error: a leg that fails must fail the run,
# or the conclusion lies about the fleet's state.

on:
  schedule:
    # 05:40 UTC daily — after the nightly image builds have promoted.
    - cron: "40 5 * * *"
  workflow_dispatch:
    inputs:
      image:
        description: "Single asahi image ref to verify (leave empty to sweep every flavor)"
        default: ""
        type: string

permissions:
  contents: read
  packages: read

jobs:
  # "<registry>/<namespace>" the images publish to: [build.publish] in
  # tunaos.toml, else ghcr.io/<owner> (scripts/publish-destination.sh). The
  # sweep's `with:` is evaluated before any step runs, so it needs this as a
  # job output.
  destination:
    runs-on: ubuntu-latest
    outputs:
      destination: ${{ steps.dest.outputs.destination }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup yq
        uses: ./.github/actions/setup-yq
      - name: Resolve publish destination
        id: dest
        env:
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
        run: echo "destination=$(bash scripts/publish-destination.sh)" >> "$GITHUB_OUTPUT"

  # Sweep mode: every flavor that declares and publishes a :gnome-asahi tag.
  # marlin and flounder are excluded as their gnome-asahi flavors are not declared in
  # build-config.yml until complete distro Asahi stacks are available (tunaOS#911, #1738).
  # guppy is absent as its asahi overlay is stubbed, not broken.
  sweep:
    needs: destination
    # Explicit on the schedule path: a `schedule` event has no `inputs` context
    # at all, and relying on null == '' to pick the sweep is exactly how you get
    # a daily run where BOTH jobs skip and the workflow reports success with
    # zero legs executed — coverage that looks green and checks nothing.
    if: github.event_name == 'schedule' || inputs.image == ''
    strategy:
      fail-fast: false
      matrix:
        # Generated by scripts/generate-workflows.py from tunaos.toml
        # (variants with asahi_verify = true); do not edit.
        flavor: [yellowfin, albacore, skipjack, bonito, sailfin, grouper]
    uses: ./.github/workflows/verify-asahi-one.yml
    with:
      image: ${{ needs.destination.outputs.destination }}/${{ matrix.flavor }}:gnome-asahi

  # Triage mode: one explicit ref.
  single:
    if: github.event_name == 'workflow_dispatch' && inputs.image != ''
    uses: ./.github/workflows/verify-asahi-one.yml
    with:
      image: ${{ inputs.image }}
