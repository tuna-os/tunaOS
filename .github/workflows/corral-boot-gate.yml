name: Corral Boot Gate

# The boot gate's own test. reusable-build-image.yml's Gate job runs
# scripts/corral-boot-gate.sh only inside a publishing build, which no pull
# request starts, so a change to the harness would otherwise meet its first
# real boot in a nightly, where a failure blocks Promote for a whole variant.
#
# This boots two published images through the same script, on the same
# hosted runner and KVM the Gate uses: one per bootc backend, because the
# disk build differs between them (ostree: bootupd + GRUB on xfs; composefs:
# systemd-boot, a sealed root on ext4, and the kernel restored on the ESP).
#
#   yellowfin:gnome   ostree
#   sailfin:gnome     composefs, sealed
#
# Both passed the iso-e2e.sh Gate in their last nightly, so a red cell here is
# the harness, not the image.

on:
  pull_request:
    paths:
      - "scripts/corral-boot-gate.sh"
      - "scripts/install-corral.sh"
      - "scripts/lib/backend.sh"
      - ".github/workflows/corral-boot-gate.yml"
      # downloads.corral selects the executable both disk gates run.
      - "image-versions.yaml"
  workflow_dispatch:

concurrency:
  group: corral-boot-gate-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  gate:
    name: "${{ matrix.variant }}:${{ matrix.desktop }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: yellowfin
            desktop: gnome
          - variant: sailfin
            desktop: gnome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Maximize build space
        uses: ublue-os/container-storage-action@dc1f4c8f17b672069e921f001132f7cf98a423a6 # main as of 2026-02-11

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      # Same rule as the Gate: never apt-install podman over the one the
      # runner image ships under /usr/local (reusable-build-image.yml).
      - name: Install dependencies
        run: |
          sudo apt-get update
          pkgs=(jq qemu-system-x86 qemu-utils ovmf ffmpeg)
          if ! sudo sh -c 'command -v podman' >/dev/null 2>&1; then
            pkgs+=(podman)
          fi
          sudo apt-get install -y "${pkgs[@]}"

      - name: Set up Go for corral
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
          cache: false

      - name: Install corral
        run: |
          scripts/install-corral.sh "$RUNNER_TEMP/corral-bin"
          sudo install -m 0755 "$RUNNER_TEMP/corral-bin/corral" /usr/local/bin/corral

      - name: Boot and verify
        env:
          VARIANT: ${{ matrix.variant }}
          DESKTOP: ${{ matrix.desktop }}
        run: |
          REF="$(bash ./scripts/published-image-ref.sh "$VARIANT" "$DESKTOP" ghcr)"
          echo "==> ${VARIANT}:${DESKTOP} resolves to ${REF}"
          mkdir -p verify-out
          sudo ./scripts/corral-boot-gate.sh "$REF" verify-out 900

      - name: Normalize verify-out ownership
        if: always()
        run: sudo chown -R "$USER:$(id -gn)" verify-out 2>/dev/null || true

      - name: Upload boot evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corral-boot-gate-${{ matrix.variant }}-${{ matrix.desktop }}
          path: |
            verify-out/serial.log
            verify-out/*.png
            verify-out/timelapse.webm
            verify-out/corral/result.json
            verify-out/corral/diagnostics/
          if-no-files-found: warn
          retention-days: 7
