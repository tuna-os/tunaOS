name: Installer Walkthrough Screenshots

# Boots a freshly built live ISO in QEMU, drives the bootc-install GUI with
# scripts/run-walkthrough.sh (which delegates the driving to
# scripts/installer-walkthrough.py — the fixed sendkey choreography this
# comment used to describe was removed after it labelled three welcome-screen
# frames as disk_select and confirm), and commits
# the resulting flow screenshots to docs/images/installer/ — replacing the
# repo's installer imagery with real captures on a schedule.
#
# The gnome flow writes 01_welcome.png … 06_done.png; the cosmic flow gets a
# cosmic_ prefix. These exact filenames are what docs/INSTALLER_SCREENSHOTS.md
# and the docs site carousels reference.

on:
  schedule:
    # Mondays 05:00 UTC — after weekend image publishes and the 02:00 desktop
    # screenshot run, before the 06:00 iso-e2e smoke.
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      variant:
        description: "Variant to capture the installer on"
        required: false
        default: "skipjack"
        type: choice
        options:
          - yellowfin
          - albacore
          - skipjack
          - bonito
          - grouper

permissions:
  contents: read
  packages: read

concurrency:
  group: installer-screenshots
  cancel-in-progress: false

jobs:
  walkthrough:
    name: ${{ inputs.variant || 'skipjack' }}:${{ matrix.flavor }} installer flow
    runs-on: ubuntu-24.04
    # Must exceed the sum of the step ceilings below (70 ISO + 30 walkthrough
    # + 20 install-verify), or the job clock kills a step that is still inside
    # its own budget — which reads as a hang rather than as the timeout it is.
    timeout-minutes: 130
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: gnome
            prefix: ""
          - flavor: cosmic
            prefix: "cosmic_"
    env:
      VARIANT: ${{ inputs.variant || 'skipjack' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: ublue-os/container-storage-action@dc1f4c8f17b672069e921f001132f7cf98a423a6 # main as of 2026-02-11

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      # The second line is the ISO-BUILD toolchain, and it is required now that
      # tacklebox runs as a host binary rather than in a container: the
      # container carried these tools, the runner does not. Without them the
      # build runs all the way to the end and then dies with
      #
      #   Error: no systemd-boot EFI binary on host ...; install
      #   systemd-boot-efi or systemd-boot-unsigned
      #
      # This is the same list installer-smoke.yml installs, and for the same
      # reason — it has always built its ISOs from source.
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            just podman jq golang-go git \
            systemd-boot-efi xorriso mtools squashfs-tools dosfstools gdisk \
            qemu-system-x86 qemu-utils ovmf socat netpbm python3-pil \
            tesseract-ocr imagemagick
          sudo wget -qO /usr/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 && sudo chmod +x /usr/bin/yq

      # The runner image ships podman 5.8.4, which wedges committing a
      # live-customized rootfs (#1893). Every ISO build needs the Kubic one
      # instead; this job ran `just iso` without it. Necessary, not
      # sufficient -- iso-e2e.yml installs this and its commit still exceeded
      # tacklebox's 600s bound on a GitHub-hosted runner (job 97638514487) --
      # but a build without it cannot finish at all.
      - name: setup working podman
        run: |
          set -euo pipefail
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/unstable/xUbuntu_24.04/Release.key \
            | gpg --dearmor | sudo tee /etc/apt/keyrings/kubic.gpg >/dev/null
          echo 'deb [signed-by=/etc/apt/keyrings/kubic.gpg] https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/unstable/xUbuntu_24.04/ /' \
            | sudo tee /etc/apt/sources.list.d/kubic.list
          sudo apt-get update -qq
          sudo apt-get remove -y podman conmon crun || true
          sudo apt-get install -y podman
          for p in /usr/local/bin/podman /usr/local/sbin/podman; do
            if [ -e "$p" ] && ! dpkg -S "$p" >/dev/null 2>&1; then
              sudo rm -f "$p"
            fi
          done
          hash -r

      - name: Log in to GHCR
        run: echo "${{ env.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # TACKLEBOX_FROM_SOURCE=1 is what every other ISO-building workflow in
      # this repo already sets — reusable-build-artifacts, live-iso-bootc,
      # luks-e2e, publish-iso-groups and installer-smoke. This job was the only
      # one that did not, and it is the reason it has never once gone green.
      #
      # Without it, tunaos_run_tacklebox() runs tacklebox INSIDE a podman
      # container (scripts/lib/common.sh). Tacklebox then issues its own
      # `podman run` for the live-customize step, so that step is
      # podman-in-podman — and the nested container's DNS does not resolve:
      #
      #   Error: Failed to download metadata for repo 'baseos': Cannot prepare
      #   internal mirrorlist: Curl error (6): Could not resolve hostname for
      #   https://mirrors.centos.org/... [Could not resolve host: mirrors.centos.org]
      #
      # With it, tacklebox is built and run as a HOST binary at the SHA pinned
      # in image-versions.yaml, so live-customize is an ordinary host container
      # with working DNS. golang-go is already in this job's dependency list.
      #
      # The outer `sudo` goes with it. The Justfile's `iso` recipe already does
      # `sudo -E bash ./scripts/build-iso-tacklebox.sh` itself; wrapping the
      # whole thing in another sudo dropped the environment, which is why the
      # variable had to be re-stated inline. installer-smoke.yml calls `just
      # iso` unsudoed for exactly this reason.
      # 45 was not enough once tacklebox moved to the host: the gnome leg of run
      # 31162836652 was killed mid-build at exactly 45 minutes, having got
      # past every previous failure point. The cosmic leg finished its build in
      # ~7 minutes, so this is headroom for the large images, not a general
      # slowdown.
      - name: Build live ISO (from published GHCR image)
        timeout-minutes: 70
        env:
          GITHUB_REPOSITORY_OWNER: tuna-os
          TACKLEBOX_FROM_SOURCE: "1"
        run: |
          just iso "${VARIANT}" "${{ matrix.flavor }}" ghcr "${{ matrix.flavor }}"

      - name: Run installer walkthrough
        timeout-minutes: 30
        run: |
          ISO=$(find . -maxdepth 1 -name "${VARIANT}-${{ matrix.flavor }}-*.iso" | head -1)
          if [[ -z "$ISO" ]]; then
            echo "::error::No ISO found for ${VARIANT}-${{ matrix.flavor }}"
            exit 1
          fi
          # FLAVOR must be set AND must survive sudo (-E), or run-walkthrough.sh
          # falls back to FLAVOR=de and both matrix legs write the same
          # walkthrough-de.json — a parity report that names neither frontend
          # it came from.
          # `|| true` so a walkthrough failure still reaches the chown below.
          # run-walkthrough.sh runs as root, so everything it writes —
          # serial.log included — is root-owned; without the chown the
          # if: always() debug upload dies with EACCES and destroys the one
          # piece of evidence a failed run produces. Run 31168173594 did
          # exactly that: the walkthrough failed, `set -e` skipped the chown,
          # and the serial log could not be uploaded.
          rc=0
          sudo -E FLAVOR="${{ matrix.flavor }}" \
            bash scripts/run-walkthrough.sh "$ISO" walkthrough-out || rc=$?
          sudo chown -R "$USER:$(id -gn)" walkthrough-out || true
          if [[ "$rc" -ne 0 ]]; then
            echo "::error::run-walkthrough.sh exited $rc"
            exit "$rc"
          fi

          # Fail loudly rather than publish a report with the screen rows
          # unfilled. installer-walkthrough.py degrades to "screen detection
          # skipped" when tesseract is missing and still exits 0, so a missing
          # dependency looked exactly like a passing run — which is how this
          # job produced ocr:false reports for months while green.
          json="walkthrough-out/walkthrough-${{ matrix.flavor }}.json"
          if [[ ! -f "$json" ]]; then
            echo "::error::$json was not written"
            exit 1
          fi
          if [[ "$(jq -r .ocr "$json")" != "true" ]]; then
            echo "::error::walkthrough ran without OCR — every screen row in"
            echo "::error::this report is unfilled. tesseract-ocr missing?"
            exit 1
          fi
          jq -r '.screens | to_entries[] | "  \(.key): \(.value)"' "$json"

          # ocr:true only proves tesseract RAN. It says nothing about whether
          # anything was recognised, and on run 31171184497 that gap was the
          # whole story: the step went green while the harness's own TAP output
          # read
          #
          #   not ok - gnome: screen changes between steps
          #     # 0/10 transitions changed >500px
          #     # 1 distinct visual state(s) across 11 frames
          #   # Results: 2 passed, 7 failed, 9 total
          #   # screens reached: (none detected)
          #
          # and every screen row came back false. installer-walkthrough.py
          # reports those failures and exits 0 unless --strict is passed, so
          # the assertion above — mine — was a gate that could not fire on the
          # only question the job exists to answer.
          #
          # A run that detected NO screen at all has not produced a parity
          # report; it has produced an empty one, which is worse, because the
          # matrix cannot tell "we looked and found nothing" from "we never
          # looked". Blank frames on the GPU-less runner are a known and
          # expected limitation for cosmic/niri/xfwl4 — but the correct
          # response to a limitation is to say so out loud, not to publish a
          # green tick over six false rows.
          reached=$(jq -r '[.screens[] | select(. == true)] | length' "$json")
          total=$(jq -r '.screens | length' "$json")
          echo "screens detected: ${reached}/${total}"
          if [[ "$reached" -eq 0 ]]; then
            echo "::error::the walkthrough detected NONE of the ${total} spec'd"
            echo "::error::screens. The installer UI was never reached, so this"
            echo "::error::report would fill the parity matrix with six false"
            echo "::error::rows. See the DIAGNOSIS line above and the captured"
            echo "::error::PNGs in the installer-shots-${{ matrix.flavor }} artifact."
            exit 1
          fi

      # The walkthrough performed a real install onto install-disk.qcow2.
      # Boot that disk to verify the install flow actually produced a
      # bootable system — this is the end-to-end check on the ISO install
      # pipeline, not just the GUI rendering. Advisory for now: sendkey
      # choreography drift aborts installs without meaning the ISO is bad.
      - name: Verify installed system boots
        id: install-verify
        timeout-minutes: 20
        continue-on-error: true
        run: |
          sudo ./scripts/iso-e2e.sh walkthrough-out/install-disk.qcow2 --disk \
            --output install-verify-out \
            --timeout 600
          sudo chown -R "$USER:$(id -gn)" install-verify-out || true

      - name: Report install verification
        if: steps.install-verify.outcome == 'failure'
        run: |
          echo "::warning::installed system from the walkthrough did not verify as bootable — check installer-debug artifact"

      - name: Apply flavor prefix and validate captures
        run: |
          mkdir -p staged
          count=0
          for png in walkthrough-out/*.png; do
            [[ -f "$png" ]] || continue
            cp "$png" "staged/${{ matrix.prefix }}$(basename "$png")"
            count=$((count + 1))
          done
          echo "Captured ${count} screenshots"
          if [[ "$count" -lt 6 ]]; then
            echo "::warning::expected 6 walkthrough screenshots, got ${count} — flow may have drifted (see serial.log artifact)"
          fi
          if [[ "$count" -eq 0 ]]; then
            echo "::error::no screenshots captured"
            exit 1
          fi

      - name: Upload walkthrough artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-shots-${{ matrix.flavor }}
          # The parity report ships alongside the PNGs. It was being written
          # into walkthrough-out/ and then uploaded by nothing, so the file
          # tunaOS's own installer matrix consumes never left the runner.
          path: |
            staged/*.png
            walkthrough-out/walkthrough-*.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-debug-${{ matrix.flavor }}
          path: walkthrough-out/serial.log
          if-no-files-found: ignore
          retention-days: 7

  commit-to-repo:
    name: Commit installer screenshots
    needs: walkthrough
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Needed to open the refresh PR; `main` only accepts merge-queue changes.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download walkthrough artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installer-shots-*
          merge-multiple: true
          path: /tmp/installer-shots

      - name: Stage screenshots
        id: stage
        run: |
          mkdir -p docs/images/installer
          count=0
          for png in /tmp/installer-shots/*.png; do
            [[ -f "$png" ]] || continue
            cp "$png" "docs/images/installer/$(basename "$png")"
            count=$((count + 1))
          done
          echo "staged=${count}" >> "$GITHUB_OUTPUT"
          echo "Staged ${count} screenshot(s)"

      # tunaos.org's InstallerWalkthrough component reads these:
      # screenshots/installer/<name>-latest.png on download.tunaos.org.
      - name: Publish captures to R2
        if: steps.stage.outputs.staged != '0'
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          if [[ -z "${RCLONE_CONFIG_R2_ACCESS_KEY_ID:-}" ]]; then
            echo "::notice::R2 credentials not configured; skipping publish."
            exit 0
          fi
          sudo apt-get install -y -qq rclone 2>/dev/null || true
          for png in /tmp/installer-shots/*.png; do
            [[ -f "$png" ]] || continue
            base="$(basename "$png" .png)"
            rclone copyto --s3-no-check-bucket --log-level ERROR \
              "$png" "R2:${{ secrets.R2_BUCKET }}/screenshots/installer/${base}-latest.png"
          done
          echo "Published capture(s) to R2"

      - name: Regenerate screenshot gallery
        if: steps.stage.outputs.staged != '0'
        run: bash scripts/gen-screenshot-gallery.sh

      # Opens a PR; does NOT push to main. `main` is protected by a
      # repository rule -- "Changes must be made through the merge queue" --
      # so `git push origin HEAD:main` is rejected outright (GH013). Observed
      # on installer-smoke.yml run 32704425971, where the identical step had
      # simply never executed before: it is gated on `staged != 0` and no
      # flavor had ever produced frames. All three screenshot writers carried
      # the same line; all three are now the matrix-status.yml shape.
      - name: Open the screenshot refresh PR
        if: steps.stage.outputs.staged != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: automation/installer-screenshots-weekly
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/installer docs/SCREENSHOTS.md
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit"
            exit 0
          fi
          git checkout -b "$BRANCH"
          git commit -m "docs: refresh installer walkthrough screenshots ($(date -u +%Y-%m-%d))"
          git push --force origin "$BRANCH"

          if [[ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]]; then
            gh pr create --base main --head "$BRANCH" \
              --title "docs: refresh installer walkthrough screenshots" \
              --body "$(printf '%s\n\n%s\n' \
                'Captured by the weekly installer walkthrough and staged by `scripts/gen-screenshot-gallery.sh`.' \
                'Force-updated in place, so this branch always holds the newest capture.')"
          else
            echo "PR already open for $BRANCH — force-push refreshed it."
          fi

          # A PR opened with the Actions token starts no checks of its own;
          # the merge queue runs the required checks on the merge group, so
          # arming auto-merge is what actually lands the refresh.
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [[ -n "$pr" ]]; then
            gh pr merge --auto --merge "$pr" ||
              echo "::warning::could not arm auto-merge on #$pr — the refresh will wait for a human"
          fi
