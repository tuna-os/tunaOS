name: Build Stingray [experimental]
permissions:
  contents: read
  packages: write
  id-token: write
on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Flavor (all, base, gnome, kde, xfce)'
        default: 'all'
        type: string

concurrency:
  group: build-stingray-${{ github.ref }}-${{ inputs.flavor || 'all' }}
  cancel-in-progress: true

jobs:
  build:
    name: 🐟-stingray
    uses: ./.github/workflows/build-variant.yml
    with:
      variant: 'stingray'
      flavor: ${{ inputs.flavor || 'all' }}
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
