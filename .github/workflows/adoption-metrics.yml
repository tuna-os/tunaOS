---
name: Adoption metrics snapshot

"on":
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  discussions: read

jobs:
  snapshot:
    if: github.repository == 'tuna-os/tunaOS'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Collect public signals
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/adoption-snapshot.py --output-dir adoption-snapshot
      - name: Publish run summary
        run: cat adoption-snapshot/*.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adoption-snapshot-${{ github.run_id }}
          path: adoption-snapshot/
          if-no-files-found: error
          retention-days: 90
