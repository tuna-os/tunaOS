name: Lint and Check

# Runs static analysis on shell scripts, YAML, JSON, Justfiles, and
# GitHub Actions workflows. Uses the project's existing `just check`
# command which wraps shellcheck, yamllint, jq, actionlint, and just fmt.
#
# Triggered on every PR and push to main to catch regressions before
# they land. Complements `just-fix.yml` (auto-formatting) by adding
# enforcement of code quality rules.
#
# This is a hold-gated PR — human review required before merge.
# See quality agent finding: https://github.com/tuna-os/tunaOS/issues/150

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - shellcheck
          - yamllint
          - json-validate
          - actionlint
          - justfmt
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@2ebcf16054461267868620b1414507f3ccc765c1 # main as of 2026-06-09

      - name: Install tools
        run: |
          # Install all lint tools; brew is idempotent for already-installed
          brew install just shellcheck shfmt yamllint jq actionlint 2>/dev/null || true
          # Verify installations
          shellcheck --version
          yamllint --version
          jq --version
          actionlint -version
          just --version

      - name: Run shellcheck
        if: matrix.check == 'shellcheck'
        run: |
          echo "==> Running shellcheck on all .sh files..."
          # Exclude third-party extensions and build artifacts
          /usr/bin/find . \
            -not -path './system_files/usr/share/gnome-shell/extensions/*' \
            -not -path './packages-repo/*' \
            -not -path './.build/*' \
            -not -path './_upstream-snapshots/*' \
            -iname "*.sh" -type f \
            -exec shellcheck --severity=error --exclude=SC1091,SC2114 --format=tty {} +

      - name: Run yamllint
        if: matrix.check == 'yamllint'
        run: |
          echo "==> Running yamllint on all YAML files..."
          find . \
            -not -path './system_files/usr/share/gnome-shell/extensions/*' \
            -not -path './packages-repo/*' \
            -not -path './.build/*' \
            -not -path './_upstream-snapshots/*' \
            \( -name "*.yaml" -o -name "*.yml" \) -type f \
            -exec yamllint -c ./.yamllint.yml {} +

      - name: Validate JSON files
        if: matrix.check == 'json-validate'
        run: |
          echo "==> Validating JSON syntax..."
          find . \
            -not -path './system_files/usr/share/gnome-shell/extensions/*' \
            -not -path './packages-repo/*' \
            -not -path './.build/*' \
            -name "*.json" -type f \
            -exec sh -c 'jq . "$1" > /dev/null || { echo "ERROR: invalid JSON in $1"; exit 1; }' _ {} \;

      - name: Run actionlint
        if: matrix.check == 'actionlint'
        continue-on-error: true  # actionlint is informative, not blocking
        run: |
          echo "==> Running actionlint on workflows..."
          actionlint \
            -ignore 'permission "id-token" is unknown' \
            -ignore "SC2086" -ignore "SC2129" -ignore "SC2001" \
            -ignore "SC2034" -ignore "SC2015" -ignore "SC1001" \
            -ignore "SC2295" -ignore "SC2016" \
            -ignore "save-always" \
            -ignore "cannot be filtered" \
            .github/workflows/*.yml .github/workflows/*.yaml

      - name: Check Justfile formatting
        if: matrix.check == 'justfmt'
        run: |
          echo "==> Checking Justfile format..."
          just --unstable --fmt --check -f Justfile
          find . \
            -not -path './system_files/usr/share/gnome-shell/extensions/*' \
            -not -path './packages-repo/*' \
            -not -path './.build/*' \
            -name "*.just" -type f \
            -exec just --unstable --fmt --check -f {} \;

  package-source-policy:
    name: Package source policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install YAML parser
        run: python3 -m pip install pyyaml --break-system-packages
      - name: Reject new non-system package sources
        run: python3 scripts/check-package-sources.py --base "${{ github.event.pull_request.base.sha || github.event.before }}"

  # Summary job: aggregates results and posts a single status check
  #
  # A cancelled shard is NOT a lint failure. `cancel-in-progress` cancels this
  # workflow on every superseding push, and treating anything != success as a
  # failure turned each of those into a red "Lint Summary" check reporting
  # lint problems that did not exist: six consecutive cancelled runs on one PR
  # branch (30596589325 through 30598179346), every one of them red, each
  # sending autofix chasing a phantom. Only a real failure fails this job;
  # cancelled and skipped are reported as-is.
  lint-summary:
    name: Lint Summary
    needs: [lint, package-source-policy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check lint results
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          SOURCE_POLICY_RESULT: ${{ needs['package-source-policy'].result }}
        run: |
          echo "## Lint Results" >> "$GITHUB_STEP_SUMMARY"
          case "${LINT_RESULT}" in
            success)
              echo "✅ All lint checks passed" >> "$GITHUB_STEP_SUMMARY"
              ;;
            cancelled | skipped)
              echo "⚪ Lint shards were ${LINT_RESULT} (superseded by a newer run); nothing was linted, so nothing failed." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "❌ Some lint checks failed, see job details above" >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac
          if [[ "${SOURCE_POLICY_RESULT}" != success ]]; then
            echo "❌ Package source policy check did not pass" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
