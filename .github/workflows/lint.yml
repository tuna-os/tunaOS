name: Lint and Check

# Runs static analysis on shell scripts, YAML, JSON, Justfiles, and
# GitHub Actions workflows, plus the package source policy. Uses the same
# tools and excludes as `just check`: shellcheck, yamllint, jq, actionlint
# and just fmt.
#
# Triggered on every PR and push to main to catch regressions before
# they land. Complements `just-fix.yml` (auto-formatting) by adding
# enforcement of code quality rules.
#
# ONE job, not a matrix. This used to be a six-cell matrix plus a source
# policy job and a summary job: eight jobs per PR push, every cell paying
# ~80s of checkout + Homebrew + tool install to run a check that takes
# seconds. On the org's shared 60-job runner pool that was the largest
# per-PR fan-out in this repo. Each check is still its own step and runs
# even when an earlier check failed (`!cancelled()`), so a red Lint job
# still names every failing check, as the matrix's fail-fast: false did.
#
# See quality agent finding: https://github.com/tuna-os/tunaOS/issues/150

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the package source policy diffs against the
          # merge base (`BASE...HEAD`).
          fetch-depth: 0
          persist-credentials: false

      - name: Validate and prepare primary configuration
        uses: ./.github/actions/prepare-config

      - name: Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@2ebcf16054461267868620b1414507f3ccc765c1 # main as of 2026-06-09

      - name: Install tools
        id: tools
        run: |
          # Install all lint tools; brew is idempotent for already-installed
          brew install just shellcheck shfmt yamllint jq actionlint 2>/dev/null || true
          # shfmt is a FORMATTER, so its version is part of this repo's
          # formatting: a different one reformats the whole tree and `just
          # check` then fails on files nobody touched. brew installs whatever
          # is current, so install the PINNED version over the top of it and
          # let it win on PATH. See image-versions.yaml and just/utilities.just
          # (_check_shfmt_version), which fails locally on the same mismatch.
          want="$(sed -n 's/^  shfmt: "v\{0,1\}\([^"]*\)"$/\1/p' image-versions.yaml | head -1)"
          if [ -n "$want" ]; then
            echo "Pinned shfmt: v${want}"
            GOBIN=/usr/local/bin go install "mvdan.cc/sh/v3/cmd/shfmt@v${want}" \
              || echo "::warning::could not install pinned shfmt v${want}; using $(shfmt --version)"
          fi
          # Verify installations
          shfmt --version
          shellcheck --version
          yamllint --version
          jq --version
          actionlint -version
          just --version

      - name: Run shellcheck
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: |
          echo "==> Running shellcheck on all .sh files..."
          # Exclude third-party extensions and build artifacts
          /usr/bin/find . \
            -not -path './system_files/usr/share/gnome-shell/extensions/*' \
            -not -path './packages-repo/*' \
            -not -path './.build/*' \
            -not -path './_upstream-snapshots/*' \
            -iname "*.sh" -type f \
            -exec shellcheck --severity=error --exclude=SC1091,SC2114 --format=tty {} +

      - name: Run yamllint
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: |
          echo "==> Running yamllint on all YAML files..."
          find . \
            -not -path './system_files/usr/share/gnome-shell/extensions/*' \
            -not -path './packages-repo/*' \
            -not -path './.build/*' \
            -not -path './_upstream-snapshots/*' \
            \( -name "*.yaml" -o -name "*.yml" \) -type f \
            -exec yamllint -c ./.yamllint.yml {} +

      - name: Validate JSON files
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: |
          echo "==> Validating JSON syntax..."
          find . \
            -not -path './system_files/usr/share/gnome-shell/extensions/*' \
            -not -path './packages-repo/*' \
            -not -path './.build/*' \
            -name "*.json" -type f \
            -exec sh -c 'jq . "$1" > /dev/null || { echo "ERROR: invalid JSON in $1"; exit 1; }' _ {} \;

      - name: Run actionlint
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        continue-on-error: true  # actionlint is informative, not blocking
        run: |
          echo "==> Running actionlint on workflows..."
          actionlint \
            -ignore 'permission "id-token" is unknown' \
            -ignore "SC2086" -ignore "SC2129" -ignore "SC2001" \
            -ignore "SC2034" -ignore "SC2015" -ignore "SC1001" \
            -ignore "SC2295" -ignore "SC2016" \
            -ignore "save-always" \
            -ignore "cannot be filtered" \
            .github/workflows/*.yml .github/workflows/*.yaml

      - name: Check action pins
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/check-action-pins.py

      - name: Check Justfile formatting
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: |
          echo "==> Checking Justfile format..."
          just --unstable --fmt --check -f Justfile
          find . \
            -not -path './system_files/usr/share/gnome-shell/extensions/*' \
            -not -path './packages-repo/*' \
            -not -path './.build/*' \
            -name "*.just" -type f \
            -exec just --unstable --fmt --check -f {} \;

      - name: Install YAML parser
        id: pyyaml
        if: ${{ !cancelled() }}
        run: python3 -m pip install pyyaml --break-system-packages

      - name: Package source policy
        if: ${{ !cancelled() && steps.pyyaml.outcome == 'success' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/check-package-sources.py --base "$BASE_SHA"
