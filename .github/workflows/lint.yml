name: Lint and Check

# Runs static analysis on shell scripts, YAML, JSON, Justfiles, and
# GitHub Actions workflows, plus the package source policy. Uses the same
# tools and excludes as `just check`: shellcheck, yamllint, jq, actionlint
# and just fmt.
#
# Triggered on every PR and push to main to catch regressions before
# they land. Complements `just-fix.yml` (auto-formatting) by adding
# enforcement of code quality rules.
#
# ONE job, not a matrix. This used to be a six-cell matrix plus a source
# policy job and a summary job: eight jobs per PR push, every cell paying
# ~80s of checkout + Homebrew + tool install to run a check that takes
# seconds. On the org's shared 60-job runner pool that was the largest
# per-PR fan-out in this repo. Each check is still its own step and runs
# even when an earlier check failed (`!cancelled()`), so a red Lint job
# still names every failing check, as the matrix's fail-fast: false did.
#
# See quality agent finding: https://github.com/tuna-os/tunaOS/issues/150

# `Lint` is a required status check on main (tunaOS#1167), so on pull requests
# and merge-queue entries the workflow always runs: a workflow-level
# `paths-ignore` would leave a prose-only PR with a required check that never
# reports, which blocks it forever. The `changes` job makes that decision
# instead, and a job skipped by `if:` reports Skipped, which satisfies a
# required check. Merge-queue entries always lint in full.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect lint inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      # Pull requests only; every other event leaves `relevant` empty and the
      # lint job runs. A failed detection also leaves it empty, which lints
      # rather than skipping. A file is relevant unless it is prose. These are
      # the push trigger's paths-ignore exclusions; '**/*.md' here and '**.md'
      # there both match every Markdown file at any depth in their matchers.
      - name: Detect changed lint inputs
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            relevant:
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'

  lint:
    name: Lint
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.relevant != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the package source policy diffs against the
          # merge base (`BASE...HEAD`).
          fetch-depth: 0
          persist-credentials: false

      - name: Validate and prepare primary configuration
        uses: ./.github/actions/prepare-config

      - name: Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@2ebcf16054461267868620b1414507f3ccc765c1 # main as of 2026-06-09

      - name: Locate tool caches
        id: tool_cache_paths
        run: echo "brew=$(brew --cache)" >> "$GITHUB_OUTPUT"

      - name: Cache verified tools and Brew downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/lint-tools
            ${{ steps.tool_cache_paths.outputs.brew }}/downloads
          # No fallback key: a changed pin/installer gets a clean binary cache.
          # Brew downloads are content-addressed; never restore a mutable Cellar.
          key: lint-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchain/lint-tools.json', 'scripts/lint_tools.py', '.github/workflows/lint.yml') }}

      - name: Install verified tools
        id: tools
        run: |
          set -euo pipefail
          brew install yamllint jq
          bin_dir="$RUNNER_TEMP/lint-tools"
          python3 scripts/lint_tools.py install --bin-dir "$bin_dir"
          export PATH="$bin_dir:$PATH"
          python3 scripts/lint_tools.py verify
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Run shellcheck
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: ./scripts/run-config-lint.sh shellcheck

      - name: Check shell formatting
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: ./scripts/run-config-lint.sh shfmt

      - name: Run yamllint
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: ./scripts/run-config-lint.sh yaml

      - name: Validate JSON files
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: ./scripts/run-config-lint.sh json

      - name: Run actionlint
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: ./scripts/run-config-lint.sh actionlint

      - name: Check action pins
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/check-action-pins.py

      - name: Check Justfile formatting
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: ./scripts/run-config-lint.sh just

      - name: Locate Python dependency cache
        id: python_cache_paths
        if: ${{ !cancelled() }}
        run: |
          echo "pip=$(python3 -m pip cache dir)" >> "$GITHUB_OUTPUT"
          python3 -c 'import sys; print("interpreter=" + sys.implementation.cache_tag)' >> "$GITHUB_OUTPUT"

      - name: Cache Python downloads
        if: ${{ !cancelled() && steps.python_cache_paths.outcome == 'success' }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.python_cache_paths.outputs.pip }}
          key: lint-pip-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.python_cache_paths.outputs.interpreter }}-${{ hashFiles('.github/workflows/lint.yml') }}

      - name: Install YAML parser
        id: pyyaml
        if: ${{ !cancelled() }}
        run: python3 -m pip install pyyaml --break-system-packages

      - name: Package source policy
        if: ${{ !cancelled() && steps.pyyaml.outcome == 'success' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: python3 scripts/check-package-sources.py --base "$BASE_SHA"
