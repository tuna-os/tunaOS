# Installer GUI smoke (tunaOS#678 phase 1): per-desktop proof that the
# live ISO autologins and the installer frontend actually starts.
#
# For each flavor (gnome and the four forks): build the dev ISO (SSH enabled),
# boot it under OVMF,
# wait for TUNAOS_LIVE_READY, then over SSH assert the installer process
# is running (flatpak run org.tunaos.Installer* / bootc-installer) and
# capture a desktop screenshot as reviewable evidence.
#
# Phase 2 (per-DE install path) extends the LUKS E2E matrix; phase 3
# (VLM screen assertions) is blocked on a CI-reachable VLM endpoint.
name: Installer Smoke

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Variant"
        required: false
        default: "yellowfin"
        type: string
      flavors:
        description: "Comma-separated flavors"
        required: false
        # gnome included: it is the flow the four forks are asked to match, and
        # it was the only frontend with no per-DE smoke leg at all. The APP
        # mapping below already falls through to org.bootcinstaller.Installer
        # for it, and the walkthrough's --strict list already names it — only
        # this default kept it from ever running.
        default: "gnome,kde,cosmic,niri,xfce"
        type: string
  schedule:
    # Weekly, after the Tuesday image builds settle.
    - cron: "0 9 * * 3"

permissions:
  contents: read
  packages: read

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install yq
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - id: gen
        env:
          FILTER_VARIANT: ${{ inputs.variant || '' }}
          FILTER_FLAVORS: ${{ inputs.flavors || '' }}
        run: |
          set -euo pipefail
          json="$(yq -o=json '.' .github/build-config.yml)"

          if [[ -n "$FILTER_VARIANT" || -n "$FILTER_FLAVORS" ]]; then
            v="${FILTER_VARIANT:-yellowfin}"
            f="${FILTER_FLAVORS:-gnome,kde,cosmic,niri,xfce}"
            M=$(jq -cn --arg v "$v" --arg f "$f" \
              '{include: ($f | split(",") | map({variant: $v, flavor: ., runner: "build-amd64"}))}')
          else
            M=$(echo "$json" | jq -c \
              '{include: [ .variants[] | . as $variant | .id as $v | .flavors[]
                 | select(.build_iso == true)
                 | select((.platforms // $variant.platforms // []) | index("linux/amd64"))
                 | {variant: $v, flavor: .id, runner: "build-amd64"} ]}')
          fi
          echo "matrix=$M" >> "$GITHUB_OUTPUT"
          echo "$M" | jq .

  build-iso:
    name: build ${{ matrix.variant }}:${{ matrix.flavor }}
    needs: generate-matrix
    # RunsOn for all cells: the ISO build (tacklebox + podman) cannot work on
    # the GitHub runner's podman 5.8.4 (tunaOS#1893).
    #
    # build-amd64 for every flavor, including cosmic/niri/xfwl4/kde. Those
    # four were routed to the `gpu` group (g4dn spot) for the DRM render node
    # the compositor checks need -- but #1929 split this workflow in two, and
    # the render node is needed by the half that no longer runs here. THIS job
    # checks out, sets up podman, builds an ISO and uploads it; it touches no
    # DRM device and invokes no compositor. The boot-and-assert half is the
    # `smoke` job below, which runs on ubuntu-latest for every flavor and
    # drives scripts/iso-e2e.sh -- not iso-e2e-gpu.sh.
    #
    # So the gpu routing survived the split as a no-op that still provisions
    # a g4dn per cell. Removing it makes cosmic/niri/kde testable without any
    # GPU capacity at all, which matters because the g4dn quota is a real
    # constraint (the on-demand increase was declined 2026-08-21, and this
    # group is spot anyway -- a different quota, L-3819A6DF).
    #
    # The boot Gate in reusable-build-image.yml is unaffected: it genuinely
    # runs iso-e2e-gpu.sh and still asks for `gpu`.
    runs-on: runs-on=${{ github.run_id }}/runner=${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main as of 2026-06-09
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y just podman jq golang-go git \
            systemd-boot-efi xorriso mtools squashfs-tools dosfstools gdisk
          sudo wget -qO /usr/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 && sudo chmod +x /usr/bin/yq

      # The RunsOn ubuntu24 image ships podman 5.8.4 (same wedge as the GitHub
      # runner); install the Kubic podman and drop the image shadow so the ISO
      # build's podman run/commit work (tunaOS#1893). The bumped tacklebox pin
      # (k8s-file log driver) handles the rest.
      - name: setup working podman on RunsOn
        run: |
          set -euo pipefail
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/unstable/xUbuntu_24.04/Release.key \
            | gpg --dearmor | sudo tee /etc/apt/keyrings/kubic.gpg >/dev/null
          echo 'deb [signed-by=/etc/apt/keyrings/kubic.gpg] https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/unstable/xUbuntu_24.04/ /' \
            | sudo tee /etc/apt/sources.list.d/kubic.list
          sudo apt-get update -qq
          sudo apt-get remove -y podman conmon crun || true
          sudo apt-get install -y podman
          for p in /usr/local/bin/podman /usr/local/sbin/podman; do
            if [ -e "$p" ] && ! dpkg -S "$p" >/dev/null 2>&1; then
              sudo rm -f "$p"
            fi
          done
          hash -r
          echo ">>> podman: $(podman --version)"

      - name: Log in to GHCR
        # sudo (root) podman: the runner rootless re-exec is broken
        # ("cannot re-exec process"); the ISO build also runs as root.
        run: echo "${{ env.GITHUB_TOKEN }}" | sudo -n podman login ghcr.io -u ${{ github.actor }} --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build dev ISO
        env:
          VARIANT: ${{ matrix.variant }}
          FLAVOR: ${{ matrix.flavor }}
        run: |
          export TACKLEBOX_FROM_SOURCE=1
          # Root build: the RunsOn runner's rootless podman/buildah re-exec is
          # broken ("cannot re-exec process"), and the tacklebox ISO build
          # already runs as root via sudo.
          sudo -E env "PATH=$PATH" just iso "${VARIANT}" "${FLAVOR}" ghcr "" 1
          ISO=$(find .build -maxdepth 3 -name "*.iso" | head -1)
          [[ -n "$ISO" ]] || { echo "::error::dev ISO not produced"; exit 1; }
          echo "ISO_PATH=${ISO}" >> "$GITHUB_ENV"
          # Hand-off: the boot phase runs on a KVM-capable GitHub-hosted
          # runner (see the smoke job below), which receives the ISO as an
          # artifact. Stage it under a stable name.
          mkdir -p iso-out
          sudo mv "$ISO" iso-out/dev.iso
          sudo chown "$(id -u):$(id -g)" iso-out/dev.iso
          ls -lh iso-out/

      - name: Upload dev ISO for the boot phase
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev-iso-${{ matrix.variant }}-${{ matrix.flavor }}
          path: iso-out/dev.iso
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  smoke:
    name: ${{ matrix.variant }}:${{ matrix.flavor }}
    needs: [generate-matrix, build-iso]
    # KVM split (#1893 endgame): the ISO must be BUILT on RunsOn (working
    # podman), but RunsOn's EC2 instances are virtualized — no /dev/kvm — so
    # QEMU falls back to TCG and the live image cannot reach its readiness
    # marker inside any sane timeout (run 32395858593 attempt 2: 2.8KB of
    # serial output in 20 minutes). GitHub-hosted runners are the inverse:
    # broken podman, working KVM. So build there, boot here — the boot half
    # needs no podman, and this is the exact environment the render/screen
    # gates and the software-GL generator (#1087) were built against.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main as of 2026-06-09
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Install boot dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq socat imagemagick sshpass tesseract-ocr \
            qemu-system-x86 qemu-utils ovmf
          sudo wget -qO /usr/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 && sudo chmod +x /usr/bin/yq

      - name: Download dev ISO
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dev-iso-${{ matrix.variant }}-${{ matrix.flavor }}
          path: iso-out

      - name: Point the harness at the ISO
        run: |
          ls -lh iso-out/
          echo "ISO_PATH=iso-out/dev.iso" >> "$GITHUB_ENV"

      - name: Boot live env (SSH mode, keep VM)
        env:
          VARIANT: ${{ matrix.variant }}
          FLAVOR: ${{ matrix.flavor }}
        run: |
          mkdir -p smoke-out
          # --memory 8192, not the 4096 default. Run 31216208138's cosmic leg
          # had cosmic-comp OOM-killed THREE times:
          #
          #   Out of memory: Killed process 2146 (cosmic-comp)
          #   total-vm:2697460kB ... task_memcg=/user.slice/user-974.slice
          #
          # Every captured frame was 282 bytes of black, and the harness
          # reported "0/9 frames above stddev" — which reads as a GL failure and
          # is not one. The live overlay's upperdir alone is an 8G tmpfs backed
          # by guest RAM; a Wayland compositor on top of that does not fit in 4G.
          # ubuntu-latest runners have 16G, so 8G guest leaves ample host.
          sudo -E ./scripts/iso-e2e.sh "$ISO_PATH" --ssh-only --keep-vm \
            --memory 8192 --timeout 1200 --output smoke-out

          # An OOM kill must never reach the walkthrough as "blank screen".
          # It is the one failure that looks identical to missing GL, costs a
          # full 25-minute leg to misdiagnose, and is one grep away from
          # certainty. Fail here, naming the process the kernel killed.
          if grep -q 'Out of memory: Killed process' smoke-out/serial.log 2>/dev/null; then
            echo "::error::guest ran out of memory — the kernel killed:"
            grep 'Out of memory: Killed process' smoke-out/serial.log | sed 's/^/  /'
            echo "Raise --memory above 8192 rather than reading the black frames as a GPU problem."
            exit 1
          fi

      - name: Assert live desktop session + installer frontend
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          SSH="sshpass -p live ssh -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null liveuser@127.0.0.1"
          # GROUND TRUTH = the compositor for THIS flavor is actually running.
          # The old check accepted any compositor: a KDE session could make a
          # broken COSMIC leg green, and a cosmic-greeter's own cosmic-comp
          # made the COSMIC login prompt look like a real desktop. A stale
          # Wayland socket also let Niri falling through to a TTY pass.
          # Require the exact compositor family selected by the matrix cell.
          case "${FLAVOR}" in
            kde)    COMPS="kwin_wayland" ;;
            cosmic) COMPS="cosmic-comp" ;;
            niri)   COMPS="niri" ;;
            xfce)   COMPS="xfwl4 labwc wayfire xfwm4" ;;
            gnome)  COMPS="gnome-shell" ;;
            *)      echo "::error::unsupported installer-smoke flavor: ${FLAVOR}"; exit 1 ;;
          esac
          session_ok=0; COMP=""
          for i in $(seq 1 36); do
            COMP=$($SSH "for p in $COMPS; do pgrep -x \"\$p\" >/dev/null 2>&1 && { echo \"\$p\"; break; }; done" 2>/dev/null || true)
            if [ -n "$COMP" ]; then session_ok=1; break; fi
            sleep 10
          done
          if [ "$session_ok" -ne 1 ]; then
            echo "::error::${FLAVOR}: no compositor process running (stuck at greeter or TTY?)"
            echo "--- loginctl / runtime / user manager:"
            $SSH 'loginctl list-sessions; ls /run/user/$(id -u)/ 2>/dev/null; systemctl --user status 2>/dev/null | head' 2>/dev/null || true
            # Dump the DM that actually got resolved, not a hardcoded guess.
            # This step used to only ever dump greetd's journal, so when kde's
            # plasmalogin.service failed to start (run 30191933429) the reason
            # was nowhere in the artifacts and the failure was undiagnosable
            # from CI alone.
            echo "--- display-manager journal:"
            $SSH 'DM=$(systemctl show -P Id display-manager.service 2>/dev/null); echo "resolved display-manager.service -> ${DM:-<unresolved>}"; sudo journalctl -u "${DM:-display-manager.service}" -b --no-pager 2>/dev/null | tail -60; echo "--- unit state:"; systemctl status --no-pager "${DM:-display-manager.service}" 2>/dev/null | head -20' 2>/dev/null || true
            echo "--- greetd journal (if in use):"
            $SSH 'sudo journalctl -u greetd --no-pager 2>/dev/null | tail -40' 2>/dev/null || true
            echo "--- SELinux mode + AVC denials (compositor/greetd):"
            $SSH 'getenforce 2>/dev/null; sudo journalctl -b --no-pager 2>/dev/null | grep -iE "avc: *denied" | grep -iE "niri|greet|xfwl|wayland|xdm" | tail -30 || true' 2>/dev/null || true
            echo "--- DM install + labels + session exec:"
            $SSH 'command -v greetd niri xfwl4 startxfce4 2>/dev/null; rpm -q greetd 2>/dev/null; ls -Z /usr/bin/greetd /usr/bin/niri /usr/bin/xfwl4 2>/dev/null; systemctl get-default; systemctl is-active greetd 2>/dev/null; cat /etc/greetd/config.toml 2>/dev/null' 2>/dev/null || true
            echo "--- compositor procs:"
            $SSH 'ps -eo pid,user,comm | grep -iE "niri|xfwl|cosmic|greet|wayland|gnome-shell|kwin|xfce" || true' 2>/dev/null || true
            exit 1
          fi
          echo "== ${FLAVOR}: compositor running: ${COMP}"

          # Then the DESKTOP-MATCHED installer frontend must actually be
          # running. The old fallback accepted any TunaOS installer after the
          # exact flatpak lookup failed, so the wrong frontend could satisfy a
          # matrix cell. There is no generic fallback now: an app-id mismatch
          # is a real per-frontend failure.
          case "${FLAVOR}" in
            kde)    APP=org.tunaos.InstallerKde ;;
            cosmic) APP=org.tunaos.InstallerCosmic ;;
            niri)   APP=org.tunaos.InstallerNiri ;;
            xfce)   APP=org.tunaos.InstallerXfce ;;
            *)      APP=org.bootcinstaller.Installer ;;
          esac
          echo "expecting installer frontend: ${APP}"
          PROCS=""
          for i in $(seq 1 18); do
            # flatpak ps is authoritative (app id, not a substring guess).
            # `pgrep -f` is intentionally absent: its shell command line can
            # self-match and it cannot distinguish the four frontends.
            PROCS=$($SSH "flatpak ps --columns=application 2>/dev/null | grep -Fx '${APP}' || true" 2>/dev/null || true)
            [ -n "$PROCS" ] && break
            sleep 10
          done
          echo "installer frontend: ${PROCS:-<none>}"
          if [ -z "$PROCS" ]; then
            echo "::error::${FLAVOR}: installer frontend ${APP} is not running in the live session"
            echo "--- running flatpaks:"; $SSH 'flatpak ps 2>/dev/null; flatpak list --app --columns=application 2>/dev/null' 2>/dev/null || true
            echo "--- autostart + session procs:"; $SSH 'ls -la /etc/xdg/autostart/ 2>/dev/null | head; ps -eo pid,comm | grep -iE "install|bwrap|flatpak" || true' 2>/dev/null || true
            exit 1
          fi

          # ── 2b. The frontend must have PUT A WINDOW ON THE SCREEN ──────────
          #
          # Check 2 above answers "is the process alive". That is not the same
          # question as "did the user get a window", and the two have already
          # diverged HERE: the cosmic leg ran the installer process with no
          # window ever appearing, and check 2 stayed green. The only thing
          # that noticed was a human looking at a screenshot.
          #
          # Checks 3-5 (the walkthrough) would notice, but they need a
          # compositor that renders — and cosmic, niri, xfwl4 and kwin_wayland
          # all require a DRM render node that GitHub-hosted runners do not
          # have. So on exactly the runners where this matters most, the
          # rendering checks are the ones that cannot run.
          #
          # The frontends therefore say it themselves: each writes
          # $XDG_RUNTIME_DIR/tuna-installer-ready when its window comes up. No
          # GPU, no OCR, just a file read over SSH. Contract and field list:
          # docs/INSTALLER-FRONTENDS.md.
          #
          # Inside the Flatpak sandbox $XDG_RUNTIME_DIR reads as
          # /run/user/<uid>, but that is a BIND MOUNT and the host path
          # differs. Current flatpak backs it with
          #   /run/user/<uid>/.flatpak/<app-id>/xdg-run/
          # and that is where run 32445454947 actually found the stamp:
          #   /run/user/1000/.flatpak/org.bootcinstaller.Installer/xdg-run/
          #     tuna-installer-ready
          # while the app's own log said it had written
          # "/run/user/1000/tuna-installer-ready" -- the in-sandbox view of
          # the same file.
          #
          # This check previously read only /run/user/<uid>/app/<app-id>/ and
          # /run/user/<uid>/. Neither is where the file lands, so runs 63-68
          # were ALL false negatives: the installer mapped its window (run 67's
          # evidence screenshot shows the wizard), wrote a correct stamp naming
          # BootcWindow, and the gate reported "running but never reported a
          # window". The app/<app-id>/ directory does still exist -- flatpak
          # creates it -- which is why an empty-directory listing looked like
          # confirmation that nothing had been written.
          #
          # All three paths are read, newest layout first: an unsandboxed run
          # still writes to /run/user/<uid>/ directly, and app/<app-id>/ costs
          # nothing to keep for older flatpak.
          echo "expecting readiness stamp from: ${APP}"
          STAMP=""
          for _ in $(seq 1 18); do
            STAMP=$($SSH "cat /run/user/*/.flatpak/${APP}/xdg-run/tuna-installer-ready /run/user/*/app/${APP}/tuna-installer-ready /run/user/*/tuna-installer-ready 2>/dev/null | head -20" 2>/dev/null || true)
            [ -n "$STAMP" ] && break
            sleep 10
          done

          if [ -z "$STAMP" ]; then
            echo "::error::${FLAVOR}: ${APP} is running but never reported a window"
            echo "  The process is alive (check 2 passed) and no readiness stamp"
            echo "  was written, which is the cosmic failure shape: a frontend"
            echo "  that starts, stays up, and puts nothing on the screen."
            echo "  If this frontend's stamp is new, confirm the ISO's flatpak"
            echo "  postdates it before treating this as a UI regression."
            echo "--- runtime dirs:"; $SSH 'ls -la /run/user/*/ /run/user/*/app/*/ /run/user/*/.flatpak/*/xdg-run/ 2>/dev/null | head -60' 2>/dev/null || true
            # A stamp that exists but sits somewhere none of the three reads
            # cover is the exact defect this block just had, so name it
            # rather than making the next reader deduce it again.
            echo "--- stamp anywhere under /run/user:"; $SSH 'find /run/user -name tuna-installer-ready 2>/dev/null || echo "(none)"' 2>/dev/null || true
            exit 1
          fi

          # awk rather than `sed 's/^/  /'`: shellcheck's SC2001 fires on
          # echo-into-sed, and this file is actionlint-clean.
          echo "readiness stamp:"; echo "$STAMP" | awk '{print "  " $0}'

          # The stamp must come from the frontend we asked for. A stale stamp
          # from a previous boot cannot survive ($XDG_RUNTIME_DIR is tmpfs),
          # but the WRONG frontend autostarting is a real and silent failure —
          # every desktop's autostart entry is written by a different
          # desktop-*.sh adapter.
          STAMP_APP=$(echo "$STAMP" | sed -n 's/^app_id=//p' | head -1)
          if [ "$STAMP_APP" != "${APP}" ]; then
            echo "::error::${FLAVOR}: expected a stamp from ${APP}, got '${STAMP_APP:-<none>}'"
            exit 1
          fi

          # `signal` records HOW each frontend earned its stamp, because the
          # five toolkits cannot all make the same claim:
          #
          #   frame-swapped  a frame actually reached the compositor
          #                  (kde, niri — Qt's QQuickWindow::frameSwapped)
          #   gtk-map        the widget was mapped
          #                  (gnome/bootc-installer, xfce)
          #   first-frame    the toolkit asked for a frame. Proves the event
          #                  loop runs; does NOT prove a surface was presented
          #                  (cosmic — libcosmic is iced-on-wgpu, no map hook)
          #
          # first-frame is deliberately NOT failed here: it is the strongest
          # claim libcosmic can make, and rejecting it would fail the one
          # frontend this check exists for. It is reported instead, so a
          # reader weighs cosmic's evidence for what it is rather than
          # assuming a mapped window. An UNKNOWN value does fail — that means
          # a frontend invented a claim this workflow has not reasoned about.
          STAMP_SIGNAL=$(echo "$STAMP" | sed -n 's/^signal=//p' | head -1)
          case "${STAMP_SIGNAL}" in
            frame-swapped|gtk-map)
              echo "${FLAVOR}: window confirmed on screen (${STAMP_SIGNAL})" ;;
            first-frame)
              echo "::notice::${FLAVOR}: stamp is 'first-frame' — the app is"\
                   "producing frames, which does not prove a surface was"\
                   "presented. Strongest claim libcosmic offers." ;;
            *)
              echo "::error::${FLAVOR}: unrecognised readiness signal '${STAMP_SIGNAL:-<none>}'."
              echo "  Add it to this case with a note on what it proves, or fix the frontend."
              exit 1 ;;
          esac

          # The stamp's `window` field was designed and never read.
          #
          # readiness.py states plainly why it carries the window class:
          # do_activate does not always present the wizard. Depending on the
          # machine it presents BootcRamWindow, BootcCpuWindow or
          # BootcUnsupportedWindow instead -- real windows, correctly mapped,
          # that are not the installer. Its own words: "A CI VM sized just
          # under the RAM threshold would show the not-enough-RAM screen and
          # pass every check we currently run."
          #
          # That was true until now. app_id proves WHICH frontend stamped;
          # signal proves a surface reached the screen; neither can tell the
          # wizard from the sorry-your-VM-is-too-small screen. So the field
          # existed, the frontends all wrote it, and nothing looked.
          #
          # A denylist rather than an allowlist, because the wizard class is
          # per-frontend -- BootcWindow on gnome, ApplicationWindow on niri --
          # and an allowlist would have to be updated every time a fork
          # renames a class, failing green cells when it was not.
          STAMP_WINDOW=$(echo "$STAMP" | sed -n 's/^window=//p' | head -1)
          case "${STAMP_WINDOW}" in
            BootcRamWindow|BootcCpuWindow|BootcUnsupportedWindow)
              echo "::error::${FLAVOR}: the frontend presented ${STAMP_WINDOW}, not the installer."
              echo "  The window mapped and the stamp is genuine -- this is the"
              echo "  wrong window, which means the VM does not meet the"
              echo "  installer's own requirements:"
              echo "    BootcRamWindow         not enough RAM"
              echo "    BootcCpuWindow         not enough CPU"
              echo "    BootcUnsupportedWindow not booted UEFI"
              echo "  Fix the harness sizing in scripts/iso-e2e.sh, or set"
              echo "  IGNORE_RAM / IGNORE_CPU in the live autostart if the"
              echo "  threshold is deliberately not met in CI."
              exit 1 ;;
            "")
              echo "::warning::${FLAVOR}: stamp carries no window class; cannot"\
                   "tell the wizard from the RAM/CPU/UEFI screens"
              ;;
            *)
              echo "${FLAVOR}: window class ${STAMP_WINDOW}" ;;
          esac

      # Capturing frames proves nothing on its own, so this also asserts the
      # installer RENDERS (non-blank), ADVANCES (frames differ), and WHICH
      # spec'd screens it reached (OCR vs tests/installer-screens.yaml) — the
      # signal that catches feature drift between the five independent
      # frontend forks. Must run before the screenshot step kills QEMU.
      - name: Installer walkthrough + verification
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          # Every flavor is strict. This used to exempt niri and xfce on the
          # premise that "Smithay compositors cannot render without virgl, so a
          # GPU-less runner shows blank frames legitimately" — which is false on
          # both halves. The kernel in these very runs reports
          #   [drm] pci: virtio-vga detected
          # so a render node exists; and the blank frames that motivated the
          # carve-out were the COMPOSITOR BEING OOM-KILLED (run 31216208138:
          # cosmic-comp killed three times), fixed by the 8G guest above.
          #
          # An exemption granted on a wrong premise is worse than no gate: it
          # made two of the five frontends permanently unable to fail the render
          # and screen-coverage checks, which is exactly the drift this workflow
          # exists to catch. If niri or xfce genuinely cannot render here, that
          # must show up as a red leg with frames to look at, not as silence.
          STRICT="--strict"
          if sudo test -S smoke-out/monitor.sock; then
            set +e
            sudo python3 scripts/installer-walkthrough.py \
              smoke-out/monitor.sock smoke-out 8 "${FLAVOR}" $STRICT \
              2>&1 | tee "smoke-out/walkthrough-${FLAVOR}.tap"
            rc=${PIPESTATUS[0]}
            set -e
            sudo chown -R "$(id -u)" smoke-out 2>/dev/null || true
            exit "$rc"
          else
            echo "::warning::no QEMU monitor socket — walkthrough skipped"
          fi

      # The installer's own stderr is the one thing this workflow never
      # captured, and it is exactly what distinguishes "no window" causes.
      # cosmic launches, connects to Wayland, then loses its GPU path:
      #   libEGL warning: failed to get driver name for fd -1
      #   MESA: error: ZINK: failed to choose pdev
      #   libEGL warning: egl: failed to create dri2 screen
      # Reproduced on real hardware; there it survived by falling back to
      # Vulkan llvmpipe. Under plain virtio-vga that fallback may not exist,
      # which would leave a live process with no surface — precisely the state
      # observed in run 29684495194. Without this capture the gate can only
      # report "process running, nothing on screen".
      - name: Capture installer stderr and session journal
        if: always()
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          SSH="sshpass -p live ssh -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null liveuser@127.0.0.1"
          out="smoke-out/installer-stderr-${FLAVOR}.log"
          {
            # The installer's OWN log, which is where its Python logging
            # actually goes. main.py configures basicConfig with both a
            # StreamHandler and a FileHandler at
            #   $XDG_CACHE_HOME/bootc-installer/installer-debug.log
            # and inside the Flatpak sandbox XDG_CACHE_HOME is the app's
            # private ~/.var/app/<app-id>/cache. The journal therefore sees
            # almost nothing from it: smoke run 32435080411 captured 133
            # lines and exactly ONE came from the installer (an libEGL
            # warning), which is why "running but never reported a window"
            # has stayed undiagnosable across runs 63-66.
            #
            # This file answers it directly. It records "do_activate called",
            # which of BootcWindow / BootcRamWindow / BootcCpuWindow /
            # BootcUnsupportedWindow was constructed, "Main window created",
            # and any traceback from the do_activate except-branch. If the
            # window was built and armed but never mapped, the log ends after
            # "Main window created" with no exception — which distinguishes a
            # renderer that cannot present from an app that never got that
            # far. Collect what settles it rather than guessing at a fix.
            echo "=== installer's own debug log ==="
            $SSH 'cat ~/.var/app/org.bootcinstaller.Installer/cache/bootc-installer/installer-debug.log 2>/dev/null || cat ~/.cache/bootc-installer/installer-debug.log 2>/dev/null || echo "(no installer-debug.log found)"' 2>/dev/null || true
            echo
            echo "=== user journal (installer + portal + flatpak) ==="
            $SSH 'journalctl --user -b --no-pager 2>/dev/null | grep -iE "installer|flatpak|portal|wgpu|EGL|MESA|wayland|vulkan" | tail -120' 2>/dev/null || true
            echo
            echo "=== system journal (compositor / greetd / GPU) ==="
            $SSH 'sudo journalctl -b --no-pager 2>/dev/null | grep -iE "EGL|MESA|drm|vulkan|llvmpipe|virtio|cosmic|niri|xfwl4" | tail -80' 2>/dev/null || true
            echo
            echo "=== rendering capability in the live session ==="
            $SSH 'ls -l /dev/dri/ 2>/dev/null; echo "--- eglinfo/vulkaninfo ---"; (eglinfo 2>&1 | head -20) || true; (vulkaninfo --summary 2>&1 | head -20) || true' 2>/dev/null || true
            echo
            echo "=== who the display manager is, and which greetd config it reads ==="
            # Added because run 31183217981's cosmic leg sat on the
            # cosmic-greeter LOGIN SCREEN — liveuser, password prompt — so the
            # installer never launched. desktop-cosmic.sh writes
            # /etc/greetd/config.toml with [initial_session] user=liveuser
            # command=cosmic-session, which should bypass any greeter, and the
            # symptom says it did not take. The evidence to tell WHY was not
            # collected: greetd logs to the journal, not to ttyS0, and the
            # serial log we upload has nothing about the session at all.
            #
            # install-desktop.sh documents the shape that would explain it —
            # cosmic-greeter.service IS greetd, wrapped, started as
            #   ExecStart=greetd --config /etc/greetd/cosmic-greeter.toml
            # i.e. a DIFFERENT file from the one the live adapter writes. That
            # is a hypothesis, not a finding: this run reported the display
            # manager as greetd.service, not cosmic-greeter.service. Rather
            # than change autologin on a guess, collect what settles it.
            $SSH 'echo "-- display-manager.service ->"; readlink -f /etc/systemd/system/display-manager.service 2>/dev/null; \
                  echo "-- greetd config files present --"; ls -l /etc/greetd/ 2>/dev/null; \
                  echo "-- ExecStart of the active DM --"; systemctl cat "$(basename "$(readlink -f /etc/systemd/system/display-manager.service 2>/dev/null)" 2>/dev/null)" 2>/dev/null | grep -E "^ExecStart|^\[" | head -20; \
                  echo "-- /etc/greetd/config.toml as installed --"; cat /etc/greetd/config.toml 2>/dev/null; \
                  echo "-- greetd journal --"; sudo journalctl -u greetd -u cosmic-greeter --no-pager 2>/dev/null | tail -40' 2>/dev/null || true
            echo
            echo "=== windows the compositor actually has ==="
            # -x matches comm exactly, so this cannot self-match the way a
            # bare `pgrep -f` does — but the fallbacks below it were reporting
            # this very command line as a running compositor (run 30234237855
            # line 11046: "bash -c pgrep -xl \"cosmic-comp|niri|...\"").
            # Bracket the first letter so the pattern never matches its own
            # argv, the same defence the frontend check above already uses.
            $SSH 'pgrep -xl "[c]osmic-comp|[n]iri|[x]fwl4|[k]win_wayland" 2>/dev/null || echo "(no compositor matched)"; ps -eo pid,comm,args | grep -iE "[I]nstaller" || echo "(no installer process)"' 2>/dev/null || true

            echo
            echo "=== does the session command's compositor exist at all? ==="
            # Run 32450214451's xfce leg: greetd's config is correctly shaped
            # (user and command present in both [initial_session] and
            # [default_session]) and `dbus-run-session startxfce4 --wayland
            # xfwl4` still exited immediately, twice, after which greetd
            # looped -- "greeter exited without creating a session". greetd
            # does not capture the session's stderr, so the journal says only
            # that it exited, never why.
            #
            # The cheapest discriminator is whether the binaries the config
            # names are installed at all. tideforge-xfwl4-el10 is red today
            # for want of libxfce4ui-devel, a build-chain product with no
            # publisher (tunaos-packages#459), so "the compositor is simply
            # not in the image" is a live hypothesis rather than a wild one --
            # and one line of output settles it either way.
            $SSH 'for b in startxfce4 xfwl4 labwc niri cosmic-comp kwin_wayland gnome-shell; do \
                    printf "%-16s %s\n" "$b" "$(command -v "$b" 2>/dev/null || echo MISSING)"; \
                  done' 2>/dev/null || true

            echo
            echo "=== XDG_RUNTIME_DIR as the sandboxed frontend sees it ==="
            # Run 67 put the wizard ON SCREEN (evidence screenshot) with the
            # app's runtime dir present and EMPTY, and no stamp in either
            # location the assert reads. So the window mapped and the stamp
            # still was not written. readiness.stamp_path() returns None when
            # XDG_RUNTIME_DIR is unset, and write_stamp swallows failures by
            # design, so an unset variable INSIDE the sandbox produces exactly
            # this shape and leaves no other trace. The host-side directory
            # existing does not prove the variable is set in the sandbox --
            # flatpak creates it either way. Read it from the process itself.
            $SSH 'for p in $(pgrep -x bootc-installer 2>/dev/null); do \
                    echo "-- pid $p"; \
                    { sudo cat /proc/$p/environ 2>/dev/null || cat /proc/$p/environ 2>/dev/null; } | tr "\0" "\n" | grep -E "^(XDG_RUNTIME_DIR|FLATPAK_ID|HOME|XDG_CACHE_HOME)=" || echo "(could not read environ)"; \
                  done; \
                  echo "-- stamp anywhere under /run/user --"; \
                  find /run/user -name "tuna-installer-ready" 2>/dev/null || true' 2>/dev/null || true
          } > "$out" 2>&1
          echo "--- captured $(wc -l < "$out") lines ---"
          # NOT tail: the installer's own debug log is the FIRST section of
          # five, so `tail -30` showed the last two and structurally could
          # never show the one this capture was added for (run 67). The whole
          # file is ~170 lines -- small enough to print, and the point is to
          # be readable without downloading an artifact.
          cat "$out"

      - name: Screenshot desktop evidence
        if: always()
        run: |
          # Prefer the QEMU monitor screendump; fall back to grim/scrot over
          # SSH inside the live session (ssh-only mode has no monitor sock).
          shot="smoke-out/installer-${{ matrix.flavor }}"
          # The QEMU monitor sock is root-owned (iso-e2e.sh runs under sudo),
          # so the screendump command must go through sudo too — otherwise
          # 'Permission denied' on the socket and no screenshot.
          if sudo test -S smoke-out/monitor.sock; then
            echo "screendump $(pwd)/${shot}.ppm" | sudo socat - UNIX-CONNECT:smoke-out/monitor.sock || true
            sleep 3
            sudo chown "$(id -u)" "${shot}.ppm" 2>/dev/null || true
            [ -f "${shot}.ppm" ] && convert "${shot}.ppm" "${shot}.png" || true
          fi
          if [ ! -f "${shot}.png" ]; then
            SSH="sshpass -p live ssh -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null liveuser@127.0.0.1"
            $SSH 'XDG_RUNTIME_DIR=/run/user/$(id -u) grim /tmp/s.png 2>/dev/null || scrot /tmp/s.png 2>/dev/null || true' || true
            $SSH 'cat /tmp/s.png' > "${shot}.png" 2>/dev/null || true
            [ -s "${shot}.png" ] || rm -f "${shot}.png"
          fi
          sudo pkill -f qemu-system || true

      - name: Fix evidence ownership
        if: always()
        run: sudo chown -R "$(id -u)" smoke-out 2>/dev/null || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-smoke-${{ matrix.variant }}-${{ matrix.flavor }}
          # *.log rather than serial.log alone: the capture step writes
          # installer-stderr-<flavor>.log, which matched no pattern here, so
          # run 67's capture reached neither the console nor the artifact.
          path: |
            smoke-out/*.png
            smoke-out/*.json
            smoke-out/*.tap
            smoke-out/*.log
          if-no-files-found: warn

  # Publishes the walkthrough-*.png frames captured above to docs, the same
  # way installer-screenshots.yml already does for its gnome/cosmic full-install
  # flow. That workflow only covers two flavors because it drives a hardcoded
  # sendkey choreography (scripts/run-walkthrough.sh) written for one page
  # layout; this job reuses installer-walkthrough.py instead, which already
  # runs across all four independent frontend forks with per-frontend
  # navigation handling (KDE's Enter-key fix, tab-count widening, etc.), so it
  # is the only harness that actually generalizes across kde/cosmic/niri/xfce.

  publish-screenshots:
    name: Publish installer screenshots
    needs: smoke
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # This job commits to main, so it must start FROM main — not from the
      # dispatched ref. Checking out a feature branch made `git pull --rebase
      # origin main` replay that branch's commits onto main: it conflicted
      # (run 30618282287, add/add on luks-e2e.yml + image-versions.yaml, since
      # the shallow clone has no merge base) and, had it succeeded, would have
      # pushed unreviewed PR commits straight to main. fetch-depth: 0 gives the
      # rebase real history so a concurrent push to main is handled instead of
      # degenerating into add/add conflicts again.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Download walkthrough artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installer-smoke-*
          merge-multiple: true
          path: /tmp/installer-smoke

      - name: Stage walkthrough frames
        id: stage
        run: |
          mkdir -p docs/images/installer
          count=0
          # installer-walkthrough.py names frames walkthrough-<flavor>-NN.png;
          # rename to smoke-<flavor>_NN.png so gen-screenshot-gallery.sh's
          # prefix grouping treats each flavor as its own flow. The smoke-
          # prefix keeps this distinct from installer-screenshots.yml's
          # cosmic_NN_name.png (that one walks a full install to a bootable
          # disk on gnome/cosmic only; this one is launch-smoke evidence
          # across all four frontends) — same R2 path convention, different
          # source, so they must not collide on cosmic's filenames.
          : > /tmp/staged-basenames.txt
          for png in /tmp/installer-smoke/walkthrough-*.png; do
            [[ -f "$png" ]] || continue
            base="$(basename "$png" .png)"
            # walkthrough-kde-03 -> smoke-kde_03
            renamed="$(echo "$base" | sed -E 's/^walkthrough-([a-z]+)-([0-9]+)$/smoke-\1_\2/')"
            cp "$png" "docs/images/installer/${renamed}.png"
            echo "$renamed" >> /tmp/staged-basenames.txt
            count=$((count + 1))
          done
          echo "staged=${count}" >> "$GITHUB_OUTPUT"
          echo "Staged ${count} screenshot(s)"

      # tunaos.org's InstallerWalkthrough component reads these:
      # screenshots/installer/<name>-latest.png on download.tunaos.org.
      - name: Publish captures to R2
        if: steps.stage.outputs.staged != '0'
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          if [[ -z "${RCLONE_CONFIG_R2_ACCESS_KEY_ID:-}" ]]; then
            echo "::notice::R2 credentials not configured; skipping publish."
            exit 0
          fi
          # Do not mask package-install failures: otherwise the next line reports
          # only `rclone: command not found`, hiding the actual cause.
          if ! command -v rclone >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq rclone
          fi
          rclone version
          while IFS= read -r base; do
            [[ -n "$base" ]] || continue
            png="docs/images/installer/${base}.png"
            [[ -f "$png" ]] || continue
            rclone copyto --s3-no-check-bucket --log-level ERROR \
              "$png" "R2:${{ secrets.R2_BUCKET }}/screenshots/installer/${base}-latest.png"
          done < /tmp/staged-basenames.txt
          echo "Published capture(s) to R2"

      - name: Regenerate screenshot gallery
        if: steps.stage.outputs.staged != '0'
        run: bash scripts/gen-screenshot-gallery.sh

      - name: Commit and push
        if: steps.stage.outputs.staged != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/installer docs/SCREENSHOTS.md
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit"
            exit 0
          fi
          git commit -m "docs: refresh installer frontend walkthrough screenshots ($(date +%Y-%m-%d)) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
