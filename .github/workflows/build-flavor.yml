name: Build Flavor
permissions:
  contents: read
# The weekly all-flavor sweep was removed 2026-08-01: each nightly variant
# build already runs flavor=all. Pull requests that affect Tuna build its
# admitted image matrix here; use workflow_dispatch for manual flavor rebuilds.
on:
  pull_request:
    paths:
      - ".github/build-config.yml"
      - ".github/workflows/build-flavor.yml"
      - ".github/workflows/build-variant.yml"
      - ".github/workflows/reusable-build-image.yml"
      - ".github/actions/**"
      - ".github/scripts/**"
      - "Containerfile*"
      - "build_scripts/**"
      - "experiences/**"
      - "image-versions.yaml"
      - "manifests/desktops/tuna*.yaml"
      - "system_files/**"
      - "system_files_overrides/**"
      - "scripts/**"
      - "manifests/desktop-contracts/**"
      - "Justfile"
      - "just/**"
      - "tests/functional/**"
      - "tunaos.toml"
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Flavor to build across all variants (base, gnome, kde, niri, cosmic, xfce, etc.)'
        required: true
        type: string

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      flavor: ${{ steps.validate.outputs.flavor }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup yq
        uses: ./.github/actions/setup-yq

      - name: Validate Flavor
        id: validate
        env:
          FLAVOR_INPUT: ${{ github.event.inputs.flavor }}
        run: |
          FLAVOR="${FLAVOR_INPUT:-all}"
          # Read valid flavors from build-config.yml
          VALID_FLAVORS=$(yq -r '.variants[].flavors[].id' .github/build-config.yml | sort -u | tr '\n' ' ')
          VALID_FLAVORS="all $VALID_FLAVORS"

          if echo " $VALID_FLAVORS " | grep -q " $FLAVOR "; then
            echo "flavor=$FLAVOR" >> $GITHUB_OUTPUT
            echo "✅ Flavor '$FLAVOR' is valid"
          else
            echo "::error::Invalid flavor '$FLAVOR'. Valid flavors: $VALID_FLAVORS"
            exit 1
          fi

  build:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        variant: [yellowfin, albacore, skipjack, bonito, bonito-rawhide, grouper, marlin, flounder, flounder-sid, sailfin, guppy]
    name: Build ${{ matrix.variant }}:${{ needs.validate.outputs.flavor }}
    uses: ./.github/workflows/build-variant.yml
    with:
      variant: ${{ matrix.variant }}
      flavor: ${{ needs.validate.outputs.flavor }}
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

  build_tuna_pr:
    if: github.event_name == 'pull_request'
    name: "${{ matrix.variant }}:tuna"
    strategy:
      fail-fast: false
      matrix:
        variant:
          - marlin
          - yellowfin
          - albacore
          - skipjack
          - bonito
          - wahoo
          - bonito-rawhide
          - grouper
          - flounder
          - flounder-sid
          - sailfin
    uses: ./.github/workflows/build-variant.yml
    with:
      variant: ${{ matrix.variant }}
      flavor: tuna
