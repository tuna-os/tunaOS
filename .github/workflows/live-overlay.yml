# Live-overlay parity artifacts (tunaOS#673): run the production
# live_customize (installer flatpak preseed, autologin, polkit, ready
# marker) in a container of each published flavor image and publish the
# result as <publish destination>/live-overlay:<variant>-<flavor>.
#
# The pushed image's layers ABOVE the base image are exactly the
# customize delta — the browser ISO builder applies those extra layers
# onto its unpacked base tree (same digests, same content), giving
# browser-built ISOs the identical live payload CI media carry.
#
# Every Promote that moves a cell's bare tag dispatches this workflow for
# that one cell (reusable-build-image.yml's live_overlay job, through
# scripts/dispatch-live-overlay.sh) with the index digest it wrote, so the
# published overlay's org.tunaos.live-overlay.base-digest follows the base
# instead of going stale until the weekly run. tacklebox refuses an overlay
# bound to any other base (fail-closed since #425).
name: Live Overlay Artifacts

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Variant id, or 'all'"
        required: false
        default: "all"
        type: string
      flavors:
        description: "Single flavor id (e.g. gnome, kde-nvidia, cosmic-hwe), or 'all'"
        required: false
        default: "all"
        type: string
      base_index_digest:
        description: >-
          Index digest Promote wrote to <variant>:<flavor>. Set by Promote's
          dispatch; needs a single variant and flavor. A platform whose base
          has moved past this index is noted and built from the current base.
        required: false
        default: ""
        type: string
  schedule:
    # Weekly, after image builds.
    - cron: "30 9 * * 3"

# One run per cell: a newer Promote's run cancels the older one, whose base
# is no longer the tag's. Runs over different selections can still overlap
# (the weekly 'all' run beside a per-cell one), so publish-compatible-index
# also refuses to bind a base the tag no longer names.
concurrency:
  group: live-overlay-${{ inputs.variant || 'all' }}-${{ inputs.flavors || 'all' }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      count: ${{ steps.gen.outputs.count }}
      destination: ${{ steps.dest.outputs.destination }}
      base_index_digest: ${{ steps.gen.outputs.base_index_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup yq
        uses: ./.github/actions/setup-yq
      # "<registry>/<namespace>" the images publish to: [build.publish] in
      # tunaos.toml, else ghcr.io/<owner> (scripts/publish-destination.sh).
      - name: Resolve publish destination
        id: dest
        env:
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
        run: echo "destination=$(bash scripts/publish-destination.sh)" >> "$GITHUB_OUTPUT"
      - id: gen
        env:
          WANT_VARIANT: ${{ inputs.variant || 'all' }}
          WANT_FLAVOR: ${{ inputs.flavors || 'all' }}
          BASE_INDEX_DIGEST: ${{ inputs.base_index_digest }}
        run: |
          # The selection (and why it is what it is) lives in the script, which
          # Promote's dispatch shares so the two cannot disagree on a cell.
          if [[ -n "$BASE_INDEX_DIGEST" ]]; then
            # One index names one cell's base; it says nothing about others.
            if [[ "$WANT_VARIANT" == "all" || "$WANT_FLAVOR" == "all" ]]; then
              echo "::error::base_index_digest binds one cell; set variant and flavors too"
              exit 1
            fi
            if [[ ! "$BASE_INDEX_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::base_index_digest is not a sha256 digest: ${BASE_INDEX_DIGEST}"
              exit 1
            fi
          fi
          MATRIX="$(bash scripts/live-overlay-matrix.sh "$WANT_VARIANT" "$WANT_FLAVOR")"
          COUNT=$(echo "$MATRIX" | jq '.include | length')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "base_index_digest=$BASE_INDEX_DIGEST" >> "$GITHUB_OUTPUT"
          echo "Building $COUNT overlay(s):"
          echo "$MATRIX" | jq -r '.include[] | "  \(.variant):\(.flavor) [\(.platform)]"'

  overlay:
    name: ${{ matrix.variant }}:${{ matrix.flavor }} [${{ matrix.platform }}]
    needs: generate-matrix
    if: ${{ needs.generate-matrix.outputs.count != '0' }}
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        run: echo "${{ env.GITHUB_TOKEN }}" | podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Pinned to image-versions.yaml the same way scripts/lib/common.sh
      # pins it, so the overlay publisher and the ISO build use the same
      # tacklebox — the whole point of routing through its CLI.
      - name: Build tacklebox
        id: tbx
        run: |
          set -euo pipefail
          SHA="$(grep '^\s*tacklebox:' image-versions.yaml | sed 's/.*"\(.*\)".*/\1/')"
          echo "tacklebox @ ${SHA}"
          src="$RUNNER_TEMP/tacklebox"
          git clone --quiet https://github.com/tuna-os/tacklebox.git "$src"
          git -C "$src" checkout --quiet "$SHA"
          ( cd "$src" && go build -o "$RUNNER_TEMP/tacklebox-bin" ./cmd/tacklebox )
          "$RUNNER_TEMP/tacklebox-bin" customize-live --help >/dev/null || {
            echo "::error::tacklebox @ ${SHA} lacks customize-live; pin a commit containing tuna-os/tacklebox#149"
            exit 1
          }
          echo "bin=$RUNNER_TEMP/tacklebox-bin" >> "$GITHUB_OUTPUT"

      - name: Run live customize and publish overlay
        env:
          VARIANT: ${{ matrix.variant }}
          FLAVOR: ${{ matrix.flavor }}
          PLATFORM: ${{ matrix.platform }}
          SAFEPLATFORM: ${{ matrix.safeplatform }}
          TACKLEBOX_BIN: ${{ steps.tbx.outputs.bin }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_DEST: ${{ needs.generate-matrix.outputs.destination }}
          BASE_INDEX_DIGEST: ${{ needs.generate-matrix.outputs.base_index_digest }}
        run: |
          set -euo pipefail
          source scripts/lib/platform-digest.sh
          IMG="${PUBLISH_DEST:?}/${VARIANT}:${FLAVOR}"
          # Each attempt owns its staging tag through annotation and digest capture.
          OUT="${PUBLISH_DEST}/live-overlay:${VARIANT}-${FLAVOR}-${SAFEPLATFORM}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          for i in 1 2 3; do sudo podman pull --platform "$PLATFORM" "$IMG" && break; sleep $((i*15)); done

          # The digest of the base we ACTUALLY built from. The base label
          # below records only a tag, and tags move — so on its own it cannot
          # tell a consumer whether this overlay came from the base image a
          # build currently points at, or one from three weeks ago. Anything
          # that consumes overlays instead of re-running the customize
          # scripts needs this to detect staleness; without it a stale
          # overlay silently ships an old rootfs.
          BASE_DIGEST="$(
            sudo bash -euo pipefail -c \
              'source "$1"; platform_manifest_digest "$2" "$3"' \
              _ "$PWD/scripts/lib/platform-digest.sh" "$IMG" "$PLATFORM"
          )"
          echo "base digest: ${BASE_DIGEST}"

          # Promote's dispatch names the index it wrote to $IMG. If the tag
          # moved since, a newer Promote wrote it; building from the base the
          # tag names now is still right, because publish-compatible-index
          # binds only a base the tag names when it publishes. Say so.
          if [[ -n "${BASE_INDEX_DIGEST}" ]]; then
            promoted_index=""
            for i in 1 2 3; do
              promoted_index="$(skopeo inspect --raw "docker://${IMG%:*}@${BASE_INDEX_DIGEST}")" && break
              promoted_index=""
              sleep $((i*15))
            done
            [[ -n "$promoted_index" ]] || {
              echo "::error::cannot read Promote's index ${IMG%:*}@${BASE_INDEX_DIGEST}"
              exit 1
            }
            in_index=0
            index_lists_platform_digest "$PLATFORM" "$BASE_DIGEST" <<<"$promoted_index" || in_index=$?
            case "$in_index" in
              0) echo "base is in Promote's index ${BASE_INDEX_DIGEST}" ;;
              1) echo "::notice::${IMG} [${PLATFORM}] moved past Promote's index ${BASE_INDEX_DIGEST}; building from the base it names now" ;;
              *) exit 1 ;;
            esac
          fi

          # Installer bundle selection is arch-specific: the release carries
          # one flatpak bundle per arch (org.bootcinstaller.Installer.flatpak
          # on x86_64, org.bootcinstaller.Installer-<arch>.flatpak elsewhere;
          # see customize-live.sh). Thread the matrix platform through as the
          # arch customize-live.sh must download for, rather than letting it
          # guess from the runner (an arm64 overlay built under emulation
          # still reports the emulated uname, but being explicit beats being
          # lucky). Same desktop -> app-id mapping as customize-live.sh's
          # DESKTOP case: strip the hardware/kernel layer suffix first.
          case "$PLATFORM" in
            linux/arm64) INSTALLER_ARCH="aarch64" ;;
            *) INSTALLER_ARCH="x86_64" ;;
          esac
          DESKTOP="${FLAVOR%%-hwe}"; DESKTOP="${DESKTOP%%-nvidia}"
          DESKTOP="${DESKTOP%%-cachyos}"; DESKTOP="${DESKTOP%%-zfs}"
          case "$DESKTOP" in
            kde) INSTALLER_APP="org.tunaos.InstallerKde" ;;
            niri) INSTALLER_APP="org.tunaos.InstallerNiri" ;;
            cosmic) INSTALLER_APP="org.tunaos.InstallerCosmic" ;;
            xfce) INSTALLER_APP="org.tunaos.InstallerXfce" ;;
            *) INSTALLER_APP="org.bootcinstaller.Installer" ;;
          esac
          # The installed Flatpak commit is the payload identity. The
          # customization script records it after installation; read that
          # receipt below rather than guessing from a moving release tag.
          echo "installer app: ${INSTALLER_APP} (arch ${INSTALLER_ARCH})"

          # Use tacklebox's own customize pipeline rather than reimplementing
          # it here (tacklebox#149).
          #
          # This step used to be a hand-rolled `podman run ... bash
          # ./customize-live.sh`, and the reimplementation had silently
          # diverged: it ran only customize-live.sh, while tacklebox's
          # CustomizeLive additionally prepends its embedded
          # src/live/baseline.sh — live user, DM autologin, live networking,
          # sleep masking. The published overlay was therefore base +
          # customize-live.sh, NOT the live payload a CI-built ISO gets, and
          # nothing compared the two. The browser path masked it further by
          # applying its own EnsureLiveUser/EnsureAutologin after grafting.
          #
          # Calling the same code the ISO build calls makes that class of
          # drift impossible rather than merely fixed, which is why the
          # baseline label below can now honestly say true.
          # sudo -E preserves HOME, and a preserved HOME points root's podman
          # at the RUNNER's rootless storage. MEASURED on the marlin:kde ISO
          # built the same way: the resulting live payload came out owned by
          # uid 1000, so sshd refused to start ("/usr/share/empty.sshd must be
          # owned by root") and restart-looped, which reads as "Connection
          # reset by peer" at kex rather than as a failure. Pin HOME (and drop
          # the XDG overrides that redirect containers/storage.conf) so this
          # path gets root's own store, as scripts/build-iso-tacklebox.sh does
          # for the ISO build. This workflow does NOT go through that script,
          # so it needs its own copy of the fix.
          # NOTE the argument order: GNU env stops parsing options at the
          # first NAME=VALUE, so `env HOME=/root -u XDG_DATA_HOME` treats
          # `-u` as the command to run and dies with
          # `env: '-u': No such file or directory`. Options first.
          # The pinned tacklebox forwards only its own allowlisted variables
          # into the customization container. Generate the script it hashes
          # with explicit exports so target identity both reaches the
          # container and participates in tacklebox's cache key. Keep the
          # pin file beside that generated script for immutable bundle fetches.
          CUSTOMIZE_DIR="$RUNNER_TEMP/live-customize-${SAFEPLATFORM}"
          rm -rf "$CUSTOMIZE_DIR"
          mkdir -p "$CUSTOMIZE_DIR"
          cp -a "$PWD/live-iso/common/src/." "$CUSTOMIZE_DIR/"
          cp "$PWD/image-versions.yaml" "$CUSTOMIZE_DIR/"
          CUSTOMIZE_SCRIPT="$CUSTOMIZE_DIR/.customize-live-${SAFEPLATFORM}.sh"
          PROVENANCE_CTR=""
          PROVENANCE_FILE=""
          cleanup() {
            rm -rf "$CUSTOMIZE_DIR"
            [[ -z "$PROVENANCE_FILE" ]] || sudo rm -f "$PROVENANCE_FILE"
            [[ -z "$PROVENANCE_CTR" ]] || sudo podman rm -f "$PROVENANCE_CTR" >/dev/null
          }
          trap cleanup EXIT
          {
            echo '#!/usr/bin/env bash'
            echo 'export TUNA_SESSION_ROOT=/'
            printf 'export TUNA_INSTALLER_ARCH=%q\n' "$INSTALLER_ARCH"
            printf 'export TUNA_INSTALLER_APP=%q\n' "$INSTALLER_APP"
            printf 'export TUNA_LIVE_BASE_IMAGE=%q\n' "$IMG"
            printf 'export TUNA_LIVE_BASE_DIGEST=%q\n' "$BASE_DIGEST"
            printf 'export TUNA_LIVE_PLATFORM=%q\n' "$PLATFORM"
            tail -n +2 "$PWD/live-iso/common/src/customize-live.sh"
          } > "$CUSTOMIZE_SCRIPT"
          chmod 0755 "$CUSTOMIZE_SCRIPT"

          sudo -E env -u XDG_DATA_HOME -u XDG_CONFIG_HOME HOME=/root \
            "${TACKLEBOX_BIN}" customize-live \
            --image "$IMG" \
            --script "$CUSTOMIZE_SCRIPT" \
            --tag "$OUT" \
            --label "org.tunaos.live-overlay.base=${IMG}" \
            --label "org.tunaos.live-overlay.base-digest=${BASE_DIGEST}" \
            --label "org.tunaos.live-overlay.platform=${PLATFORM}" \
            --label "org.tunaos.live-overlay.baseline=true"

          PROVENANCE_FILE="$(mktemp)"
          PROVENANCE_CTR="$(sudo podman create "$OUT" true)"
          sudo podman cp \
            "${PROVENANCE_CTR}:/etc/tunaos/live-source.json" "$PROVENANCE_FILE"
          sudo chown "$(id -u):$(id -g)" "$PROVENANCE_FILE"
          ACTUAL_INSTALLER_APP="$(jq -er '.installer_app_id | strings | select(length > 0)' "$PROVENANCE_FILE")"
          ACTUAL_INSTALLER_REV="$(jq -er '.installer_revision | select(test("^[0-9a-f]{64}$"))' "$PROVENANCE_FILE")"
          sudo podman commit --quiet \
            --change "LABEL org.tunaos.live-overlay.installer=${ACTUAL_INSTALLER_APP}@${ACTUAL_INSTALLER_REV}" \
            "$PROVENANCE_CTR" "$OUT" >/dev/null
          sudo podman rm -f "$PROVENANCE_CTR" >/dev/null
          PROVENANCE_CTR=""

          # Tacklebox's --label writes the base digest into the image config.
          # Its consumer also requires the digest on the platform manifest
          # itself; an annotation on the later multi-platform index descriptor
          # is not the same object. Push OCI explicitly, then replace this tag
          # with the same manifest plus the provenance annotation.
          sudo podman push --format oci "$OUT"
          (
            manifest_dir="$(mktemp -d)"
            trap 'rm -rf "$manifest_dir"' EXIT
            raw="${manifest_dir}/manifest.json"
            annotated="${manifest_dir}/annotated.json"
            skopeo inspect --raw "docker://${OUT}" >"$raw"
            jq --arg key "org.tunaos.live-overlay.base-digest" \
              --arg value "$BASE_DIGEST" '
                if .mediaType != "application/vnd.oci.image.manifest.v1+json"
                then error("live overlay platform manifest is not OCI")
                else .annotations = ((.annotations // {}) + {($key): $value})
                end
              ' "$raw" >"$annotated"
            registry_token="$(
              printf 'user = "%s:%s"\n' "$GITHUB_ACTOR" "$GH_TOKEN" |
                curl --config - --fail --silent --show-error \
                  --retry 5 --retry-delay 2 --retry-max-time 60 \
                  "https://ghcr.io/token?service=ghcr.io&scope=repository:tuna-os/live-overlay:pull,push" |
                jq -er .token
            )"
            printf 'header = "Authorization: Bearer %s"\n' "$registry_token" |
              curl --config - --fail --silent --show-error \
                --retry 5 --retry-delay 2 --retry-max-time 60 \
                --request PUT \
                --header "Content-Type: application/vnd.oci.image.manifest.v1+json" \
                --data-binary "@${annotated}" \
                "https://ghcr.io/v2/tuna-os/live-overlay/manifests/${OUT##*:}"
            skopeo inspect --raw "docker://${OUT}" |
              jq -e --arg value "$BASE_DIGEST" \
                '.annotations["org.tunaos.live-overlay.base-digest"] == $value' >/dev/null
          )
          PLATFORM_DIGEST="$(skopeo inspect --format '{{.Digest}}' "docker://${OUT}")"
          jq -n \
            --arg variant "$VARIANT" \
            --arg flavor "$FLAVOR" \
            --arg platform "$PLATFORM" \
            --arg repository "${OUT%:*}" \
            --arg digest "$PLATFORM_DIGEST" \
            --arg base_digest "$BASE_DIGEST" \
            --arg installer "${ACTUAL_INSTALLER_APP}@${ACTUAL_INSTALLER_REV}" \
            '{
              variant: $variant,
              flavor: $flavor,
              platform: $platform,
              repository: $repository,
              digest: $digest,
              base_digest: $base_digest,
              installer: $installer
            }' >"${RUNNER_TEMP}/live-overlay-receipt-${VARIANT}-${FLAVOR}-${SAFEPLATFORM}.json"
          echo "published $OUT"

      - name: Upload current-run platform receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-overlay-receipt-${{ matrix.variant }}-${{ matrix.flavor }}-${{ matrix.safeplatform }}
          path: ${{ runner.temp }}/live-overlay-receipt-${{ matrix.variant }}-${{ matrix.flavor }}-${{ matrix.safeplatform }}.json
          if-no-files-found: error
          retention-days: 1

  publish-compatible-index:
    name: Publish compatible multi-platform tags
    needs: [generate-matrix, overlay]
    # !cancelled(), not always(): a run cancelled by a newer one for the same
    # cell (concurrency above) must leave the binding to that newer run.
    if: ${{ !cancelled() && needs.generate-matrix.outputs.count != '0' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      MATRIX: ${{ needs.generate-matrix.outputs.matrix }}
      PUBLISH_DEST: ${{ needs.generate-matrix.outputs.destination }}
    steps:
      # scripts/lib/platform-digest.sh, for the base check below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Download current-run platform receipts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: live-overlay-receipt-*
          path: receipts
          merge-multiple: true

      - name: Publish complete current-run platform groups
        run: |
          set -euo pipefail
          shopt -s nullglob
          source scripts/lib/platform-digest.sh
          receipt_files=(receipts/*.json)
          receipts='[]'
          if ((${#receipt_files[@]})); then
            receipts="$(jq -s '.' "${receipt_files[@]}")"
          fi
          jq -r '.include | unique_by([.variant, .flavor])[] | [.variant, .flavor] | @tsv' \
            <<<"$MATRIX" |
          while IFS=$'\t' read -r variant flavor; do
            expected="$(jq -c --arg variant "$variant" --arg flavor "$flavor" \
              '[.include[] | select(.variant == $variant and .flavor == $flavor) |
                {platform}] | unique_by(.platform) | sort_by(.platform)' <<<"$MATRIX")"
            current="$(jq -c --arg variant "$variant" --arg flavor "$flavor" \
              '[.[] | select(.variant == $variant and .flavor == $flavor)] |
                unique_by(.platform) | sort_by(.platform)' <<<"$receipts")"
            if ! jq -e --argjson expected "$expected" \
              'map({platform}) == $expected and length == ($expected | length)' \
              <<<"$current" >/dev/null; then
              echo "skipping ${variant}:${flavor}: current-run platform set is incomplete"
              continue
            fi

            # Bind only bases the tag still names. A Promote that landed while
            # this run customized moved the tag; publishing now would bind the
            # overlay to the previous base, and its own dispatch is the run
            # that rebinds the cell. Checked per platform, by membership: see
            # index_lists_platform_digest.
            base="${PUBLISH_DEST:?}/${variant}:${flavor}"
            base_index=""
            for i in 1 2 3; do
              base_index="$(skopeo inspect --raw "docker://${base}")" && break
              base_index=""
              sleep $((i*15))
            done
            if [[ -z "$base_index" ]]; then
              echo "::error::cannot read ${base}; not binding ${variant}:${flavor}"
              exit 1
            fi
            moved=""
            while IFS=$'\t' read -r platform base_digest; do
              in_index=0
              index_lists_platform_digest "$platform" "$base_digest" <<<"$base_index" || in_index=$?
              case "$in_index" in
                0) ;;
                1) moved+=" ${platform}" ;;
                *) exit 1 ;;
              esac
            done < <(jq -r '.[] | [.platform, .base_digest] | @tsv' <<<"$current")
            if [[ -n "$moved" ]]; then
              echo "::notice::skipping ${variant}:${flavor}: ${base} moved since this run built from it (${moved# }); the newer Promote's run binds it"
              continue
            fi

            index="${PUBLISH_DEST:?}/live-overlay:${variant}-${flavor}"
            podman manifest rm "$index" >/dev/null 2>&1 || true
            podman manifest create "$index"
            while IFS=$'\t' read -r repository digest base_digest platform; do
              platform_ref="${repository}@${digest}"
              case "$platform" in
                linux/amd64) platform_flags=(--os linux --arch amd64) ;;
                linux/amd64/v2) platform_flags=(--os linux --arch amd64 --variant v2) ;;
                linux/arm64) platform_flags=(--os linux --arch arm64) ;;
                *)
                  echo "::error::unexpected platform '${platform}' in receipt for ${platform_ref}"
                  exit 1
                  ;;
              esac
              podman manifest add "${platform_flags[@]}" "$index" "docker://${platform_ref}"
              # podman 4.9 identifies the list entry by bare digest, not repo@digest.
              podman manifest annotate "$index" "$digest" \
                --annotation "org.tunaos.live-overlay.base-digest=${base_digest}"
            done < <(jq -r '.[] | [.repository, .digest, .base_digest, .platform] | @tsv' <<<"$current")
            podman manifest push --all "$index" "docker://$index"
            echo "published $index from current-run receipts"
          done
