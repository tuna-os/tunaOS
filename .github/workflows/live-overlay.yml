# Live-overlay parity artifacts (tunaOS#673): run the production
# live_customize (installer flatpak preseed, autologin, polkit, ready
# marker) in a container of each published flavor image and publish the
# result as ghcr.io/tuna-os/live-overlay:<variant>-<flavor>.
#
# The pushed image's layers ABOVE the base image are exactly the
# customize delta — the browser ISO builder applies those extra layers
# onto its unpacked base tree (same digests, same content), giving
# browser-built ISOs the identical live payload CI media carry.
name: Live Overlay Artifacts

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Variant id, or 'all'"
        required: false
        default: "all"
        type: string
      flavors:
        description: "Single desktop flavor id (gnome/kde/cosmic/niri/xfce), or 'all'"
        required: false
        default: "all"
        type: string
  schedule:
    # Weekly, after image builds.
    - cron: "30 9 * * 3"

permissions:
  contents: read
  packages: write

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      count: ${{ steps.gen.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install yq
        run: sudo wget -qO /usr/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 && sudo chmod +x /usr/bin/yq
      - id: gen
        env:
          WANT_VARIANT: ${{ inputs.variant || 'all' }}
          WANT_FLAVOR: ${{ inputs.flavors || 'all' }}
        run: |
          # Overlays carry the per-desktop live payload (installer flatpak,
          # autologin, polkit) the browser ISO builder grafts in as
          # live-overlay:<variant>-<flavor>. Filter on build_image (NOT
          # build_iso): the browser builds ISOs from any published *image*,
          # including image-only variants CI never cuts an ISO for — sailfin
          # is exactly that case, so it had no overlay and booted with no
          # installer. Restrict to the plain desktop tags the browser offers
          # (gnome/kde/cosmic/niri/xfce, no -nvidia/-hwe); new variants are
          # picked up automatically instead of the old yellowfin-only default.
          MATRIX=$(yq -o json .github/build-config.yml | jq -c \
            --arg v "$WANT_VARIANT" --arg f "$WANT_FLAVOR" '{
              include: [
                .variants[] as $var | $var.flavors[]
                | select(.build_image == true)
                | select(.id | test("^(gnome|kde|cosmic|niri|xfce)$"))
                | select($v == "all" or $var.id == $v)
                | select($f == "all" or .id == $f)
                | {variant: $var.id, flavor: .id}
              ]
            }')
          COUNT=$(echo "$MATRIX" | jq '.include | length')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Building $COUNT overlay(s):"
          echo "$MATRIX" | jq -r '.include[] | "  \(.variant):\(.flavor)"'

  overlay:
    name: ${{ matrix.variant }}:${{ matrix.flavor }}
    needs: generate-matrix
    if: ${{ needs.generate-matrix.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        run: echo "${{ env.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Pinned to image-versions.yaml the same way scripts/lib/common.sh
      # pins it, so the overlay publisher and the ISO build use the same
      # tacklebox — the whole point of routing through its CLI.
      - name: Build tacklebox
        id: tbx
        run: |
          set -euo pipefail
          SHA="$(grep '^\s*tacklebox:' image-versions.yaml | sed 's/.*"\(.*\)".*/\1/')"
          echo "tacklebox @ ${SHA}"
          src="$RUNNER_TEMP/tacklebox"
          git clone --quiet https://github.com/tuna-os/tacklebox.git "$src"
          git -C "$src" checkout --quiet "$SHA"
          ( cd "$src" && go build -o "$RUNNER_TEMP/tacklebox-bin" ./cmd/tacklebox )
          "$RUNNER_TEMP/tacklebox-bin" customize-live --help >/dev/null || {
            echo "::error::tacklebox @ ${SHA} has no customize-live command — bump the pin in image-versions.yaml to a commit that includes tuna-os/tacklebox#149"
            exit 1
          }
          echo "bin=$RUNNER_TEMP/tacklebox-bin" >> "$GITHUB_OUTPUT"

      - name: Run live customize and publish overlay
        env:
          VARIANT: ${{ matrix.variant }}
          FLAVOR: ${{ matrix.flavor }}
          TACKLEBOX_BIN: ${{ steps.tbx.outputs.bin }}
        run: |
          set -euo pipefail
          IMG="ghcr.io/tuna-os/${VARIANT}:${FLAVOR}"
          OUT="ghcr.io/tuna-os/live-overlay:${VARIANT}-${FLAVOR}"

          for i in 1 2 3; do sudo podman pull "$IMG" && break; sleep $((i*15)); done

          # The digest of the base we ACTUALLY built from. The base label
          # below records only a tag, and tags move — so on its own it cannot
          # tell a consumer whether this overlay came from the base image a
          # build currently points at, or one from three weeks ago. Anything
          # that consumes overlays instead of re-running the customize
          # scripts needs this to detect staleness; without it a stale
          # overlay silently ships an old rootfs.
          BASE_DIGEST="$(sudo podman image inspect --format '{{.Digest}}' "$IMG")"
          echo "base digest: ${BASE_DIGEST}"

          # Use tacklebox's own customize pipeline rather than reimplementing
          # it here (tacklebox#149).
          #
          # This step used to be a hand-rolled `podman run ... bash
          # ./customize-live.sh`, and the reimplementation had silently
          # diverged: it ran only customize-live.sh, while tacklebox's
          # CustomizeLive additionally prepends its embedded
          # src/live/baseline.sh — live user, DM autologin, live networking,
          # sleep masking. The published overlay was therefore base +
          # customize-live.sh, NOT the live payload a CI-built ISO gets, and
          # nothing compared the two. The browser path masked it further by
          # applying its own EnsureLiveUser/EnsureAutologin after grafting.
          #
          # Calling the same code the ISO build calls makes that class of
          # drift impossible rather than merely fixed, which is why the
          # baseline label below can now honestly say true.
          sudo -E "${TACKLEBOX_BIN}" customize-live \
            --image "$IMG" \
            --script "$PWD/live-iso/common/src/customize-live.sh" \
            --tag "$OUT" \
            --label "org.tunaos.live-overlay.base=${IMG}" \
            --label "org.tunaos.live-overlay.base-digest=${BASE_DIGEST}" \
            --label "org.tunaos.live-overlay.baseline=true"

          sudo podman push "$OUT"
          echo "published $OUT"
