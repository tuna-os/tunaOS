name: Unified Build
# ── Nightly schedule registry ────────────────────────────────────────────────
# The org has a 20-concurrent-job ceiling. One variant's full build alone
# demands more than that, so the per-variant nightlies (in build-<variant>.yml)
# are staggered ~2h apart instead of the old 01:00–03:30 cluster, which put
# ~8 variants (~500 job demand) in flight at once and starved the proving
# workflows (0 running / 28 queued / 102-min waits on 2026-07-31).
# Biggest variants overnight; only the two smallest inside the 04:00–09:00
# proving window (daily-verify 04:00, verify-asahi 05:40, matrix-status &
# catalog-facts 06:00, desktop-contract-sweep 08:00).
#   00:20 yellowfin(20fl)  02:20 albacore(20)       04:20 gurnard(2)
#   06:20 guppy(4)         09:20 skipjack(18)       11:20 bonito(16)
#   13:20 marlin(16)       15:20 bonito-rawhide(14) 17:20 grouper(7)
#   19:20 sailfin(7)       21:20 flounder(7)        22:20 hummingbird(5)
#   23:20 flounder-sid(7)
# If you add a variant or move a cron, keep this table true.
on:
  workflow_call:
    inputs:
      variant:
        description: 'Variant to build (yellowfin, albacore, skipjack, bonito, grouper)'
        required: true
        type: string
      flavor:
        description: 'Flavor (all, base, gnome, kde, niri, etc.)'
        default: 'all'
        type: string
    secrets:
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
      R2_ENDPOINT:
        required: false
      R2_BUCKET:
        required: false

jobs:
  # ── Matrix Generation ───────────────────────────────────────────────────────
  # Reads build-config.yml and emits one matrix per build stage plus the
  # artifact matrix. Each image matrix only contains flavors for that stage,
  # which lets the workflow enforce the dependency chain via `needs`.
  generate_matrix:
    runs-on: ubuntu-latest
    outputs:
      stage1_matrix: ${{ steps.set-matrix.outputs.stage1_matrix }}
      stage2_matrix: ${{ steps.set-matrix.outputs.stage2_matrix }}
      stage3_matrix: ${{ steps.set-matrix.outputs.stage3_matrix }}
      stage4_matrix: ${{ steps.set-matrix.outputs.stage4_matrix }}
      artifact_s2_matrix: ${{ steps.set-matrix.outputs.artifact_s2_matrix }}
      artifact_s3_matrix: ${{ steps.set-matrix.outputs.artifact_s3_matrix }}
      artifact_s4_matrix: ${{ steps.set-matrix.outputs.artifact_s4_matrix }}
      artifact_s2_count: ${{ steps.set-matrix.outputs.artifact_s2_count }}
      artifact_s3_count: ${{ steps.set-matrix.outputs.artifact_s3_count }}
      artifact_s4_count: ${{ steps.set-matrix.outputs.artifact_s4_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This job only runs yq/jq over build-config.yml — no podman, no just.
      # The runner-setup + Homebrew steps it used to carry added ~3 min to
      # every pipeline for nothing.
      - name: Install yq
        run: |
          sudo wget -qO /usr/bin/yq "https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64"
          sudo chmod +x /usr/bin/yq

      - name: Validate Inputs
        env:
          FILTER_VARIANT: ${{ inputs.variant || 'all' }}
          FILTER_FLAVOR: ${{ inputs.flavor || 'all' }}
        run: |
          VALID_VARIANTS="all $(yq -r '.variants[].id' .github/build-config.yml | tr '\n' ' ')"
          VALID_FLAVORS="all $(yq -r '.variants[].flavors[].id' .github/build-config.yml | sort -u | tr '\n' ' ')"

          variant_pattern=" $FILTER_VARIANT "
          flavor_pattern=" $FILTER_FLAVOR "
          if [[ ! " $VALID_VARIANTS " =~ $variant_pattern ]]; then
            echo "::error::Invalid variant '$FILTER_VARIANT'. Must be one of: $VALID_VARIANTS"
            exit 1
          fi

          if [[ ! " $VALID_FLAVORS " =~ $flavor_pattern ]]; then
            echo "::error::Invalid flavor '$FILTER_FLAVOR'. Must be one of: $VALID_FLAVORS"
            exit 1
          fi

      - name: Generate Matrix
        id: set-matrix
        env:
          FILTER_VARIANT: ${{ inputs.variant || 'all' }}
          FILTER_FLAVOR: ${{ inputs.flavor || 'all' }}
        run: |
          # Flatten config into one entry per {variant, flavor}, applying filters.
          # All inputs are in env vars — no direct interpolation of workflow
          # inputs into the script body, to prevent shell injection.
          FULL_MATRIX=$(yq -o=json '.' .github/build-config.yml | jq -c --arg event "${{ github.event_name }}" '
            .variants[]
            | select(env.FILTER_VARIANT == "all" or .id == env.FILTER_VARIANT)
            | . as $v
            | .flavors[]
            | select(env.FILTER_FLAVOR == "all" or .id == env.FILTER_FLAVOR)
            | select($event != "pull_request" or .id == "gnome")
            | {
                variant:       $v.id,
                image_name:    ($v.publish_name // $v.id),
                image_aliases: (($v.aliases // []) | join(",")),
                published_tag: (.id + (if ($v.tag_suffix // "") == "" then "" else "-" + $v.tag_suffix end)),
                variant_emoji: ($v.emoji // "❓"),
                base_image:    $v.base_image,
                platforms:     (if $event == "pull_request" then "linux/amd64" else ((.platforms // $v.platforms) | join(",")) end),
                platforms_json: ((if $event == "pull_request" then ["linux/amd64"] else (.platforms // $v.platforms) end)
                                 | map({platform: ., safeplatform: (gsub("/"; "-"))}) | tostring),
                flavor:        .id,
                stage:         (if $event == "pull_request" then 1 else .stage end),
                build_iso:     (.build_iso  // false),
                build_qcow2:   (.build_qcow2 // false)
              }
          ' | jq -c -s '.')

          # Helper: emit an image matrix for a given stage number.
          make_image_matrix() {
            local STAGE=$1
            echo "$FULL_MATRIX" | jq -c --argjson stage "$STAGE" '{
              include: map(select(.stage == $stage) | {
                variant:       .variant,
                image_name:    .image_name,
                image_aliases: .image_aliases,
                published_tag: .published_tag,
                variant_emoji: .variant_emoji,
                flavor:        .flavor,
                platforms:     .platforms,
                platforms_json: .platforms_json,
                base_image:    .base_image
              })
            }'
          }

          STAGE1_MATRIX=$(make_image_matrix 1)
          STAGE2_MATRIX=$(make_image_matrix 2)
          STAGE3_MATRIX=$(make_image_matrix 3)
          STAGE4_MATRIX=$(make_image_matrix 4)

          echo "stage1_matrix=$STAGE1_MATRIX" >> $GITHUB_OUTPUT
          echo "stage2_matrix=$STAGE2_MATRIX" >> $GITHUB_OUTPUT
          echo "stage3_matrix=$STAGE3_MATRIX" >> $GITHUB_OUTPUT
          echo "stage4_matrix=$STAGE4_MATRIX" >> $GITHUB_OUTPUT

          # Per-stage artifact matrices — each stage's ISOs/QCOW2s depend
          # only on that stage's image builds, avoiding the stage-4 artifact
          # jail where a gnome-nvidia-hwe failure blocked ALL ISOs (F10).
          # One row per architecture platform (#1378): this used to hardcode
          # platform: "linux/amd64" unconditionally, so flavors that publish
          # arm64 images (per build-config.yml's platforms/global_platforms)
          # never got arm64 ISO/QCOW2 artifacts — the same gap #230 closed
          # without the fix landing. platforms_json (built above, per entry)
          # already carries every {platform, safeplatform} pair the image
          # matrix published; expand each artifact-eligible entry into one
          # row per amd64/arm64 platform instead of one fixed amd64 row.
          # /v2 (a CPU-feature variant, not a real target arch) is excluded.
          make_artifact_matrix() {
            local STAGE=$1
            echo "$FULL_MATRIX" | jq -c --argjson stage "$STAGE" '{
              include: map(
                select(.stage == $stage and (.build_iso == true or .build_qcow2 == true))
                | . as $e
                | ($e.platforms_json | fromjson)[]
                | select(.platform == "linux/amd64" or .platform == "linux/arm64")
                | {
                    variant:       $e.variant,
                    image_name:    $e.image_name,
                    published_tag: $e.published_tag,
                    variant_emoji: $e.variant_emoji,
                    flavor:        $e.flavor,
                    build_iso:     $e.build_iso,
                    build_qcow2:   $e.build_qcow2,
                    base_image:    $e.base_image,
                    platform:      .platform,
                    safeplatform:  .safeplatform
                  }
              )
            }'
          }

          # Per-stage artifact matrices
          ARTIFACT_S2_MATRIX=$(make_artifact_matrix 2)
          ARTIFACT_S3_MATRIX=$(make_artifact_matrix 3)
          ARTIFACT_S4_MATRIX=$(make_artifact_matrix 4)
          echo "artifact_s2_matrix=$ARTIFACT_S2_MATRIX" >> $GITHUB_OUTPUT
          echo "artifact_s3_matrix=$ARTIFACT_S3_MATRIX" >> $GITHUB_OUTPUT
          echo "artifact_s4_matrix=$ARTIFACT_S4_MATRIX" >> $GITHUB_OUTPUT
          echo "artifact_s2_count=$(echo "$ARTIFACT_S2_MATRIX" | jq '.include | length')" >> $GITHUB_OUTPUT
          echo "artifact_s3_count=$(echo "$ARTIFACT_S3_MATRIX" | jq '.include | length')" >> $GITHUB_OUTPUT
          echo "artifact_s4_count=$(echo "$ARTIFACT_S4_MATRIX" | jq '.include | length')" >> $GITHUB_OUTPUT

  # ── Stage 1: Base images ────────────────────────────────────────────────────
  # Builds {variant}:base for every variant in parallel.
  # Nothing else may start until all base images are published.
  build_base:
    name: "${{ matrix.flavor }}"
    needs: generate_matrix
    if: fromJson(needs.generate_matrix.outputs.stage1_matrix).include[0]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate_matrix.outputs.stage1_matrix) }}
    uses: ./.github/workflows/reusable-build-image.yml
    with:
      image-name: ${{ matrix.image_name }}
      image-aliases: ${{ matrix.image_aliases }}
      image-variant: ${{ matrix.variant }}
      flavor: ${{ matrix.flavor }}
      platforms: ${{ matrix.platforms }}
      platforms-json: ${{ matrix.platforms_json }}
      default-tag: ${{ matrix.published_tag }}
      publish: ${{ github.event_name != 'pull_request' }}
      sbom: ${{ github.event_name != 'pull_request' }}

  # ── Stage 2: base-hwe, base-nvidia, and desktop base flavors ──────────────────
  # Runs only after ALL stage-1 jobs pass. Includes:
  #   - base-hwe  (layers on base)
  #   - base-nvidia  (layers on base)
  #   - gnome     (layers on base)
  #   - kde       (layers on base)
  #   - niri      (layers on base)
  # All of these run in parallel within stage 2.
  build_stage2:
    name: "${{ matrix.flavor }}"
    needs: [generate_matrix, build_base]
    # build_base is SKIPPED (not failed) when a flavor-filtered dispatch
    # leaves stage 1 empty (e.g. `-f flavor=xfce`); without !cancelled() a
    # skipped need auto-skips this job and single-flavor dispatches no-op.
    #
    # Gate on the base MANIFEST, not on build_base's conclusion. The
    # conclusion is red if any platform leg failed, and one arm64 runner
    # fault used to skip this whole stage — including flavors that declare
    # only amd64 and never touch the arm64 base. On 2026-08-14 that cost 14
    # flavors across sailfin/marlin/flounder/gurnard, none of which produced
    # a job at all (tuna-os/tunaOS#1729). manifest_published is true once
    # :<flavor>-testing exists for at least one platform, so a flavor whose
    # arch did build proceeds, one whose arch did not fails on its own pull,
    # and a base that produced nothing still stops the stage dead. Same
    # principle stage 3 already applies (#285).
    if: >-
      !cancelled() && needs.generate_matrix.result == 'success' &&
      needs.build_base.result != 'cancelled' &&
      (needs.build_base.result == 'skipped' ||
       needs.build_base.outputs.manifest_published == 'true') &&
      github.event_name != 'pull_request' &&
      fromJson(needs.generate_matrix.outputs.stage2_matrix).include[0]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate_matrix.outputs.stage2_matrix) }}
    uses: ./.github/workflows/reusable-build-image.yml
    with:
      image-name: ${{ matrix.image_name }}
      image-aliases: ${{ matrix.image_aliases }}
      image-variant: ${{ matrix.variant }}
      flavor: ${{ matrix.flavor }}
      platforms: ${{ matrix.platforms }}
      platforms-json: ${{ matrix.platforms_json }}
      default-tag: ${{ matrix.published_tag }}
      publish: true
      sbom: true

  # ── Stage 3: Desktop HWE and nvidia flavors ───────────────────────────────────
  # Layers on stage-2 images:
  #   - gnome-hwe, kde-hwe, niri-hwe   (layer on base-hwe)
  #   - gnome-nvidia, kde-nvidia, niri-nvidia   (layer on base-nvidia)
  # All run in parallel within stage 3.
  #
  # `!cancelled()` (rather than the default "all needs succeeded") so that ONE
  # failed stage-2 flavor doesn't skip the entire stage-3 lineup (#285: a flaky
  # yellowfin:kde build was blocking every -hwe / -nvidia image from shipping).
  # fail-fast is already false, so the stage-2 images that *did* build are
  # pushed and available; stage-3 cells whose specific base is missing fail on
  # their own without taking the rest down.
  build_stage3:
    name: "${{ matrix.flavor }}"
    needs: [generate_matrix, build_stage2]
    if: >-
      !cancelled() && needs.generate_matrix.result == 'success' &&
      github.event_name != 'pull_request' &&
      fromJson(needs.generate_matrix.outputs.stage3_matrix).include[0]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate_matrix.outputs.stage3_matrix) }}
    uses: ./.github/workflows/reusable-build-image.yml
    with:
      image-name: ${{ matrix.image_name }}
      image-aliases: ${{ matrix.image_aliases }}
      image-variant: ${{ matrix.variant }}
      flavor: ${{ matrix.flavor }}
      platforms: ${{ matrix.platforms }}
      platforms-json: ${{ matrix.platforms_json }}
      default-tag: ${{ matrix.published_tag }}
      publish: true
      sbom: true

  # ── Stage 4: Combined nvidia+HWE flavors ──────────────────────────────────────
  # Layers on stage-3 images:
  #   - gnome-nvidia-hwe   (layers on gnome-hwe from stage 3)
  # Separate from stage 3 because gnome-nvidia-hwe depends on gnome-hwe, itself
  # built in stage 3. Same `!cancelled()` rationale as stage 3 (#285) so a
  # single stage-3 failure doesn't skip stage 4.
  build_stage4:
    name: "${{ matrix.flavor }}"
    needs: [generate_matrix, build_stage3]
    if: >-
      !cancelled() && needs.generate_matrix.result == 'success' &&
      github.event_name != 'pull_request' &&
      fromJson(needs.generate_matrix.outputs.stage4_matrix).include[0]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate_matrix.outputs.stage4_matrix) }}
    uses: ./.github/workflows/reusable-build-image.yml
    with:
      image-name: ${{ matrix.image_name }}
      image-aliases: ${{ matrix.image_aliases }}
      image-variant: ${{ matrix.variant }}
      flavor: ${{ matrix.flavor }}
      platforms: ${{ matrix.platforms }}
      platforms-json: ${{ matrix.platforms_json }}
      default-tag: ${{ matrix.published_tag }}
      publish: true
      sbom: true

  # ── Artifact builds per stage (ISO + QCOW2) ───────────────────────────────
  # Each stage's artifacts depend only on that stage's image builds.
  # This replaces the old single build_artifacts job that had
  # `needs: build_stage4`, which blocked ALL ISOs on gnome-nvidia-hwe.
  # ISOs pull the already-published GHCR image for their stage.

  build_artifacts_s2:
    name: "iso:${{ matrix.flavor }} (${{ matrix.safeplatform }})"
    needs: [generate_matrix, build_stage2]
    # Per-CELL, not per-stage (#2059). This `if` carried no status function,
    # so success() was implicit on `build_stage2` -- a MATRIX over every
    # stage-2 flavor. One failing desktop therefore skipped every ISO in the
    # stage. Run 32786338463: hummingbird's gnome image built, signed and
    # manifested, and its ISO was skipped because kde and niri failed beside
    # it. Same shape as #1729 one edge further down, and as the stage-4
    # artifact jail the comment above records.
    #
    # What replaces the coarse gate is `image-digest-artifact` below: the
    # called workflow refuses to build unless THIS run published THIS cell's
    # image. Without that, `!cancelled()` would emit an ISO from the tag a
    # FAILED flavor last published -- stale media that looks fresh.
    if: >-
      !cancelled() && needs.generate_matrix.result == 'success' &&
      needs.build_stage2.result != 'cancelled' &&
      github.event_name != 'pull_request' &&
      needs.generate_matrix.outputs.artifact_s2_count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate_matrix.outputs.artifact_s2_matrix) }}
    permissions:
      contents: read
      packages: read
      id-token: write
    uses: ./.github/workflows/reusable-build-artifacts.yml
    with:
      variant: ${{ matrix.variant }}
      flavor: ${{ matrix.flavor }}
      platform: ${{ matrix.platform }}
      safeplatform: ${{ matrix.safeplatform }}
      image-tag: ${{ matrix.published_tag }}-${{ matrix.safeplatform }}
      build-iso: ${{ matrix.build_iso }}
      # Names the artifact this cell's OWN image leg uploads after a
      # successful push. Its existence is what makes the relaxed gate above
      # safe; see the provenance gate in reusable-build-artifacts.yml.
      image-digest-artifact: ${{ matrix.image_name }}-${{ matrix.published_tag }}-${{ matrix.safeplatform }}-${{ github.run_id }}
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

  # Same cell logic for stage-3 ISOs (gnome-nvidia etc.). `!cancelled()` so a
  # single stage-3 image failure doesn't skip the artifacts that DID build.
  build_artifacts_s3:
    name: "iso:${{ matrix.flavor }} (${{ matrix.safeplatform }})"
    needs: [generate_matrix, build_stage3]
    if: >-
      !cancelled() && needs.generate_matrix.result == 'success' &&
      needs.build_stage3.result != 'cancelled' &&
      github.event_name != 'pull_request' &&
      needs.generate_matrix.outputs.artifact_s3_count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate_matrix.outputs.artifact_s3_matrix) }}
    permissions:
      contents: read
      packages: read
      id-token: write
    uses: ./.github/workflows/reusable-build-artifacts.yml
    with:
      variant: ${{ matrix.variant }}
      flavor: ${{ matrix.flavor }}
      platform: ${{ matrix.platform }}
      safeplatform: ${{ matrix.safeplatform }}
      image-tag: ${{ matrix.published_tag }}-${{ matrix.safeplatform }}
      build-iso: ${{ matrix.build_iso }}
      # Names the artifact this cell's OWN image leg uploads after a
      # successful push. Its existence is what makes the relaxed gate above
      # safe; see the provenance gate in reusable-build-artifacts.yml.
      image-digest-artifact: ${{ matrix.image_name }}-${{ matrix.published_tag }}-${{ matrix.safeplatform }}-${{ github.run_id }}
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

  build_artifacts_s4:
    name: "iso:${{ matrix.flavor }} (${{ matrix.safeplatform }})"
    needs: [generate_matrix, build_stage4]
    if: >-
      !cancelled() && needs.generate_matrix.result == 'success' &&
      needs.build_stage4.result != 'cancelled' &&
      github.event_name != 'pull_request' &&
      needs.generate_matrix.outputs.artifact_s4_count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate_matrix.outputs.artifact_s4_matrix) }}
    permissions:
      contents: read
      packages: read
      id-token: write
    uses: ./.github/workflows/reusable-build-artifacts.yml
    with:
      variant: ${{ matrix.variant }}
      flavor: ${{ matrix.flavor }}
      platform: ${{ matrix.platform }}
      safeplatform: ${{ matrix.safeplatform }}
      image-tag: ${{ matrix.published_tag }}-${{ matrix.safeplatform }}
      build-iso: ${{ matrix.build_iso }}
      # Names the artifact this cell's OWN image leg uploads after a
      # successful push. Its existence is what makes the relaxed gate above
      # safe; see the provenance gate in reusable-build-artifacts.yml.
      image-digest-artifact: ${{ matrix.image_name }}-${{ matrix.published_tag }}-${{ matrix.safeplatform }}-${{ github.run_id }}
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
