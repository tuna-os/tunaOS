name: Prune R2 retention

# Org-wide R2 storage retention (tunaOS#1618). Before this workflow existed,
# the ONLY retention anywhere in the org was a `prune-r2` job embedded in
# publish-iso-groups.yml -- a workflow_dispatch-only workflow (no schedule).
# That meant the one existing safeguard only ran as a side effect of someone
# manually publishing grouped ISOs, not on any regular cadence, while every
# path it (and everything else) writes to accumulates indefinitely: dated
# ISOs land in live-isos/ from 13+ build-<variant>.yml workflows via
# reusable-build-artifacts.yml (same prefix the old job pruned, so those ARE
# covered once this actually runs on a schedule), and the weekly screenshot
# workflows write a dated copy alongside their stable "-latest" pointer with
# no expiration at all.
#
# This workflow centralizes retention as its own scheduled job instead of
# duplicating the rclone-delete logic per-prefix in multiple workflows (the
# same duplication tunaos#1183 already flagged for other shared tooling).
# publish-iso-groups.yml's own prune-r2 job is removed in favor of this one.
#
# Deliberately NOT touched here (out of scope, different repos):
# tromso/xfce-linux's dated ISO+sig+cert uploads, tacklebox's per-recipe R2
# uploads, and tunaos-packages' rclone-synced package repo. Those need the
# same treatment but live in their own repos with their own R2 prefixes --
# see tunaos#1618 item 3 for the full inventory.

on:
  schedule:
    # Daily, well clear of the nightly build windows (00:20-23:20 UTC per
    # build-variant.yml's schedule table) and the weekly screenshot runs
    # (Mondays 02:00/06:00 UTC) -- an in-flight upload finishing just before
    # this runs is still safe (min-age below excludes anything uploaded
    # today), but running mid-upload-storm just adds noise to both.
    - cron: "30 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted without deleting"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  prune:
    name: Prune R2
    runs-on: ubuntu-latest
    steps:
      - name: Install rclone
        run: sudo apt-get install -y rclone

      - name: Prune dated ISOs older than 14 days (live-isos/)
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          if [[ -z "${RCLONE_CONFIG_R2_ACCESS_KEY_ID:-}" ]]; then
            echo "::notice::R2 credentials not configured; skipping prune."
            exit 0
          fi
          # "*-latest*", NOT "*-latest.iso*". Non-amd64 ISOs publish an
          # arch-suffixed pointer -- reusable-build-artifacts.yml writes
          # <variant>-<flavor>-latest-<arch>.iso (plus .sha256/.sigstore.json)
          # for every platform that isn't linux/amd64 (#1378), so the bare
          # <variant>-<flavor>-latest.iso name stays the documented amd64
          # download. "*-latest.iso*" needs the literal "-latest.iso" and an
          # arch-suffixed pointer does not contain it: bonito-gnome-latest-
          # arm64.iso never matched the exclude, matched --include "*.iso",
          # and was therefore deletable the moment its mtime passed 14d --
          # i.e. the first time an arm64 leg went two weeks without a
          # successful build, which is exactly when a stable pointer has to
          # survive. Match the CLASS of pointer instead: no dated artifact
          # name contains "-latest" (they are <name>-<YYYYMMDD>.iso), so the
          # broader pattern keeps every pointer and still prunes every date.
          # Use one ordered filter list. rclone explicitly warns that mixing
          # --include and --exclude makes rule order indeterminate; retention
          # must not depend on whichever order a particular rclone release
          # chooses. The final rule also keeps unrelated live-isos objects out
          # of this extension-scoped deletion.
          FLAGS=(--log-level INFO --s3-no-check-bucket --min-age 14d \
            --filter "- *-latest*" \
            --filter "+ *.iso" \
            --filter "+ *.iso.sha256" \
            --filter "+ *.iso.sigstore.json" \
            --filter "- *")
          [[ "$DRY_RUN" == "true" ]] && FLAGS+=(--dry-run)
          echo "==> Pruning live-isos/ (>14d, excluding *-latest*)..."
          rclone delete "${FLAGS[@]}" "R2:${{ secrets.R2_BUCKET }}/live-isos/"

      - name: Prune dated screenshots older than 60 days
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          if [[ -z "${RCLONE_CONFIG_R2_ACCESS_KEY_ID:-}" ]]; then
            echo "::notice::R2 credentials not configured; skipping prune."
            exit 0
          fi
          # Longer window than ISOs -- screenshots are small (a few hundred
          # KB each vs. multi-GB ISOs) and useful for spotting a regression
          # a few weeks back, so this trades a little storage for real
          # debugging value rather than matching the ISO window exactly.
          #
          # A single recursive prune of screenshots/ is enough: rclone delete
          # recurses by default, so this also covers screenshots/boot/
          # (weekly-qcow2-screenshots.yml) without a separate pass.
          # screenshots/installer/ (installer-screenshots.yml) only ever
          # writes "-latest.png" -- no dated files ever land there, so this
          # is a safe no-op for that subtree, not an intentional skip.
          #
          # Same "*-latest*" rule as the ISO step above, for the same reason:
          # the exclude should say "never delete a pointer", not enumerate the
          # extensions pointers happen to have today. Screenshots only publish
          # "-latest.png" right now, so this is not a fix here -- it is the one
          # rule both steps state the same way, and it already covers a future
          # "-latest-arm64.png" or a .webp switch without a second incident.
          # Keep this as an ordered --filter rule too. Besides making the two
          # retention policies consistent, this avoids reintroducing rclone's
          # indeterminate mixed --include/--exclude mode when this list grows.
          FLAGS=(--log-level INFO --s3-no-check-bucket --min-age 60d \
            --filter "- *-latest*")
          [[ "$DRY_RUN" == "true" ]] && FLAGS+=(--dry-run)
          echo "==> Pruning screenshots/ recursively (>60d, excluding *-latest*)..."
          rclone delete "${FLAGS[@]}" "R2:${{ secrets.R2_BUCKET }}/screenshots/"

      - name: Report R2 inventory
        if: always()
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          if [[ -z "${RCLONE_CONFIG_R2_ACCESS_KEY_ID:-}" ]]; then
            exit 0
          fi
          BUCKET="${{ secrets.R2_BUCKET }}"
          # The dashboard-free half of #1618 item 1. Stored bytes and object
          # counts do not need Cloudflare billing access -- only the CI
          # credentials this job already holds -- so the part of "get the real
          # numbers" that was blocked on nobody having the dashboard is not
          # actually blocked for storage. Operation counts (Class A/B) still
          # are; docs/R2-COST-VISIBILITY.md says what an owner must pull by
          # hand, and that split is the point rather than an omission.
          #
          # Enumerate what is ACTUALLY in the bucket instead of looping over
          # the two prefixes this workflow prunes. A prefix nobody here knows
          # about is the most useful thing this report can surface: the
          # runbook's rule is that an unknown top-level prefix is an ownership
          # question, and you cannot ask that about a prefix you never list.
          mapfile -t PREFIXES < <(
            rclone lsf --dirs-only --s3-no-check-bucket "R2:${BUCKET}/" 2>/dev/null || true
          )
          {
            echo "## R2 inventory"
            echo
            if [[ ${#PREFIXES[@]} -eq 0 ]]; then
              echo "(listing unavailable -- rclone could not enumerate the bucket)"
            else
              echo "| Prefix | Objects | Size (GiB) | Retention |"
              echo "| --- | ---: | ---: | --- |"
            fi
            for dir in "${PREFIXES[@]}"; do
              prefix="${dir%/}"
              [[ -n "$prefix" ]] || continue
              case "$prefix" in
                live-isos)   retention="dated objects >14d pruned above" ;;
                screenshots) retention="dated objects >60d pruned above" ;;
                # Not "unused". Every other prefix in this bucket belongs to
                # some other repo (tromso, xfce-linux, tacklebox,
                # tunaos-packages) or to nothing at all, and telling those two
                # apart is the open half of #1618 items 2-4.
                *)           retention="**no retention here** -- identify writer (#1618)" ;;
              esac
              stats=$(rclone size --s3-no-check-bucket "R2:${BUCKET}/${prefix}/" --json 2>/dev/null \
                | python3 -c 'import json,sys; d=json.load(sys.stdin); print(str(d["count"]) + " | " + format(d["bytes"]/1024**3, ".2f"))' 2>/dev/null) \
                || stats="? | ?"
              echo "| \`${prefix}/\` | ${stats} | ${retention} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
