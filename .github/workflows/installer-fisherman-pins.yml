# Fail when a desktop's installer builds fisherman from the wrong repository.
#
# fisherman moved from projectbluefin/fisherman to tuna-os/fisherman and only
# org.tunaos.InstallerKde followed. Four desktops spent two months building
# their installer from a repo that had stopped moving; marlin:cosmic could not
# install at all, dying at step 9 of 10 on a bug fixed months earlier, and
# nothing anywhere reported it.
#
# Nothing that already existed could have caught it. The Flatpaks were rebuilt
# daily, so publish dates looked healthy. Renovate has nothing to bump when a
# git source points at a repository that no longer moves. The source of truth
# lives in five OTHER repositories, which is why this job reaches across to
# read them rather than checking anything in this one.
#
# Scheduled rather than per-PR: nothing in this repo can change the answer, so
# running it on every PR would be noise. Drift here happens over months.
name: Installer fisherman pins

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      # ...but do run when the check or its tests change, so a PR that breaks
      # the guard is caught by the guard.
      - 'scripts/check-installer-fisherman-pins.py'
      - 'tests/test_installer_fisherman_pins.py'
      - '.github/workflows/installer-fisherman-pins.yml'

permissions:
  contents: read

concurrency:
  group: installer-fisherman-pins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Installers build fisherman from tuna-os/fisherman
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Unit-test the check itself
        run: |
          python3 -m pytest tests/test_installer_fisherman_pins.py -q

      - name: Read every installer's fisherman source
        env:
          # Read-only, and only used to raise the anonymous API rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check-installer-fisherman-pins.py
