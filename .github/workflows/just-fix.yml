name: Just Fix
permissions: {}
on:
  # Restricted to the default branch on purpose. An unfiltered `push` fires on
  # every feature-branch push as well, which produces a second run for the
  # same head SHA as the `pull_request` event. The concurrency group below
  # then cancels one of them -- and a *cancelled* check run stays attached to
  # the head SHA, where GitHub's merge-state computation counts it as
  # non-success. Every PR carrying a Just Fix run therefore sat in UNSTABLE
  # even though the run that mattered had passed, which is what stalls
  # auto-merge and the queue paths that key off merge state (#1790).
  #
  # PR branches are still formatted: the `pull_request` event covers the same
  # head SHA. Pushes to main keep the auto-fix and automation-PR behaviour.
  push:
    branches: [main]
  pull_request:

concurrency:
  # A branch push and its pull_request event represent the same work; use the
  # source branch for both so the later event replaces the duplicate run.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Check if last commit is from bot
        id: check-bot
        run: |
          LAST_COMMIT_AUTHOR=$(git log -1 --format='%an')
          LAST_COMMIT_MSG=$(git log -1 --format='%s')
          if [[ "$LAST_COMMIT_AUTHOR" == "github-actions[bot]" ]] && [[ "$LAST_COMMIT_MSG" == "style: fix formatting" ]]; then
            echo "last_commit_is_bot=true" >> $GITHUB_OUTPUT
          else
            echo "last_commit_is_bot=false" >> $GITHUB_OUTPUT
          fi

      - name: Install verified lint tools
        if: steps.check-bot.outputs.last_commit_is_bot != 'true'
        run: |
          set -euo pipefail
          bin_dir="$RUNNER_TEMP/lint-tools"
          python3 scripts/lint_tools.py install --bin-dir "$bin_dir"
          export PATH="$bin_dir:$PATH"
          python3 scripts/lint_tools.py verify
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Run just fix
        if: steps.check-bot.outputs.last_commit_is_bot != 'true'
        run: just fix

      # main is protected by the merge-queue rule (GH013: "Changes must be
      # made through the merge queue"), so a direct `git push` to the default
      # branch fails — run 31398166328, 2026-08-10, "Commit and push changes".
      # On the default branch, push the formatting commit to a feature branch
      # and open a PR (the merge queue will handle the actual merge). On any
      # other branch keep the original direct-push behavior.
      #
      # A pull request from a FORK cannot be pushed to at all: GITHUB_TOKEN is
      # read-only on fork PRs whatever `permissions:` asks for, so the push
      # 403s and `bash -e` turns a formatting nit into a red check on the one
      # population least likely to know the convention (the Hive
      # changelog-reminder lesson, kubestellar/hive#4440; epic #2250 item 13).
      # On a fork PR the diff is delivered as a job summary and a notice, and
      # the step succeeds — a reminder, not a gate.
      - name: Commit and push changes
        if: steps.check-bot.outputs.last_commit_is_bot != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ -z $(git status --porcelain) ]]; then
            echo "no formatting changes to commit"
            exit 0
          fi
          if [[ "${IS_FORK:-false}" == "true" ]]; then
            {
              echo "### Formatting changes needed"
              echo ""
              echo "This pull request comes from a fork, so the formatter cannot push a fix to it."
              echo "Run \`just fix\` locally and commit the result. The diff it would have made:"
              echo ""
              echo '```diff'
              git --no-pager diff
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            msg="Run 'just fix' locally and commit; the diff is in this job's summary. Not a gate."
            echo "::notice title=Formatting::${msg}"
            exit 0
          fi
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "style: fix formatting"
          if [[ "${REF_NAME}" == "${DEFAULT_BRANCH}" ]]; then
            BRANCH="automation/just-fix-$(date +%s)"
            git checkout -b "${BRANCH}"
            git push -u origin "${BRANCH}"
            gh pr create \
              --base "${DEFAULT_BRANCH}" \
              --head "${BRANCH}" \
              --title "style: fix formatting" \
              --body "Automated formatting fix from the **Just Fix** workflow.\n\nA direct push to \`${DEFAULT_BRANCH}\` is blocked by the merge-queue branch-protection rule, so the commit is offered as a PR instead (it will merge through the queue as usual)."
          else
            git push
          fi
