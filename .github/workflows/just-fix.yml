name: Just Fix
permissions: {}
on:
  # Restricted to the default branch on purpose. An unfiltered `push` fires on
  # every feature-branch push as well, which produces a second run for the
  # same head SHA as the `pull_request` event. The concurrency group below
  # then cancels one of them -- and a *cancelled* check run stays attached to
  # the head SHA, where GitHub's merge-state computation counts it as
  # non-success. Every PR carrying a Just Fix run therefore sat in UNSTABLE
  # even though the run that mattered had passed, which is what stalls
  # auto-merge and the queue paths that key off merge state (#1790).
  #
  # PR branches are still formatted: the `pull_request` event covers the same
  # head SHA. Pushes to main keep the auto-fix and automation-PR behaviour.
  push:
    branches: [main]
  # The pull_request run starts only when the pull request's whole diff touches
  # something `just fix` rewrites (see the `fix` recipe in just/utilities.just):
  # shell scripts, `.just` files, the Justfile, shfmt's .editorconfig, and the
  # pinned tool versions it verifies first. Anything else cannot change its
  # result, and the run used to start on every head just to find nothing to
  # format. Not a required check, so a skipped run blocks nothing.
  pull_request:
    paths:
      - '**.sh'
      - '**.just'
      - 'Justfile'
      - '.editorconfig'
      - 'toolchain/lint-tools.json'
      - 'scripts/lint_tools.py'
      - '.github/workflows/just-fix.yml'

concurrency:
  # A branch push and its pull_request event represent the same work; use the
  # source branch for both so the later event replaces the duplicate run.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Two trust domains (#3666). `just fix` runs repository-controlled code
  # (Justfile, scripts, formatter configs), so on a pull request it runs in a
  # job that holds a read-only token and no persisted git credential: a PR
  # branch, same-repo or fork, cannot use the token to write. The job reports
  # formatting drift as a failing check, a step summary and a diff artifact.
  # Only the push-to-main job can write, and it runs main's own code.
  format-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install verified lint tools
        run: |
          set -euo pipefail
          bin_dir="$RUNNER_TEMP/lint-tools"
          python3 scripts/lint_tools.py install --bin-dir "$bin_dir"
          export PATH="$bin_dir:$PATH"
          python3 scripts/lint_tools.py verify
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Run just fix
        run: just fix

      - name: Report formatting changes
        run: |
          set -euo pipefail
          # Intent-to-add makes files `just fix` created show up in the diff.
          git add -A -N
          if [[ -z $(git status --porcelain) ]]; then
            echo "no formatting changes needed"
            exit 0
          fi
          git --no-pager diff > "$RUNNER_TEMP/just-fix.diff"
          {
            echo "### Formatting changes needed"
            echo ""
            echo "Run \`just fix\` locally and commit the result. The diff it made:"
            echo ""
            echo '```diff'
            cat "$RUNNER_TEMP/just-fix.diff"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          cp "$RUNNER_TEMP/just-fix.diff" just-fix.diff
          echo "::error title=Formatting::Run 'just fix' locally and commit; the diff is in this job's summary and the just-fix-diff artifact."
          exit 1

      - name: Upload formatting diff
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: just-fix-diff
          path: just-fix.diff
          if-no-files-found: ignore

  # main is protected by the merge-queue rule (GH013: "Changes must be made
  # through the merge queue"), so a direct `git push` to the default branch
  # fails — run 31398166328, 2026-08-10. The formatting commit goes to a
  # feature branch and is offered as a PR; the merge queue handles the merge.
  fix-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Check if last commit is from bot
        id: check-bot
        run: |
          LAST_COMMIT_AUTHOR=$(git log -1 --format='%an')
          LAST_COMMIT_MSG=$(git log -1 --format='%s')
          if [[ "$LAST_COMMIT_AUTHOR" == "github-actions[bot]" ]] && [[ "$LAST_COMMIT_MSG" == "style: fix formatting" ]]; then
            echo "last_commit_is_bot=true" >> $GITHUB_OUTPUT
          else
            echo "last_commit_is_bot=false" >> $GITHUB_OUTPUT
          fi

      - name: Install verified lint tools
        if: steps.check-bot.outputs.last_commit_is_bot != 'true'
        run: |
          set -euo pipefail
          bin_dir="$RUNNER_TEMP/lint-tools"
          python3 scripts/lint_tools.py install --bin-dir "$bin_dir"
          export PATH="$bin_dir:$PATH"
          python3 scripts/lint_tools.py verify
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Run just fix
        if: steps.check-bot.outputs.last_commit_is_bot != 'true'
        run: just fix

      - name: Commit and push changes
        if: steps.check-bot.outputs.last_commit_is_bot != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ -z $(git status --porcelain) ]]; then
            echo "no formatting changes to commit"
            exit 0
          fi
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "style: fix formatting"
          BRANCH="automation/just-fix-$(date +%s)"
          git checkout -b "${BRANCH}"
          git push -u origin "${BRANCH}"
          gh pr create \
            --base "${DEFAULT_BRANCH}" \
            --head "${BRANCH}" \
            --title "style: fix formatting" \
            --body "Automated formatting fix from the **Just Fix** workflow.\n\nA direct push to \`${DEFAULT_BRANCH}\` is blocked by the merge-queue branch-protection rule, so the commit is offered as a PR instead (it will merge through the queue as usual)."
