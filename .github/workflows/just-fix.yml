name: Just Fix
on:
  push:
  pull_request:

concurrency:
  # A branch push and its pull_request event represent the same work; use the
  # source branch for both so the later event replaces the duplicate run.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check if last commit is from bot
        id: check-bot
        run: |
          LAST_COMMIT_AUTHOR=$(git log -1 --format='%an')
          LAST_COMMIT_MSG=$(git log -1 --format='%s')
          if [[ "$LAST_COMMIT_AUTHOR" == "github-actions[bot]" ]] && [[ "$LAST_COMMIT_MSG" == "style: fix formatting" ]]; then
            echo "last_commit_is_bot=true" >> $GITHUB_OUTPUT
          else
            echo "last_commit_is_bot=false" >> $GITHUB_OUTPUT
          fi

      # Use the runner's preinstalled Homebrew, as lint.yml does. Installing
      # Homebrew from scratch on every run made this job depend on a large
      # download that fails often enough to matter:
      #
      #   Error: Failed to download
      #   https://formulae.brew.sh/api/internal/packages.x86_64_linux.jws.json!
      #
      # Every such failure turned this check red, which left the pull request
      # UNSTABLE, which stopped Renovate automerging it. Renovate PRs then sat
      # open for days — #835 merged within minutes once queued by hand, after
      # five days of waiting.
      - name: Setup Homebrew
        if: steps.check-bot.outputs.last_commit_is_bot != 'true'
        uses: Homebrew/actions/setup-homebrew@2ebcf16054461267868620b1414507f3ccc765c1 # main as of 2026-06-09

      - name: Install just
        if: steps.check-bot.outputs.last_commit_is_bot != 'true'
        run: brew install just

      - name: Run just fix
        if: steps.check-bot.outputs.last_commit_is_bot != 'true'
        run: just fix

      # main is protected by the merge-queue rule (GH013: "Changes must be
      # made through the merge queue"), so a direct `git push` to the default
      # branch fails — run 31398166328, 2026-08-10, "Commit and push changes".
      # On the default branch, push the formatting commit to a feature branch
      # and open a PR (the merge queue will handle the actual merge). On any
      # other branch keep the original direct-push behavior.
      - name: Commit and push changes
        if: steps.check-bot.outputs.last_commit_is_bot != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ -z $(git status --porcelain) ]]; then
            echo "no formatting changes to commit"
            exit 0
          fi
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "style: fix formatting"
          if [[ "${REF_NAME}" == "${DEFAULT_BRANCH}" ]]; then
            BRANCH="automation/just-fix-$(date +%s)"
            git checkout -b "${BRANCH}"
            git push -u origin "${BRANCH}"
            gh pr create \
              --base "${DEFAULT_BRANCH}" \
              --head "${BRANCH}" \
              --title "style: fix formatting" \
              --body "Automated formatting fix from the **Just Fix** workflow.\n\nA direct push to \`${DEFAULT_BRANCH}\` is blocked by the merge-queue branch-protection rule, so the commit is offered as a PR instead (it will merge through the queue as usual)."
          else
            git push
          fi
