name: Build Health

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/build-health.yml"
      - ".github/build-config.yml"
      - "image-versions.yaml"
      - "scripts/gen-build-health.py"
      - "scripts/contracts/**"
      - "schemas/**"
      - "tests/test_build_health*.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: build-health-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install pinned dependencies
        run: |
          # Read the python_packages section before installing the YAML parser.
          mapfile -t package_specs < <(python scripts/python-package-pins.py image-versions.yaml PyYAML jsonschema pytest)
          python -m pip install "${package_specs[@]}" --break-system-packages ||
            python -m pip install "${package_specs[@]}" --user
      - name: Verify health and native platform boundaries
        run: python -m pytest tests/test_build_health.py tests/test_build_health_fetch.py tests/test_build_health_receipts.py tests/test_consumer_contract.py tests/regressions/test_issue_2513_selected_display_manager_survives_first_boot.py tests/test_rawhide_gnome_vpn_replacement.py tests/test_eln_fwupd_family_upgrade.py tests/test_asahi_native_kernel_evidence.py tests/regressions/test_issue_2513_waived_desktop_contract_cannot_pass.py tests/test_candidate_image_publication.py tests/test_debian_nvidia_snapshot.py tests/regressions/test_issue_2696_debian_nvidia_holds_a_kernel_the_driver_builds_on.py tests/test_candidate_flavor_selection.py
      - name: Collect required target observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p health
          api_version=$(python -c 'import yaml; print(yaml.safe_load(open("image-versions.yaml"))["github_api_version"])')
          python scripts/gen-build-health.py \
            --source-revision "$GITHUB_SHA" --api-version "$api_version" \
            --output health/build-health.json --markdown health/BUILD-HEALTH.md
          cat health/BUILD-HEALTH.md >> "$GITHUB_STEP_SUMMARY"
      - name: Generate workflow inventory for review
        run: |
          python scripts/gen-ci-lanes.py
          cp docs/CI_SPEC.md health/CI_SPEC.md
      - name: Preserve observed health
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: health/
          if-no-files-found: error
