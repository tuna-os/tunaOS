# Browser/CI ISO parity gate (tunaOS#673).
#
# ISO-builder publishes an ISO and experience manifest as an artifact. This
# reusable workflow downloads that artifact and a CI-built reference artifact,
# validates that their inputs and GUI/install contracts match, then runs the
# exact same LUKS harness against both ISO paths. There is intentionally no
# browser-specific E2E implementation here.
name: ISO Builder Parity
permissions: {}

on:
  workflow_call:
    inputs:
      ci_run_id:
        description: "Actions run containing the CI-built ISO artifact"
        required: true
        type: string
      browser_run_id:
        description: "Actions run containing the browser-built ISO artifact"
        required: true
        type: string
      ci_repository:
        description: "owner/repository containing the CI artifact"
        required: false
        default: "tuna-os/tunaos"
        type: string
      browser_repository:
        description: "owner/repository containing the browser artifact"
        required: false
        default: "tuna-os/iso-builder"
        type: string
      ci_artifact:
        description: "Artifact containing ci.iso and experience-manifest.json"
        required: true
        type: string
      browser_artifact:
        description: "Artifact containing browser.iso and experience-manifest.json"
        required: true
        type: string
      variant:
        required: true
        type: string
      flavor:
        required: true
        type: string
      browser_name:
        description: "Browser identifier recorded in the qualification evidence"
        required: false
        default: "unknown"
        type: string
      browser_version:
        description: "Browser version recorded in the qualification evidence"
        required: false
        default: "unknown"
        type: string
      browser_memory_gib:
        description: "Browser host memory GiB (empty: the harness measures the runner)"
        required: false
        default: ""
        type: string
      browser_free_disk_gib:
        description: "Browser host free disk GiB (empty: the harness measures the runner)"
        required: false
        default: ""
        type: string
      qual_platform:
        description: "Target platform recorded in the qualification evidence"
        required: false
        default: ""
        type: string
      qual_cpu_baseline:
        description: "Target CPU baseline recorded in the qualification evidence"
        required: false
        default: ""
        type: string
      qual_hardware_scope:
        description: "Target hardware scope recorded in the qualification evidence"
        required: false
        default: ""
        type: string
    secrets:
      artifact_token:
        required: false

jobs:
  parity:
    name: ${{ inputs.variant }}:${{ inputs.flavor }} browser/CI strict offline GUI parity
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download CI ISO and manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.ci_artifact }}
          path: parity/ci
          repository: ${{ inputs.ci_repository }}
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ secrets.artifact_token || github.token }}

      - name: Download browser ISO and manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.browser_artifact }}
          path: parity/browser
          repository: ${{ inputs.browser_repository }}
          run-id: ${{ inputs.browser_run_id }}
          github-token: ${{ secrets.artifact_token || github.token }}

      - name: Install E2E dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf socat sshpass imagemagick swtpm tesseract-ocr

      - name: Validate and compare experience manifests
        env:
          VARIANT: ${{ inputs.variant }}
          FLAVOR: ${{ inputs.flavor }}
        run: |
          set -euo pipefail
          for source in ci browser; do
            manifest="parity/${source}/experience-manifest.json"
            test -f "$manifest" || { echo "missing $manifest" >&2; exit 1; }
            python3 scripts/verify-experience-manifest.py "$manifest"
            jq -e --arg v "$VARIANT" --arg f "$FLAVOR" \
              '.variant == $v and .flavor == $f' "$manifest" >/dev/null
          done
          python3 scripts/verify-experience-manifest.py \
            parity/ci/experience-manifest.json \
            --compare parity/browser/experience-manifest.json

      - name: Run strict offline GUI qualification against CI ISO
        env:
          VARIANT: ${{ inputs.variant }}
          FLAVOR: ${{ inputs.flavor }}
          TUNAOS_QUAL_PLATFORM: ${{ inputs.qual_platform }}
          TUNAOS_QUAL_CPU_BASELINE: ${{ inputs.qual_cpu_baseline }}
          TUNAOS_QUAL_HARDWARE_SCOPE: ${{ inputs.qual_hardware_scope }}
          TUNAOS_QUAL_BROWSER_NAME: ${{ inputs.browser_name }}
          TUNAOS_QUAL_BROWSER_VERSION: ${{ inputs.browser_version }}
          TUNAOS_QUAL_BROWSER_MEMORY_GIB: ${{ inputs.browser_memory_gib }}
          TUNAOS_QUAL_BROWSER_FREE_DISK_GIB: ${{ inputs.browser_free_disk_gib }}
        run: |
          set -euo pipefail
          iso="parity/ci/ci.iso"
          test -f "$iso" || { echo "missing $iso" >&2; exit 1; }
          # The source digest the qualification must match after reboot.
          # v1 manifests carry it under resolved_inputs; accept the legacy
          # field while iso-builder callers migrate. Empty is fine — the
          # harness then reads it from the live guest over SSH, or fails
          # closed if neither channel yields it.
          manifest="parity/ci/experience-manifest.json"
          if [ -f "$manifest" ]; then
            export TUNAOS_QUAL_SOURCE_DIGEST TUNAOS_QUAL_OVERLAY_DIGEST
            TUNAOS_QUAL_SOURCE_DIGEST="$(jq -r '.resolved_inputs["source"] // .source_image_digest // empty' "$manifest")"
            TUNAOS_QUAL_OVERLAY_DIGEST="$(jq -r '.resolved_inputs["overlay"] // empty' "$manifest")"
          fi
          ./scripts/iso-e2e.sh "$iso" --strict-offline-gui --output parity/ci-e2e

      - name: Run strict offline GUI qualification against browser ISO
        env:
          VARIANT: ${{ inputs.variant }}
          FLAVOR: ${{ inputs.flavor }}
          TUNAOS_QUAL_PLATFORM: ${{ inputs.qual_platform }}
          TUNAOS_QUAL_CPU_BASELINE: ${{ inputs.qual_cpu_baseline }}
          TUNAOS_QUAL_HARDWARE_SCOPE: ${{ inputs.qual_hardware_scope }}
          TUNAOS_QUAL_BROWSER_NAME: ${{ inputs.browser_name }}
          TUNAOS_QUAL_BROWSER_VERSION: ${{ inputs.browser_version }}
          TUNAOS_QUAL_BROWSER_MEMORY_GIB: ${{ inputs.browser_memory_gib }}
          TUNAOS_QUAL_BROWSER_FREE_DISK_GIB: ${{ inputs.browser_free_disk_gib }}
        run: |
          set -euo pipefail
          iso="parity/browser/browser.iso"
          test -f "$iso" || { echo "missing $iso" >&2; exit 1; }
          manifest="parity/browser/experience-manifest.json"
          if [ -f "$manifest" ]; then
            export TUNAOS_QUAL_SOURCE_DIGEST TUNAOS_QUAL_OVERLAY_DIGEST
            TUNAOS_QUAL_SOURCE_DIGEST="$(jq -r '.resolved_inputs["source"] // .source_image_digest // empty' "$manifest")"
            TUNAOS_QUAL_OVERLAY_DIGEST="$(jq -r '.resolved_inputs["overlay"] // empty' "$manifest")"
          fi
          ./scripts/iso-e2e.sh "$iso" --strict-offline-gui --output parity/browser-e2e

      - name: Validate and compare qualification evidence
        run: |
          set -euo pipefail
          for source in ci browser; do
            ev="parity/${source}-e2e/qualification-evidence.json"
            test -f "$ev" || { echo "missing $ev" >&2; exit 1; }
            python3 scripts/verify-experience-manifest.py "$ev"
          done
          python3 scripts/verify-experience-manifest.py \
            parity/ci-e2e/qualification-evidence.json \
            --compare parity/browser-e2e/qualification-evidence.json

      - name: Prune heavy temporaries before upload
        if: always()
        run: |
          set -euo pipefail
          # Multi-GB temporaries must never reach artifact storage: installed
          # qcow2 disks, raw PPM captures, and any ISO copies staged under
          # the per-source output dirs. Evidence is the converted PNGs,
          # logs, walkthrough JSON, and qualification-evidence.json.
          for dir in parity/ci-e2e parity/browser-e2e; do
            [ -d "$dir" ] || continue
            find "$dir" -type f \( -name '*.qcow2' -o -name '*.ppm' -o -name '*.iso' \) -delete
          done

      - name: Upload parity evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iso-builder-parity-${{ inputs.variant }}-${{ inputs.flavor }}
          # Curated evidence only: serial/evidence logs, the v1
          # qualification JSON, per-mode fragments, walkthrough TAP JSON,
          # and converted PNG frames. The prune step above already deleted
          # qcow2/PPM/ISO temporaries; no disk-image path is listed here, so
          # multi-GB media can never reach artifact storage.
          path: |
            parity/ci-e2e/*.log
            parity/ci-e2e/*.json
            parity/ci-e2e/*.png
            parity/ci-e2e/walkthrough-*/*.json
            parity/ci-e2e/walkthrough-*/*.png
            parity/browser-e2e/*.log
            parity/browser-e2e/*.json
            parity/browser-e2e/*.png
            parity/browser-e2e/walkthrough-*/*.json
            parity/browser-e2e/walkthrough-*/*.png
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
