name: Publish Live ISOs to R2

permissions:
  contents: read

on:
  # DISABLED: per-flavor ISOs superseded by grouped dedup ISO pipeline
  # (publish-iso-groups.yml). Kept for emergency manual use only.
  # schedule:
  #   - cron: '0 22 * * 0'
  workflow_dispatch:
    inputs:
      variant:
        description: 'Variant to build (all = build everything with build_iso: true)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - yellowfin
          - albacore
          - skipjack
          - bonito
          - grouper
      flavor:
        description: 'Flavor to build (all = build everything with build_iso: true)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - gnome
          - gnome-hwe
          - kde
          - cosmic
          - niri
          - xfce
      skip_upload:
        description: 'Build ISOs but skip uploading to R2 (dry run / testing)'
        required: false
        default: false
        type: boolean

jobs:
  generate-matrix:
    name: Generate ISO matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      count: ${{ steps.build.outputs.count }}
      destination: ${{ steps.dest.outputs.destination }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup yq
        uses: ./.github/actions/setup-yq

      # "<registry>/<namespace>" the images publish to: [build.publish] in
      # tunaos.toml, else ghcr.io/<owner> (scripts/publish-destination.sh).
      - name: Resolve publish destination
        id: dest
        env:
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
        run: echo "destination=$(bash scripts/publish-destination.sh)" >> "$GITHUB_OUTPUT"

      - name: Build matrix from build-config.yml
        id: build
        env:
          WANT_VARIANT: ${{ inputs.variant || 'all' }}
          WANT_FLAVOR: ${{ inputs.flavor || 'all' }}
        run: |
          CONFIG_JSON="${RUNNER_TEMP}/build-config.json"
          yq -o=json '.' .github/build-config.yml > "$CONFIG_JSON"
          MATRIX=$(jq -c --arg v "$WANT_VARIANT" --arg f "$WANT_FLAVOR" '{
            include: [
              . as $root | .variants[] as $var | $var.flavors[]
              | select(.build_iso == true)
              | select($v == "all" or $var.id == $v)
              | select($f == "all" or .id == $f)
              | {variant: $var.id, flavor: .id,
                 published_tag: (.id + (if ($var.tag_suffix // "") == "" then "" else "-" + $var.tag_suffix end)),
                 platforms: (.platforms // $var.platforms // $root.config.global_platforms // ["linux/amd64"])}
              | . as $cell
              | $cell.platforms[]
              | select(. == "linux/amd64" or . == "linux/amd64/v2" or . == "linux/arm64")
              | {variant: $cell.variant, flavor: $cell.flavor,
                 published_tag: $cell.published_tag, platform: .,
                 safeplatform: (gsub("/"; "-")),
                 image_tag: ($cell.published_tag + "-" + gsub("/"; "-"))}
            ]
          }' "$CONFIG_JSON" | python3 scripts/iso-delivery-policy.py --config-json "$CONFIG_JSON" annotate-target-matrix)
          COUNT=$(echo "$MATRIX" | jq '.include | length')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Building $COUNT ISO target(s):"
          echo "$MATRIX" | jq -r '.include[] | "  \(.variant):\(.flavor) [\(.platform)]"'

  build-and-publish:
    name: ${{ matrix.variant }}:${{ matrix.flavor }} [${{ matrix.platform }}]
    needs: generate-matrix
    if: ${{ needs.generate-matrix.outputs.count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    permissions:
      actions: read
      contents: read
      packages: read
      id-token: write
    # Build and gate the exact canonical platform artifact from its matching
    # platform tag; only publish to R2 if the gate passes.
    uses: ./.github/workflows/reusable-build-artifacts.yml
    with:
      variant: ${{ matrix.variant }}
      flavor: ${{ matrix.flavor }}
      platform: ${{ matrix.platform }}
      safeplatform: ${{ matrix.safeplatform }}
      image-tag: ${{ matrix.image_tag }}
      upload-r2: ${{ inputs.skip_upload != true && !matrix.r2_cutover }}
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

  attach-release:
    name: Release ${{ matrix.variant }}:${{ matrix.flavor }} [${{ matrix.platform }}]
    needs: [generate-matrix, build-and-publish]
    if: ${{ !cancelled() && inputs.skip_upload != true && needs.generate-matrix.outputs.count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download signed ISO
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iso-${{ matrix.variant }}-${{ matrix.flavor }}-${{ matrix.safeplatform }}
          path: release-assets

      - name: Attach ISO to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANT: ${{ matrix.variant }}
          FLAVOR: ${{ matrix.flavor }}
          PLATFORM: ${{ matrix.platform }}
          IMAGE_TAG: ${{ matrix.image_tag }}
          PUBLISH_DEST: ${{ needs.generate-matrix.outputs.destination }}
        run: |
          DATE=$(date +%Y%m%d)
          TAG="${FLAVOR}-${DATE}"
          ISO=$(find release-assets -maxdepth 1 -name "*.iso" | head -1)
          if [[ -z "$ISO" ]]; then
            echo "::error::No ISO found to attach"
            exit 1
          fi
          # The bundle only takes its published name after the boot gate passes
          # and cosign verify-blob succeeds; the artifact upload runs if: always(),
          # so a failed cell can still ship a bare ISO or a checksum alone.
          for sidecar in "${ISO}.sha256" "${ISO}.sigstore.json"; do
            if [[ ! -f "$sidecar" ]]; then
              echo "::error::Missing ${sidecar}: boot gate or signing did not pass"
              exit 1
            fi
          done
          if ! gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" &>/dev/null; then
            if ! gh release create "$TAG" --repo "${GITHUB_REPOSITORY}" --title "TunaOS ${FLAVOR} (${DATE})" --notes "Live ISO for ${VARIANT}:${FLAVOR} [${PLATFORM}]. Built from ${PUBLISH_DEST:?}/${VARIANT}:${IMAGE_TAG}."; then
              # Several platform/variant jobs can converge on the same
              # flavor/date release; accept a creation race only if the tag
              # is now readable, then continue with this cell's distinct ISO.
              gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null
            fi
          fi
          # Delete existing assets explicitly: gh release upload --clobber can
          # return HTTP 422 for an asset uploaded in the same API session.
          ISO_NAME=$(basename "$ISO")
          ASSETS=("$ISO_NAME" "${ISO_NAME}.sha256" "${ISO_NAME}.sigstore.json")
          EXISTING=$(gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" --json assets \
            | python3 -c "import json,sys; assets=json.load(sys.stdin)['assets']; [print(a['name']) for a in assets]")
          for asset in "${ASSETS[@]}"; do
            if grep -qxF "$asset" <<< "$EXISTING"; then
              echo "==> Deleting existing asset ${asset} from release ${TAG}..."
              gh release delete-asset "$TAG" "$asset" --repo "${GITHUB_REPOSITORY}" --yes
            fi
          done
          gh release upload "$TAG" --repo "${GITHUB_REPOSITORY}" \
            "$ISO" "${ISO}.sha256" "${ISO}.sigstore.json"
          echo "==> Attached ${ISO_NAME} plus checksum and Sigstore bundle to release $TAG"
