name: Publish Live ISOs to R2

permissions:
  contents: read

on:
  # DISABLED: per-flavor ISOs superseded by grouped dedup ISO pipeline
  # (publish-iso-groups.yml). Kept for emergency manual use only.
  # schedule:
  #   - cron: '0 22 * * 0'
  workflow_dispatch:
    inputs:
      variant:
        description: 'Variant to build (all = build everything with build_iso: true)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - yellowfin
          - albacore
          - skipjack
          - bonito
          - grouper
      flavor:
        description: 'Flavor to build (all = build everything with build_iso: true)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - gnome
          - gnome-hwe
          - kde
          - cosmic
          - niri
          - xfce
      skip_upload:
        description: 'Build ISOs but skip uploading to R2 (dry run / testing)'
        required: false
        default: false
        type: boolean


jobs:
  generate-matrix:
    name: Generate ISO matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      count: ${{ steps.build.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: catalog-snapshot
        uses: ./.github/actions/download-current-catalog-snapshot
        with:
          token: ${{ github.token }}


      - name: Setup yq
        uses: ./.github/actions/setup-yq

      - name: Build matrix from build-config.yml
        id: build
        env:
          CATALOG_SNAPSHOT: ${{ steps.catalog-snapshot.outputs.snapshot }}
          WANT_VARIANT: ${{ inputs.variant || 'all' }}
          WANT_FLAVOR: ${{ inputs.flavor || 'all' }}
        run: |
          MATRIX=$(yq -o json .github/build-config.yml | jq -c \
            --arg v "$WANT_VARIANT" --arg f "$WANT_FLAVOR" '{
              include: [
                .variants[] | . as $var |
                .flavors[] |
                select(.build_iso == true) |
                select($v == "all" or $var.id == $v) |
                select($f == "all" or .id == $f) |
                {variant: $var.id, flavor: .id}
              ]
            }')
          # Suppress only when this exact commit's catalog snapshot still
          # validates the target's qualification receipt.
          CUTOVER_SNAPSHOT=()
          if [[ -n "$CATALOG_SNAPSHOT" ]]; then
            CUTOVER_SNAPSHOT=(--snapshot "$CATALOG_SNAPSHOT")
          fi
          MATRIX=$(echo "$MATRIX" | python3 scripts/delivery-cutover.py \
            --annotate-matrix --default-platform linux/amd64 \
            "${CUTOVER_SNAPSHOT[@]}")
          COUNT=$(echo "$MATRIX" | jq '.include | length')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

  build-and-publish:
    name: ${{ matrix.variant }}:${{ matrix.flavor }}
    needs: generate-matrix
    if: ${{ needs.generate-matrix.outputs.count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    permissions:
      contents: read
      packages: read
      id-token: write
    # Builds the ISO from the promoted :<flavor> image, boot-gates it in
    # QEMU, and only publishes to R2 if the gate passes.
    uses: ./.github/workflows/reusable-build-artifacts.yml
    with:
      variant: ${{ matrix.variant }}
      flavor: ${{ matrix.flavor }}
      image-tag: ${{ matrix.flavor }}
      upload-r2: ${{ inputs.skip_upload != true }}
      # Delivery cutover: same per-target gate as the nightly path above.
      # matrix.cutover is stamped in generate-matrix; a row without it
      # evaluates to false (current behavior).
      cutover-check: ${{ matrix.cutover == true }}
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

  attach-release:
    name: Release ${{ matrix.variant }}:${{ matrix.flavor }}
    needs: [generate-matrix, build-and-publish]
    if: ${{ !cancelled() && inputs.skip_upload != true && needs.generate-matrix.outputs.count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed ISO
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iso-${{ matrix.variant }}-${{ matrix.flavor }}-linux-amd64
          path: release-assets

      - name: Attach ISO to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANT: ${{ matrix.variant }}
          FLAVOR: ${{ matrix.flavor }}
        run: |
          DATE=$(date +%Y%m%d)
          TAG="${FLAVOR}-${DATE}"
          ISO=$(find release-assets -maxdepth 1 -name "*.iso" | head -1)
          if [[ -z "$ISO" ]]; then
            echo "::error::No ISO found to attach"
            exit 1
          fi
          # The bundle only takes its published name after the boot gate passes
          # and cosign verify-blob succeeds; the artifact upload runs if: always(),
          # so a failed cell can still ship a bare ISO or a checksum alone.
          for sidecar in "${ISO}.sha256" "${ISO}.sigstore.json"; do
            if [[ ! -f "$sidecar" ]]; then
              echo "::error::Missing ${sidecar}: boot gate or signing did not pass"
              exit 1
            fi
          done
          if ! gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" &>/dev/null; then
            gh release create "$TAG" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "TunaOS ${FLAVOR} (${DATE})" \
              --notes "Live ISO for ${VARIANT}:${FLAVOR}. Built from ghcr.io/tuna-os/${VARIANT}:${FLAVOR}."
          fi
          # Delete existing assets explicitly: gh release upload --clobber can
          # return HTTP 422 for an asset uploaded in the same API session.
          ISO_NAME=$(basename "$ISO")
          ASSETS=("$ISO_NAME" "${ISO_NAME}.sha256" "${ISO_NAME}.sigstore.json")
          EXISTING=$(gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" --json assets \
            | python3 -c "import json,sys; assets=json.load(sys.stdin)['assets']; [print(a['name']) for a in assets]")
          for asset in "${ASSETS[@]}"; do
            if grep -qxF "$asset" <<< "$EXISTING"; then
              echo "==> Deleting existing asset ${asset} from release ${TAG}..."
              gh release delete-asset "$TAG" "$asset" --repo "${GITHUB_REPOSITORY}" --yes
            fi
          done
          gh release upload "$TAG" --repo "${GITHUB_REPOSITORY}" \
            "$ISO" "${ISO}.sha256" "${ISO}.sigstore.json"
          echo "==> Attached ${ISO_NAME} plus checksum and Sigstore bundle to release $TAG"
