name: Good-first-issue pool

on:
  schedule:
    - cron: '30 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check onboarding labels
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./scripts/check-gfi-pool.sh
