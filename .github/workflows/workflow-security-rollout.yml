name: Workflow security issue index

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/workflow-security-rollout.yml
      - scripts/gen-workflow-security-rollout.py
      - tests/test_workflow_security_rollout.py
      - docs/data/workflow-security-issues.json
      - docs/WORKFLOW-SECURITY-ROLLOUT-INDEX.md

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the saved snapshot
        run: python3 scripts/gen-workflow-security-rollout.py --check
      - name: Refresh public issue reports
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/gen-workflow-security-rollout.py --refresh
      - name: Upload the index and source snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: workflow-security-issue-index
          path: |
            docs/data/workflow-security-issues.json
            docs/WORKFLOW-SECURITY-ROLLOUT-INDEX.md
          if-no-files-found: error
