name: One-time ISO evidence analysis
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/iso-evidence-once.yml'
      - '.github/iso-diagnostic/**'
permissions:
  contents: read
concurrency:
  group: iso-evidence-once-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  reviewed-preflight:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'diag/iso-retained-evidence-39881426883'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install pinned OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-pytest imagemagick=8:6.9.12.98+dfsg1-5.2build2 \
            imagemagick-6.q16=8:6.9.12.98+dfsg1-5.2build2 \
            tesseract-ocr=5.3.4-1build5 libtesseract5=5.3.4-1build5 \
            tesseract-ocr-eng=1:4.1.0-2 tesseract-ocr-osd=1:4.1.0-2
          dpkg-query -W imagemagick imagemagick-6.q16 tesseract-ocr libtesseract5 tesseract-ocr-eng tesseract-ocr-osd
      - name: Verify and stage reviewed source and fixtures
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, tempfile
          source = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '.github/iso-diagnostic'
          manifest = json.loads(r'''[{"path":"scripts/lib/gnome_installer_driver.py","size":27503,"sha256":"9d1112f18442d8cfcc7a43ec1b091ea247e6a6dcc5c7bd072aa7f955883fbb5a"},{"path":"tests/test_gnome_installer_driver.py","size":31418,"sha256":"2f77a102b4deca7a5a005da1adc9fdf564583916be85efb4b47b462e2ff78646"},{"path":"tests/ocr/gnome_summary_capture.py","size":4216,"sha256":"500b2f4bb0b7d0860f20da3ec1c882541c9408b13dfe74aeccab2c4f58e151c7"},{"path":"tests/fixtures/gnome-installer/button39897665901.json","size":5211,"sha256":"478f827159b3606101a09dd666ffac06a1c428ba61e8ca1f5541708c1b52f5e1"},{"path":"tests/fixtures/gnome-installer/summary39891435048.json","size":27967,"sha256":"757e03e0ae519b0ffdc7c423581927a8ab0417c36c63b04389fb6fbdff6161dd"},{"path":".github/workflows/test.yml","size":14832,"sha256":"cd61704c26cfac20f5ada721cd5440ddb55be79637331f02d240455e39ee7c23"},{"path":"tests/fixtures/gnome-installer/run39619460539.json","size":12428,"sha256":"bdcd6173de2d55e2441330e58e73675c690084a1178c2d4e961a12d30a9382b7"},{"path":"tests/fixtures/gnome-installer/run39647418167.json","size":2517,"sha256":"e89c5ba91d662e1748be339fccd6924dbfa9d6ba2cf16a38413bf0462e7b782f"},{"path":"tests/fixtures/gnome-installer/summary39891435048-plain.png","size":503734,"sha256":"03366a2b7d9a26c3d519a8c8ac9f92ee28041a1004b5dec969900886a46e00ab"},{"path":"tests/fixtures/gnome-installer/summary39891435048-luks.png","size":503382,"sha256":"3ab8f7680f15673308aa0ecd9562fc4f0293ad7d439a68d3be0971a5683867ff"},{"path":"tests/fixtures/gnome-installer/summary39897665901-plain.png","size":503622,"sha256":"a4fbaa61eaea3c4770887ee3cece3610b5f13e0def77d8eb27aac835c81249e3"},{"path":"tests/fixtures/gnome-installer/summary39897665901-luks.png","size":503809,"sha256":"0199885943d43721a26a7e00caa15cb0565d359a48156de21183cf3617cac405"},{"path":"scripts/iso-e2e.sh","size":223112,"sha256":"c7ae491632858c4eb16f2f328f4120095ed679fbf272c5af7ca7236a7b88b98e"},{"path":"scripts/installer-walkthrough.py","size":48143,"sha256":"1bb1b733171ebd7a99f177a9f965b71653a5687bd33995a28746685af5e72579"}]''')
          target = pathlib.Path(tempfile.mkdtemp(prefix='iso-reviewed-preflight-', dir=os.environ['RUNNER_TEMP']))
          for item in manifest:
              relative = pathlib.PurePosixPath(item['path'])
              if relative.is_absolute() or '..' in relative.parts:
                  raise SystemExit('invalid fixed preflight path')
              path = source.joinpath(*relative.parts)
              if any(parent.is_symlink() for parent in (path, *path.parents)):
                  raise SystemExit('preflight input symlink rejected')
              if not path.is_file() or path.stat().st_size != item['size']:
                  raise SystemExit('preflight input size mismatch')
              content = path.read_bytes()
              if hashlib.sha256(content).hexdigest() != item['sha256']:
                  raise SystemExit('preflight input digest mismatch')
              output = target.joinpath(*relative.parts)
              output.parent.mkdir(parents=True, exist_ok=True)
              output.write_bytes(content)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('ISO_PREFLIGHT_ROOT=' + str(target) + '\n')
          print('Verified and staged 14 fixed reviewed inputs; no guest input or installation.')
          
          PY
      - name: Test all pre-submit guards and local transport regressions
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          cd "$ISO_PREFLIGHT_ROOT"
          python3 -m pytest -q tests/ocr/gnome_summary_capture.py tests/test_gnome_installer_driver.py
