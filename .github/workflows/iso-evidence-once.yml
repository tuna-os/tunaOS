name: One-time ISO evidence analysis
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/iso-evidence-once.yml'
permissions: {}
jobs:
  analyze:
    if: github.repository == 'tuna-os/tunaOS' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Install the same OCR package versions as the retained native run
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            imagemagick=8:6.9.12.98+dfsg1-5.2build2 \
            imagemagick-6.q16=8:6.9.12.98+dfsg1-5.2build2 \
            tesseract-ocr=5.3.4-1build5 libtesseract5=5.3.4-1build5 \
            tesseract-ocr-eng=1:4.1.0-2 tesseract-ocr-osd=1:4.1.0-2
          dpkg-query -W imagemagick imagemagick-6.q16 tesseract-ocr libtesseract5 tesseract-ocr-eng tesseract-ocr-osd
      - name: Read pinned retained diagnostics without executing artifact content
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARCHIVE="$(mktemp)"
          export ARCHIVE
          trap 'rm -f "$ARCHIVE"' EXIT
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            --max-time 120 --max-filesize 16777216 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -o "$ARCHIVE" \
            https://api.github.com/repos/tuna-os/tunaOS/actions/artifacts/12479231151/zip
          unset GH_TOKEN
          python3 - <<'PY'
          import csv
          import subprocess
          import tempfile
          import base64
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import zipfile
          import struct

          archive = Path(os.environ["ARCHIVE"]).read_bytes()
          expected = "dd6845664fef36f0c19db45fa8cd6ff464c3a8cd5c896c07cf0447dc2a93d9e7"
          if len(archive) != 5296912 or hashlib.sha256(archive).hexdigest() != expected:
              raise SystemExit("pinned archive size or digest mismatch")
          allowed = frozenset(("unknown", "welcome", "encryption", "disk", "summary",
                               "progress", "done", "overview", "failed", "no-disk", "recovery"))
          def state(value):
              return value if isinstance(value, str) and value in allowed else "invalid"
          with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
              members = bundle.infolist()
              if len(members) > 256:
                  raise SystemExit("archive member bound exceeded")
              for mode in ("plain", "luks"):
                  name = f"iso-e2e-out/strict-diagnostics/walkthrough-{mode}/walkthrough-gnome.json"
                  matches = [entry for entry in members if entry.filename == name]
                  if len(matches) != 1 or matches[0].file_size > 1024 * 1024:
                      raise SystemExit("expected bounded diagnostic member absent or ambiguous")
                  with bundle.open(matches[0]) as source:
                      raw = source.read(1024 * 1024 + 1)
                  if len(raw) > 1024 * 1024:
                      raise SystemExit("diagnostic member exceeded byte bound")
                  value = json.loads(raw)
                  if not isinstance(value, dict):
                      raise SystemExit("diagnostic must be an object")
                  frames, transitions = value.get("frames"), value.get("transitions")
                  if (not isinstance(frames, list) or len(frames) > 128
                          or not isinstance(transitions, list) or len(transitions) > 128):
                      raise SystemExit("invalid diagnostic sequence bounds")
                  result = {"mode": mode,
                            "states": [state(frame.get("state")) if isinstance(frame, dict)
                                       else "invalid" for frame in frames],
                            "transitions": [state(item) for item in transitions]}
                  for key in ("frontmost", "submitted", "accepted", "completed"):
                      item = value.get(key)
                      result[key] = item if type(item) is bool else None
                  print("Retained GNOME observations: " + json.dumps(result, sort_keys=True))
                  for index in ((6,) if mode == "plain" else (8,)):
                      frame = frames[index] if len(frames) > index else None
                      filename = f"walkthrough-gnome-{index:02d}.png"
                      if (not isinstance(frame, dict) or frame.get("state") != "summary"
                              or frame.get("file") != filename):
                          raise SystemExit("selected frame identity or summary state mismatch")
                      image_name = f"iso-e2e-out/strict-diagnostics/walkthrough-{mode}/{filename}"
                      images = [entry for entry in members if entry.filename == image_name]
                      if len(images) != 1 or images[0].file_size > 1024 * 1024:
                          raise SystemExit("expected bounded PNG absent or ambiguous")
                      with bundle.open(images[0]) as source:
                          png = source.read(1024 * 1024 + 1)
                      if (len(png) > 1024 * 1024 or len(png) < 33
                              or png[:8] != b"\x89PNG\r\n\x1a\n"
                              or png[8:16] != b"\x00\x00\x00\x0dIHDR"):
                          raise SystemExit("invalid bounded PNG header")
                      width, height = struct.unpack("!II", png[16:24])
                      if not (640 <= width <= 1920 and 480 <= height <= 1200):
                          raise SystemExit("PNG dimensions outside driver bounds")
                      print(f"ISO_PNG_META {mode} {index:02d} {width} {height} "
                            f"{len(png)} {hashlib.sha256(png).hexdigest()}")
                      encoded = base64.b64encode(png).decode("ascii")
                      for offset in range(0, len(encoded), 4096):
                          print(f"ISO_PNG {mode} {index:02d} {offset // 4096} "
                                + encoded[offset:offset + 4096])

                      if (width, height) != (1280, 800):
                          raise SystemExit("button diagnostic requires measured framebuffer")
                      for variant in ("button-interior-inverted",):
                          with tempfile.TemporaryDirectory() as directory:
                              original = Path(directory) / "frame.png"
                              prepared = Path(directory) / "prepared.png"
                              original.write_bytes(png)
                              rgb = subprocess.run(
                                  ["convert", str(original), "-depth", "8", "rgb:-"],
                                  capture_output=True, timeout=20, check=True).stdout
                              if len(rgb) != width * height * 3:
                                  raise SystemExit("invalid bounded original pixel buffer")
                              points = ((610, 594), (670, 594), (640, 580), (640, 608),
                                        (580, 594), (700, 594), (640, 568), (640, 620))
                              pixels = [{"point": [x, y],
                                         "rgb": list(rgb[(y*width+x)*3:(y*width+x)*3+3])}
                                        for x, y in points]
                              print("ISO_BUTTON_PIXELS " + json.dumps(
                                  {"mode": mode, "index": index, "pixels": pixels},
                                  sort_keys=True))
                              # Modern Tesseract expects dark text on a light background.
                              # The verified white label lies within this purple-only interior.
                              args = ["-crop", "70x30+605+579", "+repage", "-resize",
                                      "300%", "-colorspace", "gray", "-negate"]
                              subprocess.run(["convert", str(original), *args, str(prepared)],
                                             capture_output=True, timeout=20, check=True)
                              result = subprocess.run(
                                  ["tesseract", str(prepared), "stdout", "--psm",
                                   "7", "tsv"],
                                  capture_output=True, text=True, timeout=30, check=True)
                          if len(result.stdout) > 1024 * 1024:
                              raise SystemExit("OCR output exceeded byte bound")
                          words = []
                          numeric_fields = ("level", "page_num", "block_num", "par_num",
                                            "line_num", "word_num", "left", "top",
                                            "width", "height")
                          for word in csv.DictReader(io.StringIO(result.stdout), delimiter="\t"):
                              if word.get("level") != "5" or not word.get("text", "").strip():
                                  continue
                              numeric = {key: int(word[key]) for key in numeric_fields}
                              if any(not 0 <= item <= 10000 for item in numeric.values()):
                                  raise SystemExit("OCR numeric field outside bound")
                              x, y, w, h = (numeric[key] for key in ("left", "top", "width", "height"))
                              inside = 0 <= x < x+w <= 210 and 0 <= y < y+h <= 90
                              if not inside:
                                  continue
                              confidence = float(word["conf"])
                              if not -1 <= confidence <= 100:
                                  raise SystemExit("OCR confidence outside bound")
                              token = word["text"]
                              if len(token) > 80 or len(words) >= 16:
                                  raise SystemExit("button token bound exceeded")
                              words.append({**numeric, "conf": confidence,
                                            "text": "Install" if token == "Install" else "[redacted]",
                                            "redacted": token != "Install", "token_length": len(token)})
                          print("ISO_BUTTON_OCR " + json.dumps(
                              {"mode": mode, "index": index, "variant": variant,
                               "png_sha256": hashlib.sha256(png).hexdigest(), "words": words},
                              ensure_ascii=True, sort_keys=True))
          print("Artifact 12479231151, run 39897665901, source 2d9072db.")
          print("Observations only; not input delivery or installation qualification.")
          PY
