name: ISO coverage contracts
on:
  pull_request:
    paths:
      - '.github/workflows/iso-coverage-*.yml'
      - '.github/workflows/luks-e2e.yml'
      - 'scripts/*iso-coverage*'
      - 'scripts/lib/iso_coverage_*.py'
      - 'scripts/iso-e2e.sh'
      - 'tests/test_iso_coverage_*.py'
      - 'tunaos.toml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install test-only dependencies
        run: python -m pip install pytest PyYAML
      - name: Verify inventory, receipts, API transport, schedule, and producer contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pytest -q tests/test_iso_coverage_*.py \
            tests/test_workflow_expressions_parse.py tests/test_workflow_conditions_name_real_inputs.py \
            tests/test_ci_lanes.py
          bash -n scripts/iso-e2e.sh scripts/iso-coverage-canary.sh
