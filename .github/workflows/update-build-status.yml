name: Update README build status

on:
  workflow_dispatch:
  schedule:
    # Nightly variant builds start around 04:00 UTC and can take several hours.
    - cron: '30 13 * * *'

permissions:
  actions: read
  contents: write
  # Needed to open the refresh PR; `main` only accepts merge-queue changes.
  pull-requests: write

concurrency:
  group: update-readme-build-status
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Install yq
        run: |
          sudo wget -qO /usr/bin/yq https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64
          sudo chmod +x /usr/bin/yq

      - name: Refresh build status table
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/update-build-status.sh

      # `main` is protected by a "changes must be made through the merge queue"
      # rule, so the direct `git push` this used to do was rejected every
      # single night:
      #
      #   remote: - Changes must be made through the merge queue
      #   ! [remote rejected] main -> main (push declined due to repository
      #     rule violations)
      #
      # The table regenerated correctly and then could not land, so the README
      # snapshot froze at its last hand-merged state -- every row still dated
      # 2026-07-14/15 a month later, reporting variants as blocked that had
      # since been fixed and vice versa. The job did fail loudly, but nobody
      # reads a scheduled docs job's status; what people read is the table,
      # and a stale table is worse than a missing one because nobody doubts it.
      #
      # Push a branch and open a PR instead, which the merge queue accepts.
      # This is the same fix matrix-status.yml already carries for
      # docs/MATRIX-STATUS.md, which hit this rule first.
      #
      # Note there is deliberately no `[skip ci]` in the commit message any
      # more: it was harmless on a direct push, but on a queued PR it would
      # suppress the required checks the queue is waiting for, and the refresh
      # would sit open forever.
      - name: Open a PR with the refreshed snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: automation/readme-build-status
          MAX_RETRIES: 3
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo 'Build status is unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # One long-lived branch, force-pushed: the table is fully generated,
          # so each refresh supersedes the last and stacking commits would only
          # add noise. Reusing the name also keeps this to a single open PR
          # instead of one per day.
          git checkout -b "$BRANCH"
          git add README.md
          git commit -m "docs: refresh build matrix status ($(date -u +%Y-%m-%d))"

          # Retried with linear backoff, same idiom as the GHCR push retry in
          # reusable-build-image.yml: the 2026-08-13 13:30 UTC run died on a
          # single unretried attempt hitting a transient GitHub 500 --
          #   remote: Internal Server Error
          #   ! [remote rejected] automation/readme-build-status ->
          #     automation/readme-build-status (Internal Server Error)
          # -- which froze the table exactly the way the merge-queue rejection
          # did before this workflow started opening a PR at all. One flaky
          # push should not cost the whole refresh.
          push_ok=0
          for i in $(seq "${MAX_RETRIES}"); do
            if git push --force origin "$BRANCH"; then
              push_ok=1
              break
            fi
            echo "::warning::git push failed (attempt ${i}/${MAX_RETRIES}); retrying..."
            sleep $((5 * i))
          done
          if [[ "$push_ok" -ne 1 ]]; then
            echo "::error::git push failed after ${MAX_RETRIES} attempts"
            exit 1
          fi

          if [[ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]]; then
            gh pr create --base main --head "$BRANCH" \
              --title 'docs: refresh build matrix status' \
              --body "$(printf '%s\n\n%s\n' \
                'Regenerated by `.github/scripts/update-build-status.sh` from the latest completed main-branch build of each variant.' \
                'Force-updated in place by the `Update README build status` workflow, so this branch always holds the newest snapshot.')"
          else
            echo "PR already open for $BRANCH -- force-push refreshed it."
          fi

          # Arm auto-merge so the snapshot lands without a human — same
          # mechanism and rationale as matrix-status.yml: bot-opened PRs
          # trigger no pull_request checks, but the merge queue runs its
          # required checks on the merge group itself, so arming is all the
          # PR needs to enqueue and merge. Re-armed every refresh because a
          # merge clears it.
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [[ -n "$pr" ]]; then
            gh pr merge --auto --merge "$pr" ||
              echo "::warning::could not arm auto-merge on #$pr — the refresh will wait for a human"
          fi

