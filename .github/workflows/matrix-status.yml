# Regenerate docs/MATRIX-STATUS.md from the actual state of CI.
#
# The document exists so that "never tested" is distinguishable from "passing".
# Maintaining it by hand defeats that: a stale status page asserts things that
# stopped being true, which is the same failure it was written to prevent. So
# it regenerates daily and pushes only when a cell actually moved — which makes
# the file's git history a record of when each combination flipped.
name: Matrix Status

on:
  schedule:
    # 06:00 UTC — after the nightly image builds settle, before the working day.
    - cron: "0 6 * * *"
  workflow_dispatch:
  pull_request:
    # Drift check only (no push): catches a hand-edit inside the generated
    # block, and catches the generator breaking on a build-config change.
    paths:
      - "scripts/gen-matrix-status.py"
      - ".github/build-config.yml"
      - "docs/MATRIX-STATUS.md"

permissions:
  contents: write
  # Needed to open the refresh PR; `main` only accepts merge-queue changes.
  pull-requests: write

concurrency:
  group: matrix-status
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install deps
        run: pip install --quiet pyyaml

      - name: Regenerate
        env:
          # gh needs a token; the default one can read Actions runs in-repo.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # No `|| true`: if the API is unreachable the script raises and this
          # job fails loudly. Silently rewriting cells to "never tested" would
          # be worse than not updating at all.
          ./scripts/gen-matrix-status.py

      # This used to be `git diff --quiet -- docs/MATRIX-STATUS.md` after the
      # regeneration above, i.e. "the committed document must equal a fresh
      # one". It cannot. The block is a function of build-config.yml AND of the
      # last RUN_DEPTH runs of two workflows, and only the first is in the
      # repo: runs 31089215592 and 31089333089, two minutes apart on the same
      # tree, regenerated "7 of 53" and "8 of 53" respectively, because one
      # single-cell LUKS rerun both lands its own result and pushes the oldest
      # full sweep out of the window.
      #
      # So the check went red on every PR that touched build-config.yml, and
      # committing a regeneration did not fix it — the next LUKS run, minutes
      # later, made the committed copy wrong again. #1020 and #1021 were both
      # failing it simultaneously with nothing wrong in either.
      #
      # Content freshness is the nightly refresh PR's job (below), which is why
      # it exists. What a PR can be held to is the *shape*: sections, prose,
      # table headers, the do-not-edit notice — everything the generator
      # writes from the repo rather than from the API. That is what the PR
      # check was for ("catches a hand-edit inside the generated block") and
      # `--shape` is what makes it checkable.
      - name: Fail on hand-edits inside the generated block (pull_request only)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          # HEAD is the PR merge commit, so this is the document as committed,
          # before the regeneration step above overwrote the working tree.
          git show HEAD:docs/MATRIX-STATUS.md > /tmp/committed.md
          ./scripts/gen-matrix-status.py --shape /tmp/committed.md > /tmp/committed.shape
          ./scripts/gen-matrix-status.py --shape docs/MATRIX-STATUS.md > /tmp/fresh.shape
          if ! diff -u /tmp/committed.shape /tmp/fresh.shape; then
            echo "::error::docs/MATRIX-STATUS.md's generated block was"
            echo "::error::hand-edited, or the generator's own prose changed."
            echo "::error::Run scripts/gen-matrix-status.py and commit it."
            exit 1
          fi
          echo "MATRIX-STATUS.md's generated block is machine-shaped"

      # `main` is protected by a "changes must be made through the merge queue"
      # rule, so the direct `git push origin HEAD:main` this used to do was
      # rejected every single time a cell moved:
      #
      #   remote: error: GH013: Repository rule violations found
      #   remote: - Changes must be made through the merge queue
      #   ! [remote rejected] HEAD -> main
      #
      # The job still exited 1 *after* regenerating correctly, so the failure
      # looked like a generator bug while the real symptom was silent: the
      # scoreboard froze at its last hand-merged state and drifted for a day
      # (LUKS read 5 of 48 while 14 of 48 cells were actually green). A stale
      # source of truth is worse than a missing one, because nobody doubts it.
      #
      # So push a branch and open a PR, which the merge queue accepts.
      - name: Open a PR with the refreshed status
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: automation/matrix-status
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/MATRIX-STATUS.md; then
            echo "No cells moved — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          # One long-lived branch, force-pushed: the doc is fully generated, so
          # each refresh supersedes the last and stacking commits would only
          # add noise. Reusing the name also keeps this to a single open PR
          # instead of one per day.
          git checkout -b "$BRANCH"
          git add docs/MATRIX-STATUS.md
          git commit -m "docs: refresh matrix status ($(date -u +%Y-%m-%d))"
          git push --force origin "$BRANCH"

          if [[ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]]; then
            gh pr create --base main --head "$BRANCH" \
              --title "docs: refresh matrix status" \
              --body "$(printf '%s\n\n%s\n' \
                'Regenerated by `scripts/gen-matrix-status.py`. Cells moved since the last refresh.' \
                'Force-updated in place by the `Matrix Status` workflow, so this branch always holds the newest regeneration.')"
          else
            echo "PR already open for $BRANCH — force-push refreshed it."
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Matrix status"
            echo
            sed -n '/BEGIN GENERATED/,/END GENERATED/p' \
              docs/MATRIX-STATUS.md \
              | grep -E '^\*\*|^NVIDIA|^Missing' || true
          } >> "$GITHUB_STEP_SUMMARY"
