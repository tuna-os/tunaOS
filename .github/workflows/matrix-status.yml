# Regenerate docs/MATRIX-STATUS.md from the actual state of CI.
#
# The document exists so that "never tested" is distinguishable from "passing".
# Maintaining it by hand defeats that: a stale status page asserts things that
# stopped being true, which is the same failure it was written to prevent. So
# it regenerates daily and pushes only when a cell actually moved — which makes
# the file's git history a record of when each combination flipped.
name: Matrix Status

on:
  schedule:
    # 06:00 UTC — after the nightly image builds settle, before the working day.
    - cron: "0 6 * * *"
  workflow_dispatch:
  pull_request:
    # Drift check only (no push): catches a hand-edit inside the generated
    # block, and catches the generator breaking on a build-config change.
    paths:
      - "scripts/gen-matrix-status.py"
      - "scripts/gen-build-health.py"
      - "scripts/contracts/**"
      - "image-versions.yaml"
      - ".github/build-config.yml"
      - "docs/MATRIX-STATUS.md"
      - "docs/BUILD-HEALTH.md"
      - "docs/build-health.json"

permissions:
  contents: write
  # Needed to open the refresh PR; `main` only accepts merge-queue changes.
  pull-requests: write
  # gen-matrix-status.py's Desktop Contract Sweep section (tunaOS#858) reads
  # desktop-contract-sweep.yml's `desktop-contract-baseline` artifact via
  # `gh run download` — a cross-run artifact fetch, unlike the `gh run
  # list`/`run view --json jobs` calls the LUKS/installer-smoke sections
  # already made, which return run/job metadata rather than artifact
  # contents. Listing an explicit `permissions:` block restricts every
  # unlisted scope to none, and GitHub's own docs gate artifact download
  # specifically behind `actions: read` — without this, the `pull_request`
  # drift check below (which regenerates the whole document, including this
  # section, before masking the volatile parts) would fail on that call
  # alone, on every PR, regardless of what it actually changed.
  actions: read

concurrency:
  group: matrix-status
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install deps
        run: |
          python - <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path
          text = Path("image-versions.yaml").read_text()
          packages = []
          for name in ("PyYAML", "jsonschema"):
              matches = re.findall(r'^  ' + re.escape(name) + r': "([0-9.]+)"$', text, re.M)
              if len(matches) != 1:
                  raise ValueError("missing or ambiguous central dependency pin")
              packages.append(f"{name}=={matches[0]}")
          subprocess.run([sys.executable, "-m", "pip", "install", *packages], check=True)
          PY

      - name: Observe required target health
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api_version=$(python -c 'import yaml; print(yaml.safe_load(open("image-versions.yaml"))["github_api_version"])')
          python scripts/gen-build-health.py \
            --source-revision "$GITHUB_SHA" --api-version "$api_version" \
            --output docs/build-health.json --markdown docs/BUILD-HEALTH.md

      - name: Retain observed target health
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matrix-build-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs/build-health.json
            docs/BUILD-HEALTH.md
          if-no-files-found: error

      - name: Regenerate
        if: github.event_name != 'pull_request'
        env:
          # gh needs a token; the default one can read Actions runs in-repo.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # No `|| true`: if the API is unreachable the script raises and this
          # job fails loudly. Silently rewriting cells to "never tested" would
          # be worse than not updating at all.
          ./scripts/gen-matrix-status.py

      # Byte-exact drift is enforced on the scheduled run (which pushes the
      # refresh PR), NOT here: the cells, tallies and provenance rows are a
      # readout of repo-wide CI state, so any LUKS run completing during review
      # turned this gate red for something the PR neither caused nor could fix,
      # and the only available "fix" was committing a snapshot that went stale
      # again within minutes. --check-structure still runs the generator against
      # the PR's build-config — so a broken generator or a hand-edit inside the
      # generated block fails exactly as before — while masking values that only
      # live CI can move.
      - name: Check generated block (pull_request only)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/gen-matrix-status.py --check-structure

      # `main` is protected by a "changes must be made through the merge queue"
      # rule, so the direct `git push origin HEAD:main` this used to do was
      # rejected every single time a cell moved:
      #
      #   remote: error: GH013: Repository rule violations found
      #   remote: - Changes must be made through the merge queue
      #   ! [remote rejected] HEAD -> main
      #
      # The job still exited 1 *after* regenerating correctly, so the failure
      # looked like a generator bug while the real symptom was silent: the
      # scoreboard froze at its last hand-merged state and drifted for a day
      # (LUKS read 5 of 48 while 14 of 48 cells were actually green). A stale
      # source of truth is worse than a missing one, because nobody doubts it.
      #
      # So push a branch and open a PR, which the merge queue accepts.
      - name: Open a PR with the refreshed status
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: automation/matrix-status
        run: |
          set -euo pipefail
          git add docs/MATRIX-STATUS.md docs/matrix-provenance.json docs/BUILD-HEALTH.md docs/build-health.json
          if git diff --cached --quiet; then
            echo "No cells moved — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          # One long-lived branch, force-pushed: the doc is fully generated, so
          # each refresh supersedes the last and stacking commits would only
          # add noise. Reusing the name also keeps this to a single open PR
          # instead of one per day.
          git checkout -b "$BRANCH"
          git commit -m "docs: refresh matrix status ($(date -u +%Y-%m-%d))"
          git push --force origin "$BRANCH"

          if [[ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]]; then
            gh pr create --base main --head "$BRANCH" \
              --title "docs: refresh matrix status" \
              --body "$(printf '%s\n\n%s\n' \
                'Regenerated by `scripts/gen-matrix-status.py`. Cells moved since the last refresh.' \
                'Force-updated in place by the `Matrix Status` workflow, so this branch always holds the newest regeneration.')"
          else
            echo "PR already open for $BRANCH — force-push refreshed it."
          fi

          # Arm auto-merge so the refresh lands without a human. A PR opened
          # with the Actions token triggers no pull_request workflows, so its
          # own checks sit at "Expected" forever and the PR reads as waiting
          # for approval — but this repo merges through a MERGE QUEUE, and
          # the queue runs its required checks itself on the merge group
          # (queue-initiated, so the bot-token workflow-trigger limitation
          # does not apply there). Arming auto-merge is therefore sufficient:
          # the PR enqueues immediately, the group checks run, and the
          # refresh merges — measured on every auto-merged PR of 2026-08-18,
          # each of which enqueued before its PR-level checks finished.
          # Re-armed on every refresh because a merge clears auto-merge and
          # the next refresh opens a fresh PR.
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [[ -n "$pr" ]]; then
            gh pr merge --auto --merge "$pr" ||
              echo "::warning::could not arm auto-merge on #$pr — the refresh will wait for a human"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Matrix status"
            echo
            sed -n '/BEGIN GENERATED/,/END GENERATED/p' \
              docs/MATRIX-STATUS.md \
              | grep -E '^\*\*|^NVIDIA|^Missing' || true
          } >> "$GITHUB_STEP_SUMMARY"
