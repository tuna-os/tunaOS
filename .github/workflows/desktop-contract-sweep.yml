# Desktop contract sweep — establish and maintain the per-cell baseline.
#
# Runs build_scripts/checks/verify-desktop-experience.sh against every
# PUBLISHED variant x desktop image and records one result per cell. The
# contract gate runs at build time, but it only ever ran on the artifact being
# built — never against what is actually published, which is how sailfin:gnome
# (no file manager), sailfin:xfce (no display manager enabled) and
# flounder:niri (no compositor at all) all shipped green.
#
# Four outcomes, deliberately distinct — "never tested" must never look like
# "passing", and infrastructure trouble must never look like a broken desktop:
#   pass     the image exists and satisfies the contract
#   fail     the image exists and does NOT satisfy it (reason recorded)
#   missing  no such published image — NOT a pass and NOT a fail
#   error    the pull or the runner failed — the cell is still UNTESTED
#
# Heavy work belongs on runners, not in a session: each cell pulls a multi-GB
# image, so this is one job per cell with a bounded fan-out.
name: Desktop Contract Sweep

on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'Only sweep cells matching this substring (e.g. "sailfin" or ":kde"). Empty = all.'
        default: ''
        type: string
  schedule:
    # After the nightly variant builds, so it reads the freshest images.
    - cron: "0 8 * * *"

concurrency:
  group: desktop-contract-sweep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  generate_matrix:
    name: cells
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.cells.outputs.matrix }}
      count: ${{ steps.cells.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: cells
        shell: bash
        env:
          FILTER: ${{ inputs.filter }}
        run: |
          set -euo pipefail
          # Derive cells from build-config so the sweep cannot drift from what
          # the factory actually declares. Base desktops only: the -hwe,
          # -nvidia, -asahi, -cachyos and -zfs variants are the same desktop
          # on different hardware and would triple the matrix without testing
          # a different contract.
          #
          # Filtering happens in jq, not yq: yq's `EXPR1 as $v | EXPR2`
          # still emits one row for a $v binding whose EXPR2 matches
          # nothing, with $v bound but the rest of the row empty — jq's
          # `|` has no such quirk, an empty generator produces zero rows.
          # gurnard ships only base+pantheon (no gnome/kde/niri/xfce/cosmic
          # flavor), so it hit exactly this: every sweep produced a stray
          # "gurnard:" cell (variant, empty desktop) that failed
          # evidence-bundle.sh's `invalid cell` check and then failed
          # collate's baseline reconciliation too.
          cells=$(yq -o=json '.' .github/build-config.yml | jq -c '
              [.variants[] | .id as $v | .flavors[]
                | select(.build_image == true)
                | select(.id | test("^(gnome|kde|niri|xfce|cosmic)$"))
                | {variant: $v, desktop: .id}]')
          if [[ -n "$FILTER" ]]; then
            cells=$(jq -c --arg f "$FILTER" \
              '[.[] | select("\(.variant):\(.desktop)" | contains($f))]' <<<"$cells")
          fi
          echo "matrix=$(jq -c '{include: .}' <<<"$cells")" >> "$GITHUB_OUTPUT"
          echo "count=$(jq 'length' <<<"$cells")" >> "$GITHUB_OUTPUT"
          jq -r '.[] | "\(.variant):\(.desktop)"' <<<"$cells"

  sweep:
    name: "${{ matrix.variant }}:${{ matrix.desktop }}"
    needs: generate_matrix
    if: fromJson(needs.generate_matrix.outputs.matrix).include[0]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Bounded so the sweep does not starve the build workflows of runners.
      max-parallel: 8
      matrix: ${{ fromJson(needs.generate_matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Run the contract against the published image
        id: check
        shell: bash
        env:
          REF: ghcr.io/tuna-os/${{ matrix.variant }}:${{ matrix.desktop }}
          CELL: ${{ matrix.variant }}:${{ matrix.desktop }}
        run: |
          # `set +e` EXPLICITLY, and it is load-bearing. GitHub launches this
          # step as `bash --noprofile --norc -e -o pipefail`, so -e is already
          # on before the first line runs, and `set -uo pipefail` does NOT
          # clear it. The previous version said "NOT -e" in a comment and ran
          # with -e anyway: the contract's own non-zero exit killed the step
          # before `exitcode=$?`, so result.json was never written and the
          # failing cell vanished from the baseline instead of counting as a
          # failure. Sweep 30627663051 reported "40/43 pass, 0 fail" while
          # seven cells had genuinely failed.
          set +e
          set -uo pipefail   # a contract failure is data, not an error
          # Do NOT apt-install podman on a runner that already ships one under
          # /usr/local — mixing it with Ubuntu's produces
          # "crun: unknown version specified" (see reusable-build-image.yml).
          if ! sudo sh -c 'command -v podman' >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq podman
          fi

          status=missing; exitcode=""; reason="no published image"
          omissions_status=untested; omissions_reason="image not read"
          # Existence check WITHOUT pulling: a cell with no image is untested,
          # not failing, and must not cost a multi-GB download to discover.
          #
          # RETRY, and do not let a transient registry error masquerade as
          # "no such image". A single un-retried inspect failure wrongly marked
          # flounder:cosmic, flounder:gnome and marlin:gnome as unpublished in
          # the first baseline sweep; two of those actually PASS and one is a
          # real shipped-image bug. "Never tested" is only honest when the
          # probe actually succeeded in saying so.
          exists=no
          for _try in 1 2 3; do
            if sudo podman manifest inspect "$REF" >/dev/null 2>&1 \
               || sudo podman image inspect "$REF" >/dev/null 2>&1 \
               || sudo skopeo inspect "docker://$REF" >/dev/null 2>&1; then
              exists=yes; break
            fi
            sleep $((_try * 5))
          done
          if [[ "$exists" == yes ]]; then
            # Pull as its own step. A registry/disk failure is an ERROR, not a
            # contract failure — folding the two together would report a
            # perfectly good desktop as broken, the same conflation this sweep
            # exists to prevent.
            if ! sudo podman pull -q "$REF" >/dev/null 2>&1; then
              status=error; reason="image exists but pull failed (infrastructure, not the contract)"
            else
              # IS_ELN and IS_HUMMINGBIRD, exactly as reusable-build-image.yml
              # passes them to this same script. Without them the sweep runs a
              # STRICTER contract than the build did, and fails images the
              # build deliberately passed. reusable-build-image.yml already
              # paid for this lesson on IS_ELN: wahoo's gnome, cosmic and kde
              # cells died on the ELN codec gap that the script is written to
              # name and allow, "nothing was wrong with the images" (run
              # 34609709028). That fix was never ported here, so the sweep has
              # gone on failing the same three cells for the same reason —
              # `ffmpeg cannot decode h264` in run 34692178123, all three.
              # Derived from the variant id, one line apart, so neither can
              # drift from the other or from the build job's pair.
              is_hb=false
              [[ "${{ matrix.variant }}" == hummingbird* ]] && is_hb=true
              is_eln=false
              [[ "${{ matrix.variant }}" == wahoo* ]] && is_eln=true

              out=$(sudo podman run --rm \
                -v "$PWD/build_scripts/checks/verify-desktop-experience.sh:/vde.sh:z" \
                -e IS_HUMMINGBIRD="$is_hb" \
                -e IS_ELN="$is_eln" \
                --entrypoint /bin/bash "$REF" /vde.sh "${{ matrix.desktop }}" 2>&1)
              exitcode=$?        # capture directly; `| tail` would mask it
              if [[ "$exitcode" -eq 0 ]]; then
                status=pass; reason="contract satisfied"
              else
                status=fail
                # The script has about twenty distinct failure lines and only
                # seven of them open with "missing required" or "missing unit".
                # Matching that prefix alone recorded a bare "exit 1" for 6 of
                # the 14 failing cells in run 34692178123 — every one of them
                # diagnosable only by opening the job log, which is the exact
                # habit this sweep exists to remove. So fall back to the last
                # line the script actually printed, skipping the diagnostic
                # dumps that follow a verdict (codec_diag) and the workflow
                # annotations that are not verdicts at all. On those 6 cells
                # that recovers "GNOME 49 is below the floor ...",
                # "ffmpeg cannot decode h264 ..." and "missing flatpak
                # preinstall declaration: org.mozilla.firefox".
                reason=$(grep -m1 -E "^missing (required|unit)" <<<"$out" \
                  || grep -vE "^(codec_diag:|::(warning|notice|error))" <<<"$out" \
                     | grep -vE "^[[:space:]]*$" | tail -1 \
                  || echo "exit ${exitcode}")
                reason=${reason:-exit ${exitcode}}
              fi
              echo "$out" | tail -40

              # The captured output itself, not just the line we managed to
              # parse out of it. A reason field is a best-effort summary; this
              # is the evidence, and "exit 1" with the output discarded is how
              # 6 cells stayed undiagnosable from the artifact.
              printf '%s\n' "$out" > desktop-contract.log

              # Same pulled image, second axis (green criterion 8,
              # no_silent_omissions): run the SAME gate the build runs
              # (checks/verify-package-wishlist.sh) against what was actually
              # published. The build-time gate covers new builds; this read
              # covers what users pull today — images published before the
              # gate existed, or through paths that bypass it. Reuses this
              # job's multi-GB pull instead of funding a second sweep.
              # IS_HUMMINGBIRD is mirrored from the build context: those
              # images skip the gate there, so they skip it here, for the
              # same recorded reason.
              is_hb=false
              [[ "${{ matrix.variant }}" == hummingbird* ]] && is_hb=true
              wl_out=$(sudo podman run --rm \
                -v "$PWD/build_scripts/checks/verify-package-wishlist.sh:/vpw.sh:z" \
                -v "$PWD/build_scripts/checks/package-miss-allowlist.txt:/allow.txt:z" \
                -e TUNAOS_WISHLIST_ALLOWLIST=/allow.txt \
                -e IS_HUMMINGBIRD="$is_hb" \
                --entrypoint /bin/bash "$REF" /vpw.sh 2>&1)
              wl_exit=$?
              if [[ "$wl_exit" -eq 0 ]]; then
                omissions_status=pass
              else
                omissions_status=fail
              fi
              omissions_reason=$(grep -m1 -E '^TUNAOS_WISHLIST_(OK|FAIL|SKIPPED)' <<<"$wl_out" \
                || echo "gate exited ${wl_exit} without its verdict line")
              echo "$wl_out" | tail -20
            fi
          fi

          echo "::notice title=${CELL}::${status} — ${reason}"
          jq -n --arg cell "$CELL" --arg variant "${{ matrix.variant }}" \
                --arg desktop "${{ matrix.desktop }}" --arg status "$status" \
                --arg reason "$reason" --arg exitcode "${exitcode:-}" \
                --arg om "$omissions_status" --arg omr "$omissions_reason" \
             '{cell:$cell,variant:$variant,desktop:$desktop,status:$status,reason:$reason,exit:$exitcode,omissions_status:$om,omissions_reason:$omr}' \
             > "result.json"

      - name: Collect evidence
        if: always()
        env:
          EVIDENCE_ARCH: amd64
        run: |
          scripts/evidence-bundle.sh \
            "${{ matrix.variant }}:${{ matrix.desktop }}" \
            desktop,no_silent_omissions .

      - name: Upload cell result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-${{ matrix.variant }}-${{ matrix.desktop }}
          path: |
            result.json
            desktop-contract.log
            evidence/${{ matrix.variant }}/${{ matrix.desktop }}/amd64/
          retention-days: 30
          if-no-files-found: warn

  collate:
    name: Baseline
    needs: [generate_matrix, sweep]
    if: always() && needs.generate_matrix.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: contract-*
          path: results
          merge-multiple: false
      - name: Build the baseline table
        shell: bash
        run: |
          set -euo pipefail
          # -not -path '*/evidence/*': each cell artifact ships result.json
          # TWICE — once at its root and once inside the evidence bundle — so
          # a bare -name match counted all 51 cells twice and the baseline
          # reported "72/102 pass" for a 51-cell sweep. The reconciliation
          # below cannot catch that: doubling both sides still balances, and
          # 102 == 102 held while every published number was twice its true
          # value. Take the root copy only.
          find results -name result.json -not -path '*/evidence/*' -exec cat {} + \
            | jq -s -c 'sort_by(.cell)' > found.json

          # ... and assert it directly, because the totals cannot. A cell
          # reported twice is a counting bug whichever way the arithmetic
          # lands, and this sweep's whole purpose is numbers that mean what
          # they say.
          dupes=$(jq -r 'group_by(.cell)[] | select(length > 1) | .[0].cell' found.json)
          if [[ -n "$dupes" ]]; then
            echo "::error::the same cell reported more than once: $(tr '\n' ' ' <<<"$dupes")"
            exit 1
          fi

          # RECONCILE against the dispatched matrix. A cell whose job died
          # before writing result.json used to be silently absent from this
          # table, and the totals were computed from what arrived rather than
          # from what was asked for — so seven genuinely failing cells read as
          # "0 fail" in sweep 30627663051. Absence of evidence was rendered as
          # evidence of absence, in the one file that is supposed to be
          # coverage truth.
          #
          # `lost` is its own status, distinct from fail and from missing: we
          # know the cell was dispatched and we do NOT know what it did.
          jq -c '[.include[] | {cell: (.variant + ":" + .desktop)}]' \
            <<<'${{ needs.generate_matrix.outputs.matrix }}' > expected.json
          jq -s -c '
            (.[0] | map(.cell)) as $got
            | .[0] + [ .[1][] | select(.cell as $c | $got | index($c) | not)
                       | {cell: .cell, variant: (.cell|split(":")[0]),
                          desktop: (.cell|split(":")[1]), status: "lost",
                          reason: "job produced no result (see its log)", exit: "",
                          omissions_status: "untested",
                          omissions_reason: "job produced no result"} ]
            | sort_by(.cell)' found.json expected.json > reconciled.json

          pass=$(jq '[.[]|select(.status=="pass")]|length' reconciled.json)
          fail=$(jq '[.[]|select(.status=="fail")]|length' reconciled.json)
          miss=$(jq '[.[]|select(.status=="missing")]|length' reconciled.json)
          err=$(jq '[.[]|select(.status=="error")]|length' reconciled.json)
          lost=$(jq '[.[]|select(.status=="lost")]|length' reconciled.json)
          total=$(jq 'length' reconciled.json)

          {
            echo "# Desktop contract baseline"
            echo
            echo "**${pass} / ${total} cells pass.** ${fail} fail, ${miss} have no published image, ${err} errored, ${lost} lost."
            echo
            echo "⬜ never tested (no image) — not a pass. ⚠️ infrastructure error, the cell is still untested."
            echo "❓ dispatched but reported nothing — also not a pass, and worth chasing: it means the job died."
            echo
            echo "| cell | result | reason |"
            echo "|---|:--:|---|"
            jq -r '.[] | "| \(.cell) | " +
              (if .status=="pass" then "✅"
               elif .status=="fail" then "❌"
               elif .status=="error" then "⚠️"
               elif .status=="lost" then "❓"
               else "⬜" end) +
              " | \(.reason) |"' reconciled.json
          } | tee -a "$GITHUB_STEP_SUMMARY" > baseline.md

          om_pass=$(jq '[.[]|select(.omissions_status=="pass")]|length' reconciled.json)
          om_fail=$(jq '[.[]|select(.omissions_status=="fail")]|length' reconciled.json)
          {
            echo
            echo "**Silent omissions (criterion 8): ${om_pass} clean, ${om_fail} shipping unallowlisted misses** (cells whose image was not read score untested, not clean)."
            if (( om_fail > 0 )); then
              echo
              echo "| cell | omissions |"
              echo "|---|---|"
              jq -r '.[] | select(.omissions_status=="fail")
                | "| \(.cell) | \(.omissions_reason) |"' reconciled.json
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY" >> baseline.md

          echo "DESKTOP CONTRACT BASELINE: ${pass}/${total} pass, ${fail} fail, ${miss} no image, ${err} error, ${lost} lost"

          # Every cell must be accounted for. If the reconciliation itself is
          # wrong the totals are meaningless, so fail loudly rather than
          # publish a table that quietly does not add up.
          if (( pass + fail + miss + err + lost != total )); then
            echo "::error::baseline does not reconcile: ${pass}+${fail}+${miss}+${err}+${lost} != ${total}"
            exit 1
          fi

          # Reconciled, so the measurements are trustworthy and may be
          # published. all.json exists ONLY past this point: downstream
          # readers treat its presence in the artifact as the assertion
          # that the table adds up, so an unreconciled sweep publishes
          # baseline.md alone and is skipped rather than half-believed.
          mv reconciled.json all.json

      # Unconditional, and BEFORE the gate below. The evidence and the verdict
      # are two different things, and coupling them cost the whole silent
      # omissions axis: the gate has tripped every night since 2026-09-09, the
      # upload was skipped with it, and gen-matrix-status.py — which reads
      # criterion 8 out of this artifact — found nothing to read, so all 51
      # desktop cells rendered untested. Not one of those 51 cell jobs had
      # failed; they had all measured their image and said so. A failing gate
      # is exactly when the per-cell measurements matter most, so publish them
      # and let the gate fail the run on its own.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: desktop-contract-baseline
          path: |
            all.json
            baseline.md
          retention-days: 90
          if-no-files-found: warn

      - name: Desktop completeness gate
        shell: bash
        run: |
          set -euo pipefail
          # A baseline is useful only when every expected cell is healthy.
          # Keep missing, infrastructure-error, and lost results non-passing:
          # otherwise a published edition can disappear from the evidence and
          # still look green to the release process (#1294).
          fail=$(jq '[.[]|select(.status=="fail")]|length' all.json)
          miss=$(jq '[.[]|select(.status=="missing")]|length' all.json)
          err=$(jq '[.[]|select(.status=="error")]|length' all.json)
          lost=$(jq '[.[]|select(.status=="lost")]|length' all.json)
          if (( fail + miss + err + lost > 0 )); then
            echo "::error::desktop completeness gate failed: ${fail} failed, ${miss} missing, ${err} errored, ${lost} lost"
            exit 1
          fi
          echo "desktop completeness gate passed: every dispatched cell reported pass"
