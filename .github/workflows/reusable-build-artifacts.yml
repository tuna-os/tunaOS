name: Artifacts
# Reusable ISO build + boot gate + publish for one {variant, flavor} cell.
#
# Ordering is the gate: the ISO is built, boot-verified in QEMU
# (scripts/iso-e2e.sh — serial marker with screenshot-sanity fallback), and
# only THEN uploaded to R2. A failed boot check fails the job and nothing is
# published; the ISO and e2e evidence are still uploaded as workflow
# artifacts for debugging.
on:
  workflow_call:
    inputs:
      variant:
        description: "Variant (yellowfin, albacore, skipjack, bonito, grouper)"
        required: true
        type: string
      flavor:
        description: "Flavor (gnome, kde, niri, xfce, gnome-nvidia, ...)"
        required: true
        type: string
      platform:
        description: >-
          Target platform (linux/amd64 or linux/arm64). Selects the runner
          arch (#1378) — this job builds and boots the ISO natively, no
          cross-arch emulation, so it must run on a host matching the image
          it's building.
        required: false
        type: string
        default: "linux/amd64"
      safeplatform:
        description: >-
          Filesystem/artifact-name-safe form of platform (e.g. linux-amd64).
          GitHub Actions expressions have no string-replace function, so this
          is computed by the caller (build-variant.yml already has it from
          its own matrix) rather than derived here.
        required: false
        type: string
        default: "linux-amd64"
      image-tag:
        description: "GHCR tag to build the ISO from (defaults to <flavor>-linux-amd64)"
        required: false
        type: string
        default: ""
      build-iso:
        description: "Build (and gate + publish) the live ISO"
        required: false
        type: boolean
        default: true
      upload-r2:
        description: "Publish the ISO to Cloudflare R2 after the boot gate passes"
        required: false
        type: boolean
        default: true
      attach-release:
        description: "Attach the ISO to a <flavor>-<date> GitHub Release after the boot gate passes"
        required: false
        type: boolean
        default: false
      capture-installer:
        description: "Also capture the installer walkthrough flow (screenshots ride the e2e artifact)"
        required: false
        type: boolean
        default: true
    secrets:
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
      R2_ENDPOINT:
        required: false
      R2_BUCKET:
        required: false

jobs:
  iso:
    name: "ISO ${{ inputs.variant }}:${{ inputs.flavor }}"
    if: inputs.build-iso
    runs-on: ${{ contains(inputs.platform, 'arm64') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 90
    # No explicit permissions: inherit the caller's grant. publish-isos.yml
    # grants contents:write (release attach); build-variant.yml grants only
    # read (attach-release is false there). A called workflow cannot request
    # more than its caller grants, so declaring write here would break the
    # build-variant callers.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reclaim ~25 GB of preinstalled toolchains from the main disk. The ISO is
      # assembled under .build/ on the workspace (main disk), not the
      # container-storage volume, so large desktop/NVIDIA ISOs can overflow it
      # during xorriso -commit ("Image size exceeds free space on media").
      # (Does not touch the node runtime / tool cache used by actions.)
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Maximize build space
        uses: ublue-os/container-storage-action@dc1f4c8f17b672069e921f001132f7cf98a423a6 # main as of 2026-02-11

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y just podman jq rclone golang-go git systemd-boot-efi mtools squashfs-tools xorriso dosfstools gdisk e2fsprogs btrfs-progs

      - name: Setup rootless podman (subuid/subgid for runner)
        run: |
          # tacklebox uses 'sudo -u runner podman unshare' for squashfs.
          # podman unshare needs subuid/subgid entries for the unprivileged user.
          if ! grep -q "^${USER}:" /etc/subuid 2>/dev/null; then
            echo "${USER}:100000:65536" | sudo tee -a /etc/subuid
          fi
          if ! grep -q "^${USER}:" /etc/subgid 2>/dev/null; then
            echo "${USER}:100000:65536" | sudo tee -a /etc/subgid
          fi

      - name: Build Live ISO
        env:
          VARIANT: ${{ inputs.variant }}
          FLAVOR: ${{ inputs.flavor }}
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          export TACKLEBOX_FROM_SOURCE=1
          TAG="${IMAGE_TAG:-${FLAVOR}-linux-amd64}"
          sudo -E bash ./scripts/build-iso-tacklebox.sh \
            "${VARIANT}" "${FLAVOR}" ghcr "${TAG}"

      # KNOWN GAP (#1378): qemu-system-x86 + ovmf are x86_64-specific, and
      # scripts/iso-e2e.sh itself only looks for qemu-system-x86_64 + OVMF
      # firmware — it has no qemu-system-aarch64/AAVMF path. This job now
      # runs on an arm64 runner for arm64 platforms (ISO build + tacklebox
      # need a native host, no cross-arch emulation), so the ISO build step
      # above should work — but THIS step and iso-e2e.sh's boot gate will
      # still fail on arm64 until they're taught the aarch64 QEMU/firmware
      # equivalents. Filed as a follow-up rather than guessed at here: real
      # aarch64 KVM boot behavior needs verifying on real CI, not assumed.
      - name: Install QEMU for boot verification
        env:
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          if [[ "$RUNNER_ARCH" == "ARM64" ]]; then
            sudo apt-get install -y qemu-system-arm qemu-efi-aarch64
          else
            sudo apt-get install -y qemu-system-x86 ovmf
          fi
          sudo apt-get install -y socat imagemagick qemu-utils sshpass python3-pip
          pip3 install --break-system-packages Pillow requests 2>/dev/null || pip3 install Pillow requests --user

      - name: "Boot gate: verify ISO readiness"
        id: e2e
        timeout-minutes: 25
        env:
          VARIANT: ${{ inputs.variant }}
          FLAVOR: ${{ inputs.flavor }}
        run: |
          ISO=$(find . -maxdepth 1 -name "*.iso" | head -1)
          echo "==> Running iso-e2e boot gate on $ISO"
          mkdir -p iso-e2e-out
          # Blocking: readiness marker OR screenshot-sanity fallback must
          # pass (iso-e2e.sh handles the serial-console-less kernels).
          sudo --preserve-env \
            ./scripts/iso-e2e.sh "$ISO" \
              --output iso-e2e-out \
              --timeout 900

      # The booted bytes are the signed bytes. Sign only after the QEMU gate
      # succeeds, then verify locally before either release backend sees them.
      # GitHub OIDC + Fulcio supplies an ephemeral identity: no key/password.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Checksum, sign, and verify ISO
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          ISO=$(find . -maxdepth 1 -name "*.iso" -print -quit)
          [[ -n "$ISO" ]] || { echo "::error::ISO not found"; exit 1; }
          CHECKSUM="${ISO}.sha256"
          BUNDLE="${ISO}.sigstore.json"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/reusable-build-artifacts.yml@${GITHUB_REF}"
          issuer="https://token.actions.githubusercontent.com"

          sha256sum "$(basename "$ISO")" > "$CHECKSUM"
          sha256sum --check --strict "$CHECKSUM"
          cosign sign-blob --bundle "$BUNDLE" "$ISO"
          cosign verify-blob "$ISO" \
            --bundle "$BUNDLE" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer"

      - name: Upload signed ISO artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iso-${{ inputs.variant }}-${{ inputs.flavor }}-${{ inputs.safeplatform }}
          path: |
            *.iso
            *.iso.sha256
            *.iso.sigstore.json
          if-no-files-found: error
          retention-days: 7

      # Installer-flow captures join the boot evidence so every visual the
      # pipeline can produce lands in ONE artifact (and, via the weekly
      # gallery jobs, in docs/SCREENSHOTS.md). Advisory: choreography drift
      # must never block a publish — it's evidence, not a gate.
      - name: Capture installer walkthrough
        if: inputs.capture-installer
        continue-on-error: true
        timeout-minutes: 20
        run: |
          ISO=$(find . -maxdepth 1 -name "*.iso" | head -1)
          sudo bash scripts/run-walkthrough.sh "$ISO" walkthrough-out || true
          sudo chown -R "$USER:$(id -gn)" walkthrough-out 2>/dev/null || true
          for png in walkthrough-out/*.png; do
            [[ -f "$png" ]] || continue
            cp "$png" "iso-e2e-out/installer_$(basename "$png")"
          done

      - name: Collect e2e evidence
        if: always()
        run: |
          sudo chown -R "$USER:$(id -gn)" iso-e2e-out 2>/dev/null || true
          for ppm in iso-e2e-out/*.ppm; do
            [[ -f "$ppm" ]] || continue
            convert "$ppm" "${ppm%.ppm}.png" || true
          done

      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-${{ inputs.variant }}-${{ inputs.flavor }}-${{ inputs.safeplatform }}
          path: |
            iso-e2e-out/serial.log
            iso-e2e-out/*.png
          if-no-files-found: warn
          retention-days: 7

      # Publish only runs if the boot gate above passed.
      - name: Upload ISO to Cloudflare R2
        if: inputs.upload-r2
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          VARIANT: ${{ inputs.variant }}
          FLAVOR: ${{ inputs.flavor }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          if [[ -z "${R2_BUCKET}" ]]; then
            echo "R2 secrets not configured — skipping publish"
            exit 0
          fi
          ISO=$(find . -maxdepth 1 -name "*.iso" | head -1)
          CHECKSUM="${ISO}.sha256"
          BUNDLE="${ISO}.sigstore.json"
          echo "==> Uploading $ISO to R2..."
          for artifact in "$ISO" "$CHECKSUM" "$BUNDLE"; do
            rclone copy --log-level INFO --checksum --s3-no-check-bucket \
              "$artifact" "R2:${R2_BUCKET}/live-isos/"
          done
          # amd64 keeps the bare <variant>-<flavor>-latest.iso name — that's a
          # documented download URL (docs/TESTING.md) users already `wget`,
          # so it must not move out from under them. Other platforms
          # (#1378) get an arch-suffixed pointer instead of clobbering it.
          if [[ "${PLATFORM}" == "linux/amd64" ]]; then
            LATEST="${VARIANT}-${FLAVOR}-latest.iso"
          else
            ARCH_SUFFIX="${PLATFORM##*/}"
            LATEST="${VARIANT}-${FLAVOR}-latest-${ARCH_SUFFIX}.iso"
          fi
          rclone copyto --log-level INFO --s3-no-check-bucket \
            "$ISO" "R2:${R2_BUCKET}/live-isos/${LATEST}"
          DIGEST=$(sha256sum "$ISO" | awk '{print $1}')
          printf '%s  %s\n' "$DIGEST" "$LATEST" > "${LATEST}.sha256"
          rclone copyto --log-level INFO --s3-no-check-bucket \
            "${LATEST}.sha256" "R2:${R2_BUCKET}/live-isos/${LATEST}.sha256"
          rclone copyto --log-level INFO --s3-no-check-bucket \
            "$BUNDLE" "R2:${R2_BUCKET}/live-isos/${LATEST}.sigstore.json"
          echo "==> Published $(basename "$ISO") and ${LATEST}, with checksum + Sigstore bundle sidecars"

      - name: Attach ISO to GitHub Release
        if: inputs.attach-release
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANT: ${{ inputs.variant }}
          FLAVOR: ${{ inputs.flavor }}
        run: |
          DATE=$(date +%Y%m%d)
          TAG="${FLAVOR}-${DATE}"
          ISO=$(find . -maxdepth 1 -name "*.iso" | head -1)
          if [[ -z "$ISO" ]]; then
            echo "No ISO found to attach"
            exit 0
          fi
          if ! gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" &>/dev/null; then
            gh release create "$TAG" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "TunaOS ${FLAVOR} (${DATE})" \
              --notes "Live ISO for ${VARIANT}:${FLAVOR}. Built from ghcr.io/tuna-os/${VARIANT}:${FLAVOR}."
          fi
          # gh release upload --clobber returns HTTP 422 when an asset with
          # the same name already exists and was uploaded in the same API
          # session. Explicitly delete first, then upload to avoid the race.
          ISO_NAME=$(basename "$ISO")
          ASSETS=("$ISO_NAME" "${ISO_NAME}.sha256" "${ISO_NAME}.sigstore.json")
          EXISTING=$(gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" --json assets \
            | python3 -c "import json,sys; assets=json.load(sys.stdin)['assets']; [print(a['name']) for a in assets]")
          for asset in "${ASSETS[@]}"; do
            if grep -qxF "$asset" <<< "$EXISTING"; then
              echo "==> Deleting existing asset ${asset} from release ${TAG}..."
              gh release delete-asset "$TAG" "$asset" --repo "${GITHUB_REPOSITORY}" --yes
            fi
          done
          gh release upload "$TAG" --repo "${GITHUB_REPOSITORY}" \
            "$ISO" "${ISO}.sha256" "${ISO}.sigstore.json"
          echo "==> Attached ${ISO_NAME} plus checksum and Sigstore bundle to release $TAG"
