name: Validate Renovate Config

on:
  pull_request:
    paths:
      - "renovate.json"
      - "scripts/check-renovate-automerge-policy.py"
      - "tests/test_renovate_automerge_policy.py"
      - ".github/workflows/validate-renovate.yaml"
  push:
    branches:
      - main
    paths:
      - "renovate.json"
      - "scripts/check-renovate-automerge-policy.py"
      - "tests/test_renovate_automerge_policy.py"
      - ".github/workflows/validate-renovate.yaml"

# Read-only on purpose: the job only validates a file. Declared so the
# read-only downgrade on fork PRs changes nothing (tests/test_fork_safe_workflows.py).
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: latest

      - name: Install dependencies
        shell: bash
        env:
          # renovate: datasource=npm depName=renovate
          RENOVATE_VERSION: "44.132.5"
        run: npm install -g renovate@${RENOVATE_VERSION}

      - name: Validate Renovate config
        shell: bash
        run: renovate-config-validator --strict --no-global renovate.json

      - name: Enforce org automerge policy
        shell: bash
        run: python3 scripts/check-renovate-automerge-policy.py renovate.json
