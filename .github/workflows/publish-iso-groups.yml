name: Publish Grouped Dedup ISOs to R2

# Builds the combined, deduplicated ISOs defined under `iso_groups:` in
# .github/build-config.yml (issue #455): one ISO per (variant, group) that
# packs several desktop environments into a single shared squashfs. This
# replaces 36 per-desktop ISOs with 12 grouped ones.
#
# Runs separately from publish-isos.yml (the legacy per-flavor path) so the two
# can be compared before the old one is retired.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Variant (all = every variant)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - yellowfin
          - albacore
          - skipjack
          - bonito
          - grouper
      group:
        description: 'ISO group (all = flagship + community + nvidia)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - default
          - community
          - nvidia
      skip_upload:
        description: 'Build ISOs but skip uploading to R2 (dry run)'
        required: false
        default: false
        type: boolean
  schedule:
    # Sundays at 23:00 UTC — after publish-isos.yml (22:00) so they don't
    # contend for the same self-hosted/large runners.
    - cron: '0 23 * * 0'

jobs:
  generate-matrix:
    name: Generate ISO-group matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      count: ${{ steps.build.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install yq + skopeo
        run: |
          sudo wget -qO /usr/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 && sudo chmod +x /usr/bin/yq
          sudo apt-get update -q && sudo apt-get install -y skopeo

      - name: Build matrix from iso_groups ∩ variant flavors
        id: build
        env:
          WANT_VARIANT: ${{ inputs.variant || 'all' }}
          WANT_GROUP: ${{ inputs.group || 'all' }}
        run: |
          # Emit one matrix entry per (variant, group) whose intersection of
          # group flavors with the variant's build_image flavors is non-empty.
          # "default"/'' is the flagship group; its ISO has no suffix.
          MATRIX=$(yq -o=json .github/build-config.yml | jq -c \
            --arg wv "$WANT_VARIANT" --arg wg "$WANT_GROUP" '
            [ .variants[] as $var
              | ($var.flavors | map(select(.build_image == true) | .id)) as $vf
              | .iso_groups[] as $g
              | ($g.suffix // "") as $suffix
              | ($g.flavors | map(select(. as $f | $vf | index($f)))) as $sel
              | select(($sel | length) > 0)
              | select($wv == "all" or $var.id == $wv)
              | select($wg == "all"
                       or ($wg == "default" and $suffix == "")
                       or $wg == $suffix)
              # Skip publish:false groups (builder-only, e.g. community)
              # UNLESS the dispatch names that exact suffix.
              | select(($g.publish != false) or ($wg == $suffix))
              | {
                  variant:  $var.id,
                  group:    (if $suffix == "" then "default" else $suffix end),
                  suffix:   $suffix,
                  basename: (if $suffix == "" then $var.id else "\($var.id)-\($suffix)" end),
                  flavors:  $sel
                }
            ] | { include: . }')
          # Probe every image the selected group will consume. A variant whose
          # flagship image was never published is skipped, as is a group with
          # a missing flavor (for example, a failed gnome-nvidia build). Do
          # this before emitting the matrix so one unavailable group cannot
          # fail the other variants or the prune job.
          PRUNED='[]'
          for row in $(echo "$MATRIX" | jq -cr '.include[] | @base64'); do
            entry=$(echo "$row" | base64 -d)
            variant=$(echo "$entry" | jq -r .variant)
            pubname=$(yq -r ".variants[] | select(.id == \"$variant\") | .publish_name // .id" .github/build-config.yml)
            tagsuffix=$(yq -r ".variants[] | select(.id == \"$variant\") | .tag_suffix // \"\"" .github/build-config.yml)
            missing=''
            for flavor in $(echo "$entry" | jq -r '.flavors[]'); do
              probe_tag="$flavor"
              if [ -n "$tagsuffix" ]; then probe_tag="${probe_tag}-${tagsuffix}"; fi
              image="ghcr.io/tuna-os/${pubname}:${probe_tag}"
              if ! skopeo inspect --retry-times 3 --no-tags "docker://${image}" >/dev/null 2>&1; then
                missing="${missing}${missing:+, }${image}"
              fi
            done
            if [ -n "$missing" ]; then
              echo "::warning::skipping $(echo "$entry" | jq -r .basename): required image(s) not published: ${missing}"
            else
              PRUNED=$(echo "$PRUNED" | jq -c --argjson e "$entry" '. + [$e]')
            fi
          done
          MATRIX=$(echo "$PRUNED" | jq -c '{ include: . }')
          COUNT=$(echo "$MATRIX" | jq '.include | length')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Building $COUNT grouped ISO(s):"
          echo "$MATRIX" | jq -r '.include[] | "  \(.basename)  (\(.variant) / \(.group))"'

  build-and-publish:
    name: ${{ matrix.basename }}
    needs: generate-matrix
    if: ${{ needs.generate-matrix.outputs.count != '0' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Maximize build disk
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main as of 2026-06-09
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: ublue-os/container-storage-action@dc1f4c8f17b672069e921f001132f7cf98a423a6 # main as of 2026-02-11

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y just podman jq rclone golang-go git systemd-boot-efi xorriso mtools squashfs-tools dosfstools gdisk
          sudo wget -qO /usr/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 && sudo chmod +x /usr/bin/yq

      - name: Log in to GHCR
        run: echo "${{ env.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build combined dedup ISO (from published GHCR images)
        env:
          GITHUB_REPOSITORY_OWNER: tuna-os
          # The low-disk offline-store implementation must be reproducible and
          # available before the release-container workflow finishes publishing.
          TACKLEBOX_FROM_SOURCE: '1'
          TACKLEBOX_SHA: a105d6d3e64eef6736cf0d24e083ae51e2f6ac92
        run: |
          sudo --preserve-env=GITHUB_REPOSITORY_OWNER,TACKLEBOX_FROM_SOURCE,TACKLEBOX_SHA \
            just iso-group "${{ matrix.variant }}" "${{ matrix.group }}" ghcr

      - name: Install QEMU for boot gate
        run: |
          sudo apt-get install -y \
            qemu-system-x86 qemu-utils ovmf socat imagemagick \
            python3-pil python3-requests

      - name: "Boot gate: verify grouped ISO"
        timeout-minutes: 25
        run: |
          ISO=$(find . -maxdepth 1 -name "${{ matrix.basename }}-*.iso" | head -1)
          echo "==> Boot-gating $ISO (default menu entry)"
          mkdir -p iso-e2e-out
          set +e
          sudo ./scripts/iso-e2e.sh "$ISO" \
            --output iso-e2e-out \
            --timeout 900
          rc=$?
          sudo chown -R "$(id -u):$(id -g)" iso-e2e-out
          exit "$rc"

      - name: Upload boot-gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-${{ matrix.basename }}
          path: |
            iso-e2e-out/serial.log
            iso-e2e-out/*.ppm
          if-no-files-found: warn
          retention-days: 7

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Checksum, sign, and verify grouped ISO
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          ISO=$(find . -maxdepth 1 -name "${{ matrix.basename }}-*.iso" -print -quit)
          [[ -n "$ISO" ]] || { echo "::error::ISO not found"; exit 1; }
          CHECKSUM="${ISO}.sha256"
          BUNDLE="${ISO}.sigstore.json"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish-iso-groups.yml@${GITHUB_REF}"
          issuer="https://token.actions.githubusercontent.com"

          sha256sum "$(basename "$ISO")" > "$CHECKSUM"
          sha256sum --check --strict "$CHECKSUM"
          cosign sign-blob --bundle "$BUNDLE" "$ISO"
          cosign verify-blob "$ISO" \
            --bundle "$BUNDLE" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer"

      # Only reached if the boot gate passed.
      - name: Upload ISO to Cloudflare R2
        if: ${{ inputs.skip_upload != true }}
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          ISO=$(find . -maxdepth 1 -name "${{ matrix.basename }}-*.iso" | head -1)
          if [[ -z "$ISO" ]]; then
            echo "ERROR: No ISO found for ${{ matrix.basename }}"
            exit 1
          fi
          CHECKSUM="${ISO}.sha256"
          BUNDLE="${ISO}.sigstore.json"
          echo "==> Uploading $ISO to R2..."
          for artifact in "$ISO" "$CHECKSUM" "$BUNDLE"; do
            rclone copy --log-level INFO --checksum --s3-no-check-bucket \
              "$artifact" R2:${{ secrets.R2_BUCKET }}/live-isos/
          done
          LATEST="${{ matrix.basename }}-latest.iso"
          rclone copyto --log-level INFO --s3-no-check-bucket \
            "$ISO" "R2:${{ secrets.R2_BUCKET }}/live-isos/${LATEST}"
          DIGEST=$(sha256sum "$ISO" | awk '{print $1}')
          printf '%s  %s\n' "$DIGEST" "$LATEST" > "${LATEST}.sha256"
          rclone copyto --log-level INFO --s3-no-check-bucket \
            "${LATEST}.sha256" "R2:${{ secrets.R2_BUCKET }}/live-isos/${LATEST}.sha256"
          rclone copyto --log-level INFO --s3-no-check-bucket \
            "$BUNDLE" "R2:${{ secrets.R2_BUCKET }}/live-isos/${LATEST}.sigstore.json"
          echo "==> Upload complete: $(basename "$ISO") (latest → ${LATEST}) with signed sidecars"

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.basename }}-iso
          path: |
            ${{ matrix.basename }}-*.iso
            ${{ matrix.basename }}-*.iso.sha256
            ${{ matrix.basename }}-*.iso.sigstore.json
          if-no-files-found: error
          retention-days: 7

  prune-r2:
    name: Prune R2 ISOs older than 14 days
    needs: build-and-publish
    # Run even if some build jobs failed so we still prune on partial runs.
    if: ${{ always() && inputs.skip_upload != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Install rclone
        run: sudo apt-get install -y rclone

      - name: Delete grouped ISOs older than 14 days
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          echo "==> Pruning grouped ISOs older than 14 days from R2..."
          # Delete versioned ISOs and their sidecars together. Exclude every
          # latest pointer and sidecar (always current).
          rclone delete --log-level INFO \
            --min-age 14d \
            --exclude "*-latest.iso*" \
            --include "*.iso" \
            --include "*.iso.sha256" \
            --include "*.iso.sigstore.json" \
            --s3-no-check-bucket \
            "R2:${{ secrets.R2_BUCKET }}/live-isos/"
          echo "==> Prune complete. Remaining objects:"
          rclone ls --s3-no-check-bucket \
            "R2:${{ secrets.R2_BUCKET }}/live-isos/" | sort
