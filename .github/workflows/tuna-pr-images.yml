name: Tuna PR images

# THROWAWAY evidence branch for tunaOS#3337 (never merged): builds the four
# stingray cells from the #3337 head exactly as the PR canary cells build,
# runs the desktop contract and boots each under Corral. publish: false.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stingray_cells:
    name: "stingray ${{ matrix.flavor }}"
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { flavor: base, contract: false }
          - { flavor: gnome, contract: true }
          - { flavor: kde, contract: true }
          - { flavor: xfce, contract: true }
    uses: ./.github/workflows/reusable-build-image.yml
    with:
      image-name: stingray
      image-variant: stingray
      image-desc: "tunaOS#3337 evidence stingray:${{ matrix.flavor }}"
      flavor: ${{ matrix.flavor }}
      platforms: linux/amd64
      platforms-json: '[{"platform":"linux/amd64","safeplatform":"linux-amd64"}]'
      default-tag: ${{ matrix.flavor }}
      publish: false
      sbom: false
      pr-desktop-contract: ${{ matrix.contract }}
