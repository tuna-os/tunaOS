name: Tuna PR images

# Builds every admitted Tuna image on a pull request that changes one of its
# inputs. .github/scripts/tuna-pr-build-inputs.sh is the input list; there is no
# workflow-level paths filter to drift from it, so the detector sees every PR.
#
# Pull requests only, in its own workflow. These jobs reach the publish
# credential resolver through build-variant.yml, which refuses to publish on
# merge_group, so they may not live in a workflow that the merge queue
# triggers. test.yml runs on merge_group because `Unit Tests` is a required
# check (tunaOS#1167).
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tuna_build_inputs:
    name: Detect Tuna image inputs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect Tuna image input changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename')"
          if printf '%s\n' "$files" | bash .github/scripts/tuna-pr-build-inputs.sh; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  tuna_pr_images:
    name: "${{ matrix.variant }}:tuna"
    needs: tuna_build_inputs
    if: github.event_name == 'pull_request' && needs.tuna_build_inputs.outputs.relevant == 'true'
    # The reusable image jobs declare publishing scopes. Their PR path disables
    # publish/SBOM and does not receive the R2 secrets passed by manual builds.
    # GitHub gives fork pull requests a read-only token without id-token.
    permissions:
      contents: read
      packages: write
      id-token: write
      # Required by schema validation, not used here: reusable-build-image.yml's
      # live_overlay job declares it and only runs after a Promote, which pull
      # requests never reach.
      actions: write
    strategy:
      fail-fast: false
      matrix:
        variant:
          - marlin
          - yellowfin
          - albacore
          - skipjack
          - bonito
          - wahoo
          - bonito-rawhide
          - grouper
          - flounder
          - flounder-sid
          - sailfin
    uses: ./.github/workflows/build-variant.yml
    with:
      variant: ${{ matrix.variant }}
      flavor: tuna
