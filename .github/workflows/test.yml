name: Test
# `Unit Tests` is a required status check on main (tunaOS#1167), so the
# workflow itself must run on every pull request and every merge-queue entry.
# A workflow-level `paths` filter would leave a PR outside it with a required
# check that never reports, which blocks the PR forever. The path decision is
# made by the `changes` job instead: a job skipped by `if:` reports Skipped,
# which satisfies a required check. Merge-queue entries always run in full.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

# Read-only baseline. Jobs that run repository code (tests, builds) never hold
# id-token: write, because pull-request code would be able to mint an OIDC
# token; the Codecov upload is a separate job that executes no repository code.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect test inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      # Pull requests only. Every other event leaves `relevant` empty, and the
      # gated jobs run in full on anything but a pull request -- including a
      # merge-queue entry. A failed detection also leaves it empty, which runs
      # the suite rather than skipping it.
      - name: Detect changed test inputs
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            relevant:
              # Every path the suite asserts on, so that a change to one of them
              # re-runs the tests that read it. tests/
              # test_the_test_filter_covers_what_the_tests_read.py holds this list to
              # that rule, because the gap is invisible from a pull request: a PR that
              # matched nothing here showed every applicable check green and ran no
              # Unit Tests at all, which reads exactly like a PR that was tested.
              #
              # That is measured, not theoretical. tunaOS#2475 changed one file,
              # manifests/desktops/gnome.yaml, and merged on 13 green checks with Unit
              # Tests absent -- while ten test files read manifests/. One of them,
              # tests/bats/test_niri_dms_payload.bats, exists because a niri image once
              # shipped, booted and published with its entire shell missing
              # (tunaOS#1009, #637); a manifest edit that broke that guard would have
              # gone green here and failed on a nightly instead.
              #
              # Reference counts across tests/**/*.py and tests/**/*.bats:
              #   build_scripts 262   scripts 139   .github 101   live-iso 35
              #   Containerfile* ~36  manifests 23  .github/build-config.yml 20
              #   just 14  image-versions.yaml 11  system_files 11
              #   registry-map.yaml 4  files 2
              - 'scripts/**'
              - 'tests/**'
              # Versioned contract schemas are executable test inputs.
              - 'schemas/**'
              # Signed package-search observations and public trust fixtures.
              - 'config/**'
              - 'experiences/**'
              - 'build_scripts/**'
              # One entry rather than six. .github/scripts/**, changelogs.py,
              # workflows/**, green-criteria.yml, runs-on.yml and actions/** were all
              # listed while .github/build-config.yml -- the matrix itself, what
              # variants exist and what flavors each declares -- was not, and twenty
              # test files read it. A partially covered directory is the shape of this
              # bug, so this covers it wholesale. It also keeps the CI contract
              # (tests/test_ci_contract.py) re-running when the gates it proves move.
              - '.github/**'
              # Build inputs.
              - 'manifests/**'
              - 'live-iso/**'
              - 'system_files/**'
              - 'services/countme/**'
              - 'system_files_overrides/**'
              - 'custom/**'
              - 'files/**'
              - 'Containerfile*'
              - 'toolchain/**'
              - '.containerignore'
              - '.dockerignore'
              - 'tunaos.toml'
              - 'requirements-config.txt'
              - 'requirements-package-authoring.txt'
              - 'requirements-iso-diagnostic.txt'
              - 'requirements-iso-diagnostic-apt.txt'
              - 'requirements-branding.txt'
              - 'image-versions.yaml'
              - 'registry-map.yaml'
              - 'renovate.json'
              - 'Justfile'
              - 'just/**'
              # Read by tests/test_r2_build_dependency_inventory.py: the R2 dependency
              # table must match the URLs the build inputs read, so an edit to either
              # side re-runs it. The STE linter skips tables, so `ste` cannot gate it.
              - 'PACKAGE-SOURCING.md'
              # Read by tests/bats/test_niri_dms_payload.bats: zirconium's factory
              # profile.d scripts, which install-zirconium.sh copies whole. A snapshot
              # refresh that adds a script calling a tool we do not ship must fail here.
              - '_upstream-snapshots/**'
              # Read as a spec by the CI contract test, not as prose. The rest of
              # docs/ is prose and generated content, gated by `ste` and `regenerate`;
              # see the test named above for why docs/** is deliberately absent.
              - 'docs/CI_SPEC.md'
              # Portable builder exports and schemas are test inputs, not prose.
              - 'docs/iso-builder.config.json'
              - 'docs/iso-builder-config.schema.json'
              - 'docs/iso-builder.flavors.json'
              - 'docs/iso-builder-flavors.schema.json'

  bootc-candidate-compile:
    name: bootc candidate compile (${{ matrix.family }})
    # Fixed branch scope opts into this existing PR/manual workflow.
    needs: changes
    if: >-
      !cancelled() && needs.changes.outputs.relevant != 'false' && (
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/candidate/composefs-bootstrap') ||
      (github.event_name == 'pull_request' && github.head_ref == 'candidate/composefs-bootstrap'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        family: [arch, debian]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build candidate source toolchain only
        env:
          CANDIDATE_FAMILY: ${{ matrix.family }}
        run: |
          set -euo pipefail
          # Containerfile defaults pin both bases by digest. No registry login,
          # export, artifact upload, host mounts or privilege/security overrides.
          read_pin() {
            python3 - "$1" <<'PYVERSION'
          import pathlib, re, sys
          text = pathlib.Path('image-versions.yaml').read_text()
          values = re.findall(r'^  ' + re.escape(sys.argv[1]) + r': "(v[0-9]+(?:\.[0-9]+){1,2})"$', text, re.M)
          if len(values) != 1:
              raise SystemExit('expected one reviewed version pin')
          print(values[0])
          PYVERSION
          }
          bootupd=$(read_pin bootupd)
          args=(--build-arg TUNAOS_BOOTC_CANDIDATE=1
                --build-arg "BOOTUPD_VERSION=$bootupd")
          case "$CANDIDATE_FAMILY" in
            arch)
              file=Containerfile.arch
              target=bootc-builder
              ;;
            debian)
              file=toolchain/Containerfile.debian
              target=builder
              ostree=$(read_pin ostree)
              composefs=$(read_pin composefs)
              args+=(--build-arg BUILD_OSTREE=1
                     --build-arg "OSTREE_VERSION=$ostree"
                     --build-arg "COMPOSEFS_VERSION=$composefs")
              ;;
            *) echo "Unsupported candidate family" >&2; exit 1 ;;
          esac
          timeout 3000 docker build --file "$file" --target "$target" \
            "${args[@]}" --tag "localhost/bootc-candidate:${CANDIDATE_FAMILY}" .

  primary-config-python310:
    name: Primary config (Python 3.10)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.relevant != 'false') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10' # Compatibility floor; protected by the scoped Renovate rule.
      - name: Install config test dependencies
        run: python -m pip install pytest PyYAML -r requirements-config.txt -r requirements-package-authoring.txt
      - name: Verify primary config on the oldest supported Python
        run: |
          gpg --version
          python -m pytest -q tests/test_primary_config.py tests/test_config_parser.py tests/test_package_authoring.py \
            tests/test_package_catalogs.py tests/test_signed_apt.py tests/test_search_base_packages.py

  primary-config-python315:
    name: Primary config (Python 3.15)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.relevant != 'false') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - name: Install config test dependencies
        run: python -m pip install pytest PyYAML -r requirements-config.txt -r requirements-package-authoring.txt
      - name: Verify primary config with a TOML 1.1 capable stdlib
        run: |
          gpg --version
          python -m pytest -q tests/test_primary_config.py tests/test_config_parser.py tests/test_package_authoring.py \
            tests/test_package_catalogs.py tests/test_signed_apt.py tests/test_search_base_packages.py

  gnome-summary-ocr:
    name: GNOME summary OCR
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install measured OCR dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-pytest imagemagick imagemagick-6.q16 \
            tesseract-ocr libtesseract5 tesseract-ocr-eng tesseract-ocr-osd
          versions=$(dpkg-query -W -f='${Package}\t${Version}\n' \
            imagemagick imagemagick-6.q16 tesseract-ocr libtesseract5 \
            tesseract-ocr-eng tesseract-ocr-osd)
          while IFS=$'\t' read -r package version; do
            case "$package" in
              imagemagick|imagemagick-6.q16) expected='8:6.9.12.98' ;;
              tesseract-ocr|libtesseract5) expected='5.3.4' ;;
              tesseract-ocr-eng|tesseract-ocr-osd) expected='1:4.1.0' ;;
              *) echo "Unexpected OCR package from dpkg-query: $package" >&2; exit 1 ;;
            esac
            case "$version" in
              "$expected"|"$expected"+*|"$expected"-*|"$expected"~*) ;;
              *) echo "$package version $version does not match upstream $expected" >&2; exit 1 ;;
            esac
          done <<< "$versions"
      - name: Verify retained summary pixels without optional skips
        run: python3 -m pytest -q tests/ocr/gnome_summary_capture.py

  unit-tests:
    name: Unit Tests
    # Required check. Skipped (which satisfies it) only on a pull request whose
    # changes the `changes` job found outside the suite's inputs.
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.relevant != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup TunaOS Build Environment
        uses: projectbluefin/actions/bootc-build/setup-runner@569fdb93de638c31449ad223545975fa86df1a4d # v1 as of 2026-07-02
        with:
          storage-backend: ""
          update-podman: "false"
          install-tools: '[]'

      - name: Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@f830e99d47c69efee99f1ddbf18a8e3144d1b93e

      - name: Install just
        run: brew install just

      - name: Setup yq
        uses: ./.github/actions/setup-yq

      - name: Install test dependencies
        run: |
          # BATS (bash automated testing system)
          brew install bats-core

          # pytest for Python tests; xdist spreads them over the runner's cores
          pip3 install pytest pytest-cov pytest-xdist -r requirements-config.txt --break-system-packages 2>/dev/null || pip3 install pytest pytest-cov pytest-xdist -r requirements-config.txt --user

          python3 -m pip install -r requirements-package-authoring.txt --break-system-packages || python3 -m pip install -r requirements-package-authoring.txt --user
          python3 -m pip install -r requirements-iso-diagnostic.txt --break-system-packages || python3 -m pip install -r requirements-iso-diagnostic.txt --user
          python3 -m pip install -r requirements-branding.txt --break-system-packages || python3 -m pip install -r requirements-branding.txt --user

          # Independent schema oracle, pinned with the other external tools.
          schema_version=$(yq -r '.downloads.jsonschema // ""' image-versions.yaml)
          [[ "$schema_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid jsonschema test pin" >&2; exit 1; }
          python3 -m pip install "jsonschema==$schema_version" --break-system-packages || python3 -m pip install "jsonschema==$schema_version" --user

          # Pillow + requests for desktop-verify.py tests
          pip3 install pillow requests --break-system-packages 2>/dev/null || pip3 install pillow requests --user

      # Marks, lettermarks and fastfetch letters follow each variant's emoji,
      # name and accent in tunaos.toml; a fork's edits must regenerate them.
      - name: Check generated artwork
        run: python3 scripts/branding/check-artwork.py

      - name: Prepare test diagnostics
        id: test_diagnostics
        if: always()
        run: |
          if report_root=$(mktemp -d "$RUNNER_TEMP/tunaos-test-results.XXXXXX"); then
            if ! printf 'report_root=%s\n' "$report_root" >> "$GITHUB_OUTPUT"; then
              rmdir -- "$report_root" || true
            fi
          else
            echo "::warning::Test diagnostics are unavailable; core tests will still run."
          fi

      - name: Run BATS tests
        if: always()
        shell: bash
        env:
          TEST_REPORT_ROOT: ${{ steps.test_diagnostics.outputs.report_root }}
        run: |
          set -euo pipefail
          echo "=== BATS Tests ==="
          # Two files at a time, never concurrent cases within a file.
          # test_lib.bats retargets its copied lib.sh cache to BATS_TEST_TMPDIR;
          # other fixed serial/log fixtures have a single owning BATS file.
          BATS_WORK_ROOT=""
          export BATS_WORK_ROOT TEST_REPORT_ROOT
          trap 'if [[ -n "$BATS_WORK_ROOT" ]]; then rm -rf -- "$BATS_WORK_ROOT"; fi' EXIT
          run_bats_file() {
            local f="$1" report="" status
            if [[ -n "$TEST_REPORT_ROOT" && -d "$TEST_REPORT_ROOT" && ! -L "$TEST_REPORT_ROOT" ]]; then
              local candidate="$TEST_REPORT_ROOT/bats/$f.tap"
              if mkdir -p "$(dirname "$candidate")"; then report="$candidate"; fi
            fi
            if [[ -n "$report" ]]; then
              local -a pipeline_status
              if bats --formatter tap "$f" | tee --output-error=warn "$report"; then
                pipeline_status=("${PIPESTATUS[@]}")
              else
                pipeline_status=("${PIPESTATUS[@]}")
              fi
              status=${pipeline_status[0]}
              if [[ "${pipeline_status[1]}" != 0 ]]; then
                echo "::warning::BATS diagnostic output could not be saved."
              fi
              printf '%s\n' "$status" > "$report.exit" || true
            else
              if bats --formatter tap "$f"; then status=0; else status=$?; fi
            fi
            # xargs must continue after every failing file (including exit 255).
            if [[ "$status" != 0 ]]; then return 1; fi
          }
          export -f run_bats_file
          files=()
          for f in tests/bats/*.bats; do
            [[ -f "$f" ]] && files+=("$f")
          done
          FAILED=0
          if ((${#files[@]})); then
            parallel_ready=false
            # Prepare every worker directory and log before running any suite.
            # Scratch storage is optional: a setup failure keeps serial coverage.
            # Native BATS adds its own run/test suffix before monitor.sock.
            # Keep both the root and numeric worker IDs short for AF_UNIX.
            if BATS_WORK_ROOT=$(mktemp -d /tmp/tb.XXXXXX); then
              parallel_ready=true
              for id in "${!files[@]}"; do
                if ! mkdir -m 700 "$BATS_WORK_ROOT/$id" ||
                  ! { : > "$BATS_WORK_ROOT/$id.log"; }; then
                  parallel_ready=false
                  break
                fi
              done
            fi
            if [[ "$parallel_ready" == true ]]; then
              if for id in "${!files[@]}"; do printf '%s\0%s\0' "$id" "${files[$id]}"; done | xargs -0 -n 2 -P 2 \
                bash -c 'export TMPDIR="$BATS_WORK_ROOT/$1"; run_bats_file "$2" > "$BATS_WORK_ROOT/$1.log" 2>&1' bash; then
                :
              else
                FAILED=1
              fi
              # Emit whole file logs in stable order instead of interleaving TAP.
              for id in "${!files[@]}"; do
                echo "  Running: ${files[$id]}"
                cat "$BATS_WORK_ROOT/$id.log"
              done
            else
              echo "::warning::BATS worker storage is unavailable; running files serially."
              for f in "${files[@]}"; do
                echo "  Running: $f"
                if run_bats_file "$f"; then :; else FAILED=1; fi
              done
            fi
          fi
          exit "$FAILED"

      - name: Run pytest tests
        if: always()
        env:
          TEST_REPORT_ROOT: ${{ steps.test_diagnostics.outputs.report_root }}
        run: |
          echo "=== pytest Tests ==="
          report_args=()
          if [[ -n "$TEST_REPORT_ROOT" && -d "$TEST_REPORT_ROOT" && ! -L "$TEST_REPORT_ROOT" ]]; then
            report_args=(-p scripts.compact_pytest_report --compact-test-report="$TEST_REPORT_ROOT/pytest-static.json")
          fi
          if python3 -m pytest "${report_args[@]}" tests/ tests/pytest/ -n auto -v --tb=short --cov=. --cov-report=term --cov-report=xml:coverage-python.xml; then
            status=0
          else
            status=$?
          fi
          if [[ ${#report_args[@]} != 0 ]]; then
            printf '%s\n' "$status" > "$TEST_REPORT_ROOT/pytest.exit" || true
          fi
          exit "$status"

      - name: Summarize test failures
        id: test_failure_summary
        if: failure() && steps.test_diagnostics.outputs.report_root != ''
        env:
          TEST_REPORT_ROOT: ${{ steps.test_diagnostics.outputs.report_root }}
        run: |
          python3 scripts/summarize-test-failures.py --direct --reports "$TEST_REPORT_ROOT" --output "$TEST_REPORT_ROOT/failures.json"
          [[ -f "$TEST_REPORT_ROOT/failures.json" && ! -L "$TEST_REPORT_ROOT/failures.json" ]]

      - name: Archive test failure summary
        if: failure() && steps.test_failure_summary.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.test_diagnostics.outputs.report_root }}/failures.json
          retention-days: 7
          if-no-files-found: warn

      - name: Clean up test diagnostics
        if: always() && steps.test_diagnostics.outputs.report_root != ''
        env:
          TEST_REPORT_ROOT: ${{ steps.test_diagnostics.outputs.report_root }}
        run: |
          if [[ "$TEST_REPORT_ROOT" == "$RUNNER_TEMP"/tunaos-test-results.* && "$(dirname -- "$TEST_REPORT_ROOT")" == "$RUNNER_TEMP" && -d "$TEST_REPORT_ROOT" && ! -L "$TEST_REPORT_ROOT" ]]; then
            if ! rm -rf -- "$TEST_REPORT_ROOT"; then
              echo "::warning::Owned test diagnostics could not be cleaned up."
            fi
          fi

      # npm 10 (the runner image default) and npm 11 (what Renovate uses to
      # write services/countme/package-lock.json) disagree on the lockfile once
      # an override is scoped to a nested dependency: since wrangler 4.143.0
      # npm 10 `npm ci` rejects the npm 11 lockfile with "Missing: ws@8.21.0".
      # Use the same npm major that writes the lockfile.
      - name: Setup Node.js for countme
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Test countme collector with D1
        run: |
          python3 scripts/generate-countme-allowlist.py --check
          npm ci --ignore-scripts --prefix services/countme
          npm test --prefix services/countme
          npm run build --prefix services/countme

      - name: Test summary
        if: always()
        run: |
          BATS_COUNT=$(find tests/bats -name "*.bats" -type f | wc -l)
          PY_COUNT=$(find tests/pytest -name "*.py" -type f 2>/dev/null | wc -l)
          echo "| Type | Files |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| BATS | ${BATS_COUNT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| pytest | ${PY_COUNT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Top-level pytest | $(find tests -maxdepth 1 -name 'test_*.py' -type f | wc -l) |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Run locally: \`just test\`" >> "$GITHUB_STEP_SUMMARY"
          echo "| Python coverage | Codecov + xml artifact |" >> "$GITHUB_STEP_SUMMARY"

      - name: Archive Python coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python
          path: coverage-python.xml
          retention-days: 30
          if-no-files-found: ignore

  # Codecov authenticates uploads with GitHub OIDC. This job holds the only
  # id-token: write in the workflow and runs no repository code: it checks out
  # data, downloads the coverage report the unit-tests job produced, and hands
  # it to the pinned upload action. Fork pull requests are skipped; GitHub does
  # not issue them an OIDC token anyway.
  coverage-upload:
    name: Upload coverage
    needs: unit-tests
    if: >-
      always() && needs.unit-tests.result != 'skipped' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Python coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-python
        continue-on-error: true

      - name: Upload Python coverage to Codecov
        if: hashFiles('coverage-python.xml') != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-python.xml
          flags: python
          fail_ci_if_error: false
