name: Test
on:
  pull_request:
    paths:
      # Every path the suite asserts on, so that a change to one of them
      # re-runs the tests that read it. tests/
      # test_the_test_filter_covers_what_the_tests_read.py holds this list to
      # that rule, because the gap is invisible from a pull request: a PR that
      # matched nothing here showed every applicable check green and ran no
      # Unit Tests at all, which reads exactly like a PR that was tested.
      #
      # That is measured, not theoretical. tunaOS#2475 changed one file,
      # manifests/desktops/gnome.yaml, and merged on 13 green checks with Unit
      # Tests absent -- while ten test files read manifests/. One of them,
      # tests/bats/test_niri_dms_payload.bats, exists because a niri image once
      # shipped, booted and published with its entire shell missing
      # (tunaOS#1009, #637); a manifest edit that broke that guard would have
      # gone green here and failed on a nightly instead.
      #
      # Reference counts across tests/**/*.py and tests/**/*.bats:
      #   build_scripts 262   scripts 139   .github 101   live-iso 35
      #   Containerfile* ~36  manifests 23  .github/build-config.yml 20
      #   just 14  image-versions.yaml 11  system_files 11
      #   registry-map.yaml 4  files 2
      - 'scripts/**'
      - 'tests/**'
      # Versioned contract schemas are executable test inputs.
      - 'schemas/**'
      # The fork-config contract suite initializes the stock/fork templates.
      - 'examples/**'
      - 'experiences/**'
      - 'build_scripts/**'
      # One entry rather than six. .github/scripts/**, changelogs.py,
      # workflows/**, green-criteria.yml, runs-on.yml and actions/** were all
      # listed while .github/build-config.yml -- the matrix itself, what
      # variants exist and what flavors each declares -- was not, and twenty
      # test files read it. A partially covered directory is the shape of this
      # bug, so this covers it wholesale. It also keeps the CI contract
      # (tests/test_ci_contract.py) re-running when the gates it proves move.
      - '.github/**'
      # Build inputs.
      - 'manifests/**'
      - 'live-iso/**'
      - 'system_files/**'
      - 'services/countme/**'
      - 'system_files_overrides/**'
      - 'custom/**'
      - 'files/**'
      - 'Containerfile*'
      - '.containerignore'
      - '.dockerignore'
      - 'tunaos.toml'
      - 'requirements-config.txt'
      - 'requirements-package-authoring.txt'
      - 'image-versions.yaml'
      - 'registry-map.yaml'
      - 'renovate.json'
      - 'Justfile'
      - 'just/**'
      # Read by tests/bats/test_niri_dms_payload.bats: zirconium's factory
      # profile.d scripts, which install-zirconium.sh copies whole. A snapshot
      # refresh that adds a script calling a tool we do not ship must fail here.
      - '_upstream-snapshots/**'
      # Read as a spec by the CI contract test, not as prose. The rest of
      # docs/ is prose and generated content, gated by `ste` and `regenerate`;
      # see the test named above for why docs/** is deliberately absent.
      - 'docs/CI_SPEC.md'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Codecov authenticates uploads with GitHub OIDC; no long-lived repository
  # token is exposed to pull-request jobs.
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  primary-config-python310:
    name: Primary config (Python 3.10)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.10' # Compatibility floor; protected by the scoped Renovate rule.
      - name: Install config test dependencies
        run: python -m pip install pytest PyYAML -r requirements-config.txt -r requirements-package-authoring.txt
      - name: Verify primary config on the oldest supported Python
        run: python -m pytest -q tests/test_primary_config.py tests/test_config_parser.py tests/test_package_authoring.py

  primary-config-python315:
    name: Primary config (Python 3.15)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.15'
      - name: Install config test dependencies
        run: python -m pip install pytest PyYAML -r requirements-config.txt -r requirements-package-authoring.txt
      - name: Verify primary config with a TOML 1.1 capable stdlib
        run: python -m pytest -q tests/test_primary_config.py tests/test_config_parser.py tests/test_package_authoring.py

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup TunaOS Build Environment
        uses: projectbluefin/actions/bootc-build/setup-runner@59f783ed76fd9d449ef6887a6649446801bd5434 # v1 as of 2026-07-02
        with:
          storage-backend: ""
          update-podman: "false"
          install-tools: '[]'

      - name: Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@f830e99d47c69efee99f1ddbf18a8e3144d1b93e

      - name: Install just
        run: brew install just

      - name: Setup yq
        uses: ./.github/actions/setup-yq

      - name: Install test dependencies
        run: |
          # BATS (bash automated testing system)
          brew install bats-core

          # pytest for Python tests
          pip3 install pytest pytest-cov --break-system-packages 2>/dev/null || pip3 install pytest pytest-cov --user

          python3 -m pip install -r requirements-package-authoring.txt --break-system-packages || python3 -m pip install -r requirements-package-authoring.txt --user

          # Independent schema oracle, pinned with the other external tools.
          schema_version=$(yq -r '.downloads.jsonschema // ""' image-versions.yaml)
          [[ "$schema_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid jsonschema test pin" >&2; exit 1; }
          python3 -m pip install "jsonschema==$schema_version" --break-system-packages || python3 -m pip install "jsonschema==$schema_version" --user

          # Pillow + requests for desktop-verify.py tests
          pip3 install pillow requests --break-system-packages 2>/dev/null || pip3 install pillow requests --user

      - name: Prepare test diagnostics
        id: test_diagnostics
        if: always()
        run: |
          if report_root=$(mktemp -d "$RUNNER_TEMP/tunaos-test-results.XXXXXX"); then
            if ! printf 'report_root=%s\n' "$report_root" >> "$GITHUB_OUTPUT"; then
              rmdir -- "$report_root" || true
            fi
          else
            echo "::warning::Test diagnostics are unavailable; core tests will still run."
          fi

      - name: Run BATS tests
        if: always()
        shell: bash
        env:
          TEST_REPORT_ROOT: ${{ steps.test_diagnostics.outputs.report_root }}
        run: |
          echo "=== BATS Tests ==="
          FAILED=0
          for f in tests/bats/*.bats; do
            [[ -f "$f" ]] || continue
            echo "  Running: $f"
            report=""
            if [[ -n "$TEST_REPORT_ROOT" && -d "$TEST_REPORT_ROOT" && ! -L "$TEST_REPORT_ROOT" ]]; then
              candidate="$TEST_REPORT_ROOT/bats/$f.tap"
              if mkdir -p "$(dirname "$candidate")"; then
                report="$candidate"
              fi
            fi
            if [[ -n "$report" ]]; then
              if bats --formatter tap "$f" | tee --output-error=warn "$report"; then
                pipeline_status=("${PIPESTATUS[@]}")
              else
                pipeline_status=("${PIPESTATUS[@]}")
              fi
              status=${pipeline_status[0]}
              if [[ "${pipeline_status[1]}" != 0 ]]; then
                echo "::warning::BATS diagnostic output could not be saved."
              fi
              printf '%s\n' "$status" > "$report.exit" || true
            else
              if bats --formatter tap "$f"; then status=0; else status=$?; fi
            fi
            if [[ "$status" != 0 ]]; then FAILED=1; fi
          done
          exit "$FAILED"

      - name: Run pytest tests
        if: always()
        env:
          TEST_REPORT_ROOT: ${{ steps.test_diagnostics.outputs.report_root }}
        run: |
          echo "=== pytest Tests ==="
          report_args=()
          if [[ -n "$TEST_REPORT_ROOT" && -d "$TEST_REPORT_ROOT" && ! -L "$TEST_REPORT_ROOT" ]]; then
            report_args=(-p scripts.compact_pytest_report --compact-test-report="$TEST_REPORT_ROOT/pytest-static.json")
          fi
          if python3 -m pytest "${report_args[@]}" tests/ tests/pytest/ -v --tb=short --cov=. --cov-report=term --cov-report=xml:coverage-python.xml; then
            status=0
          else
            status=$?
          fi
          if [[ ${#report_args[@]} != 0 ]]; then
            printf '%s\n' "$status" > "$TEST_REPORT_ROOT/pytest.exit" || true
          fi
          exit "$status"

      - name: Summarize test failures
        id: test_failure_summary
        if: failure() && steps.test_diagnostics.outputs.report_root != ''
        env:
          TEST_REPORT_ROOT: ${{ steps.test_diagnostics.outputs.report_root }}
        run: |
          python3 scripts/summarize-test-failures.py --direct --reports "$TEST_REPORT_ROOT" --output "$TEST_REPORT_ROOT/failures.json"
          [[ -f "$TEST_REPORT_ROOT/failures.json" && ! -L "$TEST_REPORT_ROOT/failures.json" ]]

      - name: Archive test failure summary
        if: failure() && steps.test_failure_summary.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.test_diagnostics.outputs.report_root }}/failures.json
          retention-days: 7
          if-no-files-found: warn

      - name: Clean up test diagnostics
        if: always() && steps.test_diagnostics.outputs.report_root != ''
        env:
          TEST_REPORT_ROOT: ${{ steps.test_diagnostics.outputs.report_root }}
        run: |
          if [[ "$TEST_REPORT_ROOT" == "$RUNNER_TEMP"/tunaos-test-results.* && "$(dirname -- "$TEST_REPORT_ROOT")" == "$RUNNER_TEMP" && -d "$TEST_REPORT_ROOT" && ! -L "$TEST_REPORT_ROOT" ]]; then
            if ! rm -rf -- "$TEST_REPORT_ROOT"; then
              echo "::warning::Owned test diagnostics could not be cleaned up."
            fi
          fi

      # npm 10 (the runner image default) and npm 11 (what Renovate uses to
      # write services/countme/package-lock.json) disagree on the lockfile once
      # an override is scoped to a nested dependency: since wrangler 4.143.0
      # npm 10 `npm ci` rejects the npm 11 lockfile with "Missing: ws@8.21.0".
      # Use the same npm major that writes the lockfile.
      - name: Setup Node.js for countme
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Test countme collector with D1
        run: |
          python3 scripts/generate-countme-allowlist.py --check
          npm ci --ignore-scripts --prefix services/countme
          npm test --prefix services/countme
          npm run build --prefix services/countme

      - name: Test summary
        if: always()
        run: |
          BATS_COUNT=$(find tests/bats -name "*.bats" -type f | wc -l)
          PY_COUNT=$(find tests/pytest -name "*.py" -type f 2>/dev/null | wc -l)
          echo "| Type | Files |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| BATS | ${BATS_COUNT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| pytest | ${PY_COUNT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Top-level pytest | $(find tests -maxdepth 1 -name 'test_*.py' -type f | wc -l) |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Run locally: \`just test\`" >> "$GITHUB_STEP_SUMMARY"
          echo "| Python coverage | Codecov + xml artifact |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Python coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-python.xml
          flags: python
          fail_ci_if_error: false

      - name: Archive Python coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python
          path: coverage-python.xml
          retention-days: 30
          if-no-files-found: ignore
