name: Image
permissions: {}
on:
  workflow_call:
    inputs:
      image-name:
        description: "The name of the image to build"
        required: true
        type: string
      image-aliases:
        description: >-
          Comma-separated friendly names to publish the same digest under, so
          users need not know the fish names (e.g. "ubuntu" for grouper).
          Additive: the canonical image-name tags are written exactly as
          before. Aliases are written only in the promote step, so they can
          never point at an image that failed the boot gate.
        required: false
        default: ""
        type: string
      image-desc:
        description: "The description of the image to build"
        required: false
        type: string
        default: "Albacore, built on CentOS Stream with bootc"
      flavor:
        description: "The flavor of the image to build"
        required: false
        type: string
        default: "regular"
      platforms:
        description: "The platforms to build the image for"
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
      platforms-json:
        description: >-
          The same platform list as a JSON matrix include —
          [{"platform":"linux/amd64","safeplatform":"linux-amd64"},...].
          Must stay in sync with `platforms`. Passed pre-computed by the
          caller so this workflow needs no matrix-generation job: at a
          20-concurrent-job org limit, a 5-second generate_matrix job per
          flavor was measurably starving real builds of slots.
          Required, deliberately with no default: this input alone drives the
          build matrix, so a caller that forgot it would silently build a
          different platform set than the one it asked for in `platforms`.
        required: true
        type: string
      major-version:
        description: "The version of CentOS to build the image on"
        required: false
        type: string
        default: "10"
      default-tag:
        description: "The default tag to use for the image"
        required: false
        type: string
        default: "lts"
      image-variant:
        description: "The image variant to build (yellowfin, albacore, etc.)"
        required: false
        type: string
        default: "albacore"
      sbom:
        description: "Generate/publish SBOMs for the artifacts"
        required: false
        type: boolean
        default: false
      cleanup_runner:
        description: "Use the ublue cleanup action to clean up the runner before running the build"
        required: false
        type: boolean
        default: true
      publish:
        description: "Publish this image"
        required: false
        type: boolean
        default: true
      remove-unwanted-software:
        description: "Run the remove-unwanted-software action to free up disk space"
        required: false
        type: boolean
        default: false
      chain-base-image:
        description: "Base image to use for chained builds (instead of OS base image)"
        required: false
        type: string
        default: ""
    outputs:
      manifest_published:
        description: >-
          "true" once a :<flavor>-testing manifest exists in GHCR for at
          least one platform. Callers gate dependent stages on this rather
          than on the workflow's own conclusion: a single platform leg
          failing still leaves a usable base for the platforms that did
          build, and the workflow conclusion stays red so the failure is
          not mistaken for a clean run (tuna-os/tunaOS#1729).
        value: ${{ jobs.manifest.outputs.image != '' }}
      all_platforms_built:
        description: >-
          "true" when every platform this flavor declares produced a digest.
          Only then does the bare :<flavor> tag get written.
        value: ${{ jobs.manifest.outputs.all_platforms_built }}
jobs:
  build_push:
    name: ${{ matrix.safeplatform }}
    runs-on: ${{ contains(matrix.platform, 'amd64') && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    # Headroom for the source-based experimental variants — guppy (Gentoo)
    # still compiles bootc from git even with the binhost (#644).
    # A max, not a fixed duration: RPM variants finish in ~20-40m unaffected,
    # so raising it costs nothing on the variants that do not need it.
    #
    # 60 was too low (#644); 180 was too low as well (#1802). guppy's kde was
    # cancelled at 2h57m with 245 of 252 emerge jobs complete and still
    # compiling steadily — it ran out of clock, not progress, and took the
    # whole cell with it because a cancelled build writes no digest artifact.
    # Measured on that run: base 36m, xfce ~1h57m, gnome ~1h59m, kde 2h57m+.
    #
    # This is the symptom, not the cause. The cause is that the whole
    # kde-plasma set is being compiled from source rather than pulled from the
    # binhost, which is #644's preferred fix and is tracked in #1802. Until
    # that lands, the ceiling has to clear the slowest real build.
    #
    # And that build is bimodal. With the binhost warm, guppy kde takes 55m
    # (run 33310245957, 2026-08-30). When Gentoo bumps plasma and the binhost
    # has not caught up, every kde-plasma package compiles from source and
    # the same cell was still emerging (250 of 254) when a flat 210m bound
    # killed it (run 33624381727, 2026-09-02). So guppy alone gets the
    # platform maximum; the binary variants keep 240 so a wedge on one of
    # them still costs four hours, not six.
    timeout-minutes: ${{ inputs.image-variant == 'guppy' && 360 || 240 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.platforms-json) }}
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE_NAME: ${{ inputs.image-name }}
      IMAGE_DESC: ${{ inputs.image-desc }}
      IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY || format('ghcr.io/{0}', github.repository_owner) }}
      DEFAULT_TAG: ${{ inputs.default-tag }}
      MAJOR_VERSION: ${{ inputs.major-version }}
      PLATFORMS: ${{ inputs.platforms }}

    steps:
      - name: Install dependencies
        if: contains(matrix.platform, 'linux/arm64')
        run: |
          sudo apt update -y
          sudo apt install -y \
            podman

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
        if: ${{ !startsWith(inputs.flavor, 'base') }}

      - name: Checkout (no submodules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        if: ${{ startsWith(inputs.flavor, 'base') }}

      - name: Prepare build configuration
        uses: ./.github/actions/prepare-config

      - name: Setup runner
        uses: projectbluefin/actions/bootc-build/setup-runner@b541b99e9d798cd818987004405f205891e65de1 # v1 as of 2026-07-02
        with:
          storage-backend: btrfs
          update-podman: "true"
          install-tools: '[]'

      - name: Install build tools
        uses: ./.github/actions/setup-build-tools


      # Layer cache lives in a GHCR repo (buildah's native distributed cache):
      # shared across jobs/flavors/arches, no tarball upload each run, no
      # 10 GB actions/cache eviction. Replaces two broken mechanisms — a DNF
      # host-path cache that CI builds never mounted (use_cache=0), and a
      # buildah "local cache" whose env sudo stripped and whose buildx-only
      # type=local syntax buildah doesn't even parse.
      - name: Login to GitHub Container Registry (cache + push)
        if: ${{ inputs.publish }}
        uses: ./.github/actions/ghcr-login

      - name: Build Image
        uses: ./.github/actions/build-image-step
        with:
          image-registry: ${{ env.IMAGE_REGISTRY }}
          image-name: ${{ env.IMAGE_NAME }}
          image-variant: ${{ inputs.image-variant }}
          flavor: ${{ inputs.flavor }}
          default-tag: ${{ inputs.default-tag }}
          public-image-name: ${{ inputs.image-name }}
          platform: ${{ matrix.platform }}
          chain-base-image: ${{ inputs.chain-base-image }}
          is-pr: ${{ github.event_name == 'pull_request' }}
          build-bound-minutes: ${{ inputs.image-variant == 'guppy' && '330' || '210' }}


      - name: Boot-verify image (PR gate)
        if: github.event_name == 'pull_request' && contains(matrix.platform, 'amd64')
        uses: ./.github/actions/verify-boot-pr
        with:
          image-name: ${{ inputs.image-name }}
          image-variant: ${{ inputs.image-variant }}
          flavor: ${{ inputs.flavor }}
          default-tag: ${{ inputs.default-tag }}
          safe-platform: ${{ matrix.safeplatform }}

      - name: Push to GHCR
        if: ${{ inputs.publish }}
        id: push
        env:
          IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_VARIANT: ${{ inputs.image-variant }}
          DEFAULT_TAG: ${{ inputs.default-tag }}
          PLATFORM: ${{ matrix.platform }}
          SAFE_PLATFORM: ${{ matrix.safeplatform }}
          MAX_RETRIES: 3
        run: |
          set -x
          IMAGE="localhost/${IMAGE_VARIANT}:${DEFAULT_TAG}"
          IMAGE_DIGEST="$(sudo podman image inspect --format '{{.Digest}}' "${IMAGE}")"

          sudo podman tag "${IMAGE}" "${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}-${SAFE_PLATFORM}"

          for i in $(seq "${MAX_RETRIES}"); do
            # GHCR does not support multi-range blob requests (returns 501),
            # which makes zstd:chunked pulls hard-fail on podman versions
            # that lack a fallback path. Plain zstd avoids that class of
            # failure while retaining the compression benefit (tuna-os/tunaos#579).
            sudo podman push --digestfile=/tmp/digestfile \
              --compression-format=zstd \
              --compression-level=3 \
              --force-compression \
              "${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}-${SAFE_PLATFORM}" \
              && break || sleep $((5 * i));
          done

          REMOTE_IMAGE_DIGEST=$(sudo cat /tmp/digestfile)
          echo "remote_image_digest=${REMOTE_IMAGE_DIGEST}" >> $GITHUB_OUTPUT
          echo "digest=${IMAGE_DIGEST}" >> $GITHUB_OUTPUT

      - name: Verify bootc-installable layers
        if: ${{ inputs.publish }}
        env:
          REMOTE_IMAGE_DIGEST: ${{ steps.push.outputs.remote_image_digest }}
          IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          # A LABEL-only (or otherwise empty) stage emits an empty tar layer
          # that bootc install rejects ("Truncated tar archive",
          # tuna-os/tunaOS#3378) while podman stays green. Blocking: an
          # uninstallable published image is not shippable.
          command -v zstd >/dev/null || sudo apt-get install -y -qq zstd
          [[ "$REMOTE_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::push returned invalid digest: ${REMOTE_IMAGE_DIGEST}"
            exit 1
          }
          scripts/check-bootc-installable-layers \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${REMOTE_IMAGE_DIGEST}"
      - name: Verify rechunk metadata preserved
        if: ${{ inputs.publish }}
        env:
          IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DEFAULT_TAG: ${{ inputs.default-tag }}
          SAFE_PLATFORM: ${{ matrix.safeplatform }}
        run: |
          # chunkah packs layers with ostree component annotations; if a
          # podman/skopeo regression strips them during push, client delta
          # updates silently degrade. Advisory check (warn, don't block).
          REF="docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}-${SAFE_PLATFORM}"
          RAW=$(sudo skopeo inspect --raw "$REF")
          LAYERS=$(echo "$RAW" | jq '.layers | length')
          ANNOTATED=$(echo "$RAW" | jq '[.layers[].annotations // {} | keys[]] | map(select(test("ostree|chunkah"))) | length')
          echo "layers=${LAYERS} ostree-annotated-keys=${ANNOTATED}"
          if [ "${ANNOTATED}" = "0" ]; then
            echo "::warning::pushed manifest ${REF} has no ostree/chunkah layer annotations — rechunk metadata may have been stripped"
          fi

      - name: Publish package manifest
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/publish-package-manifest
        with:
          image-name: ${{ env.IMAGE_NAME }}
          image-registry: ${{ env.IMAGE_REGISTRY }}
          default-tag: ${{ inputs.default-tag }}
          safe-platform: ${{ matrix.safeplatform }}

      - name: Generate SBOM
        if: inputs.sbom && github.event_name != 'pull_request'
        uses: ./.github/actions/generate-sbom-spdx
        with:
          image-name: ${{ env.IMAGE_NAME }}
          image-registry: ${{ env.IMAGE_REGISTRY }}
          default-tag: ${{ inputs.default-tag }}
          safe-platform: ${{ matrix.safeplatform }}

      - name: Add PR testing instructions and image diff
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/post-pr-diff
        with:
          image-registry: ${{ env.IMAGE_REGISTRY }}
          image-name: ${{ env.IMAGE_NAME }}
          default-tag: ${{ env.DEFAULT_TAG }}
          safe-platform: ${{ matrix.safeplatform }}

      - name: Create Job Outputs
        if: ${{ inputs.publish }}
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          SAFE_PLATFORM: ${{ matrix.safeplatform }}
          DIGEST: ${{ steps.push.outputs.remote_image_digest }}
        run: |
          mkdir -p /tmp/outputs/digests
          echo "${DIGEST}" > "/tmp/outputs/digests/${IMAGE_NAME}-${DEFAULT_TAG}-${SAFE_PLATFORM}.txt"

      - name: Record Attestation Target
        # The fully-qualified pullable reference, written beside the digest so
        # attest-sbom.yml can reconstruct it. That workflow runs on a
        # `workflow_run` event and never sees `inputs.image-name`, and the
        # digest filename cannot be parsed back into one: it is
        # `<image-name>-<tag>-<platform>.txt` and both of the first two fields
        # contain hyphens, so `yellowfin-gnome-latest-linux-amd64` splits a
        # dozen ways and only one of them is right. Naming the ref outright is
        # cheaper than teaching a second workflow to guess.
        #
        # A separate step, not a line inside `Create Job Outputs`, because
        # that step must stay free of any SBOM condition -- gating it on the
        # SBOM is what cost a whole variant in #1796, and
        # tests/test_sbom_step_cannot_kill_the_variant.py holds that line.
        # Here the condition is wanted: no SBOM was asked for means there is
        # nothing to attest, and a ref file would make attest-sbom.yml go
        # looking for an SBOM that was never meant to exist.
        if: ${{ inputs.publish && inputs.sbom && github.event_name != 'pull_request' }}
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}
          SAFE_PLATFORM: ${{ matrix.safeplatform }}
          DIGEST: ${{ steps.push.outputs.remote_image_digest }}
        run: |
          mkdir -p /tmp/outputs/digests
          echo "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}" \
            > "/tmp/outputs/digests/${IMAGE_NAME}-${DEFAULT_TAG}-${SAFE_PLATFORM}.ref"

      - name: Upload Output Artifacts
        if: ${{ inputs.publish }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.IMAGE_NAME }}-${{ env.DEFAULT_TAG }}-${{ matrix.safeplatform }}-${{ github.run_id }}
          # Bumped from 1 day: attest-sbom.yml reads these artifacts from a
          # separate run, and a re-run of that workflow after an overnight
          # Sigstore outage must still find them. `Manifest` consumes them
          # within the same run either way.
          retention-days: 7
          if-no-files-found: error
          path: |
            /tmp/outputs/digests/*.txt
            /tmp/outputs/digests/*.ref
  manifest:
    name: Manifest
    # Temporarily off RunsOn: the tuna-os AWS account is capped to Free Tier,
    # so CreateFleet rejects every 8-vCPU type it tries and the job dies in
    # "Set up runner" before a single step executes. This is registry and
    # signing work with no special hardware needs, so a GitHub runner does it
    # fine. Restore the RunsOn label once AWS credits are back.
    runs-on: ubuntu-latest
    if: always()
    needs:
      - build_push
    container:
      image: cgr.dev/chainguard/wolfi-base@sha256:340abe305ba813e2b6198a6d455e2063a53311f2e249d396e14c007caa5f53ac  # :latest linux/amd64 as of 2026-06-13
      # This job only performs registry/API operations (podman login and
      # manifest create/add/annotate/push). It does not run or build a
      # container or mount a host filesystem -- but podman itself needs
      # CAP_SYS_ADMIN to believe it is root. Without it, podman classifies
      # the process as rootless and re-execs into a user namespace before
      # doing anything at all, and docker's default seccomp profile denies
      # clone(CLONE_NEWUSER) to a process without that capability:
      #
      #   cannot clone: Operation not permitted
      #   Error: cannot re-exec process
      #
      # Until 2026-09-02 that never surfaced, because the hosted runner
      # launched every job container with `--privileged --security-opt
      # seccomp=unconfined` on its own. Runner 2.337.0 stopped doing that.
      # Measured on the same runner image (ubuntu-24.04 20260823.283.1),
      # the same 63 apk packages and the same podman 6.0.2-r2: marlin's six
      # Manifest jobs passed on runner 2.336.0 at 18:26Z (run 33659564363);
      # every Manifest job on runner 2.337.0 from 23:12Z on died on the two
      # lines above (sailfin 33687500544, flounder 33694724467, flounder-sid
      # 33702354589). The two `docker create` commands differ only in those
      # flags and the runner path. So ask explicitly for the confinement
      # this job has always actually run under; the next runner change must
      # not be able to take promotion down matrix-wide again.
      # tests/test_the_manifest_job_asks_for_the_confinement_podman_needs.py
      # holds this line in place.
      options: --privileged
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image: ${{ steps.push_manifest.outputs.IMAGE }}
      digest: ${{ steps.push_manifest.outputs.DIGEST }}
      all_platforms_built: ${{ steps.check_platforms.outputs.all_platforms_built }}
    env:
      IMAGE_NAME: ${{ inputs.image-name }}
      IMAGE_DESC: ${{ inputs.image-desc }}
      IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY || format('ghcr.io/{0}', github.repository_owner) }}
      DEFAULT_TAG: ${{ inputs.default-tag }}
      MAJOR_VERSION: ${{ inputs.major-version }}
      PLATFORMS: ${{ inputs.platforms }}
    steps:
      - name: Install dependencies
        run: |
          # Retry the install, because apk.cgr.dev sometimes refuses a single
          # package download. apk-tools 2.14 reports an HTTP 401/403 as
          # EACCES, so the log says "Permission denied", but no file
          # permission is involved:
          #
          #   (56/69) Installing libgpg-error (1.61-r3)
          #   ERROR: libgpg-error-1.61-r3: Permission denied
          #   2 errors; 257 MiB in 88 packages     (exit 2)
          #
          # Each refused package fails 50-90 ms after its "Installing" line,
          # before any download. The packages differ on every run: bonito-rawhide
          # base 36046888245 (linux-pam, libgpg-error), flounder-sid kde
          # 36083457907 (5 packages), yellowfin gnome-hwe 35957716969. When
          # this hits `base`, the whole variant is lost. A second `apk add`
          # fetches only the packages that the first one did not install
          # (tuna-os/tunaOS#2693).
          # tests/regressions/test_issue_2693_manifest_apk_install_retries_a_refused_download.py
          # runs this function against a stub apk.
          apk_install() {
            attempt=1
            until apk update && apk add "$@"; do
              if [ "$attempt" -ge 4 ]; then
                echo "::error::apk add failed $attempt times; giving up."
                return 1
              fi
              echo "::warning::apk add failed (attempt $attempt of 4); retrying in $((attempt * 5))s."
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }
          # Install necessary packages for building and pushing the image
          apk_install jq git podman uutils bash conmon crun netavark fuse-overlayfs libstdc++ yq python3
          # Point /bin/sh at bash WITHOUT `ln -sf`.
          #
          # This step installs uutils, which replaces coreutils in PATH, so the
          # very next command runs uutils' ln. uutils 0.12.0-r0 rewrote the -f
          # path to "replace links atomically instead of unlinking first"
          # (uutils/coreutils#14623, released in 0.12.0), and `ln -sf` then
          # started failing here with
          #
          #   ln: failed to create symbolic link '/bin/sh': Not a directory
          #
          # The image is pinned by digest but `apk add` is not, so the bump
          # landed mid-run and split one run cleanly by clock: in Build Bonito
          # 35202293222 every Manifest job started up to 09:54 passed and every
          # one from 09:58 failed, and Build Gurnard 35205505527 hit the same
          # error at 10:11. Nothing in this repository changed.
          #
          # `rm` then a plain `ln -s` never enters the rewritten -f path, and
          # behaves the same under GNU, busybox and uutils. Deliberately not
          # pinned to uutils 0.11.0-r1: a pin here would need someone to notice
          # and lift it once upstream fixes the regression.
          rm -f /bin/sh
          ln -s /bin/bash /bin/sh
          mkdir -p /etc/containers
          echo '{"default":[{"type":"insecureAcceptAnything"}]}' | jq . > /etc/containers/policy.json

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare build configuration
        uses: ./.github/actions/prepare-config

      - name: Report upstream job status
        env:
          JOBS: ${{ toJson(needs) }}
        run: |
          echo "Job status:"
          echo "$JOBS" | jq -r 'to_entries[] | " - \(.key): \(.value.result)"'

          # This step used to `exit 1` the moment any build_push leg was not
          # success/skipped. `needs.build_push.result` is the aggregate of the
          # whole platform matrix, so one arch failing aborted the manifest —
          # and with it every stage that depends on this flavor, including
          # flavors that declare only the arch that DID build. On 2026-08-14
          # that turned three `sudo podman login` faults on arm64 runners into
          # 16 red cells across sailfin/marlin/flounder/gurnard, 14 of which
          # never produced a job at all (tuna-os/tunaOS#1729).
          #
          # The real precondition for building a manifest is "at least one
          # platform produced a digest", which is asserted from the digest
          # artifacts in `Require at least one platform` below — evidence of
          # what was actually pushed, not an aggregate job result. Completeness
          # is still enforced, just later and where it belongs: `Check Platform
          # Completeness` sets all_platforms_built=false and the promote job
          # leaves the bare :<flavor> tag at its last good version. A partial
          # build can therefore reach :<flavor>-testing, and can never reach
          # :<flavor>.
          if echo "$JOBS" | jq -e 'to_entries[] | select(.value.result != "success" and .value.result != "skipped")' >/dev/null; then
            echo "::warning::Not every upstream job succeeded; continuing with whatever platforms published. The bare tag will not be promoted unless all declared platforms are present."
          fi

      - name: Image metadata
        id: metadata
        uses: ./.github/actions/annotate-oci-metadata
        with:
          image-name: ${{ env.IMAGE_NAME }}
          image-description: ${{ env.IMAGE_DESC }}
          default-tag: ${{ env.DEFAULT_TAG }}
          major-version: ${{ env.MAJOR_VERSION }}
          repository-owner: ${{ github.repository_owner }}
          revision: ${{ github.sha }}
          maintainer-name: ${{ vars.MAINTAINER_NAME || github.repository_owner }}
          maintainer-email: ${{ vars.MAINTAINER_EMAIL }}

      - name: Fetch Build Outputs
        if: ${{ inputs.publish }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ env.IMAGE_NAME }}-${{ env.DEFAULT_TAG }}-*
          merge-multiple: true
          path: /tmp/artifacts

      - name: Load Outputs
        if: ${{ inputs.publish }}
        id: load-outputs
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DEFAULT_TAG: ${{ env.DEFAULT_TAG }}
        run: |
          set -e
          DIGESTS_JSON="$(jq -n '{}')"
          for digest_file in /tmp/artifacts/*.txt; do
            FILENAME_ONLY="$(basename "${digest_file}")"
            # Extract the safeplatform key from the filename (e.g., "bonito-base-linux-amd64-v2.txt" -> "linux-amd64-v2")
            # Remove prefix "${IMAGE_NAME}-${DEFAULT_TAG}-"
            KEY_PART="${FILENAME_ONLY#${IMAGE_NAME}-${DEFAULT_TAG}-}"
            # Remove suffix ".txt"
            PLATFORM_KEY="${KEY_PART%.txt}"
            DIGEST="$(cat "${digest_file}")"
            DIGESTS_JSON="$(echo "${DIGESTS_JSON}" | jq --arg key "${PLATFORM_KEY}" --arg value "${DIGEST}" '. + {($key): $value}')"
          done
          echo "DIGESTS_JSON=$(echo "$DIGESTS_JSON" | jq -c '.')" >> "${GITHUB_OUTPUT}"

      # The precondition `Report upstream job status` no longer enforces. A
      # manifest needs at least one platform to point at; zero means every
      # build_push leg failed and there is nothing to publish, which is a
      # genuine failure and must stay red.
      - name: Require at least one platform
        if: ${{ inputs.publish }}
        env:
          DIGESTS_JSON: ${{ steps.load-outputs.outputs.DIGESTS_JSON }}
        run: |
          set -euo pipefail
          count="$(echo "${DIGESTS_JSON}" | jq 'length')"
          if [ "${count}" -eq 0 ]; then
            echo "::error::No platform produced a digest — every build leg failed, nothing to publish."
            exit 1
          fi
          echo "${count} platform digest(s) available for the manifest."

      - name: Check Platform Completeness
        if: ${{ inputs.publish }}
        id: check_platforms
        env:
          DIGESTS_JSON: ${{ steps.load-outputs.outputs.DIGESTS_JSON }}
          IMAGE_VARIANT: "${{ inputs.image-variant }}"
        run: |
          set -e

          # Expected platforms = what this flavor actually declares. The
          # build matrix resolves per-flavor platform overrides into
          # inputs.platforms (gnome-asahi is arm64-only; judging it against
          # the variant's amd64+arm64 list made Promote silently skip
          # forever). Fall back to the variant list only if the input is
          # somehow empty. PR builds force amd64 here but never promote.
          DEFAULT_PLATFORMS="${PLATFORMS}"
          if [ -z "$DEFAULT_PLATFORMS" ]; then
            # Use strenv() for robust environment variable access in yq
            DEFAULT_PLATFORMS=$(yq -r '.variants[] | select(.id == strenv(IMAGE_VARIANT)) | .platforms | join(",")' .github/build-config.yml)
          fi
          if [ -z "$DEFAULT_PLATFORMS" ]; then
            echo "Unknown variant: ${IMAGE_VARIANT}"
            DEFAULT_PLATFORMS="linux/arm64,linux/amd64"
          fi

          echo "Variant: ${IMAGE_VARIANT}"
          echo "Default platforms for this variant: ${DEFAULT_PLATFORMS}"

          # Parse expected platforms (use default platforms, not input platforms)
          expected_platforms=()
          IFS=',' read -r -a expected_platforms <<< "${DEFAULT_PLATFORMS}"

          # Check if all expected platforms have digests
          all_platforms_built="true"
          for platform_original in "${expected_platforms[@]}"; do
            platform_key="${platform_original//\//-}"
            digest="$(echo "${DIGESTS_JSON}" | jq -r --arg key "${platform_key}" '.[$key]')"

            if [ "$digest" == "null" ] || [ -z "$digest" ]; then
              echo "Missing platform: ${platform_original} (key: ${platform_key})"
              all_platforms_built="false"
            else
              echo "Found platform: ${platform_original} (key: ${platform_key})"
            fi
          done

          echo "All default platforms built: ${all_platforms_built}"
          echo "all_platforms_built=${all_platforms_built}" >> "${GITHUB_OUTPUT}"

      - name: Create Manifest
        if: ${{ inputs.publish }}
        id: create-manifest
        env:
          IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DEFAULT_TAG: ${{ env.DEFAULT_TAG }}
        run: |
          podman manifest create ${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}
          echo "MANIFEST=${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}" >> $GITHUB_OUTPUT

      - name: Populate Manifest
        if: ${{ inputs.publish }}
        env:
          MANIFEST: ${{ steps.create-manifest.outputs.MANIFEST }}
          DIGESTS_JSON: ${{ steps.load-outputs.outputs.DIGESTS_JSON }} # Already confirmed valid JSON
          LABELS: ${{ steps.metadata.outputs.labels }}
          INPUT_PLATFORMS: "${{ inputs.platforms }}"
        run: |
          set -e # Ensure script exits on error

          # Turn the comma separated inputs.platforms string into a list
          platforms=()
          IFS=',' read -r -a platforms <<< "${INPUT_PLATFORMS}"

          for platform_original in "${platforms[@]}"; do
            platform_key_for_lookup="${platform_original//\//-}"

            digest="$(echo "${DIGESTS_JSON}" | jq -r --arg key "${platform_key_for_lookup}" '.[$key]')"

            # A platform with no digest means that leg failed. Skip it rather
            # than aborting: the manifest is still useful to every stage that
            # builds on the platforms that DID publish, and the bare tag is
            # withheld anyway because `Check Platform Completeness` has already
            # set all_platforms_built=false (tuna-os/tunaOS#1729).
            if [ "$digest" == "null" ] || [ -z "$digest" ]; then
              echo "::warning::No digest for platform ${platform_original} (key: ${platform_key_for_lookup}); omitting it from the manifest. The bare tag will not be promoted."
              continue
            fi

            arch_for_podman="${platform_original#linux/}"
            podman manifest add "${MANIFEST}" "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}@${digest}" --os linux --arch "${arch_for_podman}"
          done

          # Apply the labels to the manifest (separated by newlines)
          while IFS= read -r label; do
            echo "Applying label ${label} to manifest"
            podman manifest annotate --index --annotation "$label" "${MANIFEST}"
          done <<< "${LABELS}"

      - name: Login to GitHub Container Registry
        if: ${{ inputs.publish }}
        env:
          REGISTRY: ghcr.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${{ env.GITHUB_TOKEN }}" | podman login -u "${GITHUB_ACTOR}" --password-stdin "${REGISTRY}"
          echo "${{ env.GITHUB_TOKEN }}" | podman login -u "${GITHUB_ACTOR}" --password-stdin "${REGISTRY}"

      - name: Push Manifest
        if: github.event_name != 'pull_request'
        id: push_manifest
        env:
          MANIFEST: ${{ steps.create-manifest.outputs.MANIFEST }}
          TAGS: ${{ steps.metadata.outputs.tags }}
          IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          # Push every tag under a -testing suffix. The bare tags (the ones
          # users pull and docs reference) are only written by the promote
          # job after the boot gate passes — a broken image can land in
          # GHCR as :<flavor>-testing but never as :<flavor>.
          while IFS= read -r tag; do
            # GHCR does not support multi-range blob requests (returns 501),
            # which makes zstd:chunked pulls hard-fail on podman versions
            # that lack a fallback path (tuna-os/tunaos#579).
            podman manifest push --all=false --digestfile=/tmp/digestfile \
              --compression-format=zstd \
              --compression-level=3 \
              --force-compression \
              "$MANIFEST" "$IMAGE_REGISTRY/$IMAGE_NAME:${tag}-testing"
          done <<< "$TAGS"

          DIGEST=$(cat /tmp/digestfile)
          echo "DIGEST=$DIGEST" >> $GITHUB_OUTPUT
          echo "IMAGE=$IMAGE_REGISTRY/$IMAGE_NAME" >> $GITHUB_OUTPUT

  # Sign the immutable platform manifests and the final multi-arch index with
  # GitHub's OIDC identity. Fulcio issues an ephemeral certificate and Rekor
  # records the event: there is no private key, password, or repository secret.
  # This can run beside the boot gate; both must pass before promotion.
  #
  # SBOM attestation deliberately does NOT happen here — it is its own
  # workflow (.github/workflows/attest-sbom.yml) off the critical path, the
  # shape projectbluefin/dakota uses (publish-image signs; publish-sbom
  # attaches and signs the SBOM, and promote needs only publish-image), with
  # the split taken as far as a separate run. Reason, measured:
  # on the 08-15 nightly every albacore flavor built, pushed and passed its
  # gates, and all twelve Promote jobs were skipped because `cosign attest`
  # could not reach Rekor. Image signatures are a promotion precondition; an
  # SBOM attestation that a transparency-log outage delayed by an hour is not
  # (tuna-os/tunaOS#1560).
  sign:
    name: Sign
    needs: manifest
    if: >-
      inputs.publish && github.event_name != 'pull_request' &&
      needs.manifest.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE_NAME: ${{ inputs.image-name }}
      IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY || format('ghcr.io/{0}', github.repository_owner) }}
      DEFAULT_TAG: ${{ inputs.default-tag }}
      INDEX_DIGEST: ${{ needs.manifest.outputs.digest }}
      COSIGN_YES: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Login to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        run: echo "$GITHUB_TOKEN" | cosign login ghcr.io -u "$GHCR_ACTOR" --password-stdin

      - name: Fetch platform digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ env.IMAGE_NAME }}-${{ env.DEFAULT_TAG }}-*
          merge-multiple: true
          path: supply-chain/digests

      - name: Sign images
        env:
          SIGN_DEADLINE_MINUTES: "40"
          SIGN_BACKOFF_CAP_SECONDS: "120"
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/reusable-build-image.yml@${GITHUB_REF}"
          issuer="https://token.actions.githubusercontent.com"
          index_ref="${IMAGE_REGISTRY}/${IMAGE_NAME}@${INDEX_DIGEST}"

          source "${GITHUB_WORKSPACE}/.github/scripts/cosign-retry.sh"

          cosign_retry cosign sign "$index_ref"

          signed=0
          shopt -s nullglob
          for digest_file in supply-chain/digests/*.txt; do
            digest="$(<"$digest_file")"
            cosign_retry cosign sign "${IMAGE_REGISTRY}/${IMAGE_NAME}@${digest}"
            signed=$((signed + 1))
          done

          [[ "$signed" -gt 0 ]] || { echo "::error::no platform digests found"; exit 1; }

          # One verify against the index is enough to prove the identity and
          # issuer are what we think they are. Verifying every platform ref
          # individually added a Rekor round trip per platform per flavor for
          # no extra signal -- and each of those round trips was another way
          # for an outage to block promotion.
          cosign_retry cosign verify "$index_ref" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" >/dev/null

          echo "Signed index plus ${signed} platform image(s)." >> "$GITHUB_STEP_SUMMARY"

  # SBOM attestation does not live in this workflow at all any more. It is
  # .github/workflows/attest-sbom.yml, a `workflow_run` job that fires once
  # the build run has finished.
  #
  # #1560 took it off Promote's critical path with `continue-on-error: true`
  # and no `needs:` edge, and that half works -- Promote succeeded on the
  # 2026-09-02 yellowfin nightly while `base / Attest SBOM` was failing
  # against a Rekor that answered 502. What `continue-on-error` does NOT do
  # is stop the job from deciding the RUN's conclusion across a reusable-
  # workflow boundary: the caller's `uses:` job reports the called workflow's
  # aggregate result, so run 33591594151 concluded `failure` with 27 of 30
  # jobs green, every platform of every flavor built, signed, manifested and
  # promoted. That conclusion is load-bearing -- `.github/scripts/update-
  # build-status.sh` renders the variant's "Latest run" column from it, and
  # rerun-infra-failures.yml only fires on a failed run -- so an unreachable
  # transparency log read as a failed nightly and the README matrix reported
  # 47/143 built for a fleet that had built (tuna-os/tunaOS#2282).
  #
  # A separate workflow is the only placement where an SBOM attestation
  # cannot colour the build: it has its own run, its own conclusion, and its
  # own entry in the re-run classifier. This is dakota's publish-sbom split
  # taken one step further than #1560 took it.

  # ── Boot gate ───────────────────────────────────────────────────────────────
  # Pull the just-pushed :<tag>-testing manifest, install it to a disk with
  # bootc, boot it in QEMU, and require the desktop contract marker on the
  # serial console (scripts/corral-boot-gate.sh, run by Corral). Promotion of the bare
  # tags is blocked while this fails. Skipped for base* flavors (no desktop
  # to verify; they are exercised by every desktop build layered on them).
  verify_boot:
    name: Gate
    needs: manifest
    # amd64-only: this gate is an x86 QEMU/KVM boot (qemu-system-x86 +
    # OVMF), so arm64-only flavors (gnome-asahi) can never pass it —
    # skopeo dies with "no image for architecture amd64" before qemu even
    # starts. Promote treats a skipped gate as pass; asahi images are
    # verified by the dispatched "Verify Asahi image" 35-point harness
    # instead (no aarch64 KVM on GH runners — TCG boot gate is future work).
    #
    # cosmic/niri/xfwl4 are NOT SCHEDULED while the GPU runner group cannot be
    # launched. TEMPORARY, maintainer decision 2026-09-11, and paired with the
    # boots scope in .github/green-criteria.yml, which already declares the
    # same three prefixes out of scope for the same reason.
    #
    # The runs-on selector below sends those compositors to the `gpu` group for
    # a real DRM render node. The account's vCPU limit for the g4dn bucket is
    # 0, so EC2 rejects every fleet request and the job dies before its first
    # step ever runs:
    #   Failed to launch runner: failed to create fleet: VcpuLimitExceeded
    #   ... vCPU limit of 0 ... AllowedInstanceTypes:["g4dn*"]
    #
    # Scheduling it anyway measures nothing -- no runner, no serial log, no
    # screenshot, no compositor -- and costs the cell its image on top: Promote
    # needs verify_boot to be success OR skipped, and a runner that never
    # attaches is neither. That is why `builds` reads not-green for cosmic and
    # niri on ten variants whose images built, pushed and passed every other
    # gate (albacore 34573957352, yellowfin 34563335220, marlin 34505652376 --
    # Gate is the only red job in each).
    #
    # This is NOT a claim that those cells boot, and it does not make them
    # green: `boots` still reads ⬜ for every one of them, which is what "not
    # measured" has meant here since #2123. It stops a runner shortage from
    # being recorded as a build failure.
    #
    # Revert together with the green-criteria exclusion the moment g4dn
    # capacity exists (tuna-os/tunaOS#2123). The three prefixes here, in the
    # runs-on selector below, and in green-criteria.yml are pinned equal by
    # tests/test_the_boots_scope_matches_the_gpu_routing.py, so they cannot
    # drift apart -- and re-adding capacity without re-adding the gate fails
    # that test rather than silently leaving the cells ungated.
    if: >-
      inputs.publish && github.event_name != 'pull_request' &&
      !startsWith(inputs.flavor, 'base') &&
      !startsWith(inputs.flavor, 'cosmic') &&
      !startsWith(inputs.flavor, 'niri') &&
      !startsWith(inputs.flavor, 'xfwl4') &&
      contains(inputs.platforms, 'amd64')
    # Back on RunsOn (AWS credits restored) for the DRM-gated desktops only:
    # cosmic/niri/xfwl4 are Smithay compositors that hard-require a DRM render
    # node (EGL_EXT_device_drm) and never start on hosted runners — the `gpu`
    # group (g4dn spot, ubuntu24-gpu-x64) supplies /dev/dri/renderD128, which
    # iso-e2e-gpu.sh passes through. kde/xfce stay on hosted runners (per-
    # variant evidence: marlin passed 08-17), gnome is verifiable without a
    # render node. Everything else keeps the hosted runner — sparse by design.
    # NOT a ternary: GitHub Actions expressions have no `? :`, and one here
    # failed to PARSE, which fails the whole file, which fails every caller.
    # That is what startup-failed all 13 variant nightlies on 2026-08-21 with
    # zero jobs and zero duration, and what made every sweeper re-dispatch
    # return HTTP 422 (run 32482857699):
    #   reusable-build-image.yml (Line: 1242): Unexpected symbol: '?'
    # The `cond && a || b` form on line 105 of this same file is the idiom.
    # b2d29bdb introduced the same ternary into installer-smoke.yml too; that
    # copy was fixed in #1919 and this one was not.
    #
    # And `'gpu'` alone was never a runner: RunsOn groups are addressed as
    # runs-on=<run_id>/runner=<group>, as installer-smoke.yml does. A bare
    # label would queue forever with no runner ever claiming it -- trading a
    # parse error for a silent hang is not a fix, so both halves are repaired.
    runs-on: >-
      ${{ (startsWith(inputs.flavor, 'cosmic') || startsWith(inputs.flavor, 'niri') || startsWith(inputs.flavor, 'xfwl4'))
          && format('runs-on={0}/runner=gpu', github.run_id) || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_NAME: ${{ inputs.image-name }}
      IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY || format('ghcr.io/{0}', github.repository_owner) }}
      DEFAULT_TAG: ${{ inputs.default-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reclaim ~25 GB of preinstalled toolchains from the main disk. The qcow2
      # is written to the workspace (main disk), not the container-storage
      # volume, so large desktop/NVIDIA images can exhaust it during `just
      # qcow2`. (Does not touch the node runtime / tool cache used by actions.)
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Maximize build space
        uses: ublue-os/container-storage-action@dc1f4c8f17b672069e921f001132f7cf98a423a6 # main as of 2026-02-11

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      # Do NOT apt-install podman on a runner that already has one. Newer
      # ubuntu-latest images ship podman under /usr/local (its units land in
      # /usr/local/lib/systemd/system), which dpkg knows nothing about, so
      # `apt-get install podman` happily adds Ubuntu's podman 4.9.3 on top of
      # it. sudo's secure_path then prefers /usr/local/bin/podman while the
      # apt-installed conmon/OCI-runtime bits win elsewhere, and the mixed
      # stack cannot start a container at all:
      #
      #   Error: OCI runtime error: crun: unknown version specified
      #
      # That killed sailfin niri's Gate in run 30594521039 while kde/xfce/gnome
      # passed in the same run, purely because their runners already had podman
      # apt-installed, making the install a no-op. It looks like a flake and is
      # not: it fires whenever a job lands on the newer image.
      - name: Install dependencies
        run: |
          sudo apt-get update
          pkgs=(just jq qemu-system-x86 qemu-utils ovmf socat imagemagick ffmpeg)
          if sudo sh -c 'command -v podman' >/dev/null 2>&1; then
            echo "podman already present: $(sudo sh -c 'command -v podman') ($(sudo podman --version))"
          else
            pkgs+=(podman)
          fi
          sudo apt-get install -y "${pkgs[@]}"

      # This runs before the candidate image is touched. A missing render node,
      # KVM, or QEMU GL backend is runner infrastructure, not a desktop boot
      # failure. GPU-routed cells require virgl; hosted cells still record the
      # plain display path so every Gate has the same fingerprint in its
      # summary and evidence bundle (tuna-os/tunaOS#1888).
      - name: Record GPU/DRM runner capability
        env:
          REQUIRE_VIRGL: ${{ (startsWith(inputs.flavor, 'cosmic') || startsWith(inputs.flavor, 'niri') || startsWith(inputs.flavor, 'xfwl4')) && '1' || '0' }}
        run: |
          args=(--output runner-capability.txt)
          if [[ "$REQUIRE_VIRGL" == "1" ]]; then
            args+=(--require-virgl)
          fi
          scripts/gpu-drm-preflight.sh "${args[@]}"

      # Corral runs the gate (scripts/corral-boot-gate.sh): it installs the
      # image to a disk, boots it under QEMU/KVM on UEFI, and gates on the
      # contract markers on the serial console, with the verdict
      # scripts/iso-e2e.sh --disk gave. The GPU-routed compositors keep the
      # iso-e2e.sh path below, because Corral has no virgl display; they are
      # not scheduled today (see the job's `if:`).
      - name: Set up Go for corral
        if: ${{ !(startsWith(inputs.flavor, 'cosmic') || startsWith(inputs.flavor, 'niri') || startsWith(inputs.flavor, 'xfwl4')) }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
          cache: false

      - name: Install corral
        if: ${{ !(startsWith(inputs.flavor, 'cosmic') || startsWith(inputs.flavor, 'niri') || startsWith(inputs.flavor, 'xfwl4')) }}
        run: |
          scripts/install-corral.sh "$RUNNER_TEMP/corral-bin"
          sudo install -m 0755 "$RUNNER_TEMP/corral-bin/corral" /usr/local/bin/corral

      - name: Boot and verify
        if: ${{ !(startsWith(inputs.flavor, 'cosmic') || startsWith(inputs.flavor, 'niri') || startsWith(inputs.flavor, 'xfwl4')) }}
        env:
          TEST_IMAGE: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}-testing
          # hummingbird probes BACKEND=ostree SEALED=0, so it takes the xfs
          # default and `bootc install to-disk` ABORTS installing the
          # bootloader: BIOS grub2-install cannot read the xfs this base's
          # mkfs.xfs produces, and bootupctl installs the BIOS component
          # unconditionally, so the whole to-disk install fails. (An ISO
          # install is a different path -- fisherman gives it a separate
          # ext4 /boot -- so this is about the Gate, and about Promote
          # being gated on the Gate.) Six
          # consecutive nightlies died here (run 32786338463, gnome Gate job
          # 97638679623), which is why hummingbird:gnome has never been
          # promoted and is 404 on GHCR.
          #
          # Scoped to this one variant ON PURPOSE. It is a measurement, not a
          # product change: if the gate goes green on ext4 then ext4 is the
          # answer and the durable fix is a 50-hummingbird.toml drop-in, as
          # 00-tunaos.toml already prescribes. Every other variant is
          # untouched -- the variable is unset for them and the probe decides
          # exactly as before.
          TUNAOS_QCOW2_FILESYSTEM: ${{ inputs.image-variant == 'hummingbird' && 'ext4' || '' }}
          TUNAOS_GDM_LOGIN_CHECK: ${{ inputs.flavor == 'tuna' && '1' || '0' }}
        run: |
          mkdir -p verify-out
          sudo --preserve-env=TUNAOS_QCOW2_FILESYSTEM,TUNAOS_GDM_LOGIN_CHECK \
            ./scripts/corral-boot-gate.sh "$TEST_IMAGE" verify-out 900

      - name: Build qcow2 from testing image (virgl)
        if: ${{ startsWith(inputs.flavor, 'cosmic') || startsWith(inputs.flavor, 'niri') || startsWith(inputs.flavor, 'xfwl4') }}
        env:
          TEST_IMAGE: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}-testing
        run: |
          just qcow2 "${TEST_IMAGE}"

      - name: Boot and verify (virgl)
        if: ${{ startsWith(inputs.flavor, 'cosmic') || startsWith(inputs.flavor, 'niri') || startsWith(inputs.flavor, 'xfwl4') }}
        env:
          # Do not let a GPU-routed gate silently fall back to plain virtio.
          # The preflight above has already proved this mode is available.
          TBOX_E2E_GPU: virgl
        run: |
          QCOW2=$(find . -maxdepth 1 -name "*.qcow2" | head -1)
          mkdir -p verify-out
          sudo ./scripts/iso-e2e.sh "$QCOW2" --disk \
            --output verify-out \
            --timeout 900

      # The boot step runs under sudo, so everything it drops in verify-out is
      # root-owned. Hand it back to the runner user BEFORE any later step
      # reads it. This chown used to live only in "Collect evidence", which
      # runs AFTER the tier-1 step below, and that ordering failed every
      # desktop Gate on marlin and flounder: the tier-1 step's `if:` called
      # hashFiles('verify-out/serial.log'), hashFiles is evaluated by the
      # runner as the runner user, and failing to read a root-owned file is
      # not a falsy result -- it is a template evaluation error that fails
      # the whole job before a single step of it runs:
      #
      #   The template is not valid. System.InvalidOperationException:
      #   hashFiles('verify-out/serial.log') failed. Fail to hash files
      #   under directory '/home/runner/work/tunaOS/tunaOS'
      #
      # Gate is a `needs:` of Promote, so images that booted fine -- serial
      # log carrying "Desktop experience contract passed" -- never got their
      # bare tags. The `if:` now reads a step output instead of hashing a
      # file, so ownership can never turn a green boot into a template error
      # again; the chown is what makes the step's own greps work.
      - name: Normalize verify-out ownership
        if: always()
        id: evidence
        shell: bash
        run: |
          sudo chown -R "$USER:$(id -gn)" verify-out 2>/dev/null || true
          if [[ -f runner-capability.txt ]]; then
            mkdir -p verify-out
            mv runner-capability.txt verify-out/runner-capability.txt
          fi
          if [[ -r verify-out/serial.log ]]; then
            echo "serial=true" >> "$GITHUB_OUTPUT"
          else
            echo "serial=false" >> "$GITHUB_OUTPUT"
            echo "::warning::verify-out/serial.log is missing or unreadable; tier-1 functional checks skipped"
          fi

      - name: Run tier-1 functional checks (advisory)
        if: always() && steps.evidence.outputs.serial == 'true'
        continue-on-error: true
        shell: bash
        env:
          IMAGE_VARIANT: ${{ inputs.image-variant }}
          FLAVOR: ${{ inputs.flavor }}
        run: |
          # Strip overlay suffixes from flavor (e.g. gnome-nvidia -> gnome)
          DESKTOP="${FLAVOR}"
          for _suffix in -nvidia-hwe -nvidia -hwe -cachyos -asahi -zfs; do
            if [[ "$DESKTOP" == *"$_suffix" ]]; then
              DESKTOP="${DESKTOP%"$_suffix"}"
              break
            fi
          done
          echo "### 🧪 Tier-1 Functional Checks (advisory) — ${IMAGE_VARIANT}:${FLAVOR} (${DESKTOP})" >> "$GITHUB_STEP_SUMMARY"
          if grep -q "TUNAOS_DESKTOP_CONTRACT_OK" verify-out/serial.log 2>/dev/null; then
            echo "Desktop experience contract: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Desktop experience contract: UNVERIFIED / FAIL" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Collect evidence
        if: always()
        env:
          EVIDENCE_ARCH: amd64
          EVIDENCE_STATUS: ${{ job.status }}
          # inputs.* is caller-typed text; it reaches the shell through env,
          # never by interpolation into the script (see
          # tests/test_untrusted_context_never_reaches_a_run_block_by_interpolation.py).
          EVIDENCE_VARIANT: ${{ inputs.image-variant }}
          EVIDENCE_FLAVOR: ${{ inputs.flavor }}
        run: |
          sudo chown -R "$USER:$(id -gn)" verify-out 2>/dev/null || true
          for ppm in verify-out/*.ppm; do
            [[ -f "$ppm" ]] || continue
            convert "$ppm" "${ppm%.ppm}.png" || true
          done
          scripts/evidence-bundle.sh \
            "${EVIDENCE_VARIANT}:${EVIDENCE_FLAVOR}" boots verify-out

      - name: Upload boot evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boot-gate-${{ inputs.image-name }}-${{ inputs.default-tag }}
          path: |
            verify-out/serial.log
            verify-out/boot-diagnostics.txt
            verify-out/runner-capability.txt
            verify-out/*.png
            verify-out/timelapse.webm
            verify-out/corral/result.json
            verify-out/corral/diagnostics/
            evidence/${{ inputs.image-variant }}/${{ inputs.flavor }}/amd64/
          if-no-files-found: warn
          retention-days: 7

  # Asahi images are arm64-only, so the x86 QEMU gate above is skipped. Do not
  # treat that skip as proof of an Apple Silicon image: the boot-chain
  # manifest must pass against the just-pushed testing tag before promotion.
  # This is also the repository-side safety valve for tunaOS#777: until the
  # EL10 OBS packages provide the missing m1n1/update hooks and userspace,
  # these images remain available as -testing but cannot become catalog tags.
  verify_asahi:
    name: Asahi manifest gate
    permissions:
      contents: read
      packages: read
    needs: manifest
    if: >-
      inputs.publish && github.event_name != 'pull_request' &&
      endsWith(inputs.flavor, '-asahi')
    uses: ./.github/workflows/verify-asahi-one.yml
    with:
      image: ${{ vars.IMAGE_REGISTRY || format('ghcr.io/{0}', github.repository_owner) }}/${{ inputs.image-name }}:${{ inputs.default-tag }}-testing
    # No `secrets:` block: verify-asahi-one.yml's workflow_call declares no
    # explicit secrets input (it only uses the auto-provided GITHUB_TOKEN),
    # so `secrets: inherit` was passing every repo/org secret for nothing
    # (tuna-os/tunaos#1536).

  # ── Base boot gate: removed 2026-08-18 ─────────────────────────────────────
  # W3 gated plain `base` cells here (tunaos-base-contract.service marker
  # under QEMU). Maintainer decision 08-18: base images are parent layers,
  # not user-facing artifacts — their boot machinery is transitively proven
  # by every desktop Gate built on top of them (marlin's 15 Gate-passing
  # cells prove marlin's base boots without ever booting marlin:base). The
  # job also never produced a marker in 600s on any variant (the serial
  # question tracked in GREEN-MASTER-PLAN W3), so it was all cost and no
  # signal. `base` is now a reviewed boots-scope exclusion in
  # green-criteria.yml, like base-hwe/base-nvidia; the in-image
  # tunaos-base-contract.service stays (it costs nothing and still fires on
  # desktop images at multi-user, before the graphical marker). Revert this
  # block from git history if base ever becomes a supported end-user target.

  # ── Desktop contract gate ───────────────────────────────────────────────────
  # Pull the candidate :<tag>-testing manifest and verify:
  # 1. Desktop experience (verify-desktop-experience.sh): packages, session
  #    files, portals, display manager.
  # 2. Package wishlist (verify-package-wishlist.sh): no undeclared omissions.
  # Promotion of the bare tags is blocked while this fails. Skipped for base*
  # flavors (no desktop to verify) and arm64-only flavors (verified by Asahi gate).
  verify_desktop:
    name: Desktop contract
    needs: manifest
    if: >-
      inputs.publish && github.event_name != 'pull_request' &&
      !startsWith(inputs.flavor, 'base') &&
      contains(inputs.platforms, 'amd64')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_NAME: ${{ inputs.image-name }}
      IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY || format('ghcr.io/{0}', github.repository_owner) }}
      DEFAULT_TAG: ${{ inputs.default-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Login to GitHub Container Registry
        env:
          REGISTRY: ghcr.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        run: |
          echo "${GITHUB_TOKEN}" | podman login -u "$GHCR_ACTOR" --password-stdin "${REGISTRY}"
          echo "${GITHUB_TOKEN}" | sudo podman login -u "$GHCR_ACTOR" --password-stdin "${REGISTRY}"

      - name: Pull Candidate Image
        env:
          TEST_IMAGE: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}-testing
        run: |
          set -euo pipefail
          sudo podman pull "${TEST_IMAGE}"

      - name: Verify desktop experience
        env:
          TEST_IMAGE: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}-testing
          FLAVOR: ${{ inputs.flavor }}
          IMAGE_VARIANT: ${{ inputs.image-variant }}
        run: |
          set -euo pipefail
          # Strip overlay suffixes from flavor (e.g. gnome-nvidia -> gnome)
          DESKTOP="${FLAVOR}"
          for _suffix in -nvidia-hwe -nvidia -hwe -cachyos -asahi -zfs; do
            if [[ "$DESKTOP" == *"$_suffix" ]]; then
              DESKTOP="${DESKTOP%"$_suffix"}"
              break
            fi
          done

          is_hb=false
          [[ "${IMAGE_VARIANT}" == hummingbird* ]] && is_hb=true
          # IS_ELN matters here for the same reason IS_HUMMINGBIRD does: the
          # contract reads it to decide whether a finding is a packaging
          # mistake or a measured property of the upstream compose.
          #
          # At build time install-desktop.sh sources lib.sh, which derives
          # IS_ELN from BASE_IMAGE, so the script's ELN branch fires and wahoo
          # builds. This job runs the SAME script standalone in a container and
          # passed only IS_HUMMINGBIRD, so IS_ELN defaulted to false, the
          # branch could not fire, and the script exited 1 on a gap it is
          # written to name and allow:
          #
          #   ffmpeg cannot decode h264 — a free/crippled libavcodec is installed
          #
          # That is wahoo's documented ELN codec gap (README calls the variant
          # "no codecs"; tests/bats/test_eln_codec_gap.bats pins the exemption
          # as ELN-only and loud). It cost wahoo its gnome, cosmic and kde
          # cells: Desktop contract failed, so Promote was skipped, so `builds`
          # read not-green for three images that built and pushed (run
          # 34609709028). Nothing was wrong with the images.
          #
          # Derived from the variant id the same way is_hb is, rather than
          # re-deriving from BASE_IMAGE, so the two stay one line apart and
          # neither can drift from the other.
          is_eln=false
          [[ "${IMAGE_VARIANT}" == wahoo* ]] && is_eln=true
          is_ubuntu=false
          [[ "${IMAGE_VARIANT}" == grouper* || "${IMAGE_VARIANT}" == gurnard* ]] && is_ubuntu=true

          sudo podman run --rm \
            -v "$PWD/build_scripts/checks/verify-desktop-experience.sh:/vde.sh:z" \
            -e IS_HUMMINGBIRD="$is_hb" \
            -e IS_ELN="$is_eln" \
            -e IS_UBUNTU="$is_ubuntu" \
            --entrypoint /bin/bash "${TEST_IMAGE}" /vde.sh "${DESKTOP}"

      - name: Verify package wishlist
        env:
          TEST_IMAGE: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}-testing
          IMAGE_VARIANT: ${{ inputs.image-variant }}
        run: |
          set -euo pipefail
          is_hb=false
          [[ "${IMAGE_VARIANT}" == hummingbird* ]] && is_hb=true

          sudo podman run --rm \
            -v "$PWD/build_scripts/checks/verify-package-wishlist.sh:/vpw.sh:z" \
            -v "$PWD/build_scripts/checks/package-miss-allowlist.txt:/allow.txt:z" \
            -e TUNAOS_WISHLIST_ALLOWLIST=/allow.txt \
            -e IS_HUMMINGBIRD="$is_hb" \
            --entrypoint /bin/bash "${TEST_IMAGE}" /vpw.sh

  tag-image:
    name: Promote
    needs: [manifest, sign, verify_desktop, verify_boot, verify_asahi]
    if: >-
      !cancelled() && github.event_name != 'pull_request' &&
      needs.manifest.result == 'success' &&
      needs.sign.result == 'success' &&
      (needs.verify_desktop.result == 'success' || needs.verify_desktop.result == 'skipped') &&
      (needs.verify_boot.result == 'success' || needs.verify_boot.result == 'skipped') &&
      (needs.verify_asahi.result == 'success' || needs.verify_asahi.result == 'skipped')
    # Temporarily off RunsOn: the tuna-os AWS account is capped to Free Tier,
    # so CreateFleet rejects every 8-vCPU type it tries and the job dies in
    # "Set up runner" before a single step executes. This is registry and
    # signing work with no special hardware needs, so a GitHub runner does it
    # fine. Restore the RunsOn label once AWS credits are back.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE_NAME: ${{ inputs.image-name }}
      IMAGE_DESC: ${{ inputs.image-desc }}
      IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY || format('ghcr.io/{0}', github.repository_owner) }}
      DEFAULT_TAG: ${{ inputs.default-tag }}
      MAJOR_VERSION: ${{ inputs.major-version }}
      PLATFORMS: ${{ inputs.platforms }}
    steps:
      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Login to GitHub Container Registry
        env:
          REGISTRY: ghcr.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${{ env.GITHUB_TOKEN }}" | podman login -u "${GITHUB_ACTOR}" --password-stdin "${REGISTRY}"
          echo "${{ env.GITHUB_TOKEN }}" | sudo podman login -u "${GITHUB_ACTOR}" --password-stdin "${REGISTRY}"
          # Also login with skopeo
          echo "${{ env.GITHUB_TOKEN }}" | sudo skopeo login -u "${GITHUB_ACTOR}" --password-stdin "${REGISTRY}"

      - name: Pull Image and Apply Tags
        id: tag
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_ALIASES: ${{ inputs.image-aliases }}
          IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}
          DEFAULT_TAG: ${{ env.DEFAULT_TAG }}
          MAJOR_VERSION: ${{ env.MAJOR_VERSION }}
          ALL_PLATFORMS_BUILT: ${{ needs.manifest.outputs.all_platforms_built }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          MAX_RETRIES: 4
        run: |
          set -ex
          # Promote the verified -testing manifest to the bare tags users
          # pull. This is the ONLY place the bare :<flavor> tag is written.
          SOURCE_IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}-testing"

          DATE_TAG="$(date +%Y%m%d)"

          # Every promotion below is a blob-for-blob re-upload to GHCR, and
          # GHCR drops upload sessions under load: run 31891742138 (gurnard)
          # failed the whole Promote job on
          #   writing blob: uploading layer to https://ghcr.io/v2/tuna-os/elementary/
          #   blobs/upload/2.fbd191d4-...: blob upload unknown
          # on the *sixth* copy, after five had already succeeded. Under
          # `set -e` that leaves the flavor half-promoted -- the canonical
          # tags written, one alias missing -- and the run red for a fault
          # that clears on the next attempt.
          #
          # The rest of this workflow already retries the two other network
          # legs (base pull, GHCR push); the promotion copies were the one
          # bare path left. skopeo copy to the same destination is idempotent,
          # so a retry after a partial upload is safe: blobs that landed are
          # skipped by digest and only the failed one is re-sent.
          copy_retry() {
            local dest="$1" i
            for i in $(seq "${MAX_RETRIES}"); do
              if sudo skopeo copy --all "docker://${SOURCE_IMAGE}" "docker://${dest}"; then
                return 0
              fi
              if [ "$i" -lt "${MAX_RETRIES}" ]; then
                echo "::warning::promotion copy to ${dest} failed (attempt ${i}/${MAX_RETRIES}); retrying in $((i * 15))s..."
                sleep $((i * 15))
              fi
            done
            echo "::error::promotion copy to ${dest} failed after ${MAX_RETRIES} attempts."
            return 1
          }

          if [ "${ALL_PLATFORMS_BUILT}" = "true" ]; then
            echo "All default platforms built and boot gate passed - promoting"

            # Tag with flavor only
            copy_retry "${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}"

            # Tag with flavor-date
            copy_retry "${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}-${DATE_TAG}"

            # Tag each platform with flavor-arch and flavor-arch-date
            IFS=',' read -r -a PLATFORMS <<< "${INPUT_PLATFORMS}"
            for platform in "${PLATFORMS[@]}"; do
              arch="${platform#linux/}"
              arch="${arch//\//-}"
              copy_retry "${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}-${arch}"
              copy_retry "${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}-${arch}-${DATE_TAG}"
            done

            # Friendly aliases: the same digest under a name users can guess
            # without knowing the fish names (grouper -> ubuntu, and so on).
            # Deliberately inside the ALL_PLATFORMS_BUILT branch and after the
            # canonical tags: an alias must never be the reason an unverified
            # image looks published, and must never be the only tag written.
            if [ -n "${IMAGE_ALIASES}" ]; then
              IFS=',' read -r -a ALIASES <<< "${IMAGE_ALIASES}"
              for alias_name in "${ALIASES[@]}"; do
                alias_name="$(echo "${alias_name}" | tr -d '[:space:]')"
                [ -n "${alias_name}" ] || continue
                echo "Publishing alias ${alias_name}:${DEFAULT_TAG}"
                copy_retry "${IMAGE_REGISTRY}/${alias_name}:${DEFAULT_TAG}"
                copy_retry "${IMAGE_REGISTRY}/${alias_name}:${DEFAULT_TAG}-${DATE_TAG}"
              done
            fi

            echo "tag=${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}" >> $GITHUB_OUTPUT
          else
            echo "Not all default platforms built - leaving bare tags at last good version"
            echo "tag=${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}" >> $GITHUB_OUTPUT
          fi
