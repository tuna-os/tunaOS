name: Daily Image Verification
permissions:
  contents: read
on:
  schedule:
    - cron: '0 4 * * *' # 4 AM UTC daily
  workflow_dispatch:
    inputs:
      variant:
        description: 'Specific variant to verify (leave empty for rotation)'
        required: false
        type: string
      flavor:
        description: 'Specific flavor to verify (leave empty for rotation)'
        required: false
        type: string

jobs:
  generate_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup yq
        uses: ./.github/actions/setup-yq
      - name: Generate matrix
        id: set-matrix
        env:
          INPUT_VARIANT: ${{ github.event.inputs.variant }}
          INPUT_FLAVOR: ${{ github.event.inputs.flavor }}
        run: |
          if [[ -n "$INPUT_VARIANT" && -n "$INPUT_FLAVOR" ]]; then
            PICKED="[{\"variant\": \"$INPUT_VARIANT\", \"flavor\": \"$INPUT_FLAVOR\"}]"
          else
            # Get desktop-only variant:flavor pairs (exclude base/hwe/nvidia suffixes and base flavors)
            # These are the most representative images to rotate through for daily checks
            CONFIG_FILE=".github/build-config.yml"
            # guppy (Gentoo) is excluded: its source-based desktop images are experimental
            # and not reliably published — see tunaOS#657, tunaOS#658.
            # shellcheck disable=SC2016
            JQ_DESKTOP='.variants[] | .id as $v | .flavors[] | select(
              .build_image == true and (.id | test("^(gnome|kde|cosmic|niri)$")) and ($v != "guppy")
            ) | {variant: $v, flavor: .id}'
            ALL_IMAGES=$(yq -o=json "${CONFIG_FILE}" | jq -c "${JQ_DESKTOP}")

            COUNT=$(echo "$ALL_IMAGES" | jq -s 'length')

            # Use day of year for rotation offset, verify 3 images per day
            DAY=$(date +%j | sed 's/^0*//')
            START=$(( (DAY * 3) % COUNT ))
            END=$(( START + 3 ))
            WRAP=$(( END > COUNT ? END % COUNT : 0 ))
            PICKED=$(echo "$ALL_IMAGES" | jq -sc ".[$START:$END] + .[0:$WRAP]")
          fi

          echo "matrix<<EOF" >> "$GITHUB_OUTPUT"
          echo "{\"include\":$PICKED}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify ${{ matrix.variant }}:${{ matrix.flavor }}
    needs: generate_matrix
    runs-on: ubuntu-latest
    env:
      CI_SCOPE_SUFFIX: ${{ matrix.variant }}-${{ matrix.flavor }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate_matrix.outputs.matrix) }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup TunaOS Build Environment
        uses: projectbluefin/actions/bootc-build/setup-runner@ab3980490e9461a7c7c6f1836eb9c49e90da93ad # v1 as of 2026-07-02
        with:
          storage-backend: ""
          update-podman: "false"
          install-tools: '[]'

      - name: Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@f830e99d47c69efee99f1ddbf18a8e3144d1b93e

      - name: Install just
        run: brew install just

      - name: Setup yq
        uses: ./.github/actions/setup-yq

      - name: Verify image
        id: run_verify
        env:
          VARIANT: ${{ matrix.variant }}
          FLAVOR: ${{ matrix.flavor }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
        run: just ci-daily-verify-image

      - name: Create Issue on Failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANT: ${{ matrix.variant }}
          FLAVOR: ${{ matrix.flavor }}
        run: |
          TITLE="Daily Verification Failed: ${VARIANT}:${FLAVOR}"
          IMAGE_URI="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${VARIANT}:${FLAVOR}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          BODY=$(cat <<ISSUE_EOF
          Daily verification failed for \`${VARIANT}:${FLAVOR}\`.

          **Variant:** ${VARIANT}
          **Flavor:** ${FLAVOR}
          **Image:** \`${IMAGE_URI}\`

          [View Workflow Run](${RUN_URL})

          Checks performed:
          - Image exists in ghcr.io
          - \`containers.bootc=1\` label present
          - \`ostree.bootable=1\` label present
          - \`bootc install print-configuration\` passes
          ISSUE_EOF
          )

          EXISTING_ISSUE=$(gh issue list \
            --search "${TITLE}" \
            --state open \
            --json number \
            -q '.[0].number')

          if [[ -z "${EXISTING_ISSUE}" ]]; then
            gh issue create \
              --title "${TITLE}" \
              --body "${BODY}" \
              --label "bug,verification-failed"
          else
            gh issue comment "${EXISTING_ISSUE}" \
              --body "Daily verification failed again. See: ${RUN_URL}"
          fi

      - name: Clean up job-owned resources
        if: always()
        run: just ci-cleanup
