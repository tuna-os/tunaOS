name: Check for Spammy Issue Comments

on:
  issue_comment: # zizmor: ignore[dangerous-triggers] no checkout, the locked filter action only reads and hides the comment
    types: [created, edited]

permissions:
  issues: write

jobs:
  comment-filter:
    runs-on: ubuntu-latest
    steps:
      - name: Comment filter
        uses: DecimalTurn/Comment-Filter@v0.2.3
