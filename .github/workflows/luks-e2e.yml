name: LUKS E2E

# Full disk-encryption end-to-end test for every variant x desktop-flavor
# combo that has a published image (build_image — so image-only variants like
# sailfin, which the browser builder makes ISOs from, are covered too, not
# just build_iso). For each cell we build a *dev* ISO (ENABLE_SSHD=1 — the live
# env needs SSH to drive the install), then scripts/iso-e2e.sh --luks:
#   1. boots the live ISO under QEMU with an emulated TPM 2.0 (swtpm),
#   2. installs via fisherman (the same backend every TunaOS installer
#      frontend uses) with a recipe.json requesting
#      encryption.type=tpm2-luks-passphrase,
#   3. reboots the installed disk and confirms the passphrase unlocks it and
#      login is reached (proving fisherman's install-time encryption works).
#
# TPM2 auto-unlock is enrolled by a fisherman#48 first-boot oneshot against
# the INSTALLED system's own PCR 7 — not at install time, which used to seal
# against the live ISO's boot chain instead and never unseal afterward
# (tunaOS#679/#680) — so step 3 above does NOT prove it; that would need a
# fourth boot with no passphrase. scripts/iso-e2e.sh's
# TUNAOS_E2E_VERIFY_TPM_AUTOUNLOCK=1 does that boot, and this workflow's
# `tpm_autounlock` dispatch input (or the quarterly cron below) sets it — but
# only for the default run does it stay unset: a fourth boot on every cell of
# the monthly full sweep would materially raise its already-expensive cost, so
# `tpm_autounlock` mode instead narrows the matrix to one flavor per variant
# (docs/LUKS-TPM.md calls this "the per-variant TPM-enrollment test") and
# skips the variants whose initramfs cannot carry the tpm2-tss module at all
# (see the support matrix in that doc — sailfin/marlin/guppy, as of tunaOS#714).
#
# This is expensive (a dev ISO build + two QEMU boots per cell — three with
# tpm_autounlock), so it only runs on demand or on a schedule — never per
# push. Modelled on iso-e2e.yml and projectbluefin/dakota-iso's luks-*-qemu
# recipes.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Variant filter (or 'all')"
        required: false
        default: "all"
        type: string
      flavor:
        description: "Flavor filter (or 'all')"
        required: false
        default: "all"
        type: string
      tpm_autounlock:
        description: >-
          Also verify TPM2 auto-unlock (a third QEMU boot per cell, no
          passphrase). Narrows the matrix to one flavor per variant to keep
          cost bounded, and skips variants that cannot carry the tpm2-tss
          dracut module at all (see docs/LUKS-TPM.md).
        required: false
        default: false
        type: boolean
  schedule:
    # Full variant x installable-desktop sweep on the first day of each month
    # (passphrase-unlock only — see the header comment above).
    - cron: "0 7 1 * *"
    # TPM2 auto-unlock sweep, one flavor per variant, quarterly: the fourth
    # boot this adds is real extra cost, so it runs far less often than the
    # passphrase-only sweep above. github.event.schedule (the exact cron
    # string that fired) is how the generate-matrix step tells the two
    # schedules apart — workflow_dispatch inputs don't apply to `schedule`
    # events, so there is no `inputs.tpm_autounlock` to read here.
    - cron: "0 7 1 */3 *"

permissions:
  contents: read
  packages: read

jobs:
  # Build the {variant, flavor} matrix from build-config.yml (every variant x
  # desktop flavor with a published image), narrowed by the dispatch filters.
  generate-matrix:
    name: Generate matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      tpm_autounlock: ${{ steps.gen.outputs.tpm_autounlock }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install yq
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Generate matrix
        id: gen
        env:
          FILTER_VARIANT: ${{ inputs.variant || 'all' }}
          FILTER_FLAVOR: ${{ inputs.flavor || 'all' }}
          # inputs.tpm_autounlock is only populated on workflow_dispatch —
          # schedule events carry no `inputs` context, so the second cron
          # above is identified by github.event.schedule instead. Compared
          # as a string, not booleans, because event.schedule IS the literal
          # cron expression from the `on.schedule` list.
          TPM_DISPATCH: ${{ inputs.tpm_autounlock || false }}
          TPM_SCHEDULE: ${{ github.event.schedule == '0 7 1 */3 *' }}
        run: |
          set -euo pipefail
          json="$(yq -o=json '.' .github/build-config.yml)"

          if [[ "$TPM_DISPATCH" == "true" || "$TPM_SCHEDULE" == "true" ]]; then
            TPM_AUTOUNLOCK=true
          else
            TPM_AUTOUNLOCK=false
          fi
          echo "tpm_autounlock=${TPM_AUTOUNLOCK}" >> "$GITHUB_OUTPUT"

          if [[ "$TPM_AUTOUNLOCK" == "true" ]]; then
            # docs/LUKS-TPM.md's support matrix: these three never get the
            # tpm2-tss dracut module built in at all (unconditional omit on
            # openSUSE/Gentoo, no tpm2-tools package on Arch), so no boot
            # could ever confirm auto-unlock there — spending a third QEMU
            # boot on them would only ever reproduce a known, static fact.
            # tests/bats/test_luks_tpm2_support_matrix.bats keeps this list
            # honest against the actual Containerfiles.
            NO_TPM_USERSPACE="sailfin marlin guppy"
            # One flavor per variant, so a 13-variant sweep costs 13 extra
            # boots instead of one per every desktop x variant cell — see the
            # header comment. `gnome` when the variant ships it (the flavor
            # every non-Arch/apt/RPM base tests already lean on), else
            # whatever amd64 graphical flavor sorts first.
            matrix="$(echo "$json" | jq -c \
              --arg fv "$FILTER_VARIANT" --arg skip "$NO_TPM_USERSPACE" \
              '($skip | split(" ")) as $skiplist
               | {include: [ .variants[] | . as $variant | .id as $v
                   | select($skiplist | index($v) | not)
                   | ([$variant.flavors[]
                       | select(.build_image == true)
                       | select(.id != "base")
                       | select((.platforms // $variant.platforms // []) | index("linux/amd64"))
                     ] | sort_by(.id)) as $eligible
                   | (($eligible | map(select(.id == "gnome")) | .[0]) // $eligible[0]) as $pick
                   | select($pick != null)
                   | {variant: $v, flavor: $pick.id}
                   | select($fv == "all" or .variant == $fv) ]}')"
          else
            # Every variant x desktop flavor that has a published image
            # (build_image, NOT build_iso): the browser ISO builder makes ISOs
            # from any image, so image-only variants (sailfin, guppy,
            # flounder-sid) need boot+install coverage too. Cover every amd64
            # graphical image: standard desktops, overlays (NVIDIA/CachyOS),
            # and any future desktop tag. `base` has no login target to gate;
            # arm64-only flavors require an arm64 QEMU runner and are reported
            # separately in the job summary.
            matrix="$(echo "$json" | jq -c \
              --arg fv "$FILTER_VARIANT" --arg ff "$FILTER_FLAVOR" \
              '{include: [ .variants[] | . as $variant | .id as $v | .flavors[]
                 | select(.build_image == true)
                 | select(.id != "base")
                 | select((.platforms // $variant.platforms // []) | index("linux/amd64"))
                 | {variant: $v, flavor: .id}
                 | select($fv == "all" or .variant == $fv)
                 | select($ff == "all" or .flavor == $ff) ]}')"
          fi
          count="$(echo "$matrix" | jq '.include | length')"
          echo "Matrix has ${count} cell(s) (tpm_autounlock=${TPM_AUTOUNLOCK})"
          echo "$matrix" | jq .
          if [[ "$count" -eq 0 ]]; then
            echo "::error::No matching variant/flavor cells"
            exit 1
          fi
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

          # Keep the scheduled coverage auditable. A variant with no desktop
          # image cannot be exercised by this ISO-based E2E; list it
          # explicitly instead of silently dropping it.
          {
            echo "## LUKS E2E coverage"
            echo
            echo "Testing **${count}** installable variant/flavor combinations."
            echo
            echo "| Base variant | amd64 graphical flavors |"
            echo "|---|---|"
            echo "$json" | jq -r '
              .variants[] | . as $variant
              | [.id, ([.flavors[]
                 | select(.build_image == true)
                 | select(.id != "base")
                 | select((.platforms // $variant.platforms // []) | index("linux/amd64"))
                 | .id] | join(", "))]
              | select(.[1] != "")
              | "| `\(.[0])` | \(.[1]) |"'
            echo
            echo "### Variants not testable by this workflow"
            echo
            echo "$json" | jq -r '
              [.variants[] | . as $variant
               | select([.flavors[]
                 | select(.build_image == true)
                 | select(.id != "base")
                 | select((.platforms // $variant.platforms // []) | index("linux/amd64"))] | length == 0)
               | "- `\(.id)`: no amd64 graphical image (`build_image: true`)"]
              | if length == 0 then "- None" else .[] end'
          } >> "$GITHUB_STEP_SUMMARY"

  luks:
    name: LUKS ${{ matrix.variant }}:${{ matrix.flavor }}
    needs: generate-matrix
    # Hosted runners provide KVM. AWS Free Tier instances do not support the
    # nested virtualization required for this QEMU-based install gate.
    runs-on: ubuntu-latest
    # 90 min was sized for the old local-only bootc install (no network
    # pull). fisherman now does a full image pull over the QEMU guest's NAT
    # networking (see docs/ci-troubleshooting.md §4 bug #19) — slower than a
    # host-level pull — on top of build + boot + install + reboot + boot
    # verification. The host-side OCI archive transfer added for image-store
    # compatibility can add tens of minutes on the larger variants; 150 min
    # cancelled skipjack cells during install despite no test failure. Keep
    # the per-QEMU wait bounded below, but allow the complete job four hours.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The absolute time by which iso-e2e.sh must have given up, so that the
      # job ends by failing a step rather than by hitting `timeout-minutes`
      # above.
      #
      # The difference matters. A step that fails leaves `if: always()` steps
      # to run, so Collect/Upload evidence still happen and the run is
      # diagnosable. A job-level timeout CANCELS the job, evidence steps
      # included, which is how #1100's cells burned hours and left nothing to
      # look at.
      #
      # iso-e2e.sh's own backstop could not deliver that on its own: it is a
      # RELATIVE limit (default 10800s) started when the script starts, and it
      # was sized against this job's 240 minutes as though nothing ran before
      # it. Plenty does — guppy:xfce spends ~133 min in Build dev ISO below —
      # so on the slow cells the 180-minute backstop could never fire inside
      # the ~105 minutes left and the job timeout won instead. An absolute
      # deadline is the same guarantee that survives a slow build.
      #
      # 10 minutes of reserve: Collect evidence + Upload evidence measure 1-3s
      # together, and the script's own teardown (stop recorder, ladder QEMU
      # down, assemble the timelapse) under a minute. The reserve is mostly
      # slack, deliberately — running the deadline close would trade a
      # diagnosable failure back for the undiagnosable one.
      - name: Set the job deadline
        run: |
          set -euo pipefail
          reserve=$((10 * 60))
          echo "E2E_WALL_CLOCK_DEADLINE=$(($(date +%s) + JOB_TIMEOUT_SECONDS - reserve))" \
            >> "$GITHUB_ENV"
        env:
          # Must track `timeout-minutes: 240` on this job.
          JOB_TIMEOUT_SECONDS: 14400

      # The dev ISO and install disk are large; reclaim ~25 GB first.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      # Blacksmith runners provide no systemd user session, so rootless
      # podman's default cgroup manager cannot create a scope and every
      # container build dies before running anything:
      #
      #   error running container: from /usr/bin/crun creating container for
      #   [/bin/sh -c echo "${BUILD_SCRIPTS_HASH}" > /dev/null]:
      #   sd-bus call: Interactive authentication required.
      #
      # That is polkit refusing a sd-bus call with no active session behind
      # it — not a build error, though it surfaces as one at a random RUN
      # step. All 50 cells of run 30243113215 failed this way. cgroupfs needs
      # no session; GitHub-hosted images happen to ship a session, which is
      # why this never appeared there.
      - name: Use the cgroupfs cgroup manager (no user session on this runner)
        run: |
          set -euo pipefail
          mkdir -p ~/.config/containers
          cat >~/.config/containers/containers.conf <<'CONF'
          [engine]
          cgroup_manager = "cgroupfs"
          CONF
          podman info --format '{{.Host.CgroupManager}}'

      - name: Maximize build space
        uses: ublue-os/container-storage-action@dc1f4c8f17b672069e921f001132f7cf98a423a6 # main as of 2026-02-11

      # ubuntu-24.04 exposes /dev/kvm as root:kvm 0660; widen so the QEMU child
      # (and its swtpm) can open it. Without KVM the LUKS boot is far too slow.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -la /dev/kvm 2>/dev/null && echo "KVM available" || echo "Warning: no /dev/kvm — TCG (slow)"

      # crun is installed explicitly and in the same transaction as podman.
      # Without it, podman comes from Ubuntu while crun comes from whatever
      # the runner image happens to ship, and a mismatched pair fails every
      # build at the first RUN with:
      #
      #   error running container: from /usr/bin/crun creating container for
      #   [/bin/sh -c echo "${BUILD_SCRIPTS_HASH}" > /dev/null]:
      #   unknown version specified
      #
      # That is crun rejecting the OCI spec version podman generated, not a
      # build error, though it surfaces as one at a random RUN step — the
      # same shape as the cgroup-manager failure documented below. It took
      # out every cell of run 30520334279. reusable-build-image.yml dodges
      # this by letting setup-runner install a matched podman stack
      # (update-podman: "true"); this job installs from apt, so the pair has
      # to be pinned together here.
      #
      # This step and the next four are bounded because they reach the network. Each limit is an order of
      # magnitude above the measured cost (apt ~20-40s, yq ~1s, GHCR login
      # ~1s, clone ~1-6s, the golang build ~15-17s) — they exist to turn a
      # wedged mirror or registry into a named step failure, not to police
      # duration.
      - name: Install dependencies
        timeout-minutes: 15
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            just podman crun jq \
            qemu-system-x86 qemu-utils ovmf swtpm socat sshpass imagemagick \
            systemd-boot-efi mtools squashfs-tools xorriso dosfstools gdisk \
            ffmpeg
          # ffmpeg is what turns record-timelapse.sh's frames into the video.
          # Without it the recorder captures normally and then has nothing to
          # assemble with, which is deliberately NOT a failure — the first
          # green cell to run with the recorder (skipjack:cosmic, run
          # 31135333873) shipped `timelapse/frame-count.txt` reading 203 and
          # no timelapse.webm, and stayed green. That is the contract working;
          # it is also 203 frames nobody can watch.
          podman --version; crun --version | head -1

      # iso-e2e.sh resolves the published image ref through
      # scripts/published-image-ref.sh, which needs yq. Without it the script
      # falls back to a guessed ref that is wrong for bonito-rawhide and
      # flounder-sid. The matrix job installs yq the same way.
      - name: Install yq
        timeout-minutes: 5
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      # The runner image ships podman 5.8.4, which wedges committing a
      # live-customized rootfs (#1893). Every ISO build needs the Kubic one
      # instead; this job ran `just iso` without it. Necessary, not
      # sufficient -- iso-e2e.yml installs this and its commit still exceeded
      # tacklebox's 600s bound on a GitHub-hosted runner (job 97638514487) --
      # but a build without it cannot finish at all.
      - name: setup working podman
        run: |
          set -euo pipefail
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/unstable/xUbuntu_24.04/Release.key \
            | gpg --dearmor | sudo tee /etc/apt/keyrings/kubic.gpg >/dev/null
          echo 'deb [signed-by=/etc/apt/keyrings/kubic.gpg] https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/unstable/xUbuntu_24.04/ /' \
            | sudo tee /etc/apt/sources.list.d/kubic.list
          sudo apt-get update -qq
          sudo apt-get remove -y podman conmon crun || true
          sudo apt-get install -y podman
          for p in /usr/local/bin/podman /usr/local/sbin/podman; do
            if [ -e "$p" ] && ! dpkg -S "$p" >/dev/null 2>&1; then
              sudo rm -f "$p"
            fi
          done
          hash -r

      - name: Log in to GHCR
        timeout-minutes: 5
        run: |
          echo "${{ env.GITHUB_TOKEN }}" | \
            podman login ghcr.io -u "${{ github.actor }}" --password-stdin

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Build a dev (SSHD-enabled) live ISO for this cell. dev=1 wires the
      # liveuser SSH login that iso-e2e.sh --luks drives the install over.
      #
      # `just iso` was the one genuinely unbounded thing in this job, and it
      # is also where #1100's "hang" actually was: guppy:xfce spends 2h13m
      # here (133m30s on run 31232170155, 132m18s on 31242742608 — the two
      # cells reported as hung, both of which went on to finish the LUKS
      # phase normally in 14-17 min). It is slow rather than stuck because
      # TACKLEBOX_FROM_SOURCE=1 on Gentoo compiles bootc from source; the
      # 9m26s `Finished release profile` line is visible in the run log.
      #
      # 170 min is ~1.27x that worst measured build. The rest of the matrix
      # is nowhere near it — grouper:xfce 10m33s (twice), yellowfin:niri-nvidia
      # 15m12s — so this only ever bites the Gentoo cells, and only if they
      # get ~27% slower than they have ever been observed to be. Sized this
      # loosely on purpose: a bound tight enough to flake is worse than none,
      # because the gate stops being trusted.
      #
      # It still leaves the deadline above with room. Worst case this step
      # ends at T+170, the two fisherman steps add ~1 min, and iso-e2e.sh
      # starts around T+174 against a T+230 deadline — 56 min for a phase
      # whose worst measured run is 17m09s.
      - name: Build dev ISO
        timeout-minutes: 170
        env:
          VARIANT: ${{ matrix.variant }}
          FLAVOR: ${{ matrix.flavor }}
          # fd95174 probes for tpm2-tss/pcsc inside the image instead of
          # omitting them unconditionally. e7d76b2a baked in
          # `--omit "tpm2-tss pcsc"` to fix Gentoo (which ships neither
          # module); on EL images, which ship both and force-add clevis on
          # top, that omit turns clevis into "cannot be installed" and
          # dracut exits 1 — every EL LUKS cell died at Build dev ISO.
          # Do not pin this back below fd95174 without re-reading that.
          TACKLEBOX_SHA: fd95174432b854a6135600b6c321b3ef01b4bc2d
        run: |
          export TACKLEBOX_FROM_SOURCE=1
          # Root, not bare — same reason as installer-screenshots.yml: on a
          # GitHub-hosted runner the rootless commit exceeds tacklebox's
          # hardcoded 600s bound, while the root path completes in ~133s.
          # Identical arguments to installer-smoke.yml's invocation, which is
          # the one measured green on this runner.
          sudo -E env "PATH=$PATH" just iso "${VARIANT}" "${FLAVOR}" ghcr "" 1
          ISO=$(find .build -maxdepth 3 -name "*.iso" | head -1)
          [[ -n "$ISO" ]] || { echo "::error::dev ISO not produced"; exit 1; }
          echo "ISO_PATH=${ISO}" >> "$GITHUB_ENV"

      - name: Clone fisherman (under-test)
        timeout-minutes: 10
        run: git clone --depth 1 --branch dev https://github.com/tuna-os/fisherman /tmp/fisherman

      - name: Build fisherman in a golang container
        timeout-minutes: 25
        run: |
          # Build inside golang:1.26 so we avoid the runner's root-owned
          # ~/go and ~/.cache (earlier sudo steps) and the apt Go 1.24 vs
          # fisherman's go.mod (1.26) mismatch entirely.
          GOVER=$(awk '/^go /{print $2; exit}' /tmp/fisherman/fisherman/go.mod)
          sudo podman run --rm -v /tmp/fisherman:/src:z -w /src/fisherman \
            "docker.io/library/golang:${GOVER}" \
            go build -buildvcs=false -o /src/fisherman-bin ./cmd/fisherman
          sudo chown "$(id -u)" /tmp/fisherman/fisherman-bin
          cp /tmp/fisherman/fisherman-bin /tmp/fisherman-bin
          echo "FISHERMAN_OVERRIDE=/tmp/fisherman-bin" >> "$GITHUB_ENV"

      - name: LUKS install + unlock verification
        env:
          VARIANT: ${{ matrix.variant }}
          FLAVOR: ${{ matrix.flavor }}
          # Set only in tpm_autounlock mode (generate-matrix already excluded
          # the variants that can never pass this — see docs/LUKS-TPM.md).
          # iso-e2e.sh itself fails the step (exit 8) on a bad unlock, so this
          # is what actually drives the third boot, not just a label.
          TUNAOS_E2E_VERIFY_TPM_AUTOUNLOCK: ${{ needs.generate-matrix.outputs.tpm_autounlock == 'true' && '1' || '0' }}
        run: |
          mkdir -p luks-out
          # -E: sudo resets the environment by default, which drops VARIANT/
          # FLAVOR (env: above) — iso-e2e.sh needs them to build the fisherman
          # recipe's image ref. Without -E it silently falls back to parsing
          # them from the ISO filename, which has a "tunaos-" project prefix
          # the fallback doesn't account for, producing a bogus image ref.
          # --memory 10240 (the script's default is 4096). Every cell that
          # passes today takes fisherman's bootcDirect path: bootc reads the
          # embedded offline store and writes the target, once. Composefs
          # images (sailfin, marlin, flounder, gentoo) cannot: bootc has to
          # run inside a container, so fisherman exports the image to an OCI
          # layout, has podman copy that into a scratch store, and only then
          # installs. That stages a 3.24 GB image three times, all of it
          # dirty page cache flushing through dm-crypt, on a guest with
          # 3903 MB of RAM and no swap.
          #
          # sailfin:gnome wedged there in run 30729902967: the guest stopped
          # answering ssh ~15s into `bootc install` and never came back,
          # with no OOM report, no hung-task splat and no panic on the
          # console, the signature of a guest thrashing in reclaim rather
          # than one being killed. The runner has 16 GB, so give the guest
          # headroom over the image instead of a hair under it. iso-e2e.sh's
          # own offline-store comment says the same thing: raise --memory
          # above the image size.
          #
          # 8192 was not enough, and the heartbeat added with it caught why:
          # the copy allocates on the order of the image, so run 30730744132
          # died with `Out of memory: Killed process 2978 (podman)
          # anon-rss:7147396kB` and `Total swap = 0kB`; podman was still
          # growing when the kernel picked it. 10240 keeps QEMU well inside
          # the runner's 16 GB while iso-e2e.sh attaches a swap disk to the
          # install boot, so an overshoot pages out instead of being killed.
          #
          # The allocation itself turned out to be the live root's
          # /etc/containers/mounts.conf entry for the payload store, which
          # podman copies into a tmpfs runroot rather than bind-mounting
          # (tunaOS#972 — see customize-live.sh). This headroom is kept for
          # the genuine staging copies, not because that copy still happens.
          #
          # E2E_WALL_CLOCK_DEADLINE and TUNAOS_E2E_VERIFY_TPM_AUTOUNLOCK are
          # named on the `env` line rather than left to `sudo -E` for the
          # same reason FISHERMAN_OVERRIDE is: -E is subject to sudoers
          # env_keep/env_reset, and either silently failing to arrive is
          # the wrong kind of failure — a deadline that never arrives puts
          # the harness back on its relative 10800s backstop (the exact
          # thing that could not fire in time on the slow cells), and a
          # TPM flag that never arrives would silently skip the one boot
          # this whole workflow input exists to add. Passed explicitly,
          # each either arrives or the script says so.
          sudo -E env FISHERMAN_OVERRIDE="$FISHERMAN_OVERRIDE" \
            E2E_WALL_CLOCK_DEADLINE="$E2E_WALL_CLOCK_DEADLINE" \
            TUNAOS_E2E_VERIFY_TPM_AUTOUNLOCK="$TUNAOS_E2E_VERIFY_TPM_AUTOUNLOCK" \
            ./scripts/iso-e2e.sh "${ISO_PATH}" --luks \
            --output luks-out \
            --memory 10240 \
            --timeout 1200
          # Gate = encrypted install + passphrase unlock to login. TPM2
          # auto-unlock is enrolled automatically by a first-boot oneshot
          # (fisherman#48) rather than a manual `ujust enable-luks-tpm2` step;
          # asserted below only when TUNAOS_E2E_VERIFY_TPM_AUTOUNLOCK=1 (the
          # tpm_autounlock dispatch input / quarterly schedule) — see
          # docs/LUKS-TPM.md and the header comment above for why it isn't
          # part of every cell.
          grep -qx 'TUNAOS_LUKS_E2E_INSTALL_STARTED luks=1' luks-out/luks-evidence.log
          grep -qx 'TUNAOS_LUKS_E2E_ENCRYPTED_DISK_CONFIRMED' luks-out/luks-evidence.log
          grep -qx 'TUNAOS_LUKS_E2E_PASS encrypted=1 passphrase_unlock=1 installed_boot=1' luks-out/luks-evidence.log
          if [[ "$TUNAOS_E2E_VERIFY_TPM_AUTOUNLOCK" == "1" ]]; then
            grep -qx 'TUNAOS_LUKS_E2E_TPM_AUTOUNLOCK_CONFIRMED' luks-out/luks-evidence.log
          fi

      - name: Collect evidence
        if: always()
        run: |
          sudo chown -R "$USER:$(id -gn)" luks-out 2>/dev/null || true
          for ppm in luks-out/*.ppm; do
            [[ -f "$ppm" ]] || continue
            convert "$ppm" "${ppm%.ppm}.png" || true
          done

      - name: Upload LUKS evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: luks-e2e-${{ matrix.variant }}-${{ matrix.flavor }}
          path: |
            luks-out/serial.log
            luks-out/live-serial.log
            # The installed system's serial. The passphrase gate writes here,
            # not to serial.log -- which is why serial.log is 0 bytes in every
            # passphrase-path artifact and the only desktop-contract marker in
            # them comes from live-serial.log, i.e. the live ISO. Without this
            # file there is no record of what the INSTALLED system did.
            luks-out/installed-serial.log
            luks-out/luks-evidence.log
            luks-out/*.png
            # The install timelapse (scripts/record-timelapse.sh). Recording it
            # and then not collecting it is how the first two cells that ran
            # with the recorder produced nothing to look at: the frames were
            # captured and discarded with the runner.
            #
            # frame-count.txt comes too, and is the part that stays useful when
            # there is no video: 0 means screendump found no surface (the virgl
            # path) or QEMU died before the first capture, which is a different
            # story from "ffmpeg was missing" and neither should be guessed at
            # from an absent file.
            luks-out/timelapse/timelapse.webm
            luks-out/timelapse/timelapse-poster.webp
            luks-out/timelapse/frame-count.txt
          if-no-files-found: warn
          retention-days: 14
