name: Weekly Desktop Screenshots

# Captures real DESKTOP screenshots of every variant × desktop by building the
# live ISO (which autologs into the session via livesys) and booting it in
# QEMU — unlike the QCOW2 path, which lands on the display-manager login screen.
#
# Publishes to R2 at screenshots/<variant>-<flavor>-latest.png, served from
# download.tunaos.org. The DesktopScreenshots component in tuna-os/docs reads
# exactly that path, so each variant landing page on tunaos.org shows current,
# automatically-refreshed desktop screenshots.
#
# Also commits the same screenshots to docs/images/desktops/ in this repo
# (single job at the end, one commit per run) so the repo itself always
# shows real, current desktops for every variant × DE.

on:
  schedule:
    # Mondays 02:00 UTC — after the weekend image builds have published.
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      variant:
        description: "Variant (blank = all)"
        required: false
        default: ""
        type: string
      flavor:
        description: "Flavor (blank = all: gnome, kde, niri, cosmic)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: weekly-desktop-screenshots
  cancel-in-progress: false

jobs:
  screenshot:
    name: ${{ matrix.variant }}/${{ matrix.flavor }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [yellowfin, albacore, skipjack, bonito, grouper]
        flavor: [gnome, kde, niri, cosmic, xfce]
        exclude:
          # grouper declares no niri flavour (see .github/build-config.yml:
          # base, gnome, gnome-asahi, gnome-zfs, kde, cosmic, xfce), so there
          # is no grouper:niri image to screenshot.
          - variant: grouper
            flavor: niri
    steps:
      - name: Check matrix filter
        id: filter
        env:
          WANT_VARIANT: ${{ github.event.inputs.variant }}
          WANT_FLAVOR: ${{ github.event.inputs.flavor }}
        run: |
          if [[ -n "$WANT_VARIANT" && "$WANT_VARIANT" != "${{ matrix.variant }}" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "$WANT_FLAVOR" && "$WANT_FLAVOR" != "${{ matrix.flavor }}" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.filter.outputs.skip != 'true'
        with:
          submodules: recursive
          persist-credentials: false

      - uses: ublue-os/container-storage-action@dc1f4c8f17b672069e921f001132f7cf98a423a6 # main as of 2026-02-11
        if: steps.filter.outputs.skip != 'true'

      # GitHub-hosted runners ship /dev/kvm as root:kvm 0660; widen it so the
      # nested QEMU gets KVM acceleration (same rule iso-e2e.yml uses).
      - name: Enable KVM group permissions
        if: steps.filter.outputs.skip != 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm 2>/dev/null && echo "KVM available" || echo "Warning: no /dev/kvm — QEMU uses TCG"

      - name: Install dependencies
        if: steps.filter.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            just podman jq golang-go git rclone \
            qemu-system-x86 qemu-utils ovmf socat imagemagick
          sudo wget -qO /usr/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 && sudo chmod +x /usr/bin/yq

      # The runner image ships podman 5.8.4, which wedges committing a
      # live-customized rootfs (#1893). Every ISO build needs the Kubic one
      # instead; this job ran `just iso` without it. Necessary, not
      # sufficient -- iso-e2e.yml installs this and its commit still exceeded
      # tacklebox's 600s bound on a GitHub-hosted runner (job 97638514487) --
      # but a build without it cannot finish at all.
      - name: setup working podman
        run: |
          set -euo pipefail
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/unstable/xUbuntu_24.04/Release.key \
            | gpg --dearmor | sudo tee /etc/apt/keyrings/kubic.gpg >/dev/null
          echo 'deb [signed-by=/etc/apt/keyrings/kubic.gpg] https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/unstable/xUbuntu_24.04/ /' \
            | sudo tee /etc/apt/sources.list.d/kubic.list
          sudo apt-get update -qq
          sudo apt-get remove -y podman conmon crun || true
          sudo apt-get install -y podman
          for p in /usr/local/bin/podman /usr/local/sbin/podman; do
            if [ -e "$p" ] && ! dpkg -S "$p" >/dev/null 2>&1; then
              sudo rm -f "$p"
            fi
          done
          hash -r

      - name: Log in to GHCR
        if: steps.filter.outputs.skip != 'true'
        run: echo "${{ env.GITHUB_TOKEN }}" | podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build live ISO (from published GHCR image)
        if: steps.filter.outputs.skip != 'true'
        timeout-minutes: 45
        env:
          GITHUB_REPOSITORY_OWNER: tuna-os
        run: |
          # The pinned tacklebox supports this escape hatch for hosts where
          # root-context podman's bridge DNS is broken. The customize script
          # fetches installer Flatpaks from GitHub/tunaos.org; host networking
          # gives that nested container the runner's working resolver.
          sudo TBOX_CUSTOMIZE_NETWORK=host GITHUB_REPOSITORY_OWNER=tuna-os \
            just iso "${{ matrix.variant }}" "${{ matrix.flavor }}" ghcr "${{ matrix.flavor }}"

      - name: Boot ISO and capture desktop screenshot
        if: steps.filter.outputs.skip != 'true'
        id: capture
        timeout-minutes: 20
        run: |
          ISO=$(find . -maxdepth 1 -name "${{ matrix.variant }}-${{ matrix.flavor }}-*.iso" | head -1)
          if [[ -z "$ISO" ]]; then
            echo "::error::No ISO found for ${{ matrix.variant }}-${{ matrix.flavor }}"
            exit 1
          fi
          KVM_FLAG=""
          [[ -r /dev/kvm && -w /dev/kvm ]] || KVM_FLAG="--no-kvm"

          # Boot to the live-ready marker, then keep the VM up so the desktop
          # can finish painting before we grab the screenshot.
          set +e
          sudo --preserve-env=KVM_FLAG ./scripts/iso-e2e.sh "$ISO" \
            --output shot-out --timeout 600 --keep-vm $KVM_FLAG
          rc=$?
          set -e
          echo "iso-e2e rc=$rc"

          # Let the compositor settle, then screendump the live desktop.
          if [[ -S shot-out/monitor.sock ]]; then
            sleep 45
            echo "screendump $(pwd)/shot-out/desktop.ppm" | \
              sudo socat - "UNIX-CONNECT:shot-out/monitor.sock" || true
            sleep 3
            echo "system_powerdown" | \
              sudo socat - "UNIX-CONNECT:shot-out/monitor.sock" || true
          fi

          # Prefer the settled desktop shot; fall back to iso-e2e's ready shot.
          SRC=""
          for cand in shot-out/desktop.ppm shot-out/10-ready.ppm shot-out/00-boot.ppm; do
            if sudo test -f "$cand"; then SRC="$cand"; break; fi
          done
          if [[ -z "$SRC" ]]; then
            echo "::warning::No screenshot captured for ${{ matrix.variant }}-${{ matrix.flavor }}"
            exit 0
          fi
          sudo convert "$SRC" screenshot.png 2>/dev/null || sudo cp "$SRC" screenshot.png
          sudo chown "$(id -u):$(id -g)" screenshot.png || true
          echo "captured=true" >> "$GITHUB_OUTPUT"
          echo "==> Captured $(ls -lh screenshot.png) from $SRC"

      - name: Upload screenshot artifact
        if: steps.filter.outputs.skip != 'true' && steps.capture.outputs.captured == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.variant }}-${{ matrix.flavor }}-desktop-screenshot
          path: screenshot.png
          if-no-files-found: warn

      - name: Publish desktop screenshot to R2
        if: steps.filter.outputs.skip != 'true' && steps.capture.outputs.captured == 'true'
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          if [[ -z "${RCLONE_CONFIG_R2_ACCESS_KEY_ID:-}" ]]; then
            echo "::notice::R2 credentials not configured; skipping publish."
            exit 0
          fi
          DATE=$(date +%Y%m%d)
          DEST="R2:${{ secrets.R2_BUCKET }}/screenshots"
          BASE="${{ matrix.variant }}-${{ matrix.flavor }}"
          # Dated archive copy + the stable "latest" the docs site links to.
          rclone copyto --s3-no-check-bucket --log-level INFO \
            screenshot.png "${DEST}/${BASE}-${DATE}.png"
          rclone copyto --s3-no-check-bucket --log-level INFO \
            screenshot.png "${DEST}/${BASE}-latest.png"
          echo "==> Published ${BASE}-latest.png to R2."

  # ── Commit the fresh screenshots to the repo ────────────────────────────────
  # One aggregate commit per run so every variant × DE page in docs/ shows a
  # real, current desktop. Runs even if some cells failed — whatever was
  # captured gets committed; missing cells keep their previous image.
  commit-to-repo:
    name: Commit screenshots to docs/images/desktops
    needs: screenshot
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Needed to open the refresh PR; `main` only accepts merge-queue changes.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Download all screenshot artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-desktop-screenshot"
          path: /tmp/shots

      - name: Stage screenshots
        id: stage
        run: |
          mkdir -p docs/images/desktops
          count=0
          for dir in /tmp/shots/*-desktop-screenshot; do
            [[ -d "$dir" ]] || continue
            base=$(basename "$dir")
            base="${base%-desktop-screenshot}"   # <variant>-<flavor>
            if [[ -f "$dir/screenshot.png" ]]; then
              cp "$dir/screenshot.png" "docs/images/desktops/${base}.png"
              count=$((count + 1))
            fi
          done
          echo "staged=${count}" >> "$GITHUB_OUTPUT"
          echo "Staged ${count} screenshot(s)"

      - name: Regenerate screenshot gallery
        if: steps.stage.outputs.staged != '0'
        run: bash scripts/gen-screenshot-gallery.sh

      # Opens a PR; does NOT push to main. `main` is protected by a
      # repository rule -- "Changes must be made through the merge queue" --
      # so `git push origin HEAD:main` is rejected outright (GH013). Observed
      # on installer-smoke.yml run 32704425971, where the identical step had
      # simply never executed before: it is gated on `staged != 0` and no
      # flavor had ever produced frames. All three screenshot writers carried
      # the same line; all three are now the matrix-status.yml shape.
      - name: Open the screenshot refresh PR
        if: steps.stage.outputs.staged != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: automation/desktop-screenshots
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/desktops docs/SCREENSHOTS.md
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit"
            exit 0
          fi
          git checkout -b "$BRANCH"
          git commit -m "docs: refresh desktop screenshots ($(date -u +%Y-%m-%d))"
          git push --force origin "$BRANCH"

          if [[ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]]; then
            gh pr create --base main --head "$BRANCH" \
              --title "docs: refresh desktop screenshots" \
              --body "$(printf '%s\n\n%s\n' \
                'Captured by the weekly desktop screenshot run and staged by `scripts/gen-screenshot-gallery.sh`.' \
                'Force-updated in place, so this branch always holds the newest capture.')"
          else
            echo "PR already open for $BRANCH — force-push refreshed it."
          fi

          # A PR opened with the Actions token starts no checks of its own;
          # the merge queue runs the required checks on the merge group, so
          # arming auto-merge is what actually lands the refresh.
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [[ -n "$pr" ]]; then
            gh pr merge --auto --merge "$pr" ||
              echo "::warning::could not arm auto-merge on #$pr — the refresh will wait for a human"
          fi
