name: Generate SPDX SBOM
description: Generate a bounded Syft SBOM with a package-manifest fallback
inputs:
  image-name:
    description: Published image name
    required: true
  image-registry:
    description: OCI registry containing the image
    required: true
  default-tag:
    description: Image tag
    required: true
  safe-platform:
    description: Filename-safe platform identifier
    required: true
runs:
  using: composite
  steps:
    - name: Setup Syft
      id: setup-syft
      uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      with:
        syft-version: v1.39.0

    - name: Generate SBOM
      id: sbom
      continue-on-error: true
      shell: bash
      env:
        SYFT_CMD: ${{ steps.setup-syft.outputs.cmd }}
        IMAGE_REGISTRY: ${{ inputs.image-registry }}
        IMAGE_NAME: ${{ inputs.image-name }}
        DEFAULT_TAG: ${{ inputs.default-tag }}
        SAFE_PLATFORM: ${{ inputs.safe-platform }}
        GOMEMLIMIT: 3GiB
        GOGC: "25"
        SYFT_MEMORY_RESERVE_MIB: "5120"
        SYFT_MEMORY_FLOOR_MIB: "2048"
      run: scripts/generate-sbom.sh

    - name: Synthesize SBOM from the package manifest
      id: sbom_fallback
      if: steps.sbom.outcome != 'success'
      continue-on-error: true
      shell: bash
      env:
        IMAGE_REGISTRY: ${{ inputs.image-registry }}
        IMAGE_NAME: ${{ inputs.image-name }}
        DEFAULT_TAG: ${{ inputs.default-tag }}
        SAFE_PLATFORM: ${{ inputs.safe-platform }}
      run: |
        set -euo pipefail
        IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}-${SAFE_PLATFORM}"
        OUT="sbom-${IMAGE_NAME}-${DEFAULT_TAG}-${SAFE_PLATFORM}.spdx.json"
        MANIFEST="packages-${IMAGE_NAME}-${DEFAULT_TAG}-${SAFE_PLATFORM}.txt"

        # The package-manifest producer is best effort, and images with no
        # package database publish only a marker. Do not emit an empty SBOM.
        if [ ! -s "$MANIFEST" ]; then
          echo "::warning::no package manifest for ${IMAGE} -- cannot synthesize an SBOM"
          exit 1
        fi

        python3 scripts/packages_to_spdx.py \
          --manifest "$MANIFEST" --output "$OUT" --image "$IMAGE"

        jq -e '.spdxVersion | startswith("SPDX-")' "$OUT" >/dev/null
        jq -e '(.packages // []) | length > 0' "$OUT" >/dev/null
        echo "::notice::SBOM for ${IMAGE} derived from the package manifest ($(jq '.packages | length' "$OUT") packages); syft did not complete."

    - name: Upload SBOM
      if: steps.sbom.outcome == 'success' || steps.sbom_fallback.outcome == 'success'
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sbom-${{ inputs.image-name }}-${{ inputs.default-tag }}-${{ inputs.safe-platform }}
        path: sbom-*.spdx.json
        if-no-files-found: error
        retention-days: 7
