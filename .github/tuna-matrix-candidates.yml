# Reference row, not a claim. Marlin:tuna is the only Tuna cell in
# .github/build-config.yml: experimental admission (#2990, closed), image
# only, amd64 only. tests/ cross-checks these four fields against the
# build config so drift fails loudly instead of silently qualifying media.
marlin_reference:
  variant: marlin
  admission: https://github.com/tuna-os/tunaOS/issues/2990
  build_image: true
  build_iso: false
  build_qcow2: false
  luks_e2e: false
  platforms:
    - linux/amd64
  pins: pending-final-qualification
