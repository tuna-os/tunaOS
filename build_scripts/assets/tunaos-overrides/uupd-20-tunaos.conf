# TunaOS: one actionable notification per failed uupd run, not three.
#
# Upstream uupd.service sets Restart=on-failure (60s delay, up to 3 restarts
# per 10 minutes) to ride out wifi-not-ready races at resume. But every
# retry re-sends the same critical "Some System Updates Failed" notice via
# session.Notify, so one persistently failing module (flatpak remote errors,
# full disk, offline brew mirror) spams the desktop up to 3x per timer run.
# The daily timer already retries tomorrow, and the OnFailure notice below
# offers a one-click retry — so disable the restart.
[Unit]
OnFailure=tunaos-uupd-notify@%n.service

[Service]
Restart=no
