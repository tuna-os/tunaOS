# TunaOS: one actionable notification after uupd's normal retry policy.
#
# uupd v1.5.1 emits its own non-actionable failure notice by invoking
# machinectl from the service. Hide that helper only inside uupd's private
# mount namespace; the OnFailure companion runs in its normal namespace and
# remains the single actionable notifier.
[Unit]
OnFailure=tunaos-uupd-notify@%n.service

[Service]
Restart=on-failure
PrivateMounts=yes
InaccessiblePaths=/usr/bin/machinectl
