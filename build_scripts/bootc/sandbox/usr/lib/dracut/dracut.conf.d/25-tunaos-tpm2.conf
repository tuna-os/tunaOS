# The initramfs must unlock a LUKS root with the TPM (tunaOS#5141). dracut's
# tpm2-tss module returns 255 from check(): it is only included when another
# module requires it, and on this base nothing does. The initramfs then held
# systemd-cryptsetup but no libtss2, no libcryptsetup-token-systemd-tpm2.so and
# no tpm2 tools, so the installed gurnard:pantheon opened no LUKS device and
# stopped in the emergency shell (runs 46062207664, 46083846171, 46088172319).
# Containerfile.ubuntu installs tpm2-tools and the libtss2 packages, so the
# module can be installed.
add_dracutmodules+=" tpm2-tss "
