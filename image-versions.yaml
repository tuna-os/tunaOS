# Pinned binary downloads (managed by Renovate)
downloads:
  # renovate: datasource=github-releases depName=ublue-os/uupd
  uupd: "v1.4.0"
  # renovate: datasource=github-releases depName=ledif/kcm_ublue
  kcm_ublue: "v0.6.1"
  # renovate: datasource=github-releases depName=twpayne/chezmoi
  chezmoi: "v2.72.0"
  chezmoi_sha256:
    amd64: "a8880a1b01e877c3e5da250b9f882ce9fa39962686d75f436fa21e021fa092b1"
    arm64: "ea9389f4efdc26d74bf9b4cc73db8f3a529e1e6effb5703e438117ea3f095439"
  # renovate: datasource=git-refs depName=tuna-os/tacklebox
  # This is the fallback every caller that does not set TACKLEBOX_SHA gets
  # (scripts/lib/common.sh:229) — installer-smoke.yml among them.
  #
  # FLOOR, not a ceiling: below fd95174, tacklebox bakes `--omit "tpm2-tss
  # pcsc"` into the dracut command line, which aborts the rebuild on any EL
  # image that force-adds clevis (see luks-e2e.yml). fd95174 is the commit
  # that replaced it with a per-image probe, and initramfs_test.go pins the
  # baked-in form gone. So never move this pin below fd95174 — moving it
  # ABOVE has always been fine, and a Renovate bump to an older-but-clean
  # digest is the thing to watch (tuna-os/iso-builder#43).
  #
  # At 4fa6041 for the live-boot fix: below it, the embedded initrd overlay
  # cannot mount the live root at all. $hookdir is on the image's read-only
  # /usr, so the queue directories cannot be created, tbox-live-root never
  # runs, and the boot dies in emergency on `overlayfs: failed to resolve
  # '/run/rootfsbase'`. Proven both ways by named runs: broken at
  # tacklebox 30629145076, booting to login at 30630284339.
  tacklebox: "f3dd168bf15b235b554e497e7192a64a6563c4a4"
  # f3dd168 carries the k8s-file log-driver fix for all podman runs
  # (tunaOS#1893): the runner images lack journald for the container,
  # and the customize/initramfs/commit steps otherwise die in conmon.

  # Zirconium's mkosi.extra payload, fetched as a source tarball by
  # build_scripts/install-zirconium.sh (niri stages only). Pinned to a commit
  # for the same reason every other download here is: `main` moves, so an
  # unpinned fetch makes niri builds non-reproducible and puts whatever landed
  # upstream in the last hour into the image. A tarball checksum is not an
  # option on top of this — GitHub generates the archive on demand and its
  # bytes are not stable — but the commit itself is content-addressed, so the
  # pin is what fixes the file set.
  # renovate: datasource=git-refs depName=zirconium-dev/zirconium
  zirconium_src: "d2cfb176433cd214a26d02abe572c1b9d9fcc72e"

  # Bootc toolchain built from source (see toolchain/) and published to
  # ghcr.io/tuna-os/bootc-toolchain-<base> as OCI artifacts via ORAS.
  # These pins drive both the toolchain builds and the version tags consumers
  # request. Renovate bumps them; the toolchain workflow rebuilds on bump.
  # renovate: datasource=github-releases depName=bootc-dev/bootc
  bootc: "v1.16.8"
  # renovate: datasource=github-releases depName=coreos/bootupd
  bootupd: "v0.2.36"
  # ostree from source only for bases whose packaged ostree is older than
  # bootc's required libostree (e.g. Debian trixie ships 2025.2 < 2025.3).
  # ostree is built from source (with its vendored composefs submodule) only for
  # bases whose packaged libostree is older than bootc's required 2025.3 — e.g.
  # Debian trixie ships 2025.2. Newer bases (sid) use the packaged libostree.
  # renovate: datasource=github-releases depName=ostreedev/ostree
  ostree: "v2026.4"
  # composefs: built from source (meson) and pkg-config-installed so the source
  # ostree can configure --with-composefs, on bases that don't package it (trixie).
  # renovate: datasource=github-releases depName=containers/composefs
  composefs: "v1.0.8"
