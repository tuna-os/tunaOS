# Expected installer screen sequence — the contract every TunaOS installer
# frontend must satisfy.
#
# There are five independently-forked frontends (org.tunaos.Installer{Kde,
# Cosmic,Niri,Xfce} + upstream org.bootcinstaller.Installer for gnome), so
# feature DRIFT is the default failure mode: a screen added or a recipe field
# wired up in one fork silently never lands in the others. This spec is what
# catches that — scripts/installer-walkthrough.py OCRs each captured frame and
# records which screens each frontend actually reached.
#
# keywords: case-insensitive, matched per visual state (see
#           scripts/installer-walkthrough.py). Write them as HEADINGS or
#           prompts unique to that screen — never bare nouns.
#
#           A bare noun matches the same word used as a field label somewhere
#           else. "encrypt" matched "Encryption: None" on KDE's Confirm
#           Installation page, reporting an encryption screen that frontend
#           does not have at all (its pages are welcome, diskselection,
#           confirm, progress, done). Likewise "target" matches both the disk
#           page's heading and the summary's "Target Disk: vda" row.
# required: true  → a frontend missing it FAILS the walkthrough (core flow)
#           false → recorded in the parity matrix but not fatal (feature drift
#                   we want visible before we make it mandatory)
screens:
  - id: welcome
    title: Welcome
    required: true
    # "install tunaos" dropped: same product-name coupling as the disk and
    # install lists. The remaining keywords are what a welcome screen says
    # regardless of what it is installing.
    #
    # MEASURED 2026-08-24 against all five frontends' source strings, the way
    # the disk list was on 2026-08-07. The disk list got that treatment; this
    # one was written from the premise that every welcome screen says
    # "welcome" or "get started". Four of the five do. KDE does not:
    #
    #     gnome   "Welcome to <product>"          welcome_title, welcome.py:93
    #     cosmic  "Welcome. This assistant..."    src/ui.rs:82  + "Get started"
    #     niri    "Welcome to <product>"          ui/installer.qml:186
    #     xfce    "Welcome to <product>"          app.py:68
    #     KDE     "Install <product>"             welcome main.qml:39,
    #                                             primary button "Next"
    #                                             (Wizard.qml:290)
    #
    # CORRECTION, same day: KDE's welcome PAGE says none of the four, but its
    # wizard does. Wizard.qml:46 names the step "Welcome" and Wizard.qml:185
    # draws it as a 1.6x heading above the page; it starts at opacity 0 and a
    # `running: true` animation fades it in at startup (Wizard.qml:216). So
    # the literal word IS on screen, and "the keyword list cannot describe
    # KDE's welcome screen" is NOT a sufficient explanation for run
    # 32718219267 reporting it unreached.
    #
    # What that run does establish stands: the readiness stamp from the same
    # process in the same guest read `signal=frame-swapped page=welcome`, so
    # the frontend was up and on its welcome page while the contract scored
    # it missing. Why the OCR did not see a heading that large is now an open
    # question -- scripts/installer-walkthrough.py prints the text it read on
    # any leg missing a required screen, which is what will answer it.
    #
    # "will guide you through" is kept as coverage rather than as the fix: it
    # is the orientation sentence KDE, niri and cosmic all put on the welcome
    # page and nowhere else (grepped across all five frontends), it carries no
    # product name, and it is a prompt rather than the bare noun the header
    # above forbids. It gives the welcome screen a second, independent
    # phrase to be recognised by, in the body copy rather than in a heading
    # that animates.
    keywords: ["welcome", "get started", "let's get", "begin",
               "will guide you through"]

  - id: disk
    title: Disk / target selection
    required: true
    # Heading/prompt text, not the "Target Disk: vda" row on the summary.
    #
    # MEASURED 2026-08-07 against the frontends' real headings. The list below
    # was evidently written from KDE's wording — KDE matches three of these
    # outright while Niri and XFCE matched none, which read as "no disk screen"
    # for two frontends that plainly have one:
    #     KDE     "Select Target Disk"                  matched
    #     Niri    "Destination"                         no match
    #     XFCE    "Where should TunaOS be installed?"   no match ("should be"
    #                                                    vs "will be")
    # "destination" is admitted as a bare-ish noun deliberately: it is the
    # entire heading on Niri, and it does not appear as a field label on any
    # other screen in any of the four frontends.
    #
    # PRODUCT-NAME-FREE from here on. The three keywords that embedded
    # "tunaos" are gone: the frontends are being changed to show the VARIANT
    # name the branding pipeline already computes (90-image-info.sh sets
    # distro_name = PRETTY_NAME, which is why gnome says "Welcome to
    # Skipjack"), so a keyword containing "tunaos" would stop matching the
    # moment a frontend is branded correctly — the contract would punish the
    # fix. Every keyword below is a heading or prompt that holds whatever the
    # product is called.
    #
    # "be installed" rather than "will be installed" / "where tunaos will be
    # installed": the product name sits INSIDE those phrases, so no
    # product-free keyword can span it. XFCE's heading is "Where should
    # <name> be installed?" and KDE's is "Choose the disk where <name> will
    # be installed." — "be installed" is the longest contiguous run common to
    # both that contains no product name. Verified against all four forks'
    # source: it appears on their disk screens and on no other screen.
    #
    # MEASURED 2026-08-24 against the GNOME frontend, which the 2026-08-07
    # measurement above could not have covered: gnome was absent from
    # installer-smoke.yml's matrix until #1039, so upstream bootc-installer
    # was the one fork nobody OCRed. Smoke run 32681262659 is the first time
    # this cell has ever run, and it reported
    #
    #   not ok - gnome: reached 'disk' screen (Disk / target selection)
    #     # not found on any state the installer advanced to
    #
    # while crediting encryption and summary -- screens that sit AFTER disk
    # selection in the flow, so the installer plainly passed through it.
    #
    # Its heading is "Install Location" (default-disk.blp:63), which matches
    # none of the six keywords above. Same shape as the install list below:
    # a frontend failing a screen it demonstrably reached is one wrong list,
    # not a wording bug.
    #
    # Checked against all five frontends' source before admitting it: the
    # string occurs exactly once in the whole set, on this page. It carries
    # no product name, so the branding work does not break it.
    keywords: ["select target disk", "select a disk", "choose the disk",
               "available disks", "be installed", "destination",
               "install location"]

  - id: encryption
    title: Disk encryption (LUKS)
    required: false
    # NOT bare "encrypt": that matches the summary page's "Encryption: None"
    # field label, which is the opposite of having reached an encryption
    # screen. Require the screen's own heading or its passphrase prompt.
    keywords: ["disk encryption", "encrypt this disk", "enter passphrase",
               "luks passphrase", "encryption passphrase"]

  - id: summary
    title: Summary / confirm
    required: true
    keywords: ["confirm installation", "review your choices", "summary",
               "ready to install", "about to install"]

  - id: install
    title: Install progress
    required: false
    # NOT "%" — a single character matches OCR noise from anywhere on screen
    # (taskbar, clock, window chrome). Run 29681255102 credited 'install' to
    # the Select Target Disk screen because of it, which is exactly the kind of
    # phantom row the parity matrix must never publish.
    # NOT bare "install" either: the disk page reads "where TunaOS will be
    # installed", and the welcome page describes the whole flow.
    # NOT "installing tunaos": the welcome page says "guide you through
    # installing TunaOS onto your computer". Progress screens say what they
    # are DOING, so match that instead.
    #
    # MEASURED 2026-08-07: ZERO of the four frontends matched this list.
    #     KDE     (no contract keyword present)
    #     Niri    "Installing…"
    #     XFCE    "Installing TunaOS"
    #     COSMIC  "Installing"
    # Four frontends failing the same optional screen is one wrong list, not
    # four wording bugs.
    #
    # NOT bare "installing", which was the obvious fix and is wrong. Niri's
    # ENCRYPTION page reads "cannot be turned on later without reinstalling",
    # and "installing" is a substring of "reinstalling". Encryption is not the
    # first state, so the crediting rule would NOT have caught it: bare
    # "installing" manufactures a phantom install row on the encryption screen.
    # Exactly the failure the notes above this list were written about.
    #
    # "installing tunaos" IS safe, and the comment above rejects it because
    # Niri's WELCOME prose says "guide you through installing TunaOS onto your
    # computer" — correct, but that prose lives on the FIRST state, which the
    # crediting rule already defends. So it is admitted, with the ellipsis form
    # for Niri's own heading.
    #
    # The fisherman step lines are included too. Every frontend streams the
    # same backend, so "partitioning" and "installing image" appear on the
    # progress screen of all four and on no other screen — the strongest
    # evidence available that an install is actually under way, which is the
    # principle this list already states ("progress screens say what they are
    # DOING").
    #
    # "installing tunaos" removed for the same reason as the disk keywords.
    # The fisherman step lines carry this screen instead: every frontend
    # streams the same backend, so "partitioning" and "installing image"
    # appear on the progress screen of all five and on no other screen, and
    # they do not contain a product name at all.
    #
    # RE-MEASURED 2026-08-24, this time against what is on the progress screen
    # BEFORE the backend has streamed a line -- which is the state a harness
    # screenshot actually catches, and which none of the keywords above cover:
    #
    #   gnome   "Installing", "0:00 elapsed", "Downloading system image..."
    #           (progress.blp:189,229; views/progress.py:101,689)
    #   kde     "Installing <product> onto <disk>. Do not power off the
    #           machine." (modules/progress/.../main.qml:35)
    #   cosmic  "Installing <product>" + caption "Do not power off the
    #           computer." (src/ui.rs:377,369)
    #   niri    "Installing..."               (ui/installer.qml:422)
    #   xfce    "Installing <product>" + a step label from PIPELINE_STEPS
    #           (app.py:18-22,325)
    #
    # "do not power off" is added for kde and cosmic: measured on both, unique
    # to the progress screen, carries no product name, and is present from the
    # moment the screen opens rather than only once the log has scrolled.
    #
    # gnome is deliberately left unmatched rather than guessed at. Its only
    # always-present product-free strings there are the bare word "Installing"
    # -- forbidden by the header above, and a substring of the welcome page's
    # "guide you through installing" -- and "elapsed", a single common word
    # that a log pane could easily produce. The distinctive sentence
    # "Installation will continue normally" (progress.blp:85) sits in the tour
    # panel, whose visibility depends on the recipe, so it is not something
    # this file can rely on. An unmatched advisory row that says why beats a
    # keyword that manufactures a phantom one.
    keywords: ["installation progress", "copying files", "deploying",
               "please wait", "writing image", "installing\u2026",
               "partitioning", "installing image", "do not power off"]

  - id: done
    title: Finished / reboot
    required: false
    # NOT "reboot" or "restart", and NOT bare "complete"/"finished"/"success".
    #
    # A LOGIN GREETER satisfies those. cosmic-greeter's power menu offers
    # Restart, Power Off and Suspend, so run 31183217981 — which never got past
    # the greeter, with the installer not running at all — was still credited
    # with reaching the FINISHED screen. That is the worst phantom row
    # available: it reports an install that completed on a machine where the
    # installer never started.
    #
    # Every keyword below needs a sentence a greeter has no reason to contain.
    # Checked against the frontends' real done-screen text: KDE renders
    # "Installation complete" and "TunaOS has been installed. Remove the
    # installation media and restart to boot into your new system"; upstream
    # bootc-installer renders "<product> is installed" (done.py). Note
    # "restart to boot" is admitted where bare "restart" is not — the phrase
    # cannot appear in a power menu.
    keywords: ["installation complete", "installation finished",
               "is installed", "has been installed",
               "remove the installation media",
               "restart to boot", "reboot into"]
