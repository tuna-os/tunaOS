url = "https://mirror.cachyos.org/repo/$arch/cachyos-extra"

[desktops.xfce-debian]
display_manager = "lightdm"
after_install = [
  "tuna-flatpak-remote",
  "flatpak-preinstall",
]

[desktops.xfce-debian.packages]

[desktops.xfce-debian.packages.apt]
required = [
  "xfce4",
  "xfce4-goodies",
  "lightdm",
  "lightdm-gtk-greeter",
  "xserver-xorg",
  "accountsservice",
  "xdg-desktop-portal-gtk",
  "thunar",
  "mousepad",
]

[desktops.xfce]
display_manager = "gdm"
versionlock = [
  "glib2",
]
after_install = [
  "xfce-greeter",
  "xfwm4-theme",
  "tuna-flatpak-remote",
  "flatpak-preinstall",
]

[desktops.xfce.packages]

[desktops.xfce.packages.fedora]
groups = [
  "xfce-desktop",
]
required = [
  "gdm",
  "xdg-desktop-portal-gtk",
  "xdg-user-dirs-gtk",
  "thunar",
  "mousepad",
  "ristretto",
  "xfce4-terminal",
]
optional = [
  "xfce4-wayland",
]

[desktops.xfce.packages.el10]
display_manager = "greetd"
required = [
  "xfwl4",
  "xfce4-session",
  "xfce4-panel",
  "xfce4-settings",
  "xfdesktop",
  "thunar",
  "tumbler",
  "xfce4-terminal",
  "xfce4-appfinder",
  "xfce4-notifyd",
  "xfce4-power-manager",
  "xfce4-screenshooter",
  "xdg-desktop-portal-gtk",
  "xdg-user-dirs-gtk",
]
optional = [
  "xfce4-whiskermenu-plugin",
  "xfce4-clipman-plugin",
  "mousepad",
  "ristretto",
]

[[desktops.xfce.packages.el10.repos]]
name = "tunaos-xfce"
baseurl = "https://repo.tunaos.org/xfce/10-stream-x86_64/"
priority = 10

[[desktops.xfce.packages.el10.copr]]
repo = "yselkowitz/cosmic-epel"
packages = [
  "greetd",
  "greetd-selinux",
]
options = "--nobest --allowerasing"

[desktops.xfce.packages.apt]
required = [
  "xfce4",
  "xfce4-goodies",
  "gdm3",
  "xdg-desktop-portal-gtk",
  "thunar",
  "mousepad",
]

[desktops.xfce.packages.zypper]
display_manager = "lightdm"
required = [
  "patterns-xfce-xfce",
  "patterns-xfce-xfce_basis",
  "lightdm",
  "lightdm-gtk-greeter",
  "thunar",
  "thunar-volman",
  "thunar-archive-plugin",
  "tumbler",
  "engrampa",
  "xfce4-terminal",
  "mousepad",
  "ristretto",
  "xfce4-screenshooter",
  "xfce4-taskmanager",
  "xfce4-appfinder",
  "xfce4-notifyd",
  "xfce4-power-manager",
  "xfce4-clipman-plugin",
  "xfce4-whiskermenu-plugin",
  "xfce4-pulseaudio-plugin",
  "xfce4-battery-plugin",
  "gvfs",
  "gvfs-backends",
  "gvfs-fuse",
  "xdg-desktop-portal",
  "xdg-desktop-portal-gtk",
  "xdg-user-dirs",
  "xdg-user-dirs-gtk",
  "NetworkManager-applet",
  "blueman",
  "pavucontrol",
  "gnome-keyring",
  "gnome-keyring-pam",
  "polkit-gnome",
  "Mesa-dri",
  "Mesa-libEGL1",
  "adwaita-icon-theme",
]

[desktops.xfce.packages.emerge]
required = [
  "xfce-base/xfce4-meta",
  "x11-misc/lightdm",
  "xfce-base/thunar",
  "xfce-base/tumbler",
  "x11-terms/xfce4-terminal",
  "sys-apps/xdg-desktop-portal",
  "sys-apps/xdg-desktop-portal-gtk",
  "gnome-base/gvfs",
  "gnome-base/gnome-keyring",
]
