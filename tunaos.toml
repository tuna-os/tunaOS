# niri Desktop Manifest — Arch Linux / CachyOS
#
# niri.yaml builds the Fedora set out of three COPRs (yalter/niri-git,
# avengemedia/danklinux, avengemedia/dms-git). Arch ships niri itself in
# [extra], so no third-party repo is needed here — but the DankMaterialShell
# pieces (quickshell, dms, dms-greeter) have no Arch equivalent in the official
# repos, so this is a plain niri session rather than a DMS one.
#
# Two name differences from the Fedora list: SwayNotificationCenter is `swaync`
# and adw-gtk3-theme is `adw-gtk-theme`.
#
# Every package below was verified present in core/extra for x86_64.

# GREETER: there is no DMS greeter here, but there IS an official graphical one.
#
# This file used to claim "Arch has no official equivalent" and left greetd on
# its packaged config. That config runs `agreety --cmd /bin/sh`, and agreety is
# NOT part of Arch's greetd package: it ships in greetd-agreety, which nothing
# installed. So greetd came up pointed at a binary that was not on the image:
#
#   $ pacman -Ql greetd | grep bin/
#   greetd /usr/bin/greetd          <- and nothing else
#   $ pacman -F usr/bin/agreety
#   usr/bin/agreety is owned by extra/greetd-agreety
#
# With Restart=always in the packaged unit that is a restart loop, not the text
# prompt the old comment assumed. Arch does carry the same fallback stack
# openSUSE uses, greetd-gtkgreet (/usr/bin/gtkgreet) and cage, both in
# [extra], so wire that up instead, via the shared greetd-gtkgreet.sh below.
#
# Still absent, and still a real gap: the DankMaterialShell session (quickshell,
# dms, dms-greeter) has no official Arch packaging, so this is a plain niri
# session with a gtkgreet login rather than a DMS one.
[desktops.niri-arch]
display_manager = "greetd"
versionlock = []
after_install = [
  "tuna-flatpak-remote",
  "greetd-gtkgreet",
  "flatpak-preinstall",
]

