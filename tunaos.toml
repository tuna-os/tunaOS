[variants.grouper]
emoji = "🪸"
asahi_verify = true
asahi_hardware = true
schedule = "20 17 * * *"
codename = "Epinephelus marginatus"
branding = { accent = "#E95420", gnome_accent = "orange", base = "Ubuntu", homage = "Ubuntu orange", plymouth = "coral" }
description = "Based on Ubuntu 26.04 Resolute Raccoon"
base_image = "docker.io/library/ubuntu:resolute@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c"
# Friendly alias: same digest also published as ghcr.io/tuna-os/<alias>:<flavor>
aliases = ["ubuntu"]
# Built directly from stock Ubuntu and bootcified in Containerfile.ubuntu
# (bootc from the tuna-os bootc-toolchain-sid oras artifact). See RFC 010.
# arm64: toolchain publishes latest-{amd64,arm64}; Containerfile.ubuntu is
# TARGETARCH-aware. Apple Silicon (Asahi) support gated behind
# ENABLE_ASAHI=1 (build_scripts/ubuntu-kernel.sh) — flavor wiring TBD.
platforms = ["linux/amd64", "linux/arm64"]

[[variants.grouper.flavors]]
id = "base"
stage = 1
build_image = true

[[variants.grouper.flavors]]
# Tuna Desktop (tuna_rollout above, tunaOS#3205): ubuntu package
# target, signed apt index repo.tunaos.org/tideforge/ubuntu. amd64
# only, like every tuna cell: the boot gate and the session
# qualification run on amd64.
id = "tuna"
stage = 2
platforms = ["linux/amd64"]
build_image = true
build_iso = false
build_qcow2 = false
luks_e2e = false

[[variants.grouper.flavors]]
id = "gnome"
stage = 2
build_image = true
build_iso = true

[[variants.grouper.flavors]]
# Apple Silicon (M1/M2, Asahi Linux) — full build with ENABLE_ASAHI=1
# (the kernel decision lives in Containerfile.ubuntu's base stage, so
# this is not an overlay). aarch64 only; no ISO (asahi-installer path).
#
# stage 3, NOT stage 1, and the distinction matters: `stage` is build
# ORDER, not parentage. This flavor has no PARENT_FLAVOR, so it still
# builds straight from base wherever it is placed — but at stage 1 it
# shared a matrix with base, and a stage does not advance until every
# cell in it passes. One arm64-only Apple Silicon flavor therefore gated
# gnome, kde, gnome-zfs, cosmic and xfce, which all live in stage 2:
# run 30688732984 promoted base and then never started them.
#
# Every other variant already places gnome-asahi at stage 3; grouper was
# the lone exception, because there asahi is a full build rather than an
# overlay and the stage number was read as "has no parent" rather than
# "runs first".
id = "gnome-asahi"
stage = 3
platforms = ["linux/arm64"]
build_image = true
build_iso = false

[[variants.grouper.flavors]]
# GNOME with ZFS-root support (prebuilt zfs.ko + zfs-dracut). ISO gated
# off until the install-to-filesystem ZFS-root path has a boot e2e (#625).
id = "gnome-zfs"
stage = 2
build_image = true
build_iso = false

[[variants.grouper.flavors]]
id = "kde"
stage = 2
build_image = true
build_iso = true

[[variants.grouper.flavors]]
# No niri — same reason as flounder and flounder-sid (#918): niri is not
# packaged for apt in Debian trixie, Debian sid or Ubuntu 26.04, and
# manifests/desktops/niri.yaml has no apt section. grouper is Ubuntu, so
# it was covered by that evidence but missed by the change.
#
# Nothing would have caught it either. With no packages.apt section the
# installer skips the install without error, and the apt path `exit 0`s
# before the shared tail — so the desktop experience contract never runs
# on an apt variant at all. That is the mechanism that published
# flounder:niri with no compositor (tunaOS#915); grouper:niri is not in
# the published set, so it evidently never completed, but the
# declaration was wrong either way.
# Packaging it ourselves is tunaos-packages#136. Do not re-add without it.
#
# COSMIC, by contrast, IS buildable here and is now declared. Ubuntu has
# no COSMIC in its own repos, but cosmic.yaml carries
# ppa:hepp3n/cosmic-epoch with condition: ubuntu, and install-desktop.sh
# adds a PPA when IS_UBUNTU — measured WITH the PPA enabled,
# cosmic-session, cosmic-comp, cosmic-settings and cosmic-greeter all
# resolve. (Measuring in a bare ubuntu container says nothing here: the
# installer adds repositories before it installs, so a probe that skips
# that step is answering a question about the wrong system.)
# amd64 only: ppa:hepp3n/cosmic-epoch publishes amd64 and amd64v3 and
# nothing else — no arm64 build of cosmic-session/cosmic-comp/etc exists
# for any series (Launchpad getPublishedBinaries). grouper otherwise
# builds both arches, so the arm64 job was the ONLY failure in run
# 31088031074 while amd64 built clean. Same shape as the amd64 cosmic
# pin on the EL10 variants for the x86_64-only Tideforge tier.
#
# This PPA dependency is tracked for removal in tunaOS#964 — see the
# status note at the top of manifests/desktops/cosmic.yaml's apt:
# block for exactly what has and hasn't landed on the Tideforge side.
id = "cosmic"
stage = 2
platforms = ["linux/amd64"]
build_image = true

[[variants.grouper.flavors]]
id = "xfce"
stage = 2
build_image = true
build_iso = true

