# ISO Builder presentation; catalog evidence remains authoritative.
# Export: python3 scripts/config.py generate-builder-config
# Output: docs/iso-builder.config.json, not an installed-image brand payload.
# Contract/defaults: docs/ISO-BUILDER-CONFIG.md and scripts/lib/iso_builder_config.py.
# Current schema 2 uses leaf IDs/facets; version 1 is explicit compatibility.
# Unknown keys fail validation. preview_only=true disables inspection/build UI;
# false does not grant permission or establish publication/qualification.
[iso_builder]
schema_version = 2
preview_only = false

# Browser name/links/assets only. HTTPS URLs or safe root-relative logo/favicon;
# no credentials. Missing optional assets must not inherit the stock brand.
[iso_builder.brand]
name = "TunaOS"
logo_url = "/wordmark.svg"
favicon_url = "/favicon-32.png"
homepage_url = "https://tunaos.org"
documentation_url = "https://tunaos.org/docs/iso-builder"
support_url = "https://github.com/tuna-os"

# Plain display text; accent_color is #RRGGBB, not arbitrary CSS.
[iso_builder.presentation]
headline = "Make TunaOS your own"
intro = "Choose your desktop, apps and image settings."
accent_color = "#5b9cf6"

# ISO filename/volume presentation, not registry image names. Uppercase volume
# label <=32 chars; lowercase filename prefix <=64 chars (validated grammar).
[iso_builder.output]
volume_label = "TUNAOS"
filename_prefix = "tunaos"

# kind="leaf" plus exact variant:flavor:platform ID, or kind="none". A default
# must be build-enabled in TOML AND admitted by the runtime catalog to select it.
[iso_builder.default_selection]
kind = "leaf"
leaf_id = "yellowfin:gnome:linux/amd64/v2"

# Ordered desktop IDs (optional default Flatpaks), not a new build matrix.
[[iso_builder.desktops]]
id = "gnome"

[[iso_builder.desktops]]
id = "kde"

[[iso_builder.desktops]]
id = "cosmic"

[[iso_builder.desktops]]
id = "niri"

[[iso_builder.desktops]]
id = "xfce"

# default_path references a path ID; paths order questions, facets label allowed
# values, recommendations suggest exact leaves. None bypass catalog/hardware gates.
[iso_builder.selection]
default_path = "desktop-first"

[[iso_builder.selection.paths]]
id = "desktop-first"
label = "Start with a desktop"
facets = ["desktop", "base", "edition", "hardware", "platform"]

[[iso_builder.selection.paths]]
id = "base-first"
label = "Start with a base"
facets = ["base", "desktop", "edition", "hardware", "platform"]

[[iso_builder.selection.facets]]
