# cosmic.yaml: cosmic-term is `cosmic-terminal` and cosmic-edit is
# `cosmic-text-editor`. Using the Fedora names fails the whole build, because
# pacman aborts the transaction on the first unknown target — the same way an
# AUR-only package took marlin:kde down (tuna-os/tunaos-packages#126).
#
# Every package below was verified present in core/extra for x86_64.
[desktops.cosmic-arch]
display_manager = "greetd"
versionlock = []
after_install = [
  "tuna-flatpak-remote",
  "flatpak-preinstall",
  "cosmic-dock",
]

[desktops.cosmic-arch.packages]

[desktops.cosmic-arch.packages.pacman]
required = [
  "cosmic-session",
  "cosmic-comp",
  "cosmic-greeter",
  "greetd",
  "cosmic-panel",
  "cosmic-app-library",
  "cosmic-applets",
  "cosmic-bg",
  "cosmic-launcher",
  "cosmic-notifications",
  "cosmic-osd",
  "cosmic-workspaces",
  "cosmic-idle",
  "cosmic-settings",
  "cosmic-settings-daemon",
  "cosmic-randr",
  "cosmic-screenshot",
  "cosmic-files",
  "cosmic-terminal",
  "cosmic-text-editor",
  "cosmic-store",
  "cosmic-icon-theme",
  "cosmic-wallpapers",
  "pop-icon-theme",
  "xdg-desktop-portal-cosmic",
  "xdg-desktop-portal-gtk",
  "xdg-user-dirs",
  "networkmanager",
  "pipewire",
  "wireplumber",
  "flatpak",
  "wl-clipboard",
  "power-profiles-daemon",
  "fwupd",
  "plymouth",
  "vulkan-icd-loader",
  "vulkan-swrast",
]

[desktops.cosmic-arch.packages.cachyos]
required = [
  "linux-cachyos",
  "linux-cachyos-headers",
  "cachyos-settings",
]

[[desktops.cosmic-arch.packages.cachyos.repos]]
name = "cachyos"
url = "https://mirror.cachyos.org/repo/$arch/cachyos"

[[desktops.cosmic-arch.packages.cachyos.repos]]
name = "cachyos-extra"
url = "https://mirror.cachyos.org/repo/$arch/cachyos-extra"

