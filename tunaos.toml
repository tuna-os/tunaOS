  "cage",
  "xwayland-satellite",
  "waybar",
  "fuzzel",
  "swaync",
  "swaylock",
  "swayidle",
  "swaybg",
  "cliphist",
  "xdg-desktop-portal-gnome",
  "xdg-desktop-portal-gtk",
  "xdg-user-dirs",
  "xdg-user-dirs-gtk",
  "polkit-gnome",
  "gnome-keyring",
  "wl-clipboard",
  "networkmanager",
  "pipewire",
  "wireplumber",
  "pavucontrol",
