# Image preinstall declarations, not proof of installed apps or remote identity.
# config.py generate-flatpak-policy -> build_scripts/desktop/flatpak-preinstall.tsv
# -> build_scripts/desktop/flatpak-preinstall.sh -> /usr/share/flatpak/preinstall.d.
# schema_version=1; each app requires id and branch="stable" (only supported branch).
# common applies first, then desktop_additions for the logical desktop; duplicate
# IDs across those scopes are rejected. No per-variant remove/override semantics.
# Installation still depends on the image's Flatpak tooling and remote setup;
# this table neither supplies remote credentials nor configures remote trust.
[flatpak_preinstall]
schema_version = 1
# .flatpakrepo of the project's own Flatpak remote, registered as `tuna-os` in
# images that ship Tuna Desktop and in live ISOs. Empty registers no remote.
remote_url = "https://tunaos.org/flatpak/tuna-os.flatpakrepo"
common = [
  { id = "io.github.kolunmi.Bazaar", branch = "stable" },
  { id = "org.mozilla.firefox", branch = "stable" },
]

[flatpak_preinstall.desktop_additions]
gnome = [{ id = "com.mattjakeman.ExtensionManager", branch = "stable" }]

# Marlin GDM override from aa9810e9 (tunaOS#3438). The generated -arch
# adapter takes precedence over tuna.yaml on pacman bases. The beta pin
# is unchanged. Pristine firstboot uses the distribution's GNOME Initial Setup
# through GDM's no-account flow.
[desktops.tuna-arch]
display_manager = "gdm"
versionlock = []
after_install = ["tuna-flatpak-remote", "tuna-gdm-theme", "tuna-gdm-default-session", "tuna-hide-other-sessions", "flatpak-preinstall"]

[desktops.tuna-arch.packages.pacman]
required = [
  "tunaos/tuna-desktop=1.0.0beta.2-2",
  "gdm",
  "gnome-initial-setup",
  "xorg-xwayland",
  "ibus",
  "orca",
  "gnome-shell",
  "gnome-settings-daemon",
  "gnome-control-center",
  "gnome-keyring",
  "evolution-data-server",
  "xdg-desktop-portal-gnome",
  "xdg-desktop-portal-gtk",
  "xdg-user-dirs",
  "gvfs",
  "nautilus",
  "ptyxis",
  "networkmanager",
  "libsecret",
  "pipewire",
  "wireplumber",
  "gst-plugin-pipewire",
  "gst-plugins-good",
  "power-profiles-daemon",
  "upower",
  "flatpak",
  "plymouth",
  "adwaita-icon-theme",
  "noto-fonts",
  "noto-fonts-emoji",
  "ttf-dejavu",
  "ttf-liberation",
]

# Optional read-only search sources for reviewed complete targets; these do not
# change image builds or installer trust.
[hardware.t2]
architectures = ["x86_64"]
package_managers = ["dnf"]
# The t2linux COPR kernel carries the bridge/keyboard/trackpad/audio stack.
# hardware-profile.sh installs the newest kernel EVR that repo offers and
# fails unless the installed kernel came from it, so a Fedora kernel can
# never silently win.
kernel = { dnf = "kernel", repo = "copr:sharpenedblade/t2linux" }

[hardware.t2.repos]
dnf = ["copr:sharpenedblade/t2linux"]

[hardware.t2.packages]
dnf = ["t2linux-release", "iwd"]

# T2 Macs use in-kernel brcmfmac; the proprietary wl driver must not ship.
[hardware.t2.conflicts]
dnf = ["broadcom-wl"]

[hardware.t2.require]
modules = ["brcmfmac"]

