# TunaOS primary configuration (TOML 1.0). Edit this file, not its adapters.
# Validate: python3 scripts/config.py validate
# Generate matrix + desktop adapters: python3 scripts/config.py generate
# Wiring, editing tools and remaining ownership gaps: docs/CONFIG-WIRING.md.
# This is build/authoring input, not a live installed-system settings file.
# Rebuild the affected artifact to apply changes; this does not update a host.
# Never store credentials, tokens, private keys or shell commands here.
# scripts/lib/tunaos_config.py rejects unknown fields, including future sketches
# in docs/PRIMARY-CONFIG-MIGRATION.md; only implemented sections are accepted.

# Primary schema version; integer 1 only (subsections version independently).
schema_version = 1

# Fork has no sibling images; empty array (validator requires the key).
sibling_images = []

[build]
# Coverage/reporting baseline, not a cap on variant/flavor platform lists.
# Supported: linux/amd64, linux/amd64/v2, linux/amd64/v3, linux/arm64.
# scripts/gen-platform-coverage.py reads this from the primary matrix projection.
global_platforms = ["linux/amd64", "linux/arm64"]
[iso_delivery]
# Cutover entries remain empty until qualification supplies a current catalog
# and matching receipts. Keep the retained inventory here, not in generated
# .github/build-config.yml, so setup-yq cannot discard rollback protection.
cutover_targets = []
retained_r2_isos = []


# Optional publishing section (intentionally omitted for owner-neutral forks):
# [build.publish]
# registry = "quay.io"  # Lowercase host, optional port; no scheme or credentials.
# namespace = "example"  # Lowercase OCI path, possibly nested; NOT a token.
# Both keys are required when the section is present. Per-field precedence in
# scripts/lib/publish-destination.sh: IMAGE_REGISTRY / REPO_ORGANIZATION env,
# then TOML, then GITHUB_REPOSITORY_OWNER (namespace), then ghcr.io / tuna-os.
# Inspect with scripts/publish-destination.sh. This selects image destinations,
# not authentication: CI credentials/permissions must also allow that destination.
# It does not configure ISO hosting, installed branding or registry mirrors.

# ── Identity ──────────────────────────────────────────────────────────────────
# What every image calls itself. A fork changes these to become a new
# distribution; build_scripts/lib/identity.env is generated from them
# (`python3 scripts/config.py generate-identity`) and 90-image-info.sh reads
# only that file. `just check` fails if the two drift apart.
[project]
name = "TunaOS"
id = "tunaos"
cpe_vendor = "jamesreilly"
# The project's own site and its documentation root. Read by the OCI image
# labels (`url`; `documentation` is <docs_url>/intro), the release notes and
# the SBOM document namespace (<website>/spdxdocs/). No trailing slash.
website = "https://tunaos.org"
docs_url = "https://tunaos.org/docs"
# Weekly adoption reports (`tunaos-countme`). Images POST their variant, flavor
# and architecture here, and nowhere else. Empty disables reporting in every
# image this file builds; leaving the key out does the same. A fork MUST replace
# or empty countme_endpoint: validation rejects the stock endpoint once name or
# id differ from TunaOS's, because a fork image that keeps a stock variant and
# flavor id would otherwise count as that TunaOS cell. countme_metrics_url is
# the public page the status text and the systemd units link to (only with an
# endpoint).
countme_endpoint = "https://countme.tunaos.org/v1/report"
countme_metrics_url = "https://tunaos.org/metrics"

[defaults.branding]
homepage = "https://github.com/tuna-os/tunaos"
documentation = "https://github.com/tuna-os/tunaos/tree/main/docs"
support = "https://github.com/tuna-os/tunaos/issues/"
bug_report = "https://github.com/tuna-os/tunaos/issues/"
# Boot splash for a variant without its own; each variant sets branding.plymouth.
plymouth = "tunaos"

# ── Grouped dedup ISOs (issue #455) ───────────────────────────────────────────
# Per-desktop-per-flavor ISOs are wasteful: all desktops on a variant share the
# same Enterprise-Linux base, so tacklebox `shared_store.dedup` packs several
# bootable environments into ONE combined squashfs (~80%+ dedup; an extra
# desktop adds ~300 MB rather than a whole new ISO). Each group below becomes a
# single ISO named `<variant>[-<suffix>].iso` whose systemd-boot menu lists
# every environment by title.
#
# `scripts/build-iso-group.sh` intersects each group's `flavors` with the
# variant's actual `build_image: true` flavors. Variants that lack certain
# desktops simply get a smaller ISO — no group
# needs per-variant tailoring here.
# All three fields are required; suffixes must be unique (empty = no suffix).
# flavors is the live boot menu; offline_flavors is the installer payload set.
# Lists name declared flavor IDs; neither enables a held build_image=false cell.
# This grouping does not change desktop packages or prove an ISO is published.
[[iso_groups]]
# Desktop ISO group: boots GNOME NVIDIA by default, and embeds
# both NVIDIA and non-NVIDIA flavors in the offline store for installer auto-detection.
# Published as `<variant>.iso`.
suffix = ""
flavors = ["gnome-nvidia", "gnome-nvidia-hwe"]
offline_flavors = ["gnome", "gnome-hwe", "gnome-nvidia", "gnome-nvidia-hwe"]

[[iso_groups]]
# ONE ISO PER BASE+DESKTOP, each embedding its own NVIDIA and HWE flavors —
# the same shape as the GNOME group above, applied to the other four
# desktops. Published as `<variant>-<suffix>.iso`.
#
# This replaces a single `community` group that packed KDE, COSMIC, Niri and
# XFCE into ONE ISO and carried `publish: false`, on the reasoning that the
# browser ISO Builder covers the long tail on demand so a five-flavor
# offline store was not worth the storage. The cost argument was sound; the
# conclusion was not. A user who wants KDE should get a KDE ISO, not a
# four-desktop ISO or a browser build step, and one desktop's offline store
# is a fraction of four.
#
# Storage does not grow the way the old comment implied either: these are
# DEDUPLICATED groups over a shared squashfs, so a per-desktop ISO carries
# its own desktop plus the base layers it already shares with every other
# ISO of the same variant.
suffix = "kde"
flavors = ["kde-nvidia"]
offline_flavors = ["kde", "kde-hwe", "kde-nvidia"]

[[iso_groups]]
suffix = "cosmic"
flavors = ["cosmic-nvidia"]
offline_flavors = ["cosmic", "cosmic-hwe", "cosmic-nvidia"]

[[iso_groups]]
suffix = "niri"
flavors = ["niri-nvidia"]
offline_flavors = ["niri", "niri-hwe", "niri-nvidia"]

[[iso_groups]]
suffix = "xfce"
flavors = ["xfce-nvidia"]
offline_flavors = ["xfce", "xfce-hwe", "xfce-nvidia"]

# ── BuildStream image family ─────────────────────────────────────────────────
# TunaOS images built in their own repositories with BuildStream. The README
# lists them in the image matrix as a distinct family, outside the distro ×
# desktop cell totals and green criteria. Each published image has its own
# scheduled build workflow; an unpublished local target has no image status.
# `image` + `workflow` describe a published OCI reference. `target` describes
# a local BuildStream target only. These records are reporting inputs.
[tuna_rollout]

[tuna_rollout.yellowfin]
status = "admitted"
package_target = "el10"

[tuna_rollout.grouper]
status = "admitted"
package_target = "ubuntu"
# The apt variants run dbus-daemon as the session bus, where activating the
# GNOME portal before the graphical session starts hangs instead of failing
# fast, and beta.1 then never starts graphical-session.target. Their portal
# check is blocked on the tuna-desktop session-start fix until a release
# ships it; the per-variant results are on tuna-desktop#577.
portals = "blocked on tuna-desktop session-start fix"

