description = "Based on Debian 13 Trixie (stable)"
base_image = "docker.io/library/debian:trixie@sha256:913f6706df59a68922d1dd08f78c2476560a8d367897200a6005b00e5f67c2d5"
# Friendly alias: same digest also published as ghcr.io/tuna-os/<alias>:<flavor>
aliases = ["debian"]
platforms = ["linux/amd64"]

[[variants.flounder.flavors]]
# base + gnome carry an arm64 leg solely as the parent chain for
# gnome-asahi (debian:trixie is multiarch; the bootc toolchain
# publishes latest-arm64). Other DEs stay amd64 for now.
id = "base"
stage = 1
platforms = ["linux/amd64", "linux/arm64"]
build_image = true

[[variants.flounder.flavors]]
id = "gnome"
stage = 2
platforms = ["linux/amd64", "linux/arm64"]
# Off: Debian 13 trixie ships GNOME 48.7 and the floor is 50
# (manifests/desktops/gnome.yaml minimum_version), so this flavor
# cannot ship a conforming desktop from its own base.
#
# Backporting was measured, not assumed. The sid -> trixie closure
# for GNOME 50 is 165 source packages, 122 of them Rust crates, and
# it pulls rustc 1.85 -> 1.95, debhelper 13 -> 14, systemd 257 ->
# 262 and three LLVM toolchains trixie does not have; the build
# order cannot even be computed, because gdk-pixbuf, glycin, mutter,
# nautilus and the rust-gdk4 crates form a build-dependency cycle.
# With only gnome-shell and mutter as roots it is still 151. For
# scale, the same engine says Ubuntu resolute needs 18 and Debian
# sid needs 1, and trixie-backports carries no GNOME stack at all.
# That is a partial distribution rebuild, not a desktop backport
# (tuna-os/tunaos-packages#687).
#
# Debian GNOME ships from flounder-sid, which has 50.4 natively and
# takes 51 within weeks of release. Turn this back on only after
# re-measuring: while trixie is frozen the number only grows.
build_image = false
build_iso = false

[[variants.flounder.flavors]]
# gnome-asahi: NOT declared, and not an oversight.
#
# build_scripts/overlay/asahi.sh's debian branch resolves a real
# linux-image-*-asahi package from the Bananas team's archive, but the
# published ghcr.io/tuna-os/flounder:gnome-asahi tag currently ships
# stock 6.12.100+deb13-arm64 — the purge-then-install of the asahi
# kernel never runs, because it is not even reached: this flavor's
# arm64 build fails outright at Containerfile.overlay's `pacman`
# detection step. That step uses bash-only `command -v pacman
# &>/dev/null` in a RUN instruction with no `bash -c` wrapper, so it
# runs under the image's default shell — dash on this (Debian) base,
# which does not understand `&>` and mis-parses it as `command -v
# pacman &` (backgrounded) `>/dev/null` (redirecting nothing), always
# entering the `then` branch and invoking a `pacman` that does not
# exist on Debian (build 93057902527, 2026-08-08: "pacman: not
# found", exit 127). Fixed in this same change (Containerfile.overlay
# now uses portable redirection), but with that fixed the harness
# still needs to confirm the Bananas kernel actually boots and covers
# real Apple Silicon hardware before this is safe to publish again —
# unverified as of this writing.
#
# tunaOS#911: "until fixed, [this] should stop being promoted rather
# than shipping as unbootable" — a user selecting it in the installer
# catalog gets a Mac that does not boot. Re-add once a build with the
# portability fix has actually produced and verified an asahi kernel
# here. Same pattern as guppy's absent niri/cosmic flavors elsewhere
# in this file.
id = "kde"
stage = 2
build_image = true
build_iso = true

[[variants.flounder.flavors]]
# No cosmic: COSMIC is not packaged in Debian AT ALL. Checked every
# suite via ftp-master's madison API (oldoldstable through unstable and
# experimental) for cosmic-session, cosmic-comp, cosmic-panel,
# cosmic-files, cosmic-term, cosmic-settings, cosmic-greeter and
# xdg-desktop-portal-cosmic — every one returns empty, while a control
# (kde-plasma-desktop) returns suites. The apt section of
# manifests/desktops/cosmic.yaml is served by ppa:hepp3n/cosmic-epoch,
# which is `condition: ubuntu` and publishes for resolute only, so on a
# Debian base the package list has no source at all:
#   E: Unable to locate package cosmic-comp   (and 18 more)
# flounder:cosmic, LUKS run 31087927879. Same reason niri is absent
# below; it fails louder only because apt exits 100 on an unknown name
# while niri.yaml had no apt section at all, so that one installed
# nothing and exited 0. Do not re-add without a Debian source for COSMIC.
#
# That Debian source is what tunaOS#964 is building — our own
# Tideforge-built debs, not another PPA (which wouldn't cover Debian
# anyway). See manifests/desktops/cosmic.yaml's apt: block for the
# current widen/publish status before re-adding this flavor.
# No niri: it is not packaged for apt in Debian trixie, Debian sid or
# Ubuntu 26.04 (all three checked), and manifests/desktops/niri.yaml
# has no apt section as a result. Building it produced a PUBLISHED,
# installable image with no compositor at all — `command -v niri` was
# empty in ghcr.io/tuna-os/flounder:niri. See tunaOS#915; packaging it
# ourselves is tracked in tunaos-packages#136 and needs a whole deb
# toolchain this org does not have yet. Do not re-add without one.
id = "xfce"
stage = 2
build_image = true

[[variants.flounder.flavors]]
# Tuna Desktop (tuna_rollout above, tunaOS#3206): trixie package
# target, signed apt index repo.tunaos.org/tideforge/debian-trixie.
id = "tuna"
stage = 2
platforms = ["linux/amd64"]
build_image = true
build_iso = false
build_qcow2 = false
luks_e2e = false

[[variants.flounder.flavors]]
# NVIDIA overlay on the Debian base (tunaOS#624): nvidia-driver via
# apt (official Debian non-free component, not a third-party repo) +
# dkms. See build_scripts/overlay/overrides/nvidia-debian/20-nvidia.sh.
