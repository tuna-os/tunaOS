#
# xfce.yaml installs Fedora's `xfce-desktop` group. Arch has an `xfce4` group
# too, but groups expand to whatever the mirror holds on the day and pacman
# --noconfirm takes all of it, so the set is listed explicitly here instead —
# a build should not change shape because a group gained a member upstream.
#
# Note this is the X11 xfwm4 session. tunaOS prefers a Wayland compositor for
# XFCE where one exists (xfwl4/labwc, see live-iso/common/src/desktop-xfce.sh),
# and Arch has no xfwl4 package — so on marlin, XFCE is X11 only until
# tuna-os/tunaos-packages#123 lands.
#
# Every package below was verified present in core/extra for x86_64.
[desktops.xfce-arch]
display_manager = "gdm"
versionlock = []
after_install = [
  "tuna-flatpak-remote",
  "flatpak-preinstall",
]

[desktops.xfce-arch.packages]

[desktops.xfce-arch.packages.pacman]
required = [
  "xfce4-session",
  "xfwm4",
  "xfce4-panel",
  "xfce4-settings",
  "xfce4-appfinder",
  "xfconf",
  "xfdesktop",
  "gdm",
  "xfce4-power-manager",
  "xfce4-notifyd",
  "xfce4-screenshooter",
  "xfce4-taskmanager",
  "xfce4-pulseaudio-plugin",
  "thunar",
  "thunar-volman",
  "thunar-archive-plugin",
  "xfce4-terminal",
  "mousepad",
  "ristretto",
  "file-roller",
  "xdg-desktop-portal-gtk",
  "xdg-user-dirs",
  "xdg-user-dirs-gtk",
  "network-manager-applet",
  "networkmanager",
  "pipewire",
  "wireplumber",
  "flatpak",
  "wl-clipboard",
  "power-profiles-daemon",
  "fwupd",
  "plymouth",
]

[desktops.xfce-arch.packages.cachyos]
required = [
  "linux-cachyos",
  "linux-cachyos-headers",
  "cachyos-settings",
]

[[desktops.xfce-arch.packages.cachyos.repos]]
name = "cachyos"
url = "https://mirror.cachyos.org/repo/$arch/cachyos"

[[desktops.xfce-arch.packages.cachyos.repos]]
name = "cachyos-extra"
url = "https://mirror.cachyos.org/repo/$arch/cachyos-extra"

# XFCE Desktop Manifest — Debian override.
#
# Debian sid's gdm3 pulls the GNOME stack. During the GNOME 50→51
# transition, sid's libgjs0 explicitly Breaks the available gnome-shell,
# which makes an otherwise independent XFCE build impossible to resolve.
# XFCE does not require GNOME or gdm3, so use LightDM on Debian bases.
[desktops.xfce-debian]
display_manager = "lightdm"
after_install = [
  "tuna-flatpak-remote",
  "flatpak-preinstall",
]

[desktops.xfce-debian.packages]

[desktops.xfce-debian.packages.apt]
required = [
  "xfce4",
  "xfce4-goodies",
  "lightdm",
  "lightdm-gtk-greeter",
  "xserver-xorg",
  "accountsservice",
  "xdg-desktop-portal-gtk",
  "thunar",
  "mousepad",
]

# XFCE 4.20 Desktop Manifest (Wayland — xfwl4 compositor)
[desktops.xfce]
display_manager = "gdm"
versionlock = [
  "glib2",
]
after_install = [
  "xfce-greeter",
  "xfwm4-theme",
  "tuna-flatpak-remote",
  "flatpak-preinstall",
]

[desktops.xfce.packages]

[desktops.xfce.packages.fedora]
groups = [
  "xfce-desktop",
]
required = [
  "gdm",
  "xdg-desktop-portal-gtk",
  "xdg-user-dirs-gtk",
  "thunar",
  "mousepad",
  "ristretto",
  "xfce4-terminal",
]
optional = [
  "xfce4-wayland",
]

[desktops.xfce.packages.el10]
display_manager = "greetd"
required = [
  "xfwl4",
  "xfce4-session",
  "xfce4-panel",
  "xfce4-settings",
  "xfdesktop",
  "thunar",
  "tumbler",
  "xfce4-terminal",
  "xfce4-appfinder",
  "xfce4-notifyd",
  "xfce4-power-manager",
  "xfce4-screenshooter",
  "xdg-desktop-portal-gtk",
  "xdg-user-dirs-gtk",
]
optional = [
  "xfce4-whiskermenu-plugin",
  "xfce4-clipman-plugin",
  "mousepad",
  "ristretto",
]

[[desktops.xfce.packages.el10.repos]]
name = "tunaos-xfce"
baseurl = "https://repo.tunaos.org/xfce/10-stream-x86_64/"
priority = 10

[[desktops.xfce.packages.el10.copr]]
repo = "yselkowitz/cosmic-epel"
packages = [
  "greetd",
  "greetd-selinux",
]
options = "--nobest --allowerasing"

[desktops.xfce.packages.apt]
required = [
  "xfce4",
  "xfce4-goodies",
  "gdm3",
  "xdg-desktop-portal-gtk",
  "thunar",
  "mousepad",
]

[desktops.xfce.packages.zypper]
display_manager = "lightdm"
required = [
  "patterns-xfce-xfce",
  "patterns-xfce-xfce_basis",
  "lightdm",
  "lightdm-gtk-greeter",
  "thunar",
  "thunar-volman",
  "thunar-archive-plugin",
  "tumbler",
  "engrampa",
  "xfce4-terminal",
  "mousepad",
  "ristretto",
  "xfce4-screenshooter",
  "xfce4-taskmanager",
  "xfce4-appfinder",
  "xfce4-notifyd",
  "xfce4-power-manager",
  "xfce4-clipman-plugin",
  "xfce4-whiskermenu-plugin",
  "xfce4-pulseaudio-plugin",
  "xfce4-battery-plugin",
  "gvfs",
  "gvfs-backends",
  "gvfs-fuse",
  "xdg-desktop-portal",
  "xdg-desktop-portal-gtk",
  "xdg-user-dirs",
  "xdg-user-dirs-gtk",
  "NetworkManager-applet",
  "blueman",
  "pavucontrol",
  "gnome-keyring",
  "gnome-keyring-pam",
  "polkit-gnome",
  "Mesa-dri",
  "Mesa-libEGL1",
  "adwaita-icon-theme",
]

[desktops.xfce.packages.emerge]
required = [
  "xfce-base/xfce4-meta",
  "x11-misc/lightdm",
  "xfce-base/thunar",
  "xfce-base/tumbler",
  "x11-terms/xfce4-terminal",
  "sys-apps/xdg-desktop-portal",
  "sys-apps/xdg-desktop-portal-gtk",
  "gnome-base/gvfs",
  "gnome-base/gnome-keyring",
]

# ISO Builder presentation only. CatalogSnapshot v1 still owns availability,
# target references and qualification. Export; never hand-edit the JSON adapter.
[iso_builder]
schema_version = 1
preview_only = false

[iso_builder.brand]
name = "TunaOS"
logo_url = "/logo.png"
favicon_url = "/favicon-32.png"
homepage_url = "https://tunaos.org"
documentation_url = "https://tunaos.org/docs/iso-builder"
support_url = "https://github.com/tuna-os"

[iso_builder.presentation]
headline = "Make TunaOS your own"
intro = "Choose your desktop, apps and image settings."
accent_color = "#5b9cf6"

[iso_builder.output]
volume_label = "TUNAOS"
filename_prefix = "tunaos"

[iso_builder.default_selection]
kind = "catalog"
variant = "yellowfin"
flavor = "gnome"
platform = "linux/amd64/v2"

[[iso_builder.desktops]]
id = "gnome"
name = "GNOME"
description = "A clean, focused desktop with an app overview."
default_flatpaks = ["io.github.kolunmi.Bazaar", "org.mozilla.firefox", "org.gnome.TextEditor"]

[[iso_builder.desktops]]
