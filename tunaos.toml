# Hardware profiles: a flavor opts in with `hardware = "<id>"` and
# `parent = "<flavor>"`, and build_scripts/overlay/hardware-profile.sh applies
# the profile on top of the parent image. Build scripts read the generated
# build_scripts/lib/hardware-profiles.json (scripts/config.py
# generate-hardware-profiles), never this file.

# Lenovo ThinkPad X13s (Qualcomm SC8280XP). The distro's stock kernel already
# carries every SC8280XP driver and the DTB; everything here comes from what
# postmarketOS boots this laptop with (device-lenovo-21bx).
[hardware.x13s]
architectures = ["aarch64"]
package_managers = ["dnf", "pacman"]
kernel = "stock"
# Pointer authentication is broken in the firmware, and unused clocks and
# power domains must stay on until their drivers load or display and USB drop.
kargs = ["arm64.nopauth", "clk_ignore_unused", "pd_ignore_unused"]

[hardware.x13s.packages]
# Adreno 690 (qcom/a660_*) and the board's DSP, audio topology and battery
# manager firmware (qcom/sc8280xp/LENOVO/21BX/).
dnf = ["qcom-firmware"]
pacman = ["linux-firmware-qcom"]

[hardware.x13s.initramfs]
# The X13s GPU is msm; the default early-KMS list would add about 230M of
# other vendors' firmware.
kms_drivers = ["msm"]
# postmarketOS's modules-initfs list: without these the initramfs has no
# display or keyboard, and a LUKS prompt is blind.
add_drivers = [
  "apr", "dispcc_sc8280xp", "dwc3", "dwc3_qcom", "extcon_core", "gpio_sbu_mux",
  "gpucc_sc8280xp", "hci_uart", "hid_generic", "hid_multitouch", "i2c_hid_of",
  "i2c_hid_of_elan", "i2c_qcom_cci", "i2c_qcom_geni", "icc_bwmon", "icc_osm_l3",
  "leds_gpio", "leds_qcom_lpg", "llcc_qcom", "lpasscc_sc8280xp", "msm", "nvme",
  "panel_edp", "pci_pwrctrl_pwrseq", "pcie_qcom", "phy_qcom_edp",
  "phy_qcom_qmp_combo", "phy_qcom_qmp_pcie", "phy_qcom_qmp_usb",
  "phy_qcom_snps_femto_v2", "pinctrl_sc8280xp_lpass_lpi", "pmic_glink",
  "pmic_glink_altmode", "pwm_bl", "pwrseq_core", "pwrseq_qcom_wcn", "q6apm_dai",
  "q6apm_lpass_dais", "q6prm", "q6prm_clocks", "qcom_pm8008_regulator",
  "qcom_battmgr", "qcom_camss", "qcom_common", "qcom_pm8008", "qcom_pon",
  "qcom_q6v5_pas", "qcom_rng", "qcom_spmi_adc5", "qcom_spmi_adc_tm5",
  "qcom_spmi_temp_alarm", "qcom_stats", "qcom_wdt", "qrtr", "qrtr_smd",
  "rtc_pm8xxx", "typec", "videocc_sm8350",
]
# GPUs this laptop does not have pull in their firmware (NVIDIA GSP alone is
# about 100M); the boot set must fit an ESP shared with postmarketOS.
omit_drivers = ["nouveau", "nvidia", "amdgpu", "radeon", "i915", "xe"]
dracut_modules = ["crypt"]

[hardware.x13s.devicetree]
# The firmware boots Linux with ACPI tables, but this laptop needs its DTB.
dtb = "qcom/sc8280xp-lenovo-thinkpad-x13s.dtb"
select = "auto"

[hardware.x13s.require]
# SoC, display, keyboard and touchpad, NVMe, USB-C, Wi-Fi, Bluetooth, audio,
# battery. A missing one fails the build.
kconfig = [
  "CONFIG_ARCH_QCOM", "CONFIG_ARM_QCOM_CPUFREQ_HW", "CONFIG_ATH11K_PCI",
  "CONFIG_BATTERY_QCOM_BATTMGR", "CONFIG_BLK_DEV_NVME", "CONFIG_BT_HCIUART_QCA",
  "CONFIG_DRM_MSM", "CONFIG_DRM_PANEL_EDP", "CONFIG_I2C_HID_OF",
  "CONFIG_I2C_QCOM_GENI", "CONFIG_PCIE_QCOM", "CONFIG_PHY_QCOM_QMP_COMBO",
  "CONFIG_PHY_QCOM_QMP_PCIE", "CONFIG_PINCTRL_SC8280XP", "CONFIG_QCOM_PMIC_GLINK",
  "CONFIG_QCOM_Q6V5_PAS", "CONFIG_QRTR", "CONFIG_RPMSG_QCOM_GLINK_SMEM",
  "CONFIG_SND_SOC_SC8280XP", "CONFIG_TYPEC", "CONFIG_UCSI_PMIC_GLINK",
  "CONFIG_USB_DWC3",
]
# Elan touchscreen (touchscreen models only), camera sensor supplies, live ISO
# root (this profile builds no ISO). Arch Linux ARM's linux-aarch64 7.2.11 has
# none of these three; reported, never silently dropped.
kconfig_optional = ["CONFIG_I2C_HID_OF_ELAN", "CONFIG_REGULATOR_QCOM_PM8008", "CONFIG_SQUASHFS_ZSTD"]
# Each must be a loadable module or listed in the kernel's modules.builtin
# (Fedora builds some of these into vmlinuz); one that is neither fails the build.
# i2c_hid_of_elan is not here: CONFIG_I2C_HID_OF_ELAN is optional above.
modules = [
  "ath11k_pci", "dispcc_sc8280xp", "dwc3_qcom", "gpucc_sc8280xp", "i2c_hid_of",
  "i2c_qcom_geni", "msm", "nvme", "panel_edp", "pcie_qcom",
  "phy_qcom_qmp_combo", "phy_qcom_qmp_pcie", "phy_qcom_qmp_usb", "pmic_glink",
  "pmic_glink_altmode", "qcom_battmgr", "qcom_q6v5_pas", "qrtr", "snd_soc_sc8280xp",
]
firmware = [
  "/usr/lib/firmware/qca/hpbtfw21.tlv",
