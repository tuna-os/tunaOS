# Unpinned 2026-09-17. The note this replaces named the condition itself:
# "If quay GCs this one inside a day as well, that is the second strike and
# bonito should follow them to a bare tag." It did, and this is that.
#
# sha256:2c38c5f7… (tunaOS#2464) was GC'd within a day. sha256:4a460ed0…
# replaced it on 2026-09-12 and was GC'd between the green nightly of
# 2026-09-13 (run 34768771243) and the red one of 2026-09-14 (34871837299).
# Every Build Bonito since has died in the pull, all four retries:
#
#   Error: ... reading manifest sha256:4a460ed0… in quay.io/fedora/fedora-bootc:
#   manifest unknown
#
# Verified by direct registry query, not inferred:
#
#   GET /v2/fedora/fedora-bootc/manifests/sha256:4a460ed0…  -> 404
#   GET /v2/fedora/fedora-bootc/manifests/44                -> sha256:38ef702a…
#
# Two digests, two garbage collections, five days. quay does not retain
# replaced manifests for fedora-bootc even on a release tag, so :44 behaves
# like rawhide and tumbleweed below and gets their treatment. A digest that
# 404s buys no reproducibility — it buys a red base and all 16 cells behind
# it, because every downstream flavor pulls through this one line.
