# TunaOS primary configuration. Matrix ownership migration, phase 1.
# Edit this file; .github/build-config.yml is generated at setup.
# Package and branding migration: docs/PRIMARY-CONFIG-MIGRATION.md.

schema_version = 1

[build]
global_platforms = ["linux/amd64", "linux/arm64"]

# ── Grouped dedup ISOs (issue #455) ───────────────────────────────────────────
# Per-desktop-per-flavor ISOs are wasteful: all desktops on a variant share the
# same Enterprise-Linux base, so tacklebox `shared_store.dedup` packs several
# bootable environments into ONE combined squashfs (~80%+ dedup; an extra
# desktop adds ~300 MB rather than a whole new ISO). Each group below becomes a
# single ISO named `<variant>[-<suffix>].iso` whose systemd-boot menu lists
# every environment by title.
#
# `scripts/build-iso-group.sh` intersects each group's `flavors` with the
# variant's actual `build_image: true` flavors, so a variant that lacks a
# Variants that lack certain desktops simply get a smaller ISO — no group
# needs per-variant tailoring here.
[[iso_groups]]
# Desktop ISO group: boots GNOME NVIDIA by default, and embeds
# both NVIDIA and non-NVIDIA flavors in the offline store for installer auto-detection.
# Published as `<variant>.iso`.
suffix = ""
flavors = ["gnome-nvidia", "gnome-nvidia-hwe"]
offline_flavors = ["gnome", "gnome-hwe", "gnome-nvidia", "gnome-nvidia-hwe"]

[[iso_groups]]
# ONE ISO PER BASE+DESKTOP, each embedding its own NVIDIA and HWE flavors —
# the same shape as the GNOME group above, applied to the other four
# desktops. Published as `<variant>-<suffix>.iso`.
#
# This replaces a single `community` group that packed KDE, COSMIC, Niri and
# XFCE into ONE ISO and carried `publish: false`, on the reasoning that the
# browser ISO Builder covers the long tail on demand so a five-flavor
# offline store was not worth the storage. The cost argument was sound; the
# conclusion was not. A user who wants KDE should get a KDE ISO, not a
# four-desktop ISO or a browser build step, and one desktop's offline store
# is a fraction of four.
#
# Storage does not grow the way the old comment implied either: these are
# DEDUPLICATED groups over a shared squashfs, so a per-desktop ISO carries
# its own desktop plus the base layers it already shares with every other
# ISO of the same variant.
suffix = "kde"
flavors = ["kde-nvidia"]
offline_flavors = ["kde", "kde-hwe", "kde-nvidia"]

[[iso_groups]]
suffix = "cosmic"
flavors = ["cosmic-nvidia"]
offline_flavors = ["cosmic", "cosmic-hwe", "cosmic-nvidia"]

[[iso_groups]]
suffix = "niri"
flavors = ["niri-nvidia"]
offline_flavors = ["niri", "niri-hwe", "niri-nvidia"]

[[iso_groups]]
suffix = "xfce"
flavors = ["xfce-nvidia"]
offline_flavors = ["xfce", "xfce-hwe", "xfce-nvidia"]

# ── Sibling images ─────────────────────────────────────────────────────────
# TunaOS-family bootc images built in their OWN repositories with BuildStream
# on freedesktop-sdk. They are whole-OS products, not package sources, and
# they never enter the variant matrix below or green-criteria.yml: each repo
# runs its own build, live-ISO, plain-install and LUKS-install checks.
# .github/scripts/sibling-images-status.sh renders their latest main-branch
# build into the README next to the variant matrix so the family is visible
# in one place. `workflow` is the repo's SCHEDULED build workflow.
[[sibling_images]]
id = "tromso"
emoji = "🏔️"
description = "Tromsø: KDE Plasma 6 on freedesktop-sdk (BuildStream)"
image = "ghcr.io/tuna-os/tromso"
repo = "tuna-os/tromso"
workflow = "build-tromso-multirunner.yml"
desktops = ["KDE"]

[[sibling_images]]
id = "xfce-linux"
emoji = "🐭"
description = "XFCE Linux: XFCE Wayland on freedesktop-sdk (BuildStream)"
image = "ghcr.io/tuna-os/xfce-linux"
repo = "tuna-os/xfce-linux"
workflow = "build-multirunner.yml"
desktops = ["XFCE"]

# ── Tuna Desktop rollout ─────────────────────────────────────────────────────
# tuna-os/tuna-desktop ADR 0008: every variant gets a `tuna` flavor, or is
# recorded here as unsupported with its reason; a variant is never silently
# left out. `package_target` is the TunaOS factory target
# (tuna-os/tunaos-packages manifests/package-factory.yaml) that must publish
# tuna-desktop and the session's missing pieces for that base. `admitted`
# variants carry a `tuna` flavor below; `unsupported` ones must not until
# the reason is resolved. tests/test_tuna_admission.py enforces both.
# Per-variant evidence: tunaOS issues #3195-#3207 and tunaOS#2990 (marlin).
[tuna_rollout]

[tuna_rollout.marlin]
status = "admitted"
package_target = "arch"

[tuna_rollout.yellowfin]
status = "admitted"
package_target = "el10"

[tuna_rollout.albacore]
status = "admitted"
package_target = "el10"

[tuna_rollout.skipjack]
status = "admitted"
package_target = "el10"

[tuna_rollout.bonito]
status = "admitted"
package_target = "fedora"

[tuna_rollout.wahoo]
status = "admitted"
package_target = "eln"

[tuna_rollout.bonito-rawhide]
status = "admitted"
package_target = "rawhide"

[tuna_rollout.hummingbird]
status = "unsupported"
package_target = "hummingbird"
reason = "unsupported until package target hummingbird publishes tuna-desktop (tunaos-packages#832)"

[tuna_rollout.sailfin]
status = "admitted"
package_target = "opensuse"

[tuna_rollout.gurnard]
status = "unsupported"
package_target = "noble"
reason = "unsupported until package target noble publishes tuna-desktop (tunaos-packages#834), which waits for Ubuntu to publish rustc >= 1.92 for noble (gtk4-rs 0.11 needs it; noble's newest is rustc-1.91); the factory vendors no toolchain"

[tuna_rollout.grouper]
status = "admitted"
package_target = "ubuntu"
# The apt variants run dbus-daemon as the session bus, where activating the
# GNOME portal before the graphical session starts hangs instead of failing
# fast, and beta.1 then never starts graphical-session.target. Their portal
# check is blocked on the tuna-desktop session-start fix until a release
# ships it; the per-variant results are on tuna-desktop#577.
portals = "blocked on tuna-desktop session-start fix"

[tuna_rollout.flounder]
status = "admitted"
package_target = "trixie"
portals = "blocked on tuna-desktop session-start fix"

[tuna_rollout.flounder-sid]
status = "admitted"
package_target = "debian"
portals = "blocked on tuna-desktop session-start fix"

[tuna_rollout.guppy]
status = "unsupported"
package_target = "gentoo"
reason = "unsupported until package target gentoo publishes tuna-desktop (tunaos-packages#838)"

# Build stages (for reference — enforced by the workflow job graph):
#
#   Stage 1:  base
#                ├── Stage 2: base-hwe, base-nvidia
#                └── Stage 2: gnome, kde, niri
#                                ├── Stage 3: gnome-hwe, kde-hwe, niri-hwe   (layer on base-hwe)
#                                └── Stage 3: gnome-nvidia, kde-nvidia, niri-nvidia   (layer on base-nvidia)
#                                                └── Stage 4: gnome-nvidia-hwe  (layer on gnome-hwe)
#
# The `stage` field on each flavor tells generate_matrix which job matrix it belongs to:
#   stage: 1  → build_base      (no dependencies)
#   stage: 2  → build_stage2    (needs: build_base)
#   stage: 3  → build_stage3    (needs: build_stage2)
#   stage: 4  → build_stage4    (needs: build_stage3)
[variants]

[variants.yellowfin]
emoji = "🐠"
description = "Based on AlmaLinux Kitten 10"
base_image = "quay.io/almalinuxorg/almalinux-bootc:10-kitten@sha256:fabe22d605a5638cb1fbf2df38d6d9b9ace35f15cb1c10c7db87d475a039d58a"
# Friendly alias: same digest also published as ghcr.io/tuna-os/<alias>:<flavor>
aliases = ["almalinux-kitten"]
platforms = ["linux/amd64", "linux/amd64/v2", "linux/arm64"]

[[variants.yellowfin.flavors]]
# ── Stage 1 ────────────────────────────────────────────────────────────
id = "base"
stage = 1
build_image = true
build_iso = false
build_qcow2 = false

[[variants.yellowfin.flavors]]
# ── Stage 2 ────────────────────────────────────────────────────────────
id = "base-hwe"
stage = 2
build_image = true
build_iso = false
build_qcow2 = false

[[variants.yellowfin.flavors]]
id = "base-nvidia"
# x86_64 only: the akmods-nvidia-open kmods are x86_64 builds, so on
# any other platform the exact-EVR kmod install can never match and
# the overlay hard-fails (overrides/nvidia/10-kernel-swap.sh) rather
# than shipping a driverless "nvidia" image. Also excludes amd64/v2:
# Kitten v2 kernels are ARCH=x86_64_v2, which no published kmod
# matches. Same shape as bluefin's x86_64-only GDX.
platforms = ["linux/amd64"]
stage = 2
build_image = true
build_iso = false
build_qcow2 = false

[[variants.yellowfin.flavors]]
# Tuna Desktop (tuna_rollout above, tunaOS#3195): el10 package target.
# amd64 only: gtkgreet is published for EL10 x86_64 only, and the
# boot gate and session qualification run on amd64.
id = "tuna"
stage = 2
platforms = ["linux/amd64"]
build_image = true
build_iso = false
build_qcow2 = false
luks_e2e = false

[[variants.yellowfin.flavors]]
id = "gnome"
# GNOME 50 on EL10 comes from the tunaos-packages tier at
# repo.tunaos.org/gnome50/10-stream-x86_64 (manifests/desktops/
# gnome.yaml), which publishes x86_64 only (the aarch64 path 404s,
# 2026-09-03). The floor is GNOME 50 (gnome.yaml minimum_version), so
# an arm64 leg would be the base's 49 -- not allowed to ship -- and is
# not declared. Re-add linux/arm64 here the day the tier grows an
# aarch64 index, and delete the variant from
# tests/test_el10_gnome_comes_from_the_github_built_tier.py's pin set
# in the same change. Same shape as xfce below.
platforms = ["linux/amd64", "linux/amd64/v2"]
stage = 2
build_image = true
build_iso = true
build_qcow2 = true

[[variants.yellowfin.flavors]]
id = "cosmic"
# COSMIC on EL10 comes from the Tideforge tier at
# repo.tunaos.org/repo/10-stream-x86_64 (manifests/desktops/
# cosmic.yaml), which publishes x86_64 only -- same shape as xfce.
platforms = ["linux/amd64"]
stage = 2
build_image = true
build_iso = true
build_qcow2 = false

[[variants.yellowfin.flavors]]
id = "kde"
stage = 2
build_image = true
build_iso = true
build_qcow2 = false

[[variants.yellowfin.flavors]]
id = "niri"
stage = 2
build_image = true
build_iso = true
build_qcow2 = false

[[variants.yellowfin.flavors]]
id = "xfce"
stage = 2
build_image = true
build_iso = true
build_qcow2 = false
# tunaOS xfce-wayland stack comes from repo.tunaos.org, which only
# publishes EL10 x86_64 packages — no aarch64 until the repo grows one.
platforms = ["linux/amd64", "linux/amd64/v2"]

[[variants.yellowfin.flavors]]
# ── Stage 3 ────────────────────────────────────────────────────────────
# HWE: no ISO — install the standard ISO then `bootc switch` to *-hwe
id = "gnome-hwe"
# Layers on gnome, which is amd64-only while the GNOME 50 tier has
# no aarch64 index (see gnome above).
platforms = ["linux/amd64", "linux/amd64/v2"]
stage = 3
build_image = true
build_iso = false
build_qcow2 = false

[[variants.yellowfin.flavors]]
# Apple Silicon (M1/M2, Asahi Linux) — overlay/asahi.sh, CentOS
# Hyperscale SIG packages-asahi (EXPERIMENTAL: kernel + glue only; boot
# payloads pending #777). aarch64 only; no ISO (asahi-installer path).
id = "gnome-asahi"
stage = 3
platforms = ["linux/arm64"]
# Off while gnome is amd64-only: this is the arm64 leg of gnome, and
# the GNOME 50 tier has no aarch64 index yet (see gnome above). Turn
# back on with the arm64 platform there.
build_image = false
build_iso = false
build_qcow2 = false

[[variants.yellowfin.flavors]]
id = "gnome-nvidia"
# x86_64 only: the akmods-nvidia-open kmods are x86_64 builds, so on
# any other platform the exact-EVR kmod install can never match and
# the overlay hard-fails (overrides/nvidia/10-kernel-swap.sh) rather
# than shipping a driverless "nvidia" image. Also excludes amd64/v2:
# Kitten v2 kernels are ARCH=x86_64_v2, which no published kmod
# matches. Same shape as bluefin's x86_64-only GDX.
platforms = ["linux/amd64"]
stage = 3
build_image = true
build_iso = true
build_qcow2 = false

[[variants.yellowfin.flavors]]
id = "gnome-nvidia-hwe"
# NOT built: this cell cannot mount its own root. See tunaOS#2518.
#
# It builds, signs and passes its desktop contract, then boots into an
# emergency shell:
#
#   mount: /sysroot: unknown filesystem type 'xfs'
#   Dependency failed for ostree-prepare-root.service
#
# `-hwe` selects the coreos-stable akmods bundle
# (scripts/build-image-inner.sh), so 10-kernel-swap.sh installs THAT
# bundle's kernel -- Fedora 43's -- into an EL10 userspace whose dracut
# is dracut-107-8.el10. That dracut leaves xfs out of the initramfs and
# says nothing about it. The non-HWE nvidia cells take 6.12.0-266.el10
# from the centos-10 bundle and boot, which is why only this
# combination is red, on all three EL10 variants at once.
#
# There is no EL10 HWE akmods bundle to switch to: the tag list on
# ghcr.io/ublue-os/akmods-nvidia-open stops at centos-10.
#
# Naming the filesystems in the dracut rebuild was tried and reverted
# (tunaOS#2517): `--filesystems` is strict, EL10 has no btrfs, and it
# broke every EL10 *-nvidia cell to repair this one.
#
# Re-declare the day an EL10 HWE bundle ships, or the day the fc43
# module tree is readable by EL10's dracut. The x86_64-only note below
# still applies when it comes back.
#
# x86_64 only: the akmods-nvidia-open kmods are x86_64 builds, so on
# any other platform the exact-EVR kmod install can never match and
# the overlay hard-fails (overrides/nvidia/10-kernel-swap.sh) rather
# than shipping a driverless "nvidia" image. Also excludes amd64/v2:
# Kitten v2 kernels are ARCH=x86_64_v2, which no published kmod
# matches. Same shape as bluefin's x86_64-only GDX.
platforms = ["linux/amd64"]
stage = 4
build_image = false
build_iso = false
build_qcow2 = false

[[variants.yellowfin.flavors]]
id = "cosmic-hwe"
# Layers on cosmic, which is amd64-only while the Tideforge COSMIC
# tier has no aarch64 index (see cosmic above).
platforms = ["linux/amd64"]
stage = 3
build_image = true
build_iso = false
build_qcow2 = false

[[variants.yellowfin.flavors]]
id = "cosmic-nvidia"
# x86_64 only: the akmods-nvidia-open kmods are x86_64 builds, so on
# any other platform the exact-EVR kmod install can never match and
# the overlay hard-fails (overrides/nvidia/10-kernel-swap.sh) rather
