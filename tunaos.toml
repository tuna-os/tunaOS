# ── Hummingbird ────────────────────────────────────────────────────────────
# Fedora Hummingbird: container-native, hardened bootc distribution
# (Konflux hermetic build model, CKI ARK kernel).
[variants.hummingbird]
emoji = "🐦"
schedule = "20 22 * * *"
# Left out of build-flavor.yml's manual sweep, as it was before this key existed.
# Delete the line to include it (adds this variant's cells to that dispatch).
flavor_dispatch = false
codename = "Trochilidae"
branding = { accent = "#1E9E8A", gnome_accent = "teal", base = "Fedora Hummingbird", homage = "a hummingbird's teal", plymouth = "bird" }
upstream_track = "experimental"
# Rolling, security-hardened fork tracking Fedora RAWHIDE -- not Fedora 43,
# whatever the .fc43 dist tags suggest -- and shipping NO desktop upstream.
# The desktop flavors below are therefore a PORT onto a desktop-less base,
# not a rebuild of an existing one. Read docs/HUMMINGBIRD.md before
# reasoning about what its package set should contain.
description = "Fedora Hummingbird (hardened rolling Rawhide fork, bootc)"
base_image = "quay.io/hummingbird-community/bootc-os:latest@sha256:538a4574dc5822c889c1588209a29282559ea7acd665609af09f1814d5010726"
# amd64 only, because aarch64 has nothing to build FROM yet: the base
# stage's mandatory xfsprogs guard (build_scripts/10-base-packages.sh) has
# no repository that can satisfy it on arm64, so every hummingbird arm64
# leg dies before a desktop is ever considered.
#
#   ERROR: xfsprogs did not install — no enabled repo carries it;
#          bootc install to-disk cannot format the root without it.
#
# Measured against the live indexes rather than inferred, 2026-09-11
# (repo.tunaos.org/hummingbird/20251124-$basearch/repodata):
#
#   x86_64    13442 packages   xfsprogs: 1   malcontent: 2
#   aarch64    7177 packages   xfsprogs: 0   malcontent: 0
#
# The aarch64 rebuild wave is roughly half-published, and the same gap
# explains the flatpak breakage two lines further down that log ("nothing
# provides libmalcontent-0.so.0 needed by flatpak-1.17.3-1.bfin1.aarch64"):
# malcontent is an x86_64-only build in that snapshot too.
#
# This is the arch-honesty criterion, not a retreat: advertising an
# architecture whose base cannot resolve its mandatory packages scores an
# unsatisfiable cell red every night and tells a user the image exists.
#
# The direction of travel points the same way. As hummingbird takes more of
# its package set from projectbluefin/utah-packages, arm64 gets further out
# of reach, not closer: that repository is a SINGLE-manifest OCI image
# (measured 2026-09-11 — mediaType application/vnd.oci.image.manifest.v1+json,
# no manifest list, x86_64 only), which is already why hummingbird:gnome
# carries its own amd64 pin. A source that cannot be pulled for aarch64
# cannot supply an aarch64 image.
#
# Restore "linux/arm64" only alongside BOTH: the aarch64 snapshot carrying
# xfsprogs (the one-line curl above is the check) and an aarch64 build of
# whatever package source the variant is on by then. See
# docs/HUMMINGBIRD.md.
platforms = ["linux/amd64"]

[[variants.hummingbird.flavors]]
id = "base"
stage = 1
build_image = true
build_iso = true

[[variants.hummingbird.flavors]]
# GNOME remains amd64-only until its aarch64 source (utah-packages)
# publishes there. COSMIC's own 25 manifest packages did converge on
# aarch64 (2026-09-06) and this flavor inherits the variant platforms
# below — which are amd64-only today for a reason one layer down: the
# BASE cannot build on arm64 at all (see the platforms note above), so a
# desktop whose package set resolves still had nothing to layer onto.
# Both notes revert together.
id = "gnome"
stage = 2
platforms = ["linux/amd64"]
build_image = true
build_iso = true

[[variants.hummingbird.flavors]]
# kde and niri are DECLARED but not implemented for hummingbird, and
# advertising them costs the flavor that is.
#
# manifests/desktops/{kde,niri}.yaml have no `packages.hummingbird`
# section at all -- 0 packages, against gnome's 52 and cosmic's 23.
# install-desktop.sh routes hummingbird to that section by construction,
# so both flavors have never had a package set to install. Measured on
# run 32786338463: the two flavors with no manifest are exactly the two
# whose image builds failed.
#
#   kde   nothing provides libdouble-conversion.so.3 / libfbclient.so.2
#         needed by qt6-qtbase-*.hum1 from public-hummingbird -- an
#         UPSTREAM gap; those sonames are in no index, ours or theirs,
#         and no wave the factory is building supplies them.
#   niri  TUNAOS_BRANDING_FAIL -- dconf keyfiles written to
#         /etc/dconf/db/distro.d with no compiled database, because
#         `dconf update` is guarded on `command -v dconf` and dconf is
#         not installed when there is no package set to install it.
#
# Why this blocks GNOME. build_artifacts_s2 takes `needs: build_stage2`,
# a matrix job over every stage-2 flavor, so one failing leg skips every
# ISO in the stage -- gnome's included, however cleanly it built
# (tuna-os/tunaOS#2059). gnome is the only desktop with a passing
# installer-smoke cell anywhere in the matrix, so the flavors that were
# never implemented are blocking the one that works.
#
# Re-add each of these the moment it has a `packages.hummingbird`
# section, exactly as cosmic and gnome do. Nothing here is a judgement
# about wanting kde or niri on hummingbird; it is a statement that they
# do not exist yet and should not be advertised as though they do.
id = "cosmic"
stage = 2
build_image = true
build_iso = true

# ── Sailfin ──────────────────────────────────────────────────────────────
# Sailfin Tumbleweed: rolling-release, zypper-based.
[variants.sailfin]
emoji = "⛵"
asahi_verify = true
schedule = "20 19 * * *"
codename = "Istiophorus platypterus"
branding = { accent = "#73BA25", gnome_accent = "green", base = "openSUSE Tumbleweed", homage = "openSUSE green", plymouth = "sailboat" }
upstream_track = "rolling"
description = "Based on openSUSE Tumbleweed (rolling)"
# NOT digest-pinned, for the same reason as bonito-rawhide below.
#
# Tumbleweed is a rolling snapshot and registry.opensuse.org garbage-
# collects the manifests it replaces, faster than the daily pin check can
# protect a pin. Measured, this time:
#
#   2026-09-11 ~17:00  tunaOS#2464 pins sha256:349094be… (alive, verified)
#   2026-09-12 00:22   check-base-image-pins run 34661427002: success
#   2026-09-12 21:28   build-sailfin run 34720071388:
#                        reading manifest sha256:349094be… : manifest unknown
#
# Under 28 hours from written to dead, and dead in the window BETWEEN the
# 22:20 check and the build it runs ahead of. That is not a pin the checker
# can save: the guard exists (it caught #1788, 24 cells across three
# variants) and it passed nine hours before the base died anyway.
#
# The base failure took all 7 sailfin cells with it, 6 of which had just
# gone green. A digest that cannot be fetched buys no reproducibility --
# only a guaranteed red base. The checker reports this as a declared state:
#
#   SKIP  (not digest-pinned)  registry.opensuse.org/opensuse/tumbleweed:latest
#
# Re-pin by digest only if registry.opensuse.org starts retaining replaced
# manifests, or if something resolves the tag once at build time and
# threads that one digest through every stage of the build.
base_image = "registry.opensuse.org/opensuse/tumbleweed:latest"
# Friendly alias: same digest also published as ghcr.io/tuna-os/<alias>:<flavor>
aliases = ["opensuse", "tumbleweed"]
platforms = ["linux/amd64"]

[[variants.sailfin.flavors]]
# base + gnome carry an arm64 leg solely as the parent chain for
# gnome-asahi (Tumbleweed is multiarch; bootc comes from zypper).
# Other DEs stay amd64 until someone asks for them on arm64.
id = "base"
stage = 1
platforms = ["linux/amd64", "linux/arm64"]
build_image = true

[[variants.sailfin.flavors]]
id = "gnome"
stage = 2
platforms = ["linux/amd64", "linux/arm64"]
build_image = true

[[variants.sailfin.flavors]]
# gnome-asahi: NOT declared, and not an oversight. Same call marlin and
# flounder already made above, for the same reason and on the same kind
# of evidence.
#
# The image builds, assembles, and signs. It then fails the Asahi
# manifest gate 8/37 (run 34750381815), and every one of those 8 is a
# package that OBS home:mrkcee does not ship. Read out of the RPM
# headers directly on 2026-09-13, not inferred:
#
#   kernel-asahi-7.1.13-3.2   2259 files, ZERO .dtb — the gate wants the
#                             ~50 Apple device trees real hardware needs
#   m1n1-1.6.1-2.1            16 files, zero .dtb
#   u-boot-asahi-2026.07-3.1  18 files, zero .dtb
#   asahi-scripts-20250713    21 files: asahi-diagnose and the dracut
#                             modules, but NO update-m1n1, no kernel
#                             install hook, no asahi-fwupdate
#   tiny-dfr                  "Package 'tiny-dfr' not found" — absent
#                             from the repo entirely, which is why
#                             asahi.sh already installs it best-effort
#
# So nothing in the stack provides the device trees, the boot-object
# updater, the firmware updater, or the touchbar daemon. This is not the
# gate reading an openSUSE layout wrong: grouper's gnome-asahi passes the
# identical gate 37/0 with macsmc.ko, 104 Apple DTBs, update-m1n1 and its
# hook, asahi-fwupdate, and tiny-dfr all present (run 34777822830). One
# packaging set is complete and the other is not.
#
# An image that cannot update its own boot object or load Apple firmware
# does not install on an M1. Declaring the cell advertises hardware
# support that does not exist and costs an arm64 build a night to
# re-establish that. Tracked in tunaOS#2492; re-declare the day
# home:mrkcee (or another source) ships the DTBs and asahi-scripts'
# missing half.
#
# base and gnome keep their arm64 legs: they are the parent chain, and
# dropping them would be a wider change than this evidence supports.
id = "kde"
stage = 2
build_image = true

[[variants.sailfin.flavors]]
id = "niri"
stage = 2
build_image = true

[[variants.sailfin.flavors]]
id = "xfce"
stage = 2
build_image = true

[[variants.sailfin.flavors]]
# COSMIC: newly buildable. Tumbleweed packages the session richly and the
# whole zypper list installs clean (exit 0), producing cosmic-comp and
# /usr/share/wayland-sessions/cosmic.desktop — both measured on a real
# install, not inferred. Note cosmic-settings and cosmic-greeter are NOT
# packaged on openSUSE; see the manifest for what is used instead.
id = "cosmic"
stage = 2
build_image = true

[[variants.sailfin.flavors]]
# Tuna Desktop (tuna_rollout above, tunaOS#3201): opensuse package
# target, signed index repo.tunaos.org/rpm/opensuse-tumbleweed.
id = "tuna"
stage = 2
platforms = ["linux/amd64"]
build_image = true
build_iso = false
build_qcow2 = false
luks_e2e = false

# ── Guppy ────────────────────────────────────────────────────────────────
# Guppy: source-based, emerge/portage. Compiles everything from source.
[variants.guppy]
emoji = "🌈"
schedule = "20 6 * * *"
codename = "Poecilia reticulata"
branding = { accent = "#54487A", gnome_accent = "purple", base = "Gentoo", homage = "Gentoo purple", plymouth = "rainbow" }
upstream_track = "rolling"
description = "Based on Gentoo Linux (source-based)"
# Digest-pinned to match Containerfile.gentoo's FROM exactly. This value
# is not decorative: reusable-build-image.yml pre-pulls it to warm local
# storage before the build (a workaround for quay/docker CDN blob drops,
# #675). With a bare :latest here it warmed whatever latest happened to be
# while the Containerfile built from the pinned digest, so the pre-pull
# fetched an image the build never used and the workaround silently did
# nothing for guppy. Keep the two in lockstep when bumping.
base_image = "docker.io/gentoo/stage3:latest@sha256:1ca7647d1ce968d02c2858ee4201e2173675fd3fc0754a8acd583d9288b75478"
# Friendly alias: same digest also published as ghcr.io/tuna-os/<alias>:<flavor>
aliases = ["gentoo"]
platforms = ["linux/amd64"]

[[variants.guppy.flavors]]
id = "base"
stage = 1
build_image = true

[[variants.guppy.flavors]]
# GNOME 50 comes from ::gentoo under ~amd64, and builds from source:
# the official binhost has only stable versions, which stop at 49.7.
# manifests/desktops/gnome.yaml emerge_accept_keywords has the package
# list. This flavor was off from 2026-09-11 to 2026-10-07 while
# ::gentoo topped out at 49.9, below the floor (tunaOS#2450).
id = "gnome"
stage = 2
build_image = true

[[variants.guppy.flavors]]
id = "kde"
stage = 2
build_image = true

[[variants.guppy.flavors]]
# XFCE: every atom in the emerge list was verified to exist in the Gentoo
# main tree before this was declared. The list previously named
# xfce-base/lightdm, which does not exist (it is x11-misc/lightdm) — so
# declaring this flavor earlier would have failed on an unresolvable atom.
id = "xfce"
stage = 2
build_image = true

# NOT declared, and not an oversight:
#   niri    — no ebuild in the Gentoo main tree at all. A search returns
#             only dev-ruby/niceogiri. Declaring it would publish an
#             installable image with no compositor, exactly as
#             flounder:niri did (tunaOS#915). It IS packaged in the
#             community GURU overlay (gui-wm/niri, ~amd64) — see
#             manifests/desktops/niri.yaml for the full finding. Not
#             enabled here: an untested source build, and ~amd64
#             keywording that can shift under guppy without warning.
#   cosmic  — same: no cosmic-comp or cosmic-session ebuild in the tree,
#             and cosmic.yaml has no emerge section.
# Both measured and tracked in tunaOS#923.
# Do not add either until the packages exist; the emerge path now fails
# loudly on an empty list rather than shipping a desktop-less image.
# ── Rawhide ────────────────────────────────────────────────────────────────
# Fedora Rawhide (rolling development branch). Uses the same Containerfile
# as bonito — Fedora bootc with the latest kernel and packages.
[variants.bonito-rawhide]
publish_name = "bonito"
tag_suffix = "rawhide"
emoji = "🐉"
schedule = "20 15 * * *"
codename = "Sarda sarda"
branding = { accent = "#3C6EB4", gnome_accent = "blue", base = "Fedora Rawhide", homage = "Fedora blue", plymouth = "dragon" }
upstream_track = "rolling"
description = "Based on Fedora Rawhide (rolling)"
# NOT digest-pinned, and this is the only base image here that is not.
#
# A digest pin on this tag is dead before the nightly that would use it.
# Measured 2026-09-11: the digest resolved at 12:55 was already 404 by
# 13:36 -- 41 minutes -- and `:rawhide` had moved on. It is not that the
# digest goes stale; quay garbage-collects the untagged manifest at once,
# so the pin does not resolve AT ALL:
#
#   Error: creating build container: ... reading manifest sha256:0d942e1b…
#   in quay.io/fedora/fedora-bootc: manifest unknown
#
# Compare fedora-bootc:44 in this same file, whose digest was still 200 in
# the same measurement. Stable tags are retained; Rawhide's are not.
#
# That makes repinning a fix with a one-hour half-life, and the repo's own
# safety net cannot close the gap either: check-base-image-pins.yml runs at
# 22:20 and the variant builds at 01:00, so the digest it verified is
# already gone by the time anything builds. scripts/check-base-image-pins.sh
# names this exact variant in its own history (#1788, 2026-08-16), because
# it keeps happening here and nowhere else for the same reason.
#
# So the tag is the honest reference. The point of bonito-rawhide is to
# track Rawhide, a target that moves several times a day; a digest that
# cannot be fetched buys no reproducibility, it only guarantees a red base
# every night and takes every downstream flavor with it. The pin checker
# already treats this as a declared state rather than an error, and says so
# per run:
#
#   SKIP  (not digest-pinned)  quay.io/fedora/fedora-bootc:rawhide
#
# Re-pin by digest only if quay starts retaining Rawhide manifests, or if
# something resolves the tag at build time and threads one digest through
# every stage of that build.
base_image = "quay.io/fedora/fedora-bootc:rawhide"
# Friendly alias: same digest also published as ghcr.io/tuna-os/<alias>:<flavor>
aliases = ["fedora"]
akmods = "ublue-os"
platforms = ["linux/amd64", "linux/arm64"]

