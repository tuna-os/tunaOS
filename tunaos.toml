# Desktop profiles -> generated manifests/desktops/<profile>.yaml via config.py
# generate -> build_scripts/desktop/install-desktop.sh during image construction.
# Existing <desktop>-debian and <desktop>-arch profiles replace the generic
# profile on Debian and pacman respectively; they are not merged with it.
# Family selection is native: apt, pacman, cachyos, emerge, zypper, fedora,
# rawhide, eln, hummingbird, el10. Do not assume package names are portable.
# required is the requested package list (not proof every package is installed).
# RPM-family optional is best-effort; groups/group_exclude/group_options control
# DNF group install, exclude controls its package transaction, optional_group
# tries the whole list only when the first package is available. These fields
# are not accepted for apt/pacman/cachyos/zypper/emerge (required/include only,
# plus their explicitly supported repository/display-manager fields).
# display_manager selects the image's greeter; a supported family override
# beats the profile value. versionlock requests DNF locks; emerge_accept_keywords
# writes Gentoo keyword policy. minimum_version declares the GNOME floor;
# tests/test_the_gnome_floor_is_enforced.py ties it to the runtime check constant,
# so editing this value alone does not change that check.
# disable_desktop_files hides launchers, not packages. after_install,
# after_inline and native before_install are allowlisted operation IDs from
# scripts/lib/desktop_operations.json, never arbitrary shell snippets.
# repos/copr/ppa are build package sources, not package search catalogs. HTTPS
# sources must meet the validator's family-specific shape; unsigned=true is
# restricted to the two reviewed file:///run/ OCI mounts, never remote repos.
# Source policy/consumer details and safe editing: docs/CONFIG-WIRING.md.
[desktops]

