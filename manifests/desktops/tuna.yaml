# Tuna Desktop (formerly Roost, renamed in tuna-desktop#536) on every TunaOS
# variant with a published package target (tuna-desktop ADR 0008, epic #577).
# Marlin was the first cell (tunaOS#2990); its Containerfile installs the
# in-house Tideforge key/repository and qualifies this package so official
# packages stay first. tuna-desktop provides roost and ships its compat
# names, so nothing here may name the old `roost` package.
#
# Variants without a cell are recorded with their reason under
# `unsupported_flavors` in .github/build-config.yml.
display_manager: gdm

packages:
  pacman:
    # Pinned to the published v1.0.0-beta.1 release (ADR 0008 in
    # tuna-os/tuna-desktop: image flavors follow beta tags). pacman resolves
    # the repo-qualified `name=version` target exactly and fails the build if
    # the served repository no longer carries it, so a new beta is an
    # explicit bump here, never a silent drift.
    - tunaos/tuna-desktop=1.0.0beta.1-1
    - gdm
    - accountsservice
    # GDM's compiled GNOME Shell theme is rebuilt by tuna-gdm.sh.
    - glib2
    - xorg-xwayland
    - ibus
    # Screen Reader: Tuna Desktop starts and stops Orca from GNOME's
    # screen-reader-enabled key, as GNOME does; without the package the
    # key does nothing (published-image qualification, tuna-desktop#273).
    - orca
    - gnome-shell
    - gnome-settings-daemon
    - gnome-control-center
    - gnome-keyring
    - evolution-data-server
    - xdg-desktop-portal-gnome
    - xdg-desktop-portal-gtk
    - xdg-user-dirs
    - gvfs
    - nautilus
    - ptyxis
    - networkmanager
    - libsecret
    - pipewire
    - wireplumber
    - gst-plugin-pipewire
    - gst-plugins-good
    - power-profiles-daemon
    - upower
    - flatpak
    - plymouth
    - adwaita-icon-theme
    - noto-fonts
    - noto-fonts-emoji
    - ttf-dejavu
    - ttf-liberation

  # EL10 (yellowfin, albacore, skipjack). tuna-desktop and gdm are TunaOS
  # factory builds (repo/10 is the el10 target's x86_64 published index).
  # Priority 100 sits behind the distro repositories (99), so the tier only
  # supplies what the base lacks: repo/10 also carries a GNOME 50
  # pre-release, and a session must not mix it into the base's GNOME.
  # Power profiles come from the base's tuned-ppd (10-base-packages.sh), the
  # provider the EL10 GNOME flavors ship; it conflicts with
  # power-profiles-daemon, so this list names neither.
  # x86_64 only: the Tuna package target has no aarch64 build.
  el10:
    display_manager: gdm
    # GDM is selected explicitly so the greeter is present even when
    # gnome-shell's dependency graph changes. It owns display-manager.service
    # and VT1 for the Tuna session.
    repos:
      - name: tunaos-el10
        baseurl: https://repo.tunaos.org/repo/10/x86_64/
        priority: 100
      - name: tunaos-xfce
        baseurl: https://repo.tunaos.org/xfce/10-stream-x86_64/
        priority: 100
    packages:
      # Pinned like the pacman entry above: dnf installs this exact NEVR or
      # fails the build. install-desktop.sh reads a flat list, so the fedora
      # section repeats the session set instead of aliasing it.
      - tuna-desktop-1.0.0~beta.1-1.el10
      # beta.1's compositor imports the session environment with
      # dbus-update-activation-environment, which EL and Fedora ship here.
      # Without it graphical-session.target never starts and every portal
      # fails (measured on a bonito VM; tuna-os/tuna-desktop#691 drops the
      # need). Remove with the beta that carries #691.
      - dbus-tools
      - orca
      - gdm
      - accountsservice
      # GDM's compiled GNOME Shell theme is rebuilt by tuna-gdm.sh.
      - glib2-devel
      - xorg-x11-server-Xwayland
      - ibus
      - gnome-shell
      - gnome-settings-daemon
      - gnome-control-center
      - gnome-keyring
      - evolution-data-server
      - xdg-desktop-portal-gnome
      - xdg-desktop-portal-gtk
      - xdg-user-dirs
      - gvfs
      - nautilus
      - ptyxis
      - NetworkManager
      - libsecret
      - pipewire
      - wireplumber
      - pipewire-gstreamer
      - gstreamer1-plugins-good
      - upower
      - flatpak
      - plymouth
      - adwaita-icon-theme
      - google-noto-sans-fonts
      - google-noto-color-emoji-fonts
      - dejavu-sans-fonts
      - liberation-fonts

  # Fedora 44 (bonito). Only tuna-desktop is a factory build, published in
  # the fedora target's x86_64 index; gdm and the rest are Fedora's own.
  fedora:
    display_manager: gdm
    repos:
      - name: tunaos-fedora
        baseurl: https://repo.tunaos.org/xfce/44-x86_64/
        priority: 100
    packages:
      - tuna-desktop-1.0.0~beta.1-1.fc44
      # See the el10 section: needed by beta.1 until tuna-desktop#691.
      - dbus-tools
      - orca
      - gdm
      - accountsservice
      # GDM's compiled GNOME Shell theme is rebuilt by tuna-gdm.sh.
      - glib2-devel
      - xorg-x11-server-Xwayland
      - ibus
      - gnome-shell
      - gnome-settings-daemon
      - gnome-control-center
      - gnome-keyring
      - evolution-data-server
      - xdg-desktop-portal-gnome
      - xdg-desktop-portal-gtk
      - xdg-user-dirs
      - gvfs
      - nautilus
      - ptyxis
      - NetworkManager
      - libsecret
      - pipewire
      - wireplumber
      - pipewire-gstreamer
      - gstreamer1-plugins-good
      # tuned-ppd, as bonito's GNOME, KDE and XFCE flavors ship. It conflicts
      # with power-profiles-daemon and answers the same D-Bus API.
      - tuned-ppd
      - upower
      - flatpak
      - plymouth
      - adwaita-icon-theme
      - google-noto-sans-fonts
      - google-noto-color-emoji-fonts
      - dejavu-sans-fonts
      - liberation-fonts

  # Fedora ELN (wahoo, tunaOS#3198). tuna-desktop is a factory build in the
  # eln target's x86_64 index (tunaos-packages#829, #874); gdm comes from ELN
  # BaseOS and AppStream. The rest resolves on the pinned eln-bootc digest
  # (`dnf install --assumeno`, tuned-ppd included).
  # dbus-tools for beta.1, as above.
  eln:
    display_manager: gdm
    repos:
      - name: tunaos-eln
        baseurl: https://repo.tunaos.org/rpm/eln/x86_64/
        priority: 100
    packages:
      - tuna-desktop-1.0.0~beta.1-1.eln159
      - dbus-tools
      - orca
      - gdm
      - accountsservice
      # GDM's compiled GNOME Shell theme is rebuilt by tuna-gdm.sh.
      - glib2-devel
      - xorg-x11-server-Xwayland
      - ibus
      - gnome-shell
      - gnome-settings-daemon
      - gnome-control-center
      - gnome-keyring
      - evolution-data-server
      - xdg-desktop-portal-gnome
      - xdg-desktop-portal-gtk
      - xdg-user-dirs
      - gvfs
      - nautilus
      - ptyxis
      - NetworkManager
      - libsecret
      - pipewire
      - wireplumber
      - pipewire-gstreamer
      - gstreamer1-plugins-good
      - tuned-ppd
      - upower
      - flatpak
      - plymouth
      - adwaita-icon-theme
      - google-noto-sans-fonts
      - google-noto-color-emoji-fonts
      - dejavu-sans-fonts
      - liberation-fonts

  # Fedora Rawhide (bonito-rawhide, tunaOS#3203). The same set as fedora
  # above, with the factory's Rawhide build of tuna-desktop
  # (tunaos-packages#831, #870). install-desktop.sh picks this section on a
  # Rawhide base. dbus-tools for beta.1, as above.
  rawhide:
    display_manager: gdm
    repos:
      - name: tunaos-rawhide
        baseurl: https://repo.tunaos.org/rpm/rawhide/x86_64/
        priority: 100
    packages:
      - tuna-desktop-1.0.0~beta.1-1.fc46
      - dbus-tools
      - orca
      - gdm
      - accountsservice
      # GDM's compiled GNOME Shell theme is rebuilt by tuna-gdm.sh.
      - glib2-devel
      - xorg-x11-server-Xwayland
      - ibus
      - gnome-shell
      - gnome-settings-daemon
      - gnome-control-center
      - gnome-keyring
      - evolution-data-server
      - xdg-desktop-portal-gnome
      - xdg-desktop-portal-gtk
      - xdg-user-dirs
      - gvfs
      - nautilus
      - ptyxis
      - NetworkManager
      - libsecret
      - pipewire
      - wireplumber
      - pipewire-gstreamer
      - gstreamer1-plugins-good
      - tuned-ppd
      - upower
      - flatpak
      - plymouth
      - adwaita-icon-theme
      - google-noto-sans-fonts
      - google-noto-color-emoji-fonts
      - dejavu-sans-fonts
      - liberation-fonts

  # Ubuntu 26.04 (grouper), Debian sid (flounder-sid) and Debian 13 trixie
  # (flounder). Only tuna-desktop is a factory build, served from the signed
  # Tideforge apt index for each base (tunaos-packages#835, #836, #837);
  # gdm3 is the display manager on the Debian-family bases. install-desktop.sh
  # adds only the repository whose condition matches the base. Measured with
  # `apt-get install --no-install-recommends` of this list on ubuntu:resolute,
  # debian:sid and debian:trixie: gdm3 is now an explicit package, while
  # dbus-update-activation-environment comes from dbus-bin, a Depends of the
  # tuna-desktop deb itself.
  apt:
    display_manager: gdm3
    repos:
      - name: tideforge
        uri: https://repo.tunaos.org/tideforge/ubuntu/
        suite: ./
        keyring_url: https://repo.tunaos.org/tideforge/ubuntu/tideforge.gpg
        condition: "ubuntu"
      - name: tideforge
        uri: https://repo.tunaos.org/tideforge/debian-sid/
        suite: ./
        keyring_url: https://repo.tunaos.org/tideforge/debian-sid/tideforge.gpg
        condition: "debian-sid"
      - name: tideforge
        uri: https://repo.tunaos.org/tideforge/debian-trixie/
        suite: ./
        keyring_url: https://repo.tunaos.org/tideforge/debian-trixie/tideforge.gpg
        condition: "debian-trixie"
    packages:
      # Pinned like the pacman and RPM entries: apt installs exactly this
      # version or fails the build.
      - tuna-desktop=1.0.0~beta.1-1
      - orca
      - gdm3
      - accountsservice
      # GDM's compiled GNOME Shell theme is rebuilt by tuna-gdm.sh.
      - libglib2.0-bin
      - libglib2.0-dev-bin
      - xwayland
      - ibus
      - gnome-shell
      - gnome-settings-daemon
      - gnome-control-center
      - gnome-keyring
      - libpam-gnome-keyring
      - evolution-data-server
      - xdg-desktop-portal-gnome
      - xdg-desktop-portal-gtk
      - xdg-user-dirs
      - gvfs
      - nautilus
      - ptyxis
      - network-manager
      - libsecret-1-0
      - pipewire
      - wireplumber
      - gstreamer1.0-pipewire
      - gstreamer1.0-plugins-good
      - power-profiles-daemon
      - upower
      - flatpak
      - plymouth
      - adwaita-icon-theme
      - fonts-noto-core
      - fonts-noto-color-emoji
      - fonts-dejavu-core
      - fonts-liberation

  # openSUSE Tumbleweed (sailfin, tunaOS#3201). Only tuna-desktop is a
  # factory build, served from the signed opensuse-tumbleweed index
  # (tunaos-packages#833); gdm and gtk4-layer-shell are Tumbleweed's own.
  # Names that differ from Fedora's: google-noto-coloremoji-fonts,
  # gnome-keyring-pam, gstreamer-plugin-pipewire, gnome-shell-calendar (the
  # calendar server, split out of gnome-shell), and dbus-1-tools for
  # dbus-update-activation-environment, which beta.1 needs
  # (tuna-os/tuna-desktop#691). power-profiles-daemon, as sailfin's GNOME
  # flavor ships. Measured with `zypper install --dry-run --no-recommends`
  # of this list on registry.opensuse.org/opensuse/tumbleweed.
  zypper:
    display_manager: gdm
    repos:
      - name: tunaos-opensuse
        baseurl: https://repo.tunaos.org/rpm/opensuse-tumbleweed/x86_64/
    packages:
      - tuna-desktop-1.0.0~beta.1-1
      - dbus-1-tools
      - orca
      - gdm
      - accountsservice
      # GDM's compiled GNOME Shell theme is rebuilt by tuna-gdm.sh.
      - glib2-tools
      - xwayland
      - ibus
      - gnome-shell
      - gnome-shell-calendar
      - gnome-settings-daemon
      - gnome-control-center
      - gnome-keyring
      - gnome-keyring-pam
      - evolution-data-server
      - xdg-desktop-portal-gnome
      - xdg-desktop-portal-gtk
      - xdg-user-dirs
      - gvfs
      - nautilus
      - ptyxis
      - NetworkManager
      - libsecret-1-0
      - pipewire
      - wireplumber
      - gstreamer-plugin-pipewire
      - gstreamer-plugins-good
      - power-profiles-daemon
      - upower
      - flatpak
      - plymouth
      - adwaita-icon-theme
      - google-noto-sans-fonts
      - google-noto-coloremoji-fonts
      - dejavu-fonts
      - liberation-fonts

versionlock: []
post_install:
  - tuna-flatpak-remote.sh
  # GDM owns the login session; this masks stale greetd state, enforces the
  # Wayland Tuna session and rebuilds the GNOME Shell theme resource.
  - tuna-gdm.sh
  - flatpak-preinstall.sh
