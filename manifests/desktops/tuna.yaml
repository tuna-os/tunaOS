# Experimental Marlin only; admission tunaOS#2990 / tuna-desktop#69.
# Tuna Desktop (formerly Roost, renamed in tuna-desktop#536) is absent from
# Arch's repos. The Containerfile installs the in-house Tideforge
# key/repository; qualify this package so official packages stay first.
# tuna-desktop provides roost and ships its compat names, so nothing here may
# name the old `roost` package.
display_manager: greetd

packages:
  pacman:
    # Pinned to the published v1.0.0-beta.1 release (ADR 0008 in
    # tuna-os/tuna-desktop: image flavors follow beta tags). pacman resolves
    # the repo-qualified `name=version` target exactly and fails the build if
    # the served repository no longer carries it, so a new beta is an
    # explicit bump here, never a silent drift.
    - tunaos/tuna-desktop=1.0.0beta.1-1
    - greetd
    - greetd-gtkgreet
    - cage
    - xorg-xwayland
    - ibus
    - gnome-shell
    - gnome-settings-daemon
    - gnome-control-center
    - gnome-keyring
    - evolution-data-server
    - xdg-desktop-portal-gnome
    - xdg-desktop-portal-gtk
    - xdg-user-dirs
    - gvfs
    - nautilus
    - ptyxis
    - networkmanager
    - libsecret
    - pipewire
    - wireplumber
    - gst-plugin-pipewire
    - gst-plugins-good
    - power-profiles-daemon
    - upower
    - flatpak
    - plymouth
    - adwaita-icon-theme
    - noto-fonts
    - noto-fonts-emoji
    - ttf-dejavu
    - ttf-liberation

versionlock: []
post_install:
  - tuna-flatpak-remote.sh
  - greetd-gtkgreet.sh
  - flatpak-preinstall.sh
