# Niri (Tiling Wayland Compositor) + DMS Desktop Manifest

display_manager: greetd

packages:
  fedora:
    copr:
      - repo: yalter/niri-git
        packages:
          - niri
      - repo: avengemedia/danklinux
        packages:
          - quickshell-git
      - repo: avengemedia/dms-git
        packages:
          - dms
          - dms-cli
          - dms-greeter
    packages:
      - greetd
      - greetd-selinux
      - swaylock
      - SwayNotificationCenter
      - waybar
      - fuzzel
      - swayidle
      - wl-clipboard
      - xdg-desktop-portal-gnome
      - xdg-desktop-portal-gtk
      - xdg-user-dirs
      - pipewire
      - wireplumber
      - NetworkManager-tui
      - brightnessctl
      - playerctl
      - blueman
      - pavucontrol
      - gnome-keyring
      - gnome-keyring-pam
      - nautilus
      - adw-gtk3-theme
      - papirus-icon-theme
    optional:
      - polkit-gnome

  el10:
    copr:
      - repo: yalter/niri-git
        packages:
          - niri
      - repo: yselkowitz/wlroots-epel
        packages:
          - swaylock
          - SwayNotificationCenter
          - waybar
          - fuzzel
          - swayidle
          - wl-clipboard
          # brightnessctl (backlight) and playerctl (media keys) are only
          # packaged for EL10 in this COPR — same source as the sway stack.
          - brightnessctl
          - playerctl
      # greetd/greetd-selinux (DM) and adw-gtk3-theme have no EL10 base/EPEL
      # build; pull them from the COPR the cosmic manifest uses. (The old
      # zirconium/packages and ligenix/enterprise-cosmic COPRs have no EL10
      # chroot — `dnf copr enable` hard-fails on them.)
      - repo: yselkowitz/cosmic-epel
        packages:
          - greetd
          - greetd-selinux
          - adw-gtk3-theme
        options: "--nobest --allowerasing"
      # DMS (DankMaterialShell) suite: quickshell-git + dms-greeter live in the
      # danklinux COPR, dms/dms-cli in dms-git, and they cross-depend. Installing
      # dms-greeter from the dms-git block alone fails ("no match") and, because
      # copr installs are best-effort, silently drops the whole shell. Install
      # the suite from one block with danklinux (+ cosmic-epel for the
      # dms-greeter→greetd dep) enabled, mirroring build_scripts/desktop/niri.sh. The
      # danklinux block is enable-only so its repo file exists for --enablerepo.
      - repo: avengemedia/danklinux
        packages: []
      - repo: avengemedia/dms-git
        packages:
          - quickshell-git
          - dms
          - dms-cli
          - dms-greeter
        options: "--enablerepo=copr:copr.fedorainfracloud.org:avengemedia:danklinux --enablerepo=copr:copr.fedorainfracloud.org:yselkowitz:cosmic-epel"
    packages:
      - xdg-desktop-portal-gnome
      - xdg-desktop-portal-gtk
      - xdg-user-dirs
      - pipewire
      - wireplumber
      # polkit-gnome was retired Fedora-wide and has no EL10 build; polkit-kde
      # is the only GUI polkit authentication agent packaged for EL10 (EPEL).
      # It runs fine under any Wayland compositor.
      - polkit-kde
      - NetworkManager-tui
      - nautilus
      - pavucontrol
      - gnome-keyring
      - gnome-keyring-pam
      - papirus-icon-theme
      # NOTE: blueman (Bluetooth applet) has no EL10/EPEL 10 build, so it is
      # intentionally absent here (present in the Fedora section). No packaged
      # standalone Bluetooth GUI exists for EL10 niri yet.

  # ── Zypper (openSUSE Tumbleweed) ───────────────────────────────────
  # This was the thinnest list in the tree and the only genuinely bare one:
  # `niri greetd` installs a compositor and a login daemon and nothing else.
  # No bar, no launcher, no notifications, no lock screen, no terminal, no
  # file manager, no portal, no polkit agent, no keyring, no pipewire — a
  # user who logged in got a blank compositor with no way to start anything.
  # Confirmed on the published image: only `niri` was present; waybar,
  # fuzzel, swaylock, alacritty, nautilus, gvfs, gnome-keyring,
  # xdg-desktop-portal and pavucontrol were all absent.
  #
  # DMS (DankMaterialShell) — what the fedora/el10 sections use as the shell —
  # is not available here YET. quickshell, dms, dms-cli and dms-greeter are
  # becoming first-class Tideforge packages (tunaos-packages#125 builds them
  # for el10 RPM plus Debian and Ubuntu DEB), but they are not built for the
  # opensuse-tumbleweed target. That target IS declared in
  # manifests/package-factory.yaml with architectures and an R2 path — it just
  # has no cells in the package build gate, so no openSUSE package has ever
  # been built or installed by that pipeline (tunaos-packages#139). So this is
  # a not-yet, not a can't: when openSUSE is exercised there, revisit this
  # section and align it with the DMS variants.
  #
  # Until then openSUSE gets the conventional wlroots stack (waybar + fuzzel
  # + swaync + swaylock). The session differs from the DMS variants; the
  # component contract is the same.
  #
  # Every name verified with `zypper se -x -t package`; the whole list
  # dry-runs clean (exit 0, no unresolved names, no vendor changes, no
  # removals) against a base matching Containerfile.opensuse — pattern
  # enhanced_base plus packman-essentials at priority 90.
  zypper:
    - niri
    - greetd
    # greetd's stock config runs `agreety --cmd /bin/sh` — a text prompt into
    # a bare shell with no session picker. gtkgreet is the graphical greeter;
    # it is a plain Wayland client and cannot own a VT, so cage hosts it.
    # Wired up by the greetd-gtkgreet.sh post_install script below, extracted
    # from build_scripts/desktop/xfce.sh where the same block was already proven.
    - gtkgreet
    - cage
    # X11 applications under niri (niri is Wayland-only)
    - xwayland-satellite
    # Shell: bar, launcher, notifications, idle and lock
    - waybar
    - fuzzel
    - SwayNotificationCenter
    - swayidle
    - swaylock
    - wl-clipboard
    # Terminal — niri's default binding is alacritty, so shipping anything
    # else leaves Mod+T dead on a stock config
    - alacritty
    # Files, mounting and secrets
    - nautilus
    - gvfs
    - gvfs-backends
    - gvfs-fuse
    - gnome-keyring
    - gnome-keyring-pam
    - polkit-gnome
    # Portals — the GNOME backend is what the fedora/el10 sections use for
    # screencast and file chooser under niri
    - xdg-desktop-portal
    - xdg-desktop-portal-gnome
    - xdg-desktop-portal-gtk
    - xdg-user-dirs
    # Audio
    - pipewire
    - pipewire-pulseaudio
    - wireplumber
    - pavucontrol
    # Network, bluetooth and hardware keys
    - NetworkManager-applet
    - blueman
    - brightnessctl
    - playerctl
    # Theming
    - papirus-icon-theme
    - adwaita-icon-theme
    - Mesa-dri
    - Mesa-libEGL1

  # ── Emerge (Gentoo) ────────────────────────────────────────────────
  # DELIBERATELY ABSENT. niri is not packaged in the Gentoo main tree at all —
  # a search for "niri" on packages.gentoo.org returns only dev-ruby/niceogiri.
  # There is no gui-wm/niri, and no ebuild under any other category.
  #
  # This section previously read:
  #     - gui-wm/niri        does not exist
  #     - gui-apps/greetd    wrong category; the daemon is gui-libs/greetd
  # Neither atom resolves. guppy:niri is not declared as a flavor in
  # build-config.yml, so it never ran — but had anyone declared it on the
  # strength of "there is an emerge section", it would have produced exactly
  # what flounder:niri did: a published, installable image with no compositor
  # (tunaOS#915).
  #
  # What IS in the tree, for whoever packages niri later: gui-libs/greetd,
  # gui-apps/gtkgreet. Missing alongside niri: cage.
  #
  # Do not add an emerge list here until niri has an ebuild. Tracked in
  # tunaOS#923. Leaving the key absent is intentional: the installer's emerge
  # path now fails loudly on an empty list rather than shipping a desktop-less
  # image.

versionlock:
  - glib2

post_install_inline:
  - "glib-compile-schemas /usr/share/glib-2.0/schemas || true"
  - "if [ -f /etc/pam.d/greetd ]; then sed --sandbox -i -e '/gnome_keyring.so/ s/-auth/auth/ ; /gnome_keyring.so/ s/-session/session/' /etc/pam.d/greetd; fi"

# Post-install scripts to source (relative to build_scripts/)
post_install:
  - tuna-flatpak-remote.sh
  # No-op wherever a real greeter is already configured (Fedora/EL10 use
  # dms-greeter); on openSUSE it is the difference between a login screen and
  # greetd's stock text prompt into a bare shell.
  - greetd-gtkgreet.sh
