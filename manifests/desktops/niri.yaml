# Niri (Tiling Wayland Compositor) + DMS Desktop Manifest

display_manager: greetd

packages:
  fedora:
    copr:
      - repo: yalter/niri-git
        packages:
          - niri
      # DMS (DankMaterialShell) suite. Which COPR holds which binary RPM,
      # read off the repos themselves (fedora-44-x86_64 repodata, 2026-08-06):
      #
      #   avengemedia/dms-git   dms, dms-cli
      #   avengemedia/danklinux dms-greeter, quickshell, quickshell-git,
      #                         dgop, danksearch, matugen, ...
      #
      # dms-greeter was listed under dms-git, where it does not exist. dnf
      # fails the whole transaction on one unmatched name, and COPR installs
      # are best-effort (`|| true` in install-desktop.sh), so bonito lost dms
      # and dms-cli along with it and shipped a niri image with no shell at
      # all — tunaOS#1009 and #637. The el10 section below already had this
      # right; the fedora section never got the same treatment.
      #
      # Keep each transaction aligned with the repository that publishes its
      # packages. In particular, dms-greeter is only in danklinux; putting it
      # in a dms-git transaction made dnf reject the whole request and the
      # best-effort install then silently shipped bonito without DMSGreeter.qml
      # (tunaOS#1009).
      - repo: avengemedia/danklinux
        packages:
          - quickshell-git
          - dms-greeter
      - repo: avengemedia/dms-git
        packages:
          - dms
          - dms-cli
    packages:
      - greetd
      - greetd-selinux
      - swaylock
      - SwayNotificationCenter
      - waybar
      - fuzzel
      - swayidle
      # Wallpaper: niri draws none itself; swaybg renders the branded one.
      - swaybg
      - wl-clipboard
      - xdg-desktop-portal-gnome
      - xdg-desktop-portal-gtk
      - xdg-user-dirs
      - pipewire
      - wireplumber
      - NetworkManager-tui
      - brightnessctl
      - playerctl
      - blueman
      - pavucontrol
      - gnome-keyring
      - gnome-keyring-pam
      - nautilus
      - adw-gtk3-theme
      - papirus-icon-theme
      # Software Vulkan (lavapipe). Smithay needs EGL/GLES on the GBM device,
      # and on the GPU-less CI guest the render node reports `-virgl`, so Mesa
      # falls back to zink -- which needs a Vulkan ICD to choose a device at
      # all. Not a dependency of anything, so it must be named. Whether niri
      # then accepts a software GLES is the open question this tests: unlike
      # wlroots it ships no Pixman/CPU renderer, so it may still decline. If
      # it does, the honest answer is a boots-scope exclusion, not a package.
      - mesa-vulkan-drivers
    optional:
      - polkit-gnome

  el10:
    copr:
      - repo: yalter/niri-git
        packages:
          - niri
      - repo: yselkowitz/wlroots-epel
        packages:
          - swaylock
          - SwayNotificationCenter
          - waybar
          - fuzzel
          - swayidle
          - wl-clipboard
          # brightnessctl (backlight) and playerctl (media keys) are only
          # packaged for EL10 in this COPR — same source as the sway stack.
          - brightnessctl
          - playerctl
      # greetd/greetd-selinux (DM) and adw-gtk3-theme have no EL10 base/EPEL
      # build; pull them from the COPR the cosmic manifest uses. (The old
      # zirconium/packages and ligenix/enterprise-cosmic COPRs have no EL10
      # chroot — `dnf copr enable` hard-fails on them.)
      - repo: yselkowitz/cosmic-epel
        packages:
          - greetd
          - greetd-selinux
          - adw-gtk3-theme
        options: "--nobest --allowerasing"
      # DMS (DankMaterialShell) suite: quickshell-git + dms-greeter live in the
      # danklinux COPR, while dms/dms-cli live in dms-git. Keep the package
      # lists with their provider repos: a missing name rejects the whole dnf
      # transaction, and this path is best-effort by design. That exact drift
      # left the image without DMSGreeter.qml (tunaOS#1009).
      - repo: avengemedia/danklinux
        packages:
          - quickshell-git
          - dms-greeter
      - repo: avengemedia/dms-git
        packages:
          - dms
          - dms-cli
        options: "--enablerepo=copr:copr.fedorainfracloud.org:yselkowitz:cosmic-epel"
    packages:
      - xdg-desktop-portal-gnome
      - xdg-desktop-portal-gtk
      - xdg-user-dirs
      - pipewire
      - wireplumber
      # polkit-gnome was retired Fedora-wide and has no EL10 build; polkit-kde
      # is the only GUI polkit authentication agent packaged for EL10 (EPEL).
      # It runs fine under any Wayland compositor.
      - polkit-kde
      - NetworkManager-tui
      - nautilus
      - pavucontrol
      - gnome-keyring
      - gnome-keyring-pam
      - papirus-icon-theme
      # Software Vulkan (lavapipe) -- see the fedora list's note above.
      - mesa-vulkan-drivers
      # NOTE: blueman (Bluetooth applet) has no EL10/EPEL 10 build, so it is
      # intentionally absent here (present in the Fedora section). No packaged
      # standalone Bluetooth GUI exists for EL10 niri yet.

  # ── Zypper (openSUSE Tumbleweed) ───────────────────────────────────
  # This was the thinnest list in the tree and the only genuinely bare one:
  # `niri greetd` installs a compositor and a login daemon and nothing else.
  # No bar, no launcher, no notifications, no lock screen, no terminal, no
  # file manager, no portal, no polkit agent, no keyring, no pipewire — a
  # user who logged in got a blank compositor with no way to start anything.
  # Confirmed on the published image: only `niri` was present; waybar,
  # fuzzel, swaylock, alacritty, nautilus, gvfs, gnome-keyring,
  # xdg-desktop-portal and pavucontrol were all absent.
  #
  # DMS (DankMaterialShell) — what the fedora/el10 sections use as the shell —
  # is not available here YET. quickshell, dms, dms-cli and dms-greeter are
  # becoming first-class Tideforge packages (tunaos-packages#125 builds them
  # for el10 RPM plus Debian and Ubuntu DEB), but they are not built for the
  # opensuse-tumbleweed target. That target IS declared in
  # manifests/package-factory.yaml with architectures and an R2 path — it just
  # has no cells in the package build gate, so no openSUSE package has ever
  # been built or installed by that pipeline (tunaos-packages#139). So this is
  # a not-yet, not a can't: when openSUSE is exercised there, revisit this
  # section and align it with the DMS variants.
  #
  # Until then openSUSE gets the conventional wlroots stack (waybar + fuzzel
  # + swaync + swaylock). The session differs from the DMS variants; the
  # component contract is the same.
  #
  # Every name verified with `zypper se -x -t package`; the whole list
  # dry-runs clean (exit 0, no unresolved names, no vendor changes, no
  # removals) against a base matching Containerfile.opensuse — pattern
  # enhanced_base plus packman-essentials at priority 90.
  zypper:
    - niri
    - greetd
    # greetd's stock config runs `agreety --cmd /bin/sh` — a text prompt into
    # a bare shell with no session picker. gtkgreet is the graphical greeter;
    # it is a plain Wayland client and cannot own a VT, so cage hosts it.
    # Wired up by the greetd-gtkgreet.sh post_install script below, extracted
    # from build_scripts/desktop/xfce.sh where the same block was already proven.
    - gtkgreet
    - cage
    # Wallpaper: niri draws none itself; swaybg renders the branded one.
    # The fedora and pacman sections have carried this since niri landed; this
    # one did not, and openSUSE is the single base with nothing to fall back
    # on — verify-branding-niri.sh accepts dms/quickshell drawing its own
    # background instead, which is how el10 passes without swaybg, and neither
    # dms-greeter nor cosmic-greeter is packaged for Tumbleweed (hence the
    # gtkgreet-under-cage greeter above). So:
    #   FAIL: no wallpaper daemon (swaybg/swww/wpaperd) and no dms
    # sailfin:niri, LUKS run 31087934571 — the ONLY failure in that run, with
    # greeter, session file, niri config and the wallpaper asset all passing.
    # swaybg 1.2.2 is in openSUSE:Factory (checked via the OBS public API, not
    # assumed — the package is named plainly, unlike SwayNotificationCenter).
    - swaybg
    # X11 applications under niri (niri is Wayland-only)
    - xwayland-satellite
    # Shell: bar, launcher, notifications, idle and lock
    - waybar
    - fuzzel
    - SwayNotificationCenter
    - swayidle
    - swaylock
    - wl-clipboard
    # Terminal — niri's default binding is alacritty, so shipping anything
    # else leaves Mod+T dead on a stock config
    - alacritty
    # Files, mounting and secrets
    - nautilus
    - gvfs
    - gvfs-backends
    - gvfs-fuse
    - gnome-keyring
    - gnome-keyring-pam
    - polkit-gnome
    # Portals — the GNOME backend is what the fedora/el10 sections use for
    # screencast and file chooser under niri
    - xdg-desktop-portal
    - xdg-desktop-portal-gnome
    - xdg-desktop-portal-gtk
    - xdg-user-dirs
    # Audio
    - pipewire
    - pipewire-pulseaudio
    - wireplumber
    - pavucontrol
    # Network, bluetooth and hardware keys
    - NetworkManager-applet
    - blueman
    - brightnessctl
    - playerctl
    # Theming
    - papirus-icon-theme
    - adwaita-icon-theme
    - Mesa-dri
    - Mesa-libEGL1
    # See the RPM lists above: software Vulkan for the zink path.
    - libvulkan_lvp

  # ── Emerge (Gentoo) ────────────────────────────────────────────────
  # DELIBERATELY ABSENT. niri is not packaged in the Gentoo main tree at all —
  # a search for "niri" on packages.gentoo.org returns only dev-ruby/niceogiri.
  # There is no gui-wm/niri, and no ebuild under any other category.
  #
  # This section previously read:
  #     - gui-wm/niri        does not exist
  #     - gui-apps/greetd    wrong category; the daemon is gui-libs/greetd
  # Neither atom resolves. guppy:niri is not declared as a flavor in
  # build-config.yml, so it never ran — but had anyone declared it on the
  # strength of "there is an emerge section", it would have produced exactly
  # what flounder:niri did: a published, installable image with no compositor
  # (tunaOS#915).
  #
  # What IS in the tree, for whoever packages niri later: gui-libs/greetd,
  # gui-apps/gtkgreet. Missing alongside niri: cage.
  #
  # Update (tunaOS#923, 2026-08-08): niri IS packaged, just not in ::gentoo.
  # The community GURU overlay (github.com/gentoo/guru — the one enabled via
  # `eselect repository`/app-eselect/eselect-repository, not a bespoke
  # third-party repo) carries gui-wm/niri (niri-26.04.ebuild and a -9999 live
  # ebuild), KEYWORDS="~amd64" (testing, not stable), cargo-based with real
  # deps (libinput, wayland, mesa, seatd, libxkbcommon; pipewire optional for
  # screencast). cage and gtkgreet are still not there, so the greeter story
  # is unchanged either way. Not wired into Containerfile.gentoo/guppy here:
  # it is an untested source build against this pipeline's time budget, and
  # ~amd64 keywording means the rest of the overlay's dependency graph can
  # shift under guppy with no warning. Enabling the overlay is the "bigger
  # decision" tunaOS#923 already flagged — this just removes the "does an
  # ebuild exist anywhere" unknown for whoever makes that call. cosmic-comp
  # and cosmic-session were checked the same way and are 404 in GURU too.
  #
  # Do not add an emerge list here until niri has an ebuild. Tracked in
  # tunaOS#923. Leaving the key absent is intentional: the installer's emerge
  # path now fails loudly on an empty list rather than shipping a desktop-less
  # image.

versionlock:
  - glib2

post_install_inline:
  - "glib-compile-schemas /usr/share/glib-2.0/schemas || true"
  - "if [ -f /etc/pam.d/greetd ]; then sed --sandbox -i -e '/gnome_keyring.so/ s/-auth/auth/ ; /gnome_keyring.so/ s/-session/session/' /etc/pam.d/greetd; fi"

# Post-install scripts to source (relative to build_scripts/)
post_install:
  - tuna-flatpak-remote.sh
  # No-op wherever a real greeter is already configured (Fedora/EL10 use
  # dms-greeter); on openSUSE it is the difference between a login screen and
  # greetd's stock text prompt into a bare shell.
  - greetd-gtkgreet.sh
  # Curated Flatpak set (store + browser) + preinstall service — see the
  # script header; asserts live in verify-desktop-experience.sh.
  - flatpak-preinstall.sh
