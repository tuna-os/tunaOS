# XFCE 4.20 Desktop Manifest (Wayland — xfwl4 compositor)

display_manager: gdm

packages:
  fedora:
    groups:
      - xfce-desktop
    packages:
      - gdm
      - xdg-desktop-portal-gtk
      - xdg-user-dirs-gtk
      - thunar
      - mousepad
      - ristretto
      - xfce4-terminal
    optional:
      - xfce4-wayland

  el10:
    # Wayland-only XFCE — the tunaOS xfce-wayland port (xfwl4 Rust/Smithay
    # compositor + Wayland-adapted panel/session/settings/xfdesktop/thunar).
    # No X11 (xfce-desktop group + gdm dropped). Greeter is greetd on a VT,
    # Wayland-native, so the whole session is X11-free.
    #
    # The xfce-wayland RPMs live at their own R2 path, not the main
    # $releasever tree — add it explicitly.
    display_manager: greetd
    repos:
      - name: tunaos-xfce
        baseurl: https://repo.tunaos.org/xfce/10-stream-x86_64/
        priority: 10
    copr:
      # greetd/greetd-selinux have no EL10 base/EPEL build — same COPR the
      # cosmic/niri manifests pull greetd from. --nobest/--allowerasing
      # mirrors those (avoids depsolve conflicts on EL10).
      - repo: yselkowitz/cosmic-epel
        packages:
          - greetd
          - greetd-selinux
        options: "--nobest --allowerasing"
    packages:
      # Install the core xfwl4 stack EXPLICITLY rather than the xfce4-wayland
      # meta: the meta pulls xfce4-pulseaudio-plugin, which Requires the real
      # 'pulseaudio' and conflicts with the base image's pipewire-pulseaudio
      # (depsolve failure, run 29651035650). Listing the pieces keeps the
      # pipewire audio stack intact. Do NOT list xfwm4 (X11, not built for
      # EL10). Volume control comes from the panel's pipewire/pavucontrol path.
      - xfwl4
      - xfce4-session
      - xfce4-panel
      - xfce4-settings
      - xfdesktop
      - thunar
      - tumbler
      - xfce4-terminal
      - xfce4-appfinder
      - xfce4-notifyd
      - xfce4-power-manager
      - xfce4-screenshooter
      - xdg-desktop-portal-gtk
      - xdg-user-dirs-gtk
    optional:
      # Best-effort niceties. install_available skips any that do not resolve,
      # so a miss never fails the build. NOT xfce4-pulseaudio-plugin — it
      # Requires real pulseaudio (conflicts with pipewire-pulseaudio).
      - xfce4-whiskermenu-plugin
      - xfce4-clipman-plugin
      - mousepad
      - ristretto

  apt:
    - xfce4
    - xfce4-goodies
    - gdm3
    - xdg-desktop-portal-gtk
    - thunar
    - mousepad

  # ── Zypper (openSUSE Tumbleweed) ───────────────────────────────────
  # Map-shaped, not a plain list, so it can carry its own display_manager:
  # openSUSE's XFCE is lightdm, while the top-level key is gdm (right for
  # Fedora/EL10). With a list-shaped section the installer fell back to gdm,
  # which is not installed here — safe_enable no-ops on a missing unit and
  # the graphical.target.wants link is guarded by the unit file existing, so
  # sailfin:xfce booted to graphical.target with NO display manager enabled
  # and no error anywhere in the build. Verified on the published image:
  # /etc/systemd/system/graphical.target.wants/ did not exist.
  #
  # The patterns do resolve to a real session (xfce4-session, panel,
  # settings, xfdesktop, thunar, whiskermenu, power-manager, notifyd — 293
  # packages), so this is not the GNOME skeleton case. What was missing is
  # the application and integration layer: no terminal, no text editor, no
  # image viewer, no tumbler (so Thunar showed no thumbnails), no archive
  # manager, no gvfs (so Thunar could not mount removable media or browse
  # the network), no portal at all (so Flatpak file dialogs were broken),
  # and no network/bluetooth/volume applets for the panel. Confirmed absent
  # on the published image: xfce4-terminal, tumbler, mousepad, ristretto,
  # gvfs, xdg-desktop-portal.
  #
  # Every name verified with `zypper se -x -t package`; the whole list
  # dry-runs clean (exit 0, no unresolved names, no vendor changes, no
  # removals) against a base matching Containerfile.opensuse — pattern
  # enhanced_base plus packman-essentials at priority 90.
  #
  # NOTE: xfce4-pulseaudio-plugin IS safe here, unlike on EL10 (see the el10
  # section above). openSUSE's pipewire-pulseaudio satisfies its pulseaudio
  # dependency, so the plugin coexists with the pipewire stack — dry-run
  # confirms no conflict and no vendor change.
  zypper:
    display_manager: lightdm
    packages:
      - patterns-xfce-xfce
      - patterns-xfce-xfce_basis
      - lightdm
      - lightdm-gtk-greeter
      # File manager, thumbnails and archives
      - thunar
      - thunar-volman
      - thunar-archive-plugin
      - tumbler
      - engrampa
      # Core applications
      - xfce4-terminal
      - mousepad
      - ristretto
      - xfce4-screenshooter
      - xfce4-taskmanager
      - xfce4-appfinder
      # Session services and panel plugins
      - xfce4-notifyd
      - xfce4-power-manager
      - xfce4-clipman-plugin
      - xfce4-whiskermenu-plugin
      - xfce4-pulseaudio-plugin
      - xfce4-battery-plugin
      # Mounting, portals and XDG integration
      - gvfs
      - gvfs-backends
      - gvfs-fuse
      - xdg-desktop-portal
      - xdg-desktop-portal-gtk
      - xdg-user-dirs
      - xdg-user-dirs-gtk
      # Network, bluetooth, audio, secrets and privilege escalation
      - NetworkManager-applet
      - blueman
      - pavucontrol
      - gnome-keyring
      - gnome-keyring-pam
      - polkit-gnome
      # Graphics and theming
      - Mesa-dri
      - Mesa-libEGL1
      - adwaita-icon-theme

  # ── Emerge (Gentoo) ────────────────────────────────────────────────
  # Every atom below was checked against the Gentoo main tree
  # (packages.gentoo.org/packages/<cat>/<pkg>.json returns 200) BEFORE being
  # listed. The previous list named `xfce-base/lightdm`, which does not exist
  # in any category — the display manager is x11-misc/lightdm. guppy:xfce was
  # never declared as a flavor, so it never failed out loud; had it been, the
  # build would have died on an unresolvable atom.
  #
  # xfce4-meta already pulls thunar, the terminal and tumbler (Gentoo
  # metapackages pull their trees — guppy ships 2 atoms and gets the largest
  # desktop of any variant). They are listed explicitly anyway because the
  # desktop contract asserts them: a requirement satisfied only as a
  # transitive dependency is one upstream revbump away from disappearing.
  #
  # NOTE the portal category: it is sys-apps/xdg-desktop-portal-gtk, NOT
  # gui-libs/ (which is where -wlr and -lxqt live). The contract requires a
  # gtk portal backend, so getting this wrong would fail the build.
  emerge:
    - xfce-base/xfce4-meta
    - x11-misc/lightdm
    - xfce-base/thunar
    - xfce-base/tumbler
    - x11-terms/xfce4-terminal
    - sys-apps/xdg-desktop-portal
    - sys-apps/xdg-desktop-portal-gtk
    - gnome-base/gvfs
    - gnome-base/gnome-keyring

versionlock:
  - glib2

# Post-install scripts to source (relative to build_scripts/)
post_install:
  # The greeter stack (greetd/lightdm probe, gtkgreet + cage, the
  # wayland-sessions fallback and greetd's config). Lived in
  # desktop/xfce.sh, which install-desktop.sh never sources — so
  # verify-desktop-experience.sh failed with "missing required command:
  # gtkgreet" in run 31224115663, the gate immediately after the theme one.
  - xfce-greeter.sh
  # xfwl4 panics without xfwm4's theme data and nothing on EL10 ships it.
  # MUST be listed here: install-desktop.sh sources only the scripts a
  # manifest names, so logic living in desktop/xfce.sh never runs for this
  # flavor — which is exactly how the first attempt at this fix shipped
  # without taking effect.
  - xfwm4-theme.sh
  - tuna-flatpak-remote.sh
  # Curated Flatpak set (store + browser) + preinstall service — see the
  # script header; asserts live in verify-desktop-experience.sh.
  - flatpak-preinstall.sh
