# COSMIC Desktop Manifest

display_manager: greetd

packages:
  # ── APT (Ubuntu via PPA, Debian Sid has native packages) ───────────
  # Every name below was checked against the PPA's published binaries for
  # **resolute** (Launchpad getPublishedBinaries, exact_match, status=Published)
  # — grouper's series, and the only one this PPA publishes for. greetd is not
  # in the PPA; it comes from the Ubuntu archive (resolute has 0.10.3-5).
  #
  # The icon theme is `cosmic-icons` here, NOT the `cosmic-icon-theme` the
  # Fedora and EL10 sections use. That name is published by neither the PPA
  # nor the Ubuntu archive, so it would have failed the whole apt transaction.
  apt:
    ppa:
      - repo: "ppa:hepp3n/cosmic-epoch"
        condition: "ubuntu"  # only add PPA on Ubuntu; Debian Sid has native pkgs
    packages:
      - cosmic-session
      - cosmic-comp
      - cosmic-panel
      - cosmic-app-library
      - cosmic-applets
      - cosmic-bg
      - cosmic-files
      - cosmic-idle
      - cosmic-launcher
      - cosmic-notifications
      - cosmic-osd
      - cosmic-randr
      - cosmic-screenshot
      - cosmic-settings
      - cosmic-settings-daemon
      - cosmic-term
      - cosmic-wallpapers
      - cosmic-workspaces
      - cosmic-icons
      - pop-icon-theme
      # COSMIC's own greeter. The PPA publishes it for resolute, so unlike
      # openSUSE this does not fall back to greetd-gtkgreet.sh.
      - cosmic-greeter
      - greetd
      - xdg-desktop-portal-cosmic

  fedora:
    packages:
      - cosmic-session
      - cosmic-comp
      - cosmic-panel
      - cosmic-app-library
      - cosmic-applets
      - cosmic-bg
      - cosmic-files
      - cosmic-idle
      - cosmic-launcher
      - cosmic-notifications
      - cosmic-osd
      - cosmic-randr
      - cosmic-screenshot
      - cosmic-settings
      - cosmic-settings-daemon
      - cosmic-term
      - cosmic-wallpapers
      - cosmic-workspaces
      - cosmic-greeter
      - cosmic-icon-theme
      - greetd
      - xdg-desktop-portal-cosmic
      - pop-icon-theme

  el10:
    # cosmic-greeter hard-requires fprintd-pam, which CentOS Stream 10 only
    # builds for x86_64 -- that gap is why aarch64 cosmic was pinned off in
    # tunaOS's build-config.yml (tunaOS#732). It's now built
    # (tuna-os/github-copr#110, same pinned version as x86_64's 1.94.5) and
    # published at its own R2 path, separate from the main tuna-os.repo.
    # baseurl is not $basearch-templated (only aarch64 RPMs are published
    # here), so this is harmless to enable unconditionally on x86_64 --
    # dnf just finds no matching-arch packages and falls back to CentOS
    # Stream's own x86_64 fprintd-pam as before.
    repos:
      - name: tuna-os-fprintd
        baseurl: https://repo.tunaos.org/fprintd/10-stream-aarch64/
        priority: 10
    copr:
      - repo: yselkowitz/cosmic-epel
        packages:
          - cosmic-comp
          - cosmic-panel
          - cosmic-app-library
          - cosmic-applets
          - cosmic-bg
          - cosmic-files
          - cosmic-idle
          - cosmic-launcher
          - cosmic-notifications
          - cosmic-osd
          - cosmic-randr
          - cosmic-screenshot
          - cosmic-settings
          - cosmic-settings-daemon
          - cosmic-term
          - cosmic-wallpapers
          - cosmic-workspaces
          - cosmic-icon-theme
          - xdg-desktop-portal-cosmic
          - adw-gtk3-theme
      - repo: yselkowitz/cosmic-epel
        packages:
          - cosmic-session
          - greetd
          - cosmic-greeter
        options: "--nobest --allowerasing"
    packages:
      - flatpak
      - pipewire
      - wireplumber
      - wl-clipboard
      - xdg-user-dirs
      - zram-generator
      # Keyring is essential: the greetd PAM patch below wires gnome-keyring into
      # the login flow. Both are in EL10 appstream, so require (not best-effort).
      - gnome-keyring
      - gnome-keyring-pam
    optional:
      - brightnessctl
      - playerctl

  # ── Zypper (openSUSE Tumbleweed) ───────────────────────────────────
  # sailfin:cosmic did not exist: this manifest had no zypper section, so the
  # flavor could not be declared. Tumbleweed does package COSMIC, and richly —
  # every name below was listed by `zypper se cosmic` and the whole set
  # installs cleanly (`zypper install -y`, exit 0) on a Tumbleweed base.
  #
  # Two things are NOT packaged, and both change the shape of this list:
  #
  #   cosmic-settings   Does not exist on Tumbleweed under that name or any
  #                     other — there is no settings binary after installing
  #                     the full set (checked /usr/bin). Do NOT list it: the
  #                     Fedora name would fail to resolve. cosmic-ext-tweaks
  #                     is a third-party tweak tool, not the settings app, so
  #                     it is not a substitute. The session is usable without
  #                     it; the gap is upstream packaging.
  #   cosmic-greeter    Also absent, so COSMIC's own greeter cannot be used.
  #                     greetd is here instead, with gtkgreet+cage supplied by
  #                     the shared greetd-gtkgreet.sh post_install script (the
  #                     same one sailfin:niri uses). Without it greetd falls
  #                     back to `agreety --cmd /bin/sh` — a text prompt into a
  #                     bare shell.
  #
  # Verified after a real install: /usr/share/wayland-sessions/cosmic.desktop
  # exists and cosmic-comp is on PATH, so the desktop contract is satisfiable.
  zypper:
    # Session and compositor
    - cosmic-comp
    - cosmic-session
    - cosmic-panel
    - cosmic-launcher
    - cosmic-applets
    - cosmic-bg
    - cosmic-idle
    - cosmic-notifications
    - cosmic-osd
    - cosmic-randr
    - cosmic-workspaces
    # Applications
    - cosmic-files
    - cosmic-term
    - cosmic-edit
    - cosmic-store
    - cosmic-screenshot
    # Theming
    - cosmic-icons
    - cosmic-wallpapers
    # Greeter — cosmic-greeter is not packaged here; see above
    - greetd
    - gtkgreet
    - cage
    # Portals: COSMIC ships its own backend, with gtk alongside for GTK apps
    - xdg-desktop-portal
    - xdg-desktop-portal-cosmic
    - xdg-desktop-portal-gtk
    - xdg-user-dirs
    # Files, secrets and audio
    - gvfs
    - gvfs-backends
    - gvfs-fuse
    - gnome-keyring
    - gnome-keyring-pam
    - pipewire
    - pipewire-pulseaudio
    - wireplumber
    - pavucontrol
    - wl-clipboard
    - Mesa-dri
    - Mesa-libEGL1

post_install_inline:
  - "glib-compile-schemas /usr/share/glib-2.0/schemas || true"
  - "if [ -f /etc/pam.d/greetd ]; then sed --sandbox -i -e '/gnome_keyring.so/ s/-auth/auth/ ; /gnome_keyring.so/ s/-session/session/' /etc/pam.d/greetd; fi"

# Post-install scripts to source (relative to build_scripts/)
post_install:
  - tuna-flatpak-remote.sh
  # No-op wherever cosmic-greeter is installed (Fedora/EL10/Ubuntu), because it
  # only acts when gtkgreet AND cage are both present. On openSUSE, where
  # cosmic-greeter is not packaged, it is the difference between a login screen
  # and greetd's stock `agreety --cmd /bin/sh` text prompt into a bare shell.
  - greetd-gtkgreet.sh
