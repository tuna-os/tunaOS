# COSMIC Desktop Manifest

display_manager: greetd

packages:
  # ── APT (Ubuntu only, via PPA) ─────────────────────────────────────
  # tunaOS#964 tracks moving this whole apt: block off the third-party PPA
  # and onto our own Tideforge-built debs at repo.tunaos.org/tideforge/
  # <distro>/ — the only desktop still sourced from a repo we don't
  # control, and the direct cause of grouper:cosmic's known failures
  # (run 30692866756) and flounder/flounder-sid:cosmic shipping with no
  # compositor at all (#924, section 13 of docs/ci-troubleshooting.md).
  #
  # Partial migration in progress (tunaOS#964). The Tideforge repo below
  # is ADDED alongside the PPA and apt resolves each package from whichever
  # source carries the best version. Three packages (pop-icon-theme,
  # cosmic-panel, cosmic-randr) share the same name in both repos and are
  # therefore already resolved from Tideforge when its version beats the
  # PPA's; the PPA remains the sole provider for the other 11. cosmic-
  # icon-theme is NOT listed because the PPA names the icon set
  # `cosmic-icons` and cosmic-session from the PPA depends on that name —
  # switching to cosmic-icon-theme requires cosmic-session to be served
  # from Tideforge too (its recipe ships an intentionally empty Depends
  # list until then).
  #
  # Status as of 2026-08-11, verified against tuna-os/tunaos-packages
  # directly (manifests/target-queues/cosmic.yaml, .github/workflows/
  # publish-tideforge-debs.yml): 4 of the 14 required recipes (pop-icon-
  # theme, cosmic-icon-theme, cosmic-randr, cosmic-panel) are published to
  # the R2-backed apt repo at repo.tunaos.org/tideforge/ubuntu/. A 5th
  # (cosmic-comp) is gate-proven but its publish-matrix entry has not
  # landed. The other 9 — including cosmic-session, which must go last
  # since it Requires the other ten — are not yet gate-widened.
  #
  # The PPA MUST remain until all 14 are published to Tideforge.
  # cosmic-session, cosmic-greeter, and cosmic-settings-daemon are the
  # critical blockers: each has dependencies that only the PPA satisfies
  # today (cosmic-settings-daemon Requires adw-gtk3-theme — no provider
  # in Tideforge; cosmic-greeter Requires greetd-selinux — our greetd
  # recipe ships no such subpackage). Re-check tunaos-packages'
  # publish-tideforge-debs.yml matrix and manifests/target-queues/
  # cosmic.yaml before touching this block.
  #
  # NOT Debian. This block used to say "Debian Sid has native packages"; it
  # does not, and neither does any other suite. Checked with ftp-master's
  # madison API across oldoldstable..experimental for cosmic-session,
  # cosmic-comp, cosmic-panel, cosmic-files, cosmic-term, cosmic-settings,
  # cosmic-greeter and xdg-desktop-portal-cosmic — all empty, against a
  # control that is not. The `condition: ubuntu` on both the Tideforge repo
  # and the PPA below is therefore the whole story: on a Debian base this
  # list has no source and apt exits 100 with "Unable to locate package"
  # (flounder:cosmic, run 31087927879). flounder and flounder-sid no longer
  # declare a cosmic flavour as a result.
  #
  # Every name below was checked against the PPA's published binaries for
  # **resolute** (Launchpad getPublishedBinaries, exact_match, status=Published)
  # — grouper's series, and the only one this PPA publishes for. greetd is not
  # in the PPA; it comes from the Ubuntu archive (resolute has 0.10.3-5).
  #
  # The icon theme is `cosmic-icons` here, NOT the `cosmic-icon-theme` the
  # Fedora and EL10 sections use. That name is published by neither the PPA
  # nor the Ubuntu archive, so it would have failed the whole apt transaction.
  # Tideforge publishes `cosmic-icon-theme` but cosmic-session from the PPA
  # depends on `cosmic-icons` — switching the icon package name requires
  # switching cosmic-session first.
  #
  # amd64 ONLY. The PPA publishes amd64 and amd64v3 and nothing else — no
  # arm64 build exists for any of these names. grouper builds both arches, so
  # its cosmic flavour is pinned to linux/amd64 in build-config.yml; without
  # that pin the arm64 job is the only one that fails, which is how this was
  # found (run 31088031074, 1 of 4 jobs). Checking the series without checking
  # the architecture is what missed it the first time.
  apt:
    repos:
      - name: tideforge
        uri: https://repo.tunaos.org/tideforge/ubuntu/
        suite: ./
        keyring_url: https://repo.tunaos.org/tideforge/ubuntu/tideforge.gpg
        condition: "ubuntu"
    ppa:
      - repo: "ppa:hepp3n/cosmic-epoch"
        condition: "ubuntu"  # Ubuntu only — Debian has no COSMIC anywhere (see above)
    packages:
      - cosmic-session
      - cosmic-comp
      - cosmic-panel
      - cosmic-app-library
      - cosmic-applets
      - cosmic-bg
      - cosmic-files
      - cosmic-idle
      - cosmic-launcher
      - cosmic-notifications
      - cosmic-osd
      - cosmic-randr
      - cosmic-screenshot
      - cosmic-settings
      - cosmic-settings-daemon
      - cosmic-term
      - cosmic-wallpapers
      - cosmic-workspaces
      # cosmic-ICONS, not cosmic-icon-theme. The RPM name is the theme one and
      # it is what this list said, so apt exited 100 on the single name it
      # could not find and took the whole transaction with it:
      #   E: Unable to locate package cosmic-icon-theme
      # (grouper:cosmic, LUKS run 31135209477 — the other 20 names resolved).
      # ppa:hepp3n/cosmic-epoch publishes 46 binaries for resolute; the icon
      # set among them is `cosmic-icons` 1.5.0~b78b059, and no package whose
      # name contains "icon-theme" exists there at all except pop-icon-theme.
      # Tideforge publishes `cosmic-icon-theme` but the PPA's cosmic-session
      # depends on `cosmic-icons` — TODO(#964): switch to cosmic-icon-theme
      # when cosmic-session is served from Tideforge.
      - cosmic-icons
      - pop-icon-theme
      # COSMIC's own greeter. The PPA publishes it for resolute, so unlike
      # openSUSE this does not fall back to greetd-gtkgreet.sh. It also arrives
      # as a cosmic-session dependency, and naming it keeps the apt list honest
      # about what the image gets.
      - cosmic-greeter
      - greetd
      - xdg-desktop-portal-cosmic
      # Software Vulkan (lavapipe). Not a dependency of anything, so it is
      # only present if asked for by name -- which is why every cosmic cell
      # that has been booted fails on GPU-less CI while gnome starts on the
      # identical guest. The guest HAS a render node (run 32681262659 read
      # /dev/dri and found renderD128) but the kernel reports `-virgl`, so
      # Mesa routes GL through zink, and zink with no Vulkan ICD installed
      # cannot pick a device:
      #   MESA: error: ZINK: failed to choose pdev
      #   libEGL warning: egl: failed to create dri2 screen
      # cosmic-comp then holds a Wayland connection with no surface, which
      # is the 'process running, nothing on screen' state the smoke gate
      # reports. On real hardware it survived by falling back to Vulkan
      # llvmpipe -- this is that fallback, packaged.
      - mesa-vulkan-drivers

  fedora:
    packages:
      # dconf is explicit, not assumed: the TunaOS branding keyfiles in
      # /etc/dconf/db/distro.d need `dconf update` at build time, and
      # verify-branding fails the build if the compiled db is missing. Full
      # Fedora pulls dconf transitively so this line is a no-op there, but
      # hummingbird's minimal rebuild does not (its cosmic chain never
      # requires it — measured on the 2026-08-18 redispatch, where the image
      # had keyfiles, no dconf binary, and TUNAOS_BRANDING_FAIL). The package
      # is in the 20251124 hummingbird index. Listed in BOTH sections so the
      # wiring test's pinned diff (exactly cosmic-settings-daemon) holds.
      - dconf
      - cosmic-session
      - cosmic-comp
      - cosmic-panel
      - cosmic-app-library
      - cosmic-applets
      - cosmic-bg
      - cosmic-files
      - cosmic-idle
      - cosmic-launcher
      - cosmic-notifications
      - cosmic-osd
      - cosmic-randr
      - cosmic-screenshot
      - cosmic-settings
      - cosmic-settings-daemon
      - cosmic-term
      - cosmic-wallpapers
      - cosmic-workspaces
      - cosmic-greeter
      - cosmic-icon-theme
      - greetd
      - xdg-desktop-portal-cosmic
      - pop-icon-theme
      # Software Vulkan (lavapipe) -- see the apt list's note above for why
      # this must be named rather than pulled in transitively.
      - mesa-vulkan-drivers

  # ── Hummingbird (Fedora rebuild) ───────────────────────────────────
  # The cheapest real win in the matrix (#1755 §4): the rebuild repo carries
  # 22 of cosmic's 23 Fedora packages, and the cell was red purely because no
  # section named them. Re-measured 2026-08-18 against the live primary.xml
  # (8100 packages): everything below resolves.
  #
  # NOT an alias of the fedora list (unlike gnome.yaml's section, which IS
  # `*fedora_gnome_packages`): the repo has no `cosmic-settings-daemon` — the
  # single gap — and hummingbird installs run --skip-unavailable, so listing
  # it would record a permanent, known omission every night instead of a
  # decision. Same treatment as the zypper section's cosmic-settings note
  # above: do not list what the repository cannot supply. Re-add it (or
  # restore the alias outright) when tunaos-packages rebuilds it —
  # tests/bats/test_hummingbird_desktop_wiring.bats pins that the difference
  # between this list and fedora's is exactly that one package, so the two
  # cannot drift silently.
  #
  # Snapshot pin, not `current/$basearch/`: same status as gnome.yaml's
  # section — the floating alias does not exist on repo.tunaos.org yet
  # (tuna-os/tunaos-packages#365), and the x86_64-only path is the only one
  # published (#1755 §3), which is fine because this section is only read on
  # the amd64 leg's dnf path.
  hummingbird:
    repos:
      - name: tunaos-hummingbird
        baseurl: https://repo.tunaos.org/hummingbird/20251124-$basearch/
        priority: 5
    packages:
      # See the fedora list's dconf note — needed here for real (the rebuild
      # never pulls it transitively), mirrored there to keep the lists' diff
      # pinned to exactly cosmic-settings-daemon.
      - dconf
      - cosmic-session
      - cosmic-comp
      - cosmic-panel
      - cosmic-app-library
      - cosmic-applets
      - cosmic-bg
      - cosmic-files
      - cosmic-idle
      - cosmic-launcher
      - cosmic-notifications
      - cosmic-osd
      - cosmic-randr
      - cosmic-screenshot
      - cosmic-settings
      # cosmic-settings-daemon deliberately absent — see the section comment.
      - cosmic-term
      - cosmic-wallpapers
      - cosmic-workspaces
      - cosmic-greeter
      - cosmic-icon-theme
      - greetd
      - xdg-desktop-portal-cosmic
      - pop-icon-theme
      # Software Vulkan (lavapipe) -- see the apt list's note above for why
      # this must be named rather than pulled in transitively.
      - mesa-vulkan-drivers

  # ── Wahoo (Fedora ELN) ─────────────────────────────────────────────────
  # ELN carries COSMIC natively, in eln-extras, at 1.6.0 — and that is the
  # headline finding of the whole lane so far, not just a convenience.
  # `cosmic.el10` above sources COSMIC from COPR `yselkowitz/cosmic-epel`
  # (twice) and fprintd from repo.tunaos.org, both tier-3 migration
  # inventory under PACKAGE-SOURCING.md. On this base neither is needed:
  # the compose ships cosmic-session/comp/panel/files/greeter/settings and
  # xdg-desktop-portal-cosmic, and `fprintd-1.94.5-6.eln158` resolves from
  # eln-appstream, so the aarch64 fprintd gap that pinned cosmic off arm64
  # on EL10 (tunaOS#732) does not reproduce here either.
  #
  # Measured with `dnf repoquery` against the pinned eln-bootc digest on
  # 2026-08-26: 23 of 24 present. If EL11 keeps this, the COSMIC COPR
  # dependency retires itself at the EL10 -> EL11 transition rather than
  # needing a Tideforge migration (#2048, #2049).
  #
  # NO copr: block here, deliberately — ELN needs none, and a new one
  # fails scripts/check-package-sources.py.
  eln:
    packages:
      - dconf
      - cosmic-session
      - cosmic-comp
      - cosmic-panel
      - cosmic-app-library
      - cosmic-applets
      - cosmic-bg
      - cosmic-files
      - cosmic-idle
      - cosmic-launcher
      - cosmic-notifications
      - cosmic-osd
      - cosmic-randr
      - cosmic-screenshot
      - cosmic-settings
      - cosmic-settings-daemon
      - cosmic-term
      - cosmic-workspaces
      - cosmic-greeter
      - cosmic-icon-theme
      - greetd
      - xdg-desktop-portal-cosmic
      - pop-icon-theme
      # Software Vulkan (lavapipe) -- see the apt list's note above for why
      # this must be named rather than pulled in transitively.
      - mesa-vulkan-drivers
    # Absent from ELN on 2026-08-26 (cosmic-icons likewise, and it is not
    # in the fedora list either). Best-effort so it lands by itself when
    # the compose grows it — tracked in tunaos-packages.
    optional:
      - cosmic-wallpapers
  el10:
    # cosmic-greeter hard-requires fprintd-pam, which CentOS Stream 10 only
    # builds for x86_64 -- that gap is why aarch64 cosmic was pinned off in
    # tunaOS's build-config.yml (tunaOS#732). It's now built
    # (tuna-os/tunaos-packages#110, same pinned version as x86_64's 1.94.5) and
    # published at its own R2 path, separate from the main tuna-os.repo.
    # baseurl is not $basearch-templated (only aarch64 RPMs are published
    # here), so this is harmless to enable unconditionally on x86_64 --
    # dnf just finds no matching-arch packages and falls back to CentOS
    # Stream's own x86_64 fprintd-pam as before.
    repos:
      - name: tuna-os-fprintd
        baseurl: https://repo.tunaos.org/fprintd/10-stream-aarch64/
        priority: 10
    copr:
      - repo: yselkowitz/cosmic-epel
        packages:
          - cosmic-comp
          - cosmic-panel
          - cosmic-app-library
          - cosmic-applets
          - cosmic-bg
          - cosmic-files
          - cosmic-idle
          - cosmic-launcher
          - cosmic-notifications
          - cosmic-osd
          - cosmic-randr
          - cosmic-screenshot
          - cosmic-settings
          - cosmic-settings-daemon
          - cosmic-term
          - cosmic-wallpapers
          - cosmic-workspaces
          - cosmic-icon-theme
          - xdg-desktop-portal-cosmic
          - adw-gtk3-theme
      - repo: yselkowitz/cosmic-epel
        packages:
          - cosmic-session
          - greetd
          - cosmic-greeter
        options: "--nobest --allowerasing"
    packages:
      - flatpak
      - pipewire
      - wireplumber
      - wl-clipboard
      - xdg-user-dirs
      - zram-generator
      # Keyring is essential: the greetd PAM patch below wires gnome-keyring into
      # the login flow. Both are in EL10 appstream, so require (not best-effort).
      - gnome-keyring
      - gnome-keyring-pam
      # Software Vulkan (lavapipe) -- see the apt list's note above for why
      # this must be named rather than pulled in transitively.
      - mesa-vulkan-drivers
    optional:
      - brightnessctl
      - playerctl

  # ── Zypper (openSUSE Tumbleweed) ───────────────────────────────────
  # sailfin:cosmic did not exist: this manifest had no zypper section, so the
  # flavor could not be declared. Tumbleweed does package COSMIC, and richly —
  # every name below was listed by `zypper se cosmic` and the whole set
  # installs cleanly (`zypper install -y`, exit 0) on a Tumbleweed base.
  #
  # Two things are NOT packaged, and both change the shape of this list:
  #
  #   cosmic-settings   Does not exist on Tumbleweed under that name or any
  #                     other — there is no settings binary after installing
  #                     the full set (checked /usr/bin). Do NOT list it: the
  #                     Fedora name would fail to resolve. cosmic-ext-tweaks
  #                     is a third-party tweak tool, not the settings app, so
  #                     it is not a substitute. The session is usable without
  #                     it; the gap is upstream packaging.
  #   cosmic-greeter    Also absent, so COSMIC's own greeter cannot be used.
  #                     greetd is here instead, with gtkgreet+cage supplied by
  #                     the shared greetd-gtkgreet.sh post_install script (the
  #                     same one sailfin:niri uses). Without it greetd falls
  #                     back to `agreety --cmd /bin/sh` — a text prompt into a
  #                     bare shell.
  #
  # Verified after a real install: /usr/share/wayland-sessions/cosmic.desktop
  # exists and cosmic-comp is on PATH, so the desktop contract is satisfiable.
  zypper:
    # Session and compositor
    - cosmic-comp
    - cosmic-session
    - cosmic-panel
    - cosmic-launcher
    - cosmic-applets
    - cosmic-bg
    - cosmic-idle
    - cosmic-notifications
    - cosmic-osd
    - cosmic-randr
    - cosmic-workspaces
    # Applications
    - cosmic-files
    - cosmic-term
    - cosmic-edit
    - cosmic-store
    - cosmic-screenshot
    # Theming
    - cosmic-icons
    - cosmic-wallpapers
    # Greeter — cosmic-greeter is not packaged here; see above
    - greetd
    - gtkgreet
    - cage
    # Portals: COSMIC ships its own backend, with gtk alongside for GTK apps
    - xdg-desktop-portal
    - xdg-desktop-portal-cosmic
    - xdg-desktop-portal-gtk
    - xdg-user-dirs
    # Files, secrets and audio
    - gvfs
    - gvfs-backends
    - gvfs-fuse
    - gnome-keyring
    - gnome-keyring-pam
    - pipewire
    - pipewire-pulseaudio
    - wireplumber
    - pavucontrol
    - wl-clipboard
    - Mesa-dri
    - Mesa-libEGL1
    # Software Vulkan (lavapipe). Not a dependency of anything, so it is
    # only present if asked for by name -- which is why every cosmic cell
    # that has been booted fails on GPU-less CI while gnome starts on the
    # See the RPM lists above for the full zink/lavapipe note.
    - libvulkan_lvp

  # ── Emerge (Gentoo) ────────────────────────────────────────────────
  # DELIBERATELY ABSENT — no emerge section at all, same treatment as
  # apt's flounder/flounder-sid non-declaration above. Checked
  # (packages.gentoo.org/packages/<cat>/<pkg>.json, 200 = present) for
  # cosmic-comp and cosmic-session under both gui-wm/ and gui-apps/: all
  # four return 404, and no other category has a match either.
  #
  # Also checked the community GURU overlay (github.com/gentoo/guru,
  # enabled via `eselect repository` — not a bespoke third-party repo):
  # zero cosmic-* ebuilds there either, unlike niri (see niri.yaml), which
  # GURU does carry. guppy does not declare a cosmic flavor in
  # build-config.yml, so this never fails out loud; recorded here so a
  # future manifest edit doesn't add one on the strength of "there might
  # be an emerge section for this". tunaOS#923.

post_install_inline:
  - "glib-compile-schemas /usr/share/glib-2.0/schemas || true"
  - "if [ -f /etc/pam.d/greetd ]; then sed --sandbox -i -e '/gnome_keyring.so/ s/-auth/auth/ ; /gnome_keyring.so/ s/-session/session/' /etc/pam.d/greetd; fi"

# Post-install scripts to source (relative to build_scripts/)
post_install:
  - tuna-flatpak-remote.sh
  # No-op wherever cosmic-greeter is installed (Fedora/EL10/Ubuntu), because it
  # only acts when gtkgreet AND cage are both present. On openSUSE, where
  # cosmic-greeter is not packaged, it is the difference between a login screen
  # and greetd's stock `agreety --cmd /bin/sh` text prompt into a bare shell.
  - greetd-gtkgreet.sh
  # Curated Flatpak set (store + browser) + preinstall service — see the
  # script header; asserts live in verify-desktop-experience.sh.
  - flatpak-preinstall.sh
