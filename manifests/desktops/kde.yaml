# KDE Plasma Desktop Manifest
# Declares what goes into a KDE image — packages, services, config.
# The generic installer (install-desktop.sh) reads this and applies it.

display_manager: sddm

# Packages to install, keyed by package manager / OS family.
# The installer picks the right section based on detected OS.
packages:
  # ── APT (Ubuntu/Debian) ────────────────────────────────────────────
  apt:
    - kde-plasma-desktop
    - sddm
    - dolphin
    - konsole
    - kate
    - ark
    - kdeconnect
    - xdg-desktop-portal-kde
    - qt6-wayland

  # ── DNF: Fedora ────────────────────────────────────────────────────
  fedora:
    groups:
      - kde-desktop
    packages:
      - sddm
      - dolphin
      - konsole
      - kate
      - ark
      - plasma-discover
      - kde-connect
      - xdg-desktop-portal-kde
      - qt5-qtwayland
      - qt6-qtwayland
      - ksshaskpass
      - ksystemlog
      - input-remapper
      - evtest
      - tesseract
      - libratbag-ratbagd
      - solaar-udev
      - openrgb-udev-rules
      - pam-u2f
      - pam_yubico
      - pamu2fcfg
      - yubikey-manager
      - nvtop
    exclude:
      - PackageKit
      - PackageKit-command-not-found

  # ── Wahoo (Fedora ELN) ─────────────────────────────────────────────────
  # ELN defines the `kde-desktop` group (86 entries, eln-extras) and ships
  # Plasma 6.7.4 — plasma-desktop, plasma-workspace, kwin, kscreen,
  # plasma-nm — plus sddm 0.21.0 and dolphin/konsole/kate at 26.08. So the
  # group install this section leans on resolves, unlike xfce-desktop,
  # which ELN does not define at all (#2052).
  #
  # Measured with `dnf repoquery` against the pinned eln-bootc digest on
  # 2026-08-26: 16 of 23 explicit packages present. The seven misses are
  # all peripheral input / security-key extras — none is needed for a
  # session to start — so they go under optional: rather than blocking the
  # flavor. Listing them strictly would fail the build over a fingerprint
  # helper; dropping them silently would be the #1555 shape. Neither.
  #
  # MEASURED 2026-08-27 (run 33041330231), replacing the prediction that
  # used to sit here: the group makes `plasma-login-manager` (6.7.4)
  # mandatory, it claims display-manager.service first, and the build logs
  #
  #   display-manager.service already points at plasmalogin.service; leaving it
  #
  # so the greeter on wahoo is plasmalogin, NOT the sddm this manifest
  # declares — sddm is installed but not wired. The Gate PASSED on that, so
  # it boots and this is an accuracy gap rather than a breakage.
  #
  # Deliberately not "fixed" by editing display_manager: that key is
  # top-level in this file and shared with the el10 and fedora sections,
  # where sddm IS correct. Overriding it for ELN alone needs per-section
  # display_manager support on the dnf path (the zypper path already has
  # it). Left as-is until someone decides that is worth adding.
  eln:
    groups:
      - kde-desktop
    packages:
      - sddm
      - dolphin
      - konsole
      - kate
      - ark
      - plasma-discover
      - kde-connect
      - xdg-desktop-portal-kde
      - qt5-qtwayland
      - qt6-qtwayland
      - ksshaskpass
      - ksystemlog
      - tesseract
      - pam-u2f
      - pam_yubico
      - nvtop
    # Absent from ELN on 2026-08-26 — peripheral input/security-key extras.
    # Best-effort so they land by themselves when the compose grows them.
    optional:
      - input-remapper
      - evtest
      - libratbag-ratbagd
      - solaar-udev
      - openrgb-udev-rules
      - pamu2fcfg
      - yubikey-manager
    exclude:
      - PackageKit
      - PackageKit-command-not-found
  # ── DNF: EL10 (AlmaLinux, CentOS Stream, RHEL) ────────────────────
  el10:
    groups:
      - "KDE Plasma Workspaces"
      - "Common NetworkManager submodules"
      - "Core"
      - "Fonts"
      - "Guest Desktop Agents"
      - "Hardware Support"
      - "Printing Client"
      - "Standard"
    group_options: "--nobest"
    group_exclude:
      - plasma-discover
      - plasma-discover-notifier
      - plasma-nm-vpnc
      - pinentry-qt
      - plasma-workspace-wayland
      - plasma-workspace-geolocation
      - plasma-drkonqi
    packages:
      - plasma-desktop
      - plasma-workspace
      - sddm
      - dolphin
      - konsole
      - kate
      - ark
      - xdg-desktop-portal-kde
      - qt5-qtwayland
      - qt6-qtwayland
    exclude:
      - PackageKit
      - PackageKit-command-not-found
    # Best-effort packages — installed if available in repos, skipped otherwise
    optional:
      - kde-connect
      - ksshaskpass
      - ksystemlog
      - input-remapper
      - evtest
      - tesseract
      - libratbag-ratbagd
      - solaar-udev
      - openrgb-udev-rules
      - pam-u2f
      - pam_yubico
      - pamu2fcfg
      - yubikey-manager
      - nvtop
    # fcitx5 input method support (Asian languages) — only if available
    optional_group:
      - fcitx5
      - fcitx5-chewing
      - fcitx5-chinese-addons
      - fcitx5-gtk
      - fcitx5-hangul
      - fcitx5-m17n
      - fcitx5-mozc
      - fcitx5-qt
      - fcitx5-sayura
      - fcitx5-unikey
      - kcm-fcitx5

  # ── Zypper (openSUSE Tumbleweed) ───────────────────────────────────
  # Unlike GNOME's pattern, patterns-kde-kde{,_plasma} DO resolve to a real
  # session: plasma6-desktop, plasma6-workspace, kwin6, systemsettings6,
  # kscreen6, powerdevil6, kwallet, polkit-kde-agent-6 and
  # xdg-desktop-portal-kde6 all come in (833 packages on bare Tumbleweed).
  # What they do NOT bring is the application and integration layer — no
  # file manager, no terminal, no editor, no archiver, and critically no
  # plasma6-nm / plasma6-pa, so the panel had neither a network nor a volume
  # applet. Everything below closes that gap and mirrors what the el10 and
  # fedora sections already ask for.
  #
  # Every name is verified against Tumbleweed with `zypper se -x -t package`,
  # and the whole list dry-runs clean (exit 0, no unresolved names, no vendor
  # changes, no removals) on a base matching Containerfile.opensuse — pattern
  # enhanced_base plus the packman-essentials repo at priority 90. Plain
  # Tumbleweed is NOT a sufficient test bed: packman ships rival multimedia
  # builds, and a package that forces a vendor change makes `zypper install
  # -y` exit non-zero, which under `set -euo pipefail` fails the build.
  # openSUSE names that differ from the obvious guess:
  #   plasma-nm            → plasma6-nm       (likewise plasma6-pa)
  #   xdg-desktop-portal-kde → xdg-desktop-portal-kde6
  #   kwalletmanager5/6    → kwalletmanager (unsuffixed)
  #   discover             → discover6 (deliberately NOT installed — the el10
  #                          section excludes plasma-discover and
  #                          disable_desktop_files hides it; Bazaar/Flatpak
  #                          is the software centre)
  zypper:
    - patterns-kde-kde
    - patterns-kde-kde_plasma
    - sddm
    # Applications — the layer the patterns omit entirely
    - dolphin
    - konsole
    - kate
    - ark
    - gwenview
    - okular
    - spectacle
    - kcalc
    - filelight
    - kfind
    - kwalletmanager
    - khelpcenter
    - kdeconnect-kde
    - partitionmanager
    # Panel applets and system settings modules — network and volume were
    # the two most visible omissions
    - plasma6-nm
    - plasma6-pa
    - plasma6-systemmonitor
    - plasma6-disks
    - plasma6-firewall
    - plasma6-thunderbolt
    - bluedevil6
    - kdeplasma6-addons
    - plasma6-workspace-wallpapers
    # Portals and XDG integration
    - xdg-desktop-portal
    - xdg-desktop-portal-kde6
    - xdg-desktop-portal-gtk
    - xdg-user-dirs
    - xdg-user-dirs-gtk
    # File handling: KIO slaves, thumbnailers, and gvfs so GTK apps can
    # mount and browse the same things Dolphin can
    - kio-extras
    - kdegraphics-thumbnailers
    - ffmpegthumbs
    - kf6-kimageformats
    - kdenetwork-filesharing
    - gvfs
    - gvfs-backends
    - gvfs-fuse
    # Hardware, network and power integration
    - NetworkManager-openvpn
    - NetworkManager-openconnect
    - NetworkManager-vpnc
    - power-profiles-daemon
    - switcheroo-control
    - fwupd
    - Mesa-dri
    - Mesa-libEGL1

  # ── Emerge (Gentoo) ────────────────────────────────────────────────
  # Curated set, NOT kde-apps/kde-apps-meta: the everything-meta drags
  # kdemultimedia -> kamoso -> gst-plugins-meta -> 32-bit glib
  # (abi_x86_32) on top of everything else it drags in.
  emerge:
    - kde-plasma/plasma-meta
    - x11-misc/sddm
    - kde-apps/dolphin
    - kde-apps/konsole
    - kde-apps/kate
    - kde-apps/ark

# Version locks — prevent partial upgrades causing black screens
# Ref: https://github.com/ublue-os/aurora/issues/1227
versionlock:
  - plasma-desktop
  - "qt6-*"

# Desktop files to disable (replaced by Bazaar/Flatpak)
disable_desktop_files:
  - org.kde.discover.desktop
  - org.kde.discover.urlhandler.desktop

# Post-install scripts to source (relative to build_scripts/)
post_install:
  - tuna-flatpak-remote.sh
  - kcm-ublue.sh
  # Curated Flatpak set (store + browser) + preinstall service — see the
  # script header; asserts live in verify-desktop-experience.sh.
  - flatpak-preinstall.sh
