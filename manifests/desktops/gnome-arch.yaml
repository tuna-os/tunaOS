# GNOME Desktop Manifest — Arch Linux / CachyOS

display_manager: gdm

packages:
  pacman:
    - gdm
    - gnome-shell
    - gnome-control-center
    - gnome-settings-daemon
    - gnome-session
    - gnome-backgrounds
    - gnome-color-manager
    - gnome-disk-utility
    - gnome-system-monitor
    - gnome-user-docs
    - gnome-remote-desktop
    - gnome-bluetooth-3.0
    - gnome-browser-connector
    - gnome-keyring
    - nautilus
    - ptyxis
    - yelp
    - xdg-desktop-portal-gnome
    - xdg-desktop-portal-gtk
    - xdg-user-dirs-gtk
    - gvfs
    - gvfs-mtp
    - gvfs-smb
    - gvfs-gphoto2
    - gvfs-afc
    - networkmanager
    - pipewire
    - wireplumber
    - flatpak
    - wl-clipboard
    - mesa
    - vulkan-icd-loader
    - xdg-user-dirs

    # Fonts. dnf variants get these for free from the "Fonts" group
    # (gnome.yaml) plus the Nerd Font that build_scripts/26-packages-post.sh
    # curls in; Containerfile.arch runs neither path (it never sources
    # 26-packages-post.sh at all -- see the comment above install-remora.sh
    # in Containerfile.arch for the same gap hitting remora and depmod), and
    # nothing here compensated for fonts the way those two got hand-fixed.
    # Measured on a booted marlin:gnome (BUILD_ID=4ace379): /usr/share/fonts
    # held only Adwaita, encodings and gnu-free; `fc-match monospace`
    # resolved to FreeMono; `fc-list | grep -i emoji` returned nothing; and
    # `pacman -Q ttf-dejavu ttf-liberation noto-fonts noto-fonts-emoji
    # ttf-jetbrains-mono-nerd` reported all five not installed.
    - ttf-dejavu
    - ttf-liberation
    - noto-fonts
    - noto-fonts-emoji
    - ttf-jetbrains-mono-nerd

  cachyos:
    repos:
      - name: cachyos
        url: "https://mirror.cachyos.org/repo/$arch/cachyos"
    packages:
      - linux-cachyos
      - linux-cachyos-headers
      - cachyos-settings

versionlock: []

# Post-install scripts to source (relative to build_scripts/)
post_install:
  - tuna-flatpak-remote.sh
  # Curated Flatpak set (store + browser) + preinstall service — see the
  # script header; asserts live in verify-desktop-experience.sh.
  - flatpak-preinstall.sh
