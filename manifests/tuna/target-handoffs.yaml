    variants:
      - yellowfin
      - albacore
      - skipjack
    package_prerequisite: https://github.com/tuna-os/tunaos-packages/issues/828
    containerfile_stage: Containerfile.el10
    package_identity: pending
    repository_identity: pending
    signature_trust: pending
    source_vendor_arch: pending
    native_dependency_mapping: pending
    media:
      iso: false
      qcow2: false
      luks_e2e: false
